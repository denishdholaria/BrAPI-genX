info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    VariantAnnotationNewRequest:
      type: object
      description: |-
        Request to record one variant annotation. Unknown variantAnnotationDbId
        creates; same id with an identical body replays the existing record;
        same id with a different body is rejected with 409.
      required:
      - variantAnnotationDbId
      properties:
        variantAnnotationDbId:
          description: Namespaced variant-annotation identity `{authority}:variant-annotation:{localId}`
          type: string
          example: institute-a:variant-annotation:va-2026-001
        analysisMethodDbId:
          description: GenX AnalysisMethod used, when applicable
          type: string
          example: institute-a:analysis-method:variant-annotation
        studyDbId:
          description: BrAPI Study / trial context, when applicable
          type: string
          example: institute-a:study:yield-trial-2026
        variantDbId:
          description: BrAPI Variant reference, when applicable
          type: string
          example: institute-a:variant:var-001
        annotations:
          description: Functional annotations
          type: object
          example: {gene: GeneA, effect: missense}
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: variantAnnotationDbId of the record this one replaces
          type: string
          example: institute-a:variant-annotation:va-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'