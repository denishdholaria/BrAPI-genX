info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    CropRecommendationNewRequest:
      type: object
      description: |-
        Request to register one crop recommendation record. Unknown cropRecommendationDbId
        creates; same id with an identical body replays the existing record;
        same id with a different body is rejected with 409.
      required:
      - cropRecommendationDbId
      properties:
        cropRecommendationDbId:
          description: Namespaced crop-recommendation identity `{authority}:crop-recommendation:{localId}`
          type: string
          example: institute-a:crop-recommendation:cr-2026-001
        recommendationType:
          description: Type of recommendation
          type: string
          example: variety
        recommendedVariety:
          description: Recommended variety
          type: string
          example: hybrid-maize-01
        recommendedPractice:
          description: Recommended agronomic practice
          type: string
          example: optimized spacing
        regionOrZone:
          description: Region or zone the recommendation applies to
          type: string
          example: zone-3
        season:
          description: Season the recommendation applies to
          type: string
          example: 2026 main season
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: cropRecommendationDbId of the record this one replaces
          type: string
          example: institute-a:crop-recommendation:cr-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
