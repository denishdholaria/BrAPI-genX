info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /crop-recommendations:
    get:
      operationId: genxListCropRecommendations
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crop-recommendations.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List crop recommendation records, optionally filtered by status."
        canBeUsedFor:
          - "Discover crop recommendations."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCropRecommendation"
          - "genxGetCropRecommendation"
          - "genxRegisterFarm"
        decisions: ["RFC-129"]
        proposalStatus: "draft-non-normative"
      summary: List crop recommendations
      description: Get a paged list of crop recommendation records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/CropRecommendationListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CropRecommendation
    post:
      operationId: genxRegisterCropRecommendation
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crop-recommendations.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one crop recommendation record with provenance."
        canBeUsedFor:
          - "Publish a crop recommendation."
          - "Retry an identical record safely using the same cropRecommendationDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a crop recommendation identity or appends a new immutable version when accepted."
        idempotency: "Same cropRecommendationDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListCropRecommendations"
          - "genxGetCropRecommendation"
          - "genxRegisterFarm"
        decisions: ["RFC-129"]
        proposalStatus: "draft-non-normative"
      summary: Register one crop recommendation
      description: Register one crop recommendation record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CropRecommendationNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CropRecommendation'
                required:
                - metadata
                - result
                title: CropRecommendationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CropRecommendation
components:
  responses:
    CropRecommendationListResponse:
      content:
        application/json:
          schema:
            title: CropRecommendationListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CropRecommendation'
            required:
            - metadata
            - result
      description: OK