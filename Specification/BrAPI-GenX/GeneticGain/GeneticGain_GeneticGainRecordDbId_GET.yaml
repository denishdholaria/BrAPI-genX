info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /genetic-gains/{geneticGainRecordDbId}:
    get:
      operationId: genxGetGeneticGain
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.genetic-gains.get"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one genetic gain record."
        canBeUsedFor:
          - "Inspect gain value, method, and provenance."
        mustNotBeUsedFor:
          - "Assuming the record is a BrAPI Program."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordGeneticGain"
          - "genxListGeneticGains"
        decisions: ["RFC-046"]
        proposalStatus: "draft-non-normative"
      summary: Get one genetic gain
      description: Returns the recorded gain, or 404.
      parameters:
      - name: geneticGainRecordDbId
        description: Namespaced genetic-gain-record identity `{authority}:genetic-gain-record:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/GeneticGainRecord'
                required:
                - metadata
                - result
                title: GeneticGainRecordResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - GeneticGain