info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    GeneticGainRecordNewRequest:
      type: object
      description: |-
        Request to record one genetic gain estimate. Unknown
        geneticGainRecordDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      required:
      - geneticGainRecordDbId
      - programDbId
      - traitDbId
      - gainValue
      properties:
        geneticGainRecordDbId:
          description: Namespaced genetic-gain-record identity `{authority}:genetic-gain-record:{localId}`
          type: string
          example: institute-a:genetic-gain-record:gg-2026-001
        programDbId:
          description: BrAPI Program (breeding program)
          type: string
          example: institute-a:program:wheat-breeding
        traitDbId:
          description: BrAPI Trait or GenX VariableTerm identifier
          type: string
          example: institute-a:trait:grain-yield
        gainValue:
          description: Estimated genetic gain value
          type: number
          example: 0.42
        unit:
          description: Unit of measure for gain
          type: string
          example: t_per_hectare_per_year
        period:
          description: Reference period (e.g. 2016-2026)
          type: string
          example: 2016-2026
        method:
          description: Method used to estimate gain
          type: string
          example: linear-regression
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          default: active
          example: active
        supersedes:
          description: geneticGainRecordDbId of the record this one replaces
          type: string
          example: institute-a:genetic-gain-record:gg-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'