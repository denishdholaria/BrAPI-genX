info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /vegetation-indexes:
    get:
      operationId: genxListVegetationIndexes
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.vegetation-indexes.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List vegetation index records, optionally filtered by status."
        canBeUsedFor:
          - "Discover vegetation indexs."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterVegetationIndex"
          - "genxGetVegetationIndex"
          - "genxRegisterFarm"
        decisions: ["RFC-146"]
        proposalStatus: "draft-non-normative"
      summary: List vegetation indexes
      description: Get a paged list of vegetation index records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/VegetationIndexListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - VegetationIndex
    post:
      operationId: genxRegisterVegetationIndex
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.vegetation-indexes.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one vegetation index record with provenance."
        canBeUsedFor:
          - "Publish a vegetation index."
          - "Retry an identical record safely using the same vegetationIndexDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a vegetation index identity or appends a new immutable version when accepted."
        idempotency: "Same vegetationIndexDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListVegetationIndexes"
          - "genxGetVegetationIndex"
          - "genxRegisterFarm"
        decisions: ["RFC-146"]
        proposalStatus: "draft-non-normative"
      summary: Register one vegetation index
      description: Register one vegetation index record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VegetationIndexNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/VegetationIndex'
                required:
                - metadata
                - result
                title: VegetationIndexResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - VegetationIndex
components:
  responses:
    VegetationIndexListResponse:
      content:
        application/json:
          schema:
            title: VegetationIndexListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VegetationIndex'
            required:
            - metadata
            - result
      description: OK