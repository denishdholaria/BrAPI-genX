info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /spatial-indexes:
    get:
      operationId: genxListSpatialIndexes
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.spatial-indexes.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List spatial index records, optionally filtered by status."
        canBeUsedFor:
          - "Discover spatial indexs."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterSpatialIndex"
          - "genxGetSpatialIndex"
          - "genxRegisterFarm"
        decisions: ["RFC-141"]
        proposalStatus: "draft-non-normative"
      summary: List spatial indexes
      description: Get a paged list of spatial index records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/SpatialIndexListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SpatialIndex
    post:
      operationId: genxRegisterSpatialIndex
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.spatial-indexes.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one spatial index record with provenance."
        canBeUsedFor:
          - "Publish a spatial index."
          - "Retry an identical record safely using the same spatialIndexDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a spatial index identity or appends a new immutable version when accepted."
        idempotency: "Same spatialIndexDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListSpatialIndexes"
          - "genxGetSpatialIndex"
          - "genxRegisterFarm"
        decisions: ["RFC-141"]
        proposalStatus: "draft-non-normative"
      summary: Register one spatial index
      description: Register one spatial index record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpatialIndexNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/SpatialIndex'
                required:
                - metadata
                - result
                title: SpatialIndexResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SpatialIndex
components:
  responses:
    SpatialIndexListResponse:
      content:
        application/json:
          schema:
            title: SpatialIndexListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SpatialIndex'
            required:
            - metadata
            - result
      description: OK