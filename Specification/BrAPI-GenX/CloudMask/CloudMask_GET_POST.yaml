info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /cloud-masks:
    get:
      operationId: genxListCloudMasks
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.cloud-masks.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List cloud mask records, optionally filtered by status."
        canBeUsedFor:
          - "Discover cloud masks."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCloudMask"
          - "genxGetCloudMask"
          - "genxRegisterFarm"
        decisions: ["RFC-147"]
        proposalStatus: "draft-non-normative"
      summary: List cloud masks
      description: Get a paged list of cloud mask records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/CloudMaskListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CloudMask
    post:
      operationId: genxRegisterCloudMask
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.cloud-masks.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one cloud mask record with provenance."
        canBeUsedFor:
          - "Publish a cloud mask."
          - "Retry an identical record safely using the same cloudMaskDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a cloud mask identity or appends a new immutable version when accepted."
        idempotency: "Same cloudMaskDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListCloudMasks"
          - "genxGetCloudMask"
          - "genxRegisterFarm"
        decisions: ["RFC-147"]
        proposalStatus: "draft-non-normative"
      summary: Register one cloud mask
      description: Register one cloud mask record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudMaskNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CloudMask'
                required:
                - metadata
                - result
                title: CloudMaskResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CloudMask
components:
  responses:
    CloudMaskListResponse:
      content:
        application/json:
          schema:
            title: CloudMaskListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudMask'
            required:
            - metadata
            - result
      description: OK