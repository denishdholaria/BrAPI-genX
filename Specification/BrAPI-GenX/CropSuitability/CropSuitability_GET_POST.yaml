info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /crop-suitabilities:
    get:
      operationId: genxListCropSuitabilities
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crop-suitabilities.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List crop suitability records, optionally filtered by status."
        canBeUsedFor:
          - "Discover crop suitabilitys."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCropSuitability"
          - "genxGetCropSuitability"
          - "genxRegisterFarm"
        decisions: ["RFC-135"]
        proposalStatus: "draft-non-normative"
      summary: List crop suitabilities
      description: Get a paged list of crop suitability records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/CropSuitabilityListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CropSuitability
    post:
      operationId: genxRegisterCropSuitability
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crop-suitabilities.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one crop suitability record with provenance."
        canBeUsedFor:
          - "Publish a crop suitability."
          - "Retry an identical record safely using the same cropSuitabilityDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a crop suitability identity or appends a new immutable version when accepted."
        idempotency: "Same cropSuitabilityDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListCropSuitabilities"
          - "genxGetCropSuitability"
          - "genxRegisterFarm"
        decisions: ["RFC-135"]
        proposalStatus: "draft-non-normative"
      summary: Register one crop suitability
      description: Register one crop suitability record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CropSuitabilityNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CropSuitability'
                required:
                - metadata
                - result
                title: CropSuitabilityResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CropSuitability
components:
  responses:
    CropSuitabilityListResponse:
      content:
        application/json:
          schema:
            title: CropSuitabilityListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CropSuitability'
            required:
            - metadata
            - result
      description: OK