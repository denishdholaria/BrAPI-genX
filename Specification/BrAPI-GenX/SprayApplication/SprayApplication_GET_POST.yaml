info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /spray-applications:
    get:
      operationId: genxListSprayApplications
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.spray-applications.list"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List spray application records, optionally filtered by field or status."
        canBeUsedFor:
          - "Discover spray applications for a field."
          - "Support crop health and IPM tracking."
        mustNotBeUsedFor:
          - "Creating or changing a spray record (use the POST endpoint)."
          - "Assuming a spray record is a BrAPI Observation."
          - "Treating the list as a complete spray history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterSprayApplication"
          - "genxGetSprayApplication"
          - "genxRegisterFieldScouting"
        decisions: ["RFC-081"]
        proposalStatus: "draft-non-normative"
      summary: List spray applications
      description: Get a paged list of spray application records across authorities. Filters combine with AND.
      parameters:
      - name: fieldDbId
        description: Filter by field or site reference
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/SprayApplicationListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SprayApplication
    post:
      operationId: genxRegisterSprayApplication
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.spray-applications.record"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one spray application record with field linkage and provenance."
        canBeUsedFor:
          - "Publish a spray application for a field."
          - "Retry an identical record safely using the same sprayApplicationDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a spray record is a BrAPI Observation."
          - "Asserting that the spray is validated or effective."
        sideEffects: "Creates a spray application identity or appends a new immutable version when accepted."
        idempotency: "Same sprayApplicationDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListSprayApplications"
          - "genxGetSprayApplication"
          - "genxRegisterFieldScouting"
        decisions: ["RFC-081"]
        proposalStatus: "draft-non-normative"
      summary: Register one spray application
      description: |-
        Unknown sprayApplicationDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SprayApplicationNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/SprayApplication'
                required:
                - metadata
                - result
                title: SprayApplicationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SprayApplication
components:
  responses:
    SprayApplicationListResponse:
      content:
        application/json:
          schema:
            title: SprayApplicationListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SprayApplication'
            required:
            - metadata
            - result
      description: OK
