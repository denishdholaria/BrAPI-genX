info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /field-books/{fieldBookDbId}:
    get:
      operationId: genxGetFieldBook
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.field-books.get"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one field book definition record."
        canBeUsedFor:
          - "Inspect field linkage, field-book identity, status, and provenance."
        mustNotBeUsedFor:
          - "Assuming a record is a BrAPI Observation."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterFieldBook"
          - "genxListFieldBooks"
          - "genxRegisterFarm"
        decisions: ["RFC-108"]
        proposalStatus: "draft-non-normative"
      summary: Get one field-book
      description: Returns the registered record, or 404.
      parameters:
      - name: fieldBookDbId
        description: Namespaced field-books identity `{authority}:field-books:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/FieldBook'
                required:
                - metadata
                - result
                title: FieldBookResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - FieldBook
