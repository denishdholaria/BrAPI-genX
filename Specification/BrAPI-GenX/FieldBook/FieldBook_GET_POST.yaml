info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /field-books:
    get:
      operationId: genxListFieldBooks
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.field-books.list"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List field book definition records, optionally filtered by field or status."
        canBeUsedFor:
          - "Discover field-books for a field."
          - "Support experimental design."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI Observation."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterFieldBook"
          - "genxGetFieldBook"
          - "genxRegisterFarm"
        decisions: ["RFC-108"]
        proposalStatus: "draft-non-normative"
      summary: List field-books
      description: Get a paged list of field-book identity records across authorities. Filters combine with AND.
      parameters:
      - name: fieldDbId
        description: Filter by field or site reference
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/FieldBookListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - FieldBook
    post:
      operationId: genxRegisterFieldBook
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.field-books.record"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one field book definition record with field linkage and provenance."
        canBeUsedFor:
          - "Publish a field-book identity for a field."
          - "Retry an identical record safely using the same fieldBookDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI Observation."
          - "Asserting that the work order is completed or validated."
        sideEffects: "Creates a field book identity or appends a new immutable version when accepted."
        idempotency: "Same fieldBookDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListFieldBooks"
          - "genxGetFieldBook"
          - "genxRegisterFarm"
        decisions: ["RFC-108"]
        proposalStatus: "draft-non-normative"
      summary: Register one field-book
      description: |-
        Unknown fieldBookDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldBookNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/FieldBook'
                required:
                - metadata
                - result
                title: FieldBookResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - FieldBook
components:
  responses:
    FieldBookListResponse:
      content:
        application/json:
          schema:
            title: FieldBookListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FieldBook'
            required:
            - metadata
            - result
      description: OK
