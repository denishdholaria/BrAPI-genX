info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /safety-duplications:
    get:
      operationId: genxListSafetyDuplications
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.safety-duplications.list"
        classification:
          primaryDomain: "D1"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List safety duplication records, optionally filtered by seed lot or status."
        canBeUsedFor:
          - "Discover safety duplications for conserved material."
          - "Support conservation planning and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI SeedLot transaction."
          - "Treating the list as a complete conservation record."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterSafetyDuplication"
          - "genxGetSafetyDuplication"
        decisions: ["RFC-034"]
        proposalStatus: "draft-non-normative"
      summary: List safety duplications
      description: Get a paged list of safety duplications across authorities. Filters combine with AND.
      parameters:
      - name: seedLotDbId
        description: Filter by BrAPI SeedLot
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/SafetyDuplicationListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SafetyDuplication
    post:
      operationId: genxRegisterSafetyDuplication
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.safety-duplications.register"
        classification:
          primaryDomain: "D1"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register a safety duplication with backup site, quantity, and provenance."
        canBeUsedFor:
          - "Publish safety duplication metadata."
          - "Create a new version under an existing identity."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming the record is a BrAPI SeedLot transaction."
          - "Treating the record as a complete conservation record."
        sideEffects: "Creates a safety duplication identity or appends a new immutable version when accepted."
        idempotency: "Same identity and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListSafetyDuplications"
          - "genxGetSafetyDuplication"
        decisions: ["RFC-034"]
        proposalStatus: "draft-non-normative"
      summary: Register one safety duplication
      description: |-
        Unknown safetyDuplicationDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafetyDuplicationNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/SafetyDuplication'
                required:
                - metadata
                - result
                title: SafetyDuplicationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SafetyDuplication
components:
  responses:
    SafetyDuplicationListResponse:
      content:
        application/json:
          schema:
            title: SafetyDuplicationListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SafetyDuplication'
            required:
            - metadata
            - result
      description: OK