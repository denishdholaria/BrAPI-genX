info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    CollectingMissionNewRequest:
      type: object
      description: |-
        Request to register one collecting mission record. Unknown
        collectingMissionDbId creates; same id with an identical body replays
        the existing record; same id with a different body is rejected with 409.
      required:
      - collectingMissionDbId
      properties:
        collectingMissionDbId:
          description: Namespaced collecting-mission identity `{authority}:collecting-mission:{localId}`
          type: string
          example: institute-a:collecting-mission:cm-2026-001
        title:
          description: Mission title
          type: string
          example: Wild wheat collection 2026
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: collectingMissionDbId of the record this one replaces
          type: string
          example: institute-a:collecting-mission:cm-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
