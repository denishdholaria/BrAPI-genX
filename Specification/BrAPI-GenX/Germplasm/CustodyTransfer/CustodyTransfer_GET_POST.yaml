info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /custody-transfers:
    get:
      operationId: genxListCustodyTransfers
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.custody-transfers.list"
        classification:
          primaryDomain: "D1"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List custody transfer records, optionally filtered by sample, lot, or status."
        canBeUsedFor:
          - "Trace the chain of custody for a sample or seed lot."
          - "Support scientific reproducibility and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a transfer (use the POST endpoint)."
          - "Assuming a transfer is a BrAPI data resource."
          - "Treating the list as a complete custody history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordCustodyTransfer"
          - "genxGetCustodyTransfer"
          - "genxAppendSeedLotLedgerEntry"
        decisions: ["RFC-063"]
        proposalStatus: "draft-non-normative"
      summary: List custody transfers
      description: Get a paged list of custody transfers across authorities. Filters combine with AND.
      parameters:
      - name: sampleDbId
        description: Filter by BrAPI Sample
        in: query
        required: false
        schema:
          type: string
      - name: lotDbId
        description: Filter by GenX seed lot
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/CustodyTransferListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CustodyTransfer
    post:
      operationId: genxRecordCustodyTransfer
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.custody-transfers.record"
        classification:
          primaryDomain: "D1"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one custody transfer with parties, condition, and provenance."
        canBeUsedFor:
          - "Publish a custody transfer event for audit."
          - "Retry an identical transfer safely using the same custodyTransferDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing transfer; corrections require a new record that supersedes."
          - "Assuming the transfer is a BrAPI data resource."
          - "Treating a transfer as scientific validation or approval."
        sideEffects: "Creates a custody transfer record when accepted."
        idempotency: "Same custodyTransferDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListCustodyTransfers"
          - "genxGetCustodyTransfer"
          - "genxAppendSeedLotLedgerEntry"
        decisions: ["RFC-063"]
        proposalStatus: "draft-non-normative"
      summary: Record one custody transfer
      description: |-
        Unknown custodyTransferDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustodyTransferNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CustodyTransfer'
                required:
                - metadata
                - result
                title: CustodyTransferResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CustodyTransfer
components:
  responses:
    CustodyTransferListResponse:
      content:
        application/json:
          schema:
            title: CustodyTransferListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustodyTransfer'
            required:
            - metadata
            - result
      description: OK