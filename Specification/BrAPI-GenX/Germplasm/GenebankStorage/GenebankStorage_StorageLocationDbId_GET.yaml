info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /genebank-storage/{storageLocationDbId}:
    get:
      operationId: genxGetStorageLocation
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.genebank-storage.get"
        classification:
          primaryDomain: "D1"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one genebank storage location."
        canBeUsedFor:
          - "Inspect storage capacity, environment, and provenance."
        mustNotBeUsedFor:
          - "Assuming the location is a BrAPI SeedLot."
          - "Treating a decommissioned location as active."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterStorageLocation"
          - "genxListStorageLocations"
        decisions: ["RFC-015"]
        proposalStatus: "draft-non-normative"
      summary: Get one storage location
      description: Returns the registered location, or 404.
      parameters:
      - name: storageLocationDbId
        description: Namespaced storage-location identity `{authority}:storage-location:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/StorageLocation'
                required:
                - metadata
                - result
                title: StorageLocationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - GenebankStorage