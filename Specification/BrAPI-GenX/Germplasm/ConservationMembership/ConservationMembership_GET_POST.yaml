info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /conservation-memberships:
    get:
      operationId: genxListConservationMemberships
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.conservation-memberships.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List conservation membership records, optionally filtered by status."
        canBeUsedFor:
          - "Discover conservation-memberships and funding references."
          - "Support germplasm and genetic resources."
        mustNotBeUsedFor:
          - "Creating or changing a conservation-membership (use the POST endpoint)."
          - "Assuming a conservation-membership is a BrAPI Study."
          - "Treating the list as a complete conservation-membership catalogue."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterConservationMembership"
          - "genxGetConservationMembership"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-102"]
        proposalStatus: "draft-non-normative"
      summary: List conservation-memberships
      description: Get a paged list of conservation-membership and funding reference records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ConservationMembershipListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ConservationMembership
    post:
      operationId: genxRegisterConservationMembership
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.conservation-memberships.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one conservation membership record with provenance."
        canBeUsedFor:
          - "Publish a conservation-membership or funding reference."
          - "Retry an identical record safely using the same conservationMembershipDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a conservation-membership is a BrAPI Study."
          - "Asserting that the conservation-membership is validated or endorsed."
        sideEffects: "Creates a conservation membership identity or appends a new immutable version when accepted."
        idempotency: "Same conservationMembershipDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListConservationMemberships"
          - "genxGetConservationMembership"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-102"]
        proposalStatus: "draft-non-normative"
      summary: Register one conservation-membership
      description: |-
        Unknown conservationMembershipDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConservationMembershipNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ConservationMembership'
                required:
                - metadata
                - result
                title: ConservationMembershipResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ConservationMembership
components:
  responses:
    ConservationMembershipListResponse:
      content:
        application/json:
          schema:
            title: ConservationMembershipListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConservationMembership'
            required:
            - metadata
            - result
      description: OK
