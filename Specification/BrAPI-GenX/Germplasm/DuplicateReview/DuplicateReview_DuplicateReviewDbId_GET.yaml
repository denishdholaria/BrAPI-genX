info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /duplicate-reviews/{duplicateReviewDbId}:
    get:
      operationId: genxGetDuplicateReview
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.duplicate-reviews.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one duplicate review record."
        canBeUsedFor:
          - "Inspect duplicate-review identity, funding, and provenance."
        mustNotBeUsedFor:
          - "Assuming a duplicate-review is a BrAPI Study."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterDuplicateReview"
          - "genxListDuplicateReviews"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-104"]
        proposalStatus: "draft-non-normative"
      summary: Get one duplicate-review
      description: Returns the registered record, or 404.
      parameters:
      - name: duplicateReviewDbId
        description: Namespaced duplicate-review identity `{authority}:duplicate-review:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/DuplicateReview'
                required:
                - metadata
                - result
                title: DuplicateReviewResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - DuplicateReview
