info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    DuplicateReview:
      type: object
      description: |-
        One immutable duplicate review record. A published
        (duplicateReviewDbId) record never mutates in place; corrections are
        recorded as additional records linked by supersedes.
      required:
      - duplicateReviewDbId
      - status
      properties:
        duplicateReviewDbId:
          description: Namespaced duplicate-review identity `{authority}:duplicate-review:{localId}`
          type: string
          example: institute-a:duplicate-review:dr-2026-001
        candidateDbId:
          description: Candidate germplasm or accession reference
          type: string
          example: acc-001
        decision:
          description: Review decision
          type: string
          example: confirmed-duplicate
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: duplicateReviewDbId of the record this one replaces
          type: string
          example: institute-a:duplicate-review:dr-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
