info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /viability-tests/{viabilityTestDbId}:
    get:
      operationId: genxGetViabilityTest
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.viability-tests.get"
        classification:
          primaryDomain: "D1"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one recorded viability/germination test."
        canBeUsedFor:
          - "Inspect viability results and provenance."
        mustNotBeUsedFor:
          - "Assuming the test is a BrAPI SeedLot transaction."
          - "Treating a superseded test as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordViabilityTest"
          - "genxListViabilityTests"
        decisions: ["RFC-021"]
        proposalStatus: "draft-non-normative"
      summary: Get one viability test
      description: Returns the recorded test, or 404.
      parameters:
      - name: viabilityTestDbId
        description: Namespaced viability-test identity `{authority}:viability-test:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ViabilityTest'
                required:
                - metadata
                - result
                title: ViabilityTestResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - ViabilityTesting