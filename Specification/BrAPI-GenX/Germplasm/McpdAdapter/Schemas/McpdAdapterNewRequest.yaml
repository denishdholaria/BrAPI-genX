info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    McpdAdapterNewRequest:
      type: object
      description: |-
        Request to register one MCPD adapter record. Unknown mcpdAdapterDbId
        creates; same id with an identical body replays the existing record;
        same id with a different body is rejected with 409.
      required:
      - mcpdAdapterDbId
      properties:
        mcpdAdapterDbId:
          description: Namespaced MCPD-adapter identity `{authority}:mcpd-adapter:{localId}`
          type: string
          example: institute-a:mcpd-adapter:ma-2026-001
        source:
          description: MCPD source system
          type: string
          example: MCPD v2
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: mcpdAdapterDbId of the record this one replaces
          type: string
          example: institute-a:mcpd-adapter:ma-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
