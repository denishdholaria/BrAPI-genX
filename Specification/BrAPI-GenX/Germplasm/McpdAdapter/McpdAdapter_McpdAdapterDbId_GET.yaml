info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /mcpd-adapters/{mcpdAdapterDbId}:
    get:
      operationId: genxGetMcpdAdapter
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.mcpd-adapters.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one MCPD adapter record."
        canBeUsedFor:
          - "Inspect mcpd-adapter identity, funding, and provenance."
        mustNotBeUsedFor:
          - "Assuming a mcpd-adapter is a BrAPI Study."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterMcpdAdapter"
          - "genxListMcpdAdapters"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-103"]
        proposalStatus: "draft-non-normative"
      summary: Get one mcpd-adapter
      description: Returns the registered record, or 404.
      parameters:
      - name: mcpdAdapterDbId
        description: Namespaced mcpd-adapter identity `{authority}:mcpd-adapter:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/McpdAdapter'
                required:
                - metadata
                - result
                title: McpdAdapterResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - McpdAdapter
