info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /acquisitions:
    get:
      operationId: genxListAcquisitions
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.acquisitions.list"
        classification:
          primaryDomain: "D1"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List acquisition records, optionally filtered by seed lot or status."
        canBeUsedFor:
          - "Discover acquisition events for conserved material."
          - "Support conservation planning and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI SeedLot transaction."
          - "Treating the list as a complete conservation record."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordAcquisition"
          - "genxGetAcquisition"
        decisions: ["RFC-041"]
        proposalStatus: "draft-non-normative"
      summary: List acquisitions
      description: Get a paged list of acquisition records across authorities. Filters combine with AND.
      parameters:
      - name: seedLotDbId
        description: Filter by BrAPI SeedLot
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/AcquisitionRecordListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Acquisition
    post:
      operationId: genxRecordAcquisition
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.acquisitions.record"
        classification:
          primaryDomain: "D1"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one acquisition event with source and provenance."
        canBeUsedFor:
          - "Record intake of conserved material."
          - "Retry an identical record safely using the same acquisitionRecordDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming the record is a BrAPI SeedLot transaction."
          - "Treating the record as a complete conservation record."
        sideEffects: "Creates an acquisition record when accepted."
        idempotency: "Same acquisitionRecordDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListAcquisitions"
          - "genxGetAcquisition"
        decisions: ["RFC-041"]
        proposalStatus: "draft-non-normative"
      summary: Record one acquisition
      description: |-
        Unknown acquisitionRecordDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcquisitionRecordNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/AcquisitionRecord'
                required:
                - metadata
                - result
                title: AcquisitionRecordResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Acquisition
components:
  responses:
    AcquisitionRecordListResponse:
      content:
        application/json:
          schema:
            title: AcquisitionRecordListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AcquisitionRecord'
            required:
            - metadata
            - result
      description: OK