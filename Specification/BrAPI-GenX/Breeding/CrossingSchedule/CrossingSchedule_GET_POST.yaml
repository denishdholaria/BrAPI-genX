info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /crossing-schedules:
    get:
      operationId: genxListCrossingSchedules
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crossing-schedules.list"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List crossing schedules, optionally filtered by program or status."
        canBeUsedFor:
          - "Discover planned crosses for a breeding program."
          - "Support breeding planning and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a schedule (use the POST endpoint)."
          - "Assuming a schedule is a BrAPI Cross or CrossingProject."
          - "Treating the list as a complete breeding program record."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCrossingSchedule"
          - "genxGetCrossingSchedule"
        decisions: ["RFC-037"]
        proposalStatus: "draft-non-normative"
      summary: List crossing schedules
      description: Get a paged list of crossing schedules across authorities. Filters combine with AND.
      parameters:
      - name: programDbId
        description: Filter by BrAPI Program (breeding program)
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - planned
          - completed
          - cancelled
          - superseded
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/CrossingScheduleListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CrossingSchedule
    post:
      operationId: genxRegisterCrossingSchedule
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crossing-schedules.register"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register a crossing schedule with parents, date, and provenance."
        canBeUsedFor:
          - "Publish planned cross schedules."
          - "Create a new version under an existing schedule identity."
        mustNotBeUsedFor:
          - "Updating or deleting an existing schedule; corrections require a new record that supersedes."
          - "Assuming the schedule is a BrAPI Cross or CrossingProject."
          - "Treating the schedule as an approved breeding plan."
        sideEffects: "Creates a schedule identity or appends a new immutable version when accepted."
        idempotency: "Same identity and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListCrossingSchedules"
          - "genxGetCrossingSchedule"
        decisions: ["RFC-037"]
        proposalStatus: "draft-non-normative"
      summary: Register one crossing schedule
      description: |-
        Unknown crossingScheduleDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrossingScheduleNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CrossingSchedule'
                required:
                - metadata
                - result
                title: CrossingScheduleResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CrossingSchedule
components:
  responses:
    CrossingScheduleListResponse:
      content:
        application/json:
          schema:
            title: CrossingScheduleListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CrossingSchedule'
            required:
            - metadata
            - result
      description: OK