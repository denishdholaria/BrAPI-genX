info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /heritability-estimates:
    get:
      operationId: genxListHeritabilityEstimates
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.heritability-estimates.list"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List heritability estimates, optionally filtered by method, study, or status."
        canBeUsedFor:
          - "Discover heritability estimates for a study or method."
          - "Support scientific reproducibility and auditing."
        mustNotBeUsedFor:
          - "Creating or changing an estimate (use the POST endpoint)."
          - "Assuming an estimate is a BrAPI data resource."
          - "Treating the list as a complete analysis repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordHeritability"
          - "genxGetHeritabilityEstimate"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-050"]
        proposalStatus: "draft-non-normative"
      summary: List heritability estimates
      description: Get a paged list of heritability estimates across authorities. Filters combine with AND.
      parameters:
      - name: analysisMethodDbId
        description: Filter by GenX AnalysisMethod
        in: query
        required: false
        schema:
          type: string
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/HeritabilityEstimateListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Heritability
    post:
      operationId: genxRecordHeritability
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.heritability-estimates.record"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one heritability estimate with value and provenance."
        canBeUsedFor:
          - "Publish heritability estimate metadata."
          - "Retry an identical estimate safely using the same heritabilityEstimateDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing estimate; corrections require a new record that supersedes."
          - "Assuming the estimate is a BrAPI data resource."
          - "Treating the estimate as scientific validation or approval."
        sideEffects: "Creates a heritability estimate when accepted."
        idempotency: "Same heritabilityEstimateDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListHeritabilityEstimates"
          - "genxGetHeritabilityEstimate"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-050"]
        proposalStatus: "draft-non-normative"
      summary: Record one heritability estimate
      description: |-
        Unknown heritabilityEstimateDbId creates; same id with an identical
        body replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeritabilityEstimateNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/HeritabilityEstimate'
                required:
                - metadata
                - result
                title: HeritabilityEstimateResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Heritability
components:
  responses:
    HeritabilityEstimateListResponse:
      content:
        application/json:
          schema:
            title: HeritabilityEstimateListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HeritabilityEstimate'
            required:
            - metadata
            - result
      description: OK