info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /experimental-protocols:
    get:
      operationId: genxListExperimentalProtocols
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.experimental-protocols.list"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List experimental protocol records, optionally filtered by status."
        canBeUsedFor:
          - "Discover experimental protocols."
          - "Support trial design and treatment layout."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterExperimentalProtocol"
          - "genxGetExperimentalProtocol"
          - "genxRegisterFarm"
        decisions: ["RFC-117"]
        proposalStatus: "draft-non-normative"
      summary: List experimental protocols
      description: Get a paged list of experimental protocol records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ExperimentalProtocolListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ExperimentalProtocol
    post:
      operationId: genxRegisterExperimentalProtocol
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.experimental-protocols.record"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one experimental protocol record with provenance."
        canBeUsedFor:
          - "Publish an experimental protocol."
          - "Retry an identical record safely using the same experimentalProtocolDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the protocol is validated or endorsed."
        sideEffects: "Creates an experimental protocol identity or appends a new immutable version when accepted."
        idempotency: "Same experimentalProtocolDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListExperimentalProtocols"
          - "genxGetExperimentalProtocol"
          - "genxRegisterFarm"
        decisions: ["RFC-117"]
        proposalStatus: "draft-non-normative"
      summary: Register one experimental protocol
      description: Register one experimental protocol record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentalProtocolNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ExperimentalProtocol'
                required:
                - metadata
                - result
                title: ExperimentalProtocolResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ExperimentalProtocol
components:
  responses:
    ExperimentalProtocolListResponse:
      content:
        application/json:
          schema:
            title: ExperimentalProtocolListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExperimentalProtocol'
            required:
            - metadata
            - result
      description: OK