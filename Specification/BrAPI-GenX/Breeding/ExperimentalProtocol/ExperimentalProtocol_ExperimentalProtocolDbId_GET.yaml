info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /experimental-protocols/{experimentalProtocolDbId}:
    get:
      operationId: genxGetExperimentalProtocol
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.experimental-protocols.get"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one experimental protocol record."
        canBeUsedFor:
          - "Inspect protocol, design, and provenance."
        mustNotBeUsedFor:
          - "Assuming a record is a BrAPI data resource."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterExperimentalProtocol"
          - "genxListExperimentalProtocols"
          - "genxRegisterFarm"
        decisions: ["RFC-117"]
        proposalStatus: "draft-non-normative"
      summary: Get one experimental protocol
      description: Returns the registered record, or 404.
      parameters:
      - name: experimentalProtocolDbId
        description: Namespaced experimental-protocols identity `{authority}:experimental-protocols:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ExperimentalProtocol'
                required:
                - metadata
                - result
                title: ExperimentalProtocolResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - ExperimentalProtocol