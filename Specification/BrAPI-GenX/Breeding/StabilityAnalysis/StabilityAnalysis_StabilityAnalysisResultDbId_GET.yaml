info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /stability-analyses/{stabilityAnalysisResultDbId}:
    get:
      operationId: genxGetStabilityAnalysis
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.stability-analyses.get"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one stability analysis result."
        canBeUsedFor:
          - "Inspect stability index and provenance."
        mustNotBeUsedFor:
          - "Assuming the result is a BrAPI data resource."
          - "Treating a superseded result as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordStabilityAnalysis"
          - "genxListStabilityAnalyses"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-049"]
        proposalStatus: "draft-non-normative"
      summary: Get one stability analysis
      description: Returns the recorded result, or 404.
      parameters:
      - name: stabilityAnalysisResultDbId
        description: Namespaced stability-analysis-result identity `{authority}:stability-analysis-result:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/StabilityAnalysisResult'
                required:
                - metadata
                - result
                title: StabilityAnalysisResultResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - StabilityAnalysis