info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /stability-analyses:
    get:
      operationId: genxListStabilityAnalyses
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.stability-analyses.list"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List stability analysis results, optionally filtered by method, study, or status."
        canBeUsedFor:
          - "Discover stability results for a study or method."
          - "Support scientific reproducibility and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a result (use the POST endpoint)."
          - "Assuming a result is a BrAPI data resource."
          - "Treating the list as a complete analysis repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordStabilityAnalysis"
          - "genxGetStabilityAnalysis"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-049"]
        proposalStatus: "draft-non-normative"
      summary: List stability analyses
      description: Get a paged list of stability analyses across authorities. Filters combine with AND.
      parameters:
      - name: analysisMethodDbId
        description: Filter by GenX AnalysisMethod
        in: query
        required: false
        schema:
          type: string
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/StabilityAnalysisResultListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - StabilityAnalysis
    post:
      operationId: genxRecordStabilityAnalysis
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.stability-analyses.record"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one stability analysis result with index and provenance."
        canBeUsedFor:
          - "Publish stability analysis result metadata."
          - "Retry an identical result safely using the same stabilityAnalysisResultDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing result; corrections require a new record that supersedes."
          - "Assuming the result is a BrAPI data resource."
          - "Treating the result as scientific validation or approval."
        sideEffects: "Creates a stability analysis result when accepted."
        idempotency: "Same stabilityAnalysisResultDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListStabilityAnalyses"
          - "genxGetStabilityAnalysis"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-049"]
        proposalStatus: "draft-non-normative"
      summary: Record one stability analysis
      description: |-
        Unknown stabilityAnalysisResultDbId creates; same id with an
        identical body replays the existing record; same id with a
        different body is rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StabilityAnalysisResultNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/StabilityAnalysisResult'
                required:
                - metadata
                - result
                title: StabilityAnalysisResultResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - StabilityAnalysis
components:
  responses:
    StabilityAnalysisResultListResponse:
      content:
        application/json:
          schema:
            title: StabilityAnalysisResultListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StabilityAnalysisResult'
            required:
            - metadata
            - result
      description: OK