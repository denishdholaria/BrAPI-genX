info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /speed-breeding-protocols:
    get:
      operationId: genxListSpeedBreedingProtocols
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.speed-breeding-protocols.list"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List speed breeding protocols, optionally filtered by program or status."
        canBeUsedFor:
          - "Discover speed breeding protocols and their conditions."
          - "Support breeding program planning and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a protocol (use the POST endpoint)."
          - "Assuming a protocol is a BrAPI Program."
          - "Treating the list as a complete breeding program record."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterSpeedBreedingProtocol"
          - "genxGetSpeedBreedingProtocol"
        decisions: ["RFC-022"]
        proposalStatus: "draft-non-normative"
      summary: List speed breeding protocols
      description: Get a paged list of speed breeding protocols across authorities. Filters combine with AND.
      parameters:
      - name: programDbId
        description: Filter by BrAPI Program (breeding program)
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - deprecated
          - superseded
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/SpeedBreedingProtocolListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SpeedBreeding
    post:
      operationId: genxRegisterSpeedBreedingProtocol
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.speed-breeding-protocols.register"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register a speed breeding protocol with conditions, generation time, and provenance."
        canBeUsedFor:
          - "Publish speed breeding protocol metadata."
          - "Create a new version under an existing protocol identity."
        mustNotBeUsedFor:
          - "Updating or deleting an existing protocol; corrections require a new record that supersedes."
          - "Assuming the protocol is a BrAPI Program."
          - "Treating the protocol as an approved breeding plan."
        sideEffects: "Creates a protocol identity or appends a new immutable version when accepted."
        idempotency: "Same protocol identity and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListSpeedBreedingProtocols"
          - "genxGetSpeedBreedingProtocol"
        decisions: ["RFC-022"]
        proposalStatus: "draft-non-normative"
      summary: Register one speed breeding protocol
      description: |-
        Unknown speedBreedingProtocolDbId creates; same id with an identical
        body replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeedBreedingProtocolNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/SpeedBreedingProtocol'
                required:
                - metadata
                - result
                title: SpeedBreedingProtocolResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SpeedBreeding
components:
  responses:
    SpeedBreedingProtocolListResponse:
      content:
        application/json:
          schema:
            title: SpeedBreedingProtocolListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SpeedBreedingProtocol'
            required:
            - metadata
            - result
      description: OK