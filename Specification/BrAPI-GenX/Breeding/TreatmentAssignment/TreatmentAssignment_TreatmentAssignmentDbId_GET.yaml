info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /treatment-assignments/{treatmentAssignmentDbId}:
    get:
      operationId: genxGetTreatmentAssignment
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.treatment-assignments.get"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one treatment assignment record."
        canBeUsedFor:
          - "Inspect field linkage, treatment, status, and provenance."
        mustNotBeUsedFor:
          - "Assuming a record is a BrAPI Observation."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterTreatmentAssignment"
          - "genxListTreatmentAssignments"
          - "genxRegisterFarm"
        decisions: ["RFC-106"]
        proposalStatus: "draft-non-normative"
      summary: Get one treatment assignment
      description: Returns the registered record, or 404.
      parameters:
      - name: treatmentAssignmentDbId
        description: Namespaced treatment-assignments identity `{authority}:treatment-assignments:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/TreatmentAssignment'
                required:
                - metadata
                - result
                title: TreatmentAssignmentResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - TreatmentAssignment
