info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /plots:
    get:
      operationId: genxListPlots
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.plots.list"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List plot identity records, optionally filtered by field or status."
        canBeUsedFor:
          - "Discover plots for a field."
          - "Support experimental design."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI Observation."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterPlot"
          - "genxGetPlot"
          - "genxRegisterFarm"
        decisions: ["RFC-107"]
        proposalStatus: "draft-non-normative"
      summary: List plots
      description: Get a paged list of plot identity records across authorities. Filters combine with AND.
      parameters:
      - name: fieldDbId
        description: Filter by field or site reference
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/PlotListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Plot
    post:
      operationId: genxRegisterPlot
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.plots.record"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one plot identity record with field linkage and provenance."
        canBeUsedFor:
          - "Publish a plot identity for a field."
          - "Retry an identical record safely using the same plotDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI Observation."
          - "Asserting that the work order is completed or validated."
        sideEffects: "Creates a plot identity or appends a new immutable version when accepted."
        idempotency: "Same plotDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListPlots"
          - "genxGetPlot"
          - "genxRegisterFarm"
        decisions: ["RFC-107"]
        proposalStatus: "draft-non-normative"
      summary: Register one plot
      description: |-
        Unknown plotDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlotNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/Plot'
                required:
                - metadata
                - result
                title: PlotResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Plot
components:
  responses:
    PlotListResponse:
      content:
        application/json:
          schema:
            title: PlotListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plot'
            required:
            - metadata
            - result
      description: OK
