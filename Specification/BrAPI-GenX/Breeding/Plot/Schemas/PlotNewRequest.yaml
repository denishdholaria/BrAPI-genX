info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    PlotNewRequest:
      type: object
      description: |-
        Request to register one plot identity record. Unknown plotDbId
        creates; same id with an identical body replays the existing record;
        same id with a different body is rejected with 409.
      required:
      - plotDbId
      properties:
        plotDbId:
          description: Namespaced plot identity `{authority}:plot:{localId}`
          type: string
          example: institute-a:plot:pl-2026-001
        fieldDbId:
          description: Field or site reference
          type: string
          example: field-001
        plotName:
          description: Plot name or label
          type: string
          example: plot-001
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: plotDbId of the record this one replaces
          type: string
          example: institute-a:plot:pl-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
