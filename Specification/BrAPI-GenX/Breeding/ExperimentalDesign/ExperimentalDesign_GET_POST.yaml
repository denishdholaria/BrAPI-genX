info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /experimental-designs:
    get:
      operationId: genxListExperimentalDesigns
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.experimental-designs.list"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List experimental design records, optionally filtered by study or design type."
        canBeUsedFor:
          - "Discover trial layouts, replication, and randomization."
          - "Support experimental planning and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a design (use the POST endpoint)."
          - "Assuming a design is a BrAPI Study or Observation Unit."
          - "Treating the list as a complete trial record."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterExperimentalDesign"
          - "genxGetExperimentalDesign"
        decisions: ["RFC-018"]
        proposalStatus: "draft-non-normative"
      summary: List experimental designs
      description: Get a paged list of experimental designs across authorities. Filters combine with AND.
      parameters:
      - name: studyDbId
        description: Filter by BrAPI Study
        in: query
        required: false
        schema:
          type: string
      - name: designType
        description: Filter by design type
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ExperimentalDesignListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ExperimentalDesign
    post:
      operationId: genxRegisterExperimentalDesign
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.experimental-designs.register"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register an experimental design with layout, replication, randomization, and provenance."
        canBeUsedFor:
          - "Publish trial layout and treatment assignment."
          - "Create a new version under an existing design identity."
        mustNotBeUsedFor:
          - "Updating or deleting an existing design; corrections require a new record that supersedes."
          - "Assuming the design is a BrAPI Study."
          - "Treating the design as an approved protocol."
        sideEffects: "Creates a design identity or appends a new immutable version when accepted."
        idempotency: "Same design identity and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListExperimentalDesigns"
          - "genxGetExperimentalDesign"
        decisions: ["RFC-018"]
        proposalStatus: "draft-non-normative"
      summary: Register one experimental design
      description: |-
        Unknown experimentalDesignDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentalDesignNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ExperimentalDesign'
                required:
                - metadata
                - result
                title: ExperimentalDesignResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ExperimentalDesign
components:
  responses:
    ExperimentalDesignListResponse:
      content:
        application/json:
          schema:
            title: ExperimentalDesignListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExperimentalDesign'
            required:
            - metadata
            - result
      description: OK