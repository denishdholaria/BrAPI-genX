info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /trial-networks:
    get:
      operationId: genxListTrialNetworks
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.trial-networks.list"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List trial network and MET design records, optionally filtered by status."
        canBeUsedFor:
          - "Discover trial networks."
          - "Support experimental design."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI Observation."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterTrialNetwork"
          - "genxGetTrialNetwork"
          - "genxRegisterFarm"
        decisions: ["RFC-109"]
        proposalStatus: "draft-non-normative"
      summary: List trial networks
      description: Get a paged list of trial network and MET design records across authorities. Filters combine with AND.
      parameters:
      - name: fieldDbId
        description: Filter by field or site reference
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/TrialNetworkListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - TrialNetwork
    post:
      operationId: genxRegisterTrialNetwork
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.trial-networks.record"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one trial network or MET design record with provenance."
        canBeUsedFor:
          - "Publish a trial network or MET design."
          - "Retry an identical record safely using the same trialNetworkDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI Observation."
          - "Asserting that the work order is completed or validated."
        sideEffects: "Creates a trial network identity or appends a new immutable version when accepted."
        idempotency: "Same trialNetworkDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListTrialNetworks"
          - "genxGetTrialNetwork"
          - "genxRegisterFarm"
        decisions: ["RFC-109"]
        proposalStatus: "draft-non-normative"
      summary: Register one trial network
      description: |-
        Unknown trialNetworkDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrialNetworkNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/TrialNetwork'
                required:
                - metadata
                - result
                title: TrialNetworkResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - TrialNetwork
components:
  responses:
    TrialNetworkListResponse:
      content:
        application/json:
          schema:
            title: TrialNetworkListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrialNetwork'
            required:
            - metadata
            - result
      description: OK
