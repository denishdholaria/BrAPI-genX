info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    CandidateVariety:
      type: object
      description: |-
        One immutable candidate variety lifecycle record. A published
        (candidateVarietyDbId) record never mutates in place; corrections
        are recorded as additional records linked by supersedes.
      required:
      - candidateVarietyDbId
      - programDbId
      - varietyName
      - status
      properties:
        candidateVarietyDbId:
          description: Namespaced candidate-variety identity `{authority}:candidate-variety:{localId}`
          type: string
          example: institute-a:candidate-variety:cv-2026-001
        programDbId:
          description: BrAPI Program (breeding program)
          type: string
          example: institute-a:program:wheat-breeding
        varietyName:
          description: Candidate variety name
          type: string
          example: Wheat Elite Line 42
        status:
          description: Lifecycle state of the candidate variety
          type: string
          enum:
          - candidate
          - submitted
          - registered
          - released
          - withdrawn
          - superseded
          example: candidate
        registeredAt:
          description: Registration date (ISO-8601)
          type: string
          format: date
          example: '2026-10-24'
        notes:
          description: Human-readable notes
          type: string
          example: Advanced from F5 population.
        supersedes:
          description: candidateVarietyDbId of the record this one replaces
          type: string
          example: institute-a:candidate-variety:cv-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'