info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /candidate-varieties/{candidateVarietyDbId}:
    get:
      operationId: genxGetCandidateVariety
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.candidate-varieties.get"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one candidate variety lifecycle record."
        canBeUsedFor:
          - "Inspect status and provenance."
        mustNotBeUsedFor:
          - "Assuming the record is a BrAPI Program."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCandidateVariety"
          - "genxListCandidateVarieties"
        decisions: ["RFC-039"]
        proposalStatus: "draft-non-normative"
      summary: Get one candidate variety
      description: Returns the registered record, or 404.
      parameters:
      - name: candidateVarietyDbId
        description: Namespaced candidate-variety identity `{authority}:candidate-variety:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CandidateVariety'
                required:
                - metadata
                - result
                title: CandidateVarietyResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - CandidateVarietyLifecycle