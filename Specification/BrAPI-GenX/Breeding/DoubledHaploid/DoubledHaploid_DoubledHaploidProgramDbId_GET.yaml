info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /doubled-haploid-programs/{doubledHaploidProgramDbId}:
    get:
      operationId: genxGetDoubledHaploidProgram
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.doubled-haploid-programs.get"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one doubled haploid program."
        canBeUsedFor:
          - "Inspect method, donor, counts, and provenance."
        mustNotBeUsedFor:
          - "Assuming the program is a BrAPI Program."
          - "Treating a superseded program as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterDoubledHaploidProgram"
          - "genxListDoubledHaploidPrograms"
        decisions: ["RFC-020"]
        proposalStatus: "draft-non-normative"
      summary: Get one doubled haploid program
      description: Returns the registered program, or 404.
      parameters:
      - name: doubledHaploidProgramDbId
        description: Namespaced doubled-haploid-program identity `{authority}:doubled-haploid-program:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/DoubledHaploidProgram'
                required:
                - metadata
                - result
                title: DoubledHaploidProgramResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - DoubledHaploid