info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /genomic-selections/{genomicSelectionDbId}:
    get:
      operationId: genxGetGenomicSelection
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.genomic-selections.get"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one genomic selection result."
        canBeUsedFor:
          - "Inspect components, explained variance, and provenance."
        mustNotBeUsedFor:
          - "Assuming the result is a BrAPI data resource."
          - "Treating a superseded result as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordGenomicSelection"
          - "genxListGenomicSelections"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-055"]
        proposalStatus: "draft-non-normative"
      summary: Get one genomic selection result
      description: Returns the recorded result, or 404.
      parameters:
      - name: genomicSelectionDbId
        description: Namespaced PCA-result identity `{authority}:pca-result:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/GenomicSelection'
                required:
                - metadata
                - result
                title: GenomicSelectionResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - GenomicSelection