info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /measurement-scales:
    get:
      operationId: genxListMeasurementScales
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.measurement-scales.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "List measurement scale and value domain entries, optionally filtered by status."
        canBeUsedFor:
          - "Discover measurement scales and value domains."
          - "Support measurement and terminology governance."
        mustNotBeUsedFor:
          - "Creating or changing a stage entry (use the POST endpoint)."
          - "Assuming a stage entry is a BrAPI Observation."
          - "Treating the list as a complete ontology."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterMeasurementScale"
          - "genxGetMeasurementScale"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-087"]
        proposalStatus: "draft-non-normative"
      summary: List measurement scales
      description: Get a paged list of measurement scale and value domain entries across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/MeasurementScaleListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - MeasurementScale
    post:
      operationId: genxRegisterMeasurementScale
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.measurement-scales.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C4", "C9"]
        purpose: "Register one measurement scale and value domain entry with provenance."
        canBeUsedFor:
          - "Publish a measurement scale and value domain."
          - "Retry an identical entry safely using the same measurementScaleDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing entry; corrections require a new record that supersedes."
          - "Assuming an entry is a BrAPI Observation."
          - "Asserting that the entry is validated or endorsed."
        sideEffects: "Creates a measurement scale identity or appends a new immutable version when accepted."
        idempotency: "Same measurementScaleDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListMeasurementScales"
          - "genxGetMeasurementScale"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-087"]
        proposalStatus: "draft-non-normative"
      summary: Register one measurement scale
      description: |-
        Unknown measurementScaleDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementScaleNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/MeasurementScale'
                required:
                - metadata
                - result
                title: MeasurementScaleResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - MeasurementScale
components:
  responses:
    MeasurementScaleListResponse:
      content:
        application/json:
          schema:
            title: MeasurementScaleListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MeasurementScale'
            required:
            - metadata
            - result
      description: OK
