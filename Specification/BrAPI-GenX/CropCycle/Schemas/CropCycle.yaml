info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    CropCycle:
      type: object
      description: |-
        One immutable crop cycle record. A published
        (cropCycleDbId) record never mutates in place; corrections are
        recorded as additional cycles linked by supersedes.
      required:
      - cropCycleDbId
      - status
      properties:
        cropCycleDbId:
          description: Namespaced crop-cycle identity `{authority}:crop-cycle:{localId}`
          type: string
          example: institute-a:crop-cycle:cc-2026-001
        locationDbId:
          description: BrAPI Location where the cycle occurred
          type: string
          example: institute-a:location:field-12
        studyDbId:
          description: BrAPI Study / trial context, when applicable
          type: string
          example: institute-a:study:yield-trial-2026
        cropName:
          description: Crop or species name
          type: string
          example: wheat
        plantingDate:
          description: Planting date (ISO-8601)
          type: string
          format: date
          example: '2026-03-15'
        harvestDate:
          description: Harvest date (ISO-8601)
          type: string
          format: date
          example: '2026-07-20'
        status:
          description: Lifecycle state of the cycle record
          type: string
          enum:
          - active
          - completed
          - superseded
          example: active
        supersedes:
          description: cropCycleDbId of the cycle this one replaces
          type: string
          example: institute-a:crop-cycle:cc-2026-000
        provenance:
          description: Evidence and method provenance for the cycle
          $ref: '#/components/schemas/ProvenanceEnvelope'