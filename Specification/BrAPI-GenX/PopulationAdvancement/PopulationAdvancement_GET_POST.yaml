info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /population-advancements:
    get:
      operationId: genxListPopulationAdvancements
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.population-advancements.list"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List population advancement records, optionally filtered by program, population, or status."
        canBeUsedFor:
          - "Discover population advancements within a breeding program."
          - "Support breeding planning and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI Program."
          - "Treating the list as a complete breeding program record."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordPopulationAdvancement"
          - "genxGetPopulationAdvancement"
        decisions: ["RFC-035"]
        proposalStatus: "draft-non-normative"
      summary: List population advancements
      description: Get a paged list of population advancements across authorities. Filters combine with AND.
      parameters:
      - name: programDbId
        description: BrAPI Program identifier filter. This filter is valid only when paired with programServer.
        in: query
        required: false
        schema:
          type: string
      - name: programServer
        description: Authoritative BrAPI v2.1 server base URI that issued programDbId. Do not resolve an unqualified identifier by guessing the server.
        in: query
        required: false
        schema:
          type: string
          format: uri
      - name: populationDbId
        description: Population or family identifier filter. This filter is valid only when paired with populationServer.
        in: query
        required: false
        schema:
          type: string
      - name: populationServer
        description: Authoritative BrAPI v2.1 server base URI that issued populationDbId.
        in: query
        required: false
        schema:
          type: string
          format: uri
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/PopulationAdvancementListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - PopulationAdvancement
    post:
      operationId: genxRecordPopulationAdvancement
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.population-advancements.record"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one population advancement with stages and provenance."
        canBeUsedFor:
          - "Record population advancement within a breeding program."
          - "Retry an identical record safely using the same populationAdvancementDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming the record is a BrAPI Program."
          - "Treating the record as a complete breeding program record."
        sideEffects: "Creates a population advancement when accepted."
        idempotency: "Same populationAdvancementDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListPopulationAdvancements"
          - "genxGetPopulationAdvancement"
        decisions: ["RFC-035"]
        proposalStatus: "draft-non-normative"
      summary: Record one population advancement
      description: |-
        Unknown populationAdvancementDbId creates; same id with an identical
        body replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PopulationAdvancementNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/PopulationAdvancement'
                required:
                - metadata
                - result
                title: PopulationAdvancementResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - PopulationAdvancement
components:
  responses:
    PopulationAdvancementListResponse:
      content:
        application/json:
          schema:
            title: PopulationAdvancementListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PopulationAdvancement'
            required:
            - metadata
            - result
      description: OK