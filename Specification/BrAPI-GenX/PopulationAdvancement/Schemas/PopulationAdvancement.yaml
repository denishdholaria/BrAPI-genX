info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    BrapiResourceReference:
      type: object
      required: [apiGeneration, resourceType, server, dbId]
      properties:
        apiGeneration:
          type: string
          enum: ["2.1"]
        resourceType:
          type: string
        server:
          type: string
          format: uri
        dbId:
          type: string
    PopulationAdvancement:
      type: object
      description: |-
        One immutable population advancement record. A published
        (populationAdvancementDbId) record never mutates in place; corrections
        are recorded as additional records linked by supersedes.
      required:
      - populationAdvancementDbId
      - programReference
      - populationReference
      - advancedAt
      - status
      properties:
        populationAdvancementDbId:
          description: Namespaced population-advancement identity `{authority}:population-advancement:{localId}`
          type: string
          example: institute-a:population-advancement:pa-2026-001
        programReference:
          description: Authority-qualified BrAPI Program reference.
          $ref: '#/components/schemas/BrapiResourceReference'
        populationReference:
          description: Authority-qualified population or family reference. Resource type/authority must be explicit.
          $ref: '#/components/schemas/BrapiResourceReference'
        breedingPipelineDbId:
          type: string
          description: Optional stable pipeline workstream identity.
        breedingPipelineVersionDbId:
          type: string
          description: Exact immutable pipeline revision when governed by a registered pipeline.
        breedingSchemeDbId:
          type: string
          description: Optional stable scheme identity.
        breedingSchemeVersionDbId:
          type: string
          description: Required whenever fromStageId or toStageId is supplied.
        fromStageId:
          type: string
          description: Scheme-version-local source stage identifier.
        toStageId:
          type: string
          description: Scheme-version-local destination stage identifier.
        advancedAt:
          description: Date of advancement (ISO-8601)
          type: string
          format: date
          example: '2026-10-24'
        notes:
          description: Human-readable notes
          type: string
          example: Selected lines advanced to F3.
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          example: active
        supersedes:
          description: populationAdvancementDbId of the record this one replaces
          type: string
          example: institute-a:population-advancement:pa-2026-000
        provenance:
          description: Evidence and method provenance for the advancement
          $ref: '#/components/schemas/ProvenanceEnvelope'