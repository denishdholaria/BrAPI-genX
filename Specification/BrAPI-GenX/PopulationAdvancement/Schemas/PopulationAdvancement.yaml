info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    PopulationAdvancement:
      type: object
      description: |-
        One immutable population advancement record. A published
        (populationAdvancementDbId) record never mutates in place; corrections
        are recorded as additional records linked by supersedes.
      required:
      - populationAdvancementDbId
      - programDbId
      - populationDbId
      - fromStage
      - toStage
      - advancedAt
      - status
      properties:
        populationAdvancementDbId:
          description: Namespaced population-advancement identity `{authority}:population-advancement:{localId}`
          type: string
          example: institute-a:population-advancement:pa-2026-001
        programDbId:
          description: BrAPI Program (breeding program)
          type: string
          example: institute-a:program:wheat-breeding
        populationDbId:
          description: BrAPI population or family reference
          type: string
          example: institute-a:population:f2-2026
        fromStage:
          description: Stage the population advanced from
          type: string
          example: F2
        toStage:
          description: Stage the population advanced to
          type: string
          example: F3
        advancedAt:
          description: Date of advancement (ISO-8601)
          type: string
          format: date
          example: '2026-10-24'
        notes:
          description: Human-readable notes
          type: string
          example: Selected lines advanced to F3.
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          example: active
        supersedes:
          description: populationAdvancementDbId of the record this one replaces
          type: string
          example: institute-a:population-advancement:pa-2026-000
        provenance:
          description: Evidence and method provenance for the advancement
          $ref: '#/components/schemas/ProvenanceEnvelope'