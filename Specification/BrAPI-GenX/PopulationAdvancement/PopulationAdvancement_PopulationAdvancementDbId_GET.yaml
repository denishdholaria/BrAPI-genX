info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /population-advancements/{populationAdvancementDbId}:
    get:
      operationId: genxGetPopulationAdvancement
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.population-advancements.get"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one population advancement record."
        canBeUsedFor:
          - "Inspect stages, dates, and provenance."
        mustNotBeUsedFor:
          - "Assuming the record is a BrAPI Program."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordPopulationAdvancement"
          - "genxListPopulationAdvancements"
        decisions: ["RFC-035"]
        proposalStatus: "draft-non-normative"
      summary: Get one population advancement
      description: Returns the recorded advancement, or 404.
      parameters:
      - name: populationAdvancementDbId
        description: Namespaced population-advancement identity `{authority}:population-advancement:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/PopulationAdvancement'
                required:
                - metadata
                - result
                title: PopulationAdvancementResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - PopulationAdvancement