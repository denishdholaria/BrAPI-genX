info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /disease-observations:
    get:
      operationId: genxListDiseaseObservations
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.disease-observations.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List disease observation records, optionally filtered by status."
        canBeUsedFor:
          - "Discover disease observations."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterDiseaseObservation"
          - "genxGetDiseaseObservation"
          - "genxRegisterFarm"
        decisions: ["RFC-123"]
        proposalStatus: "draft-non-normative"
      summary: List disease observations
      description: Get a paged list of disease observation records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/DiseaseObservationListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - DiseaseObservation
    post:
      operationId: genxRegisterDiseaseObservation
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.disease-observations.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one disease observation record with provenance."
        canBeUsedFor:
          - "Publish a disease observation."
          - "Retry an identical record safely using the same diseaseObservationDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a disease observation identity or appends a new immutable version when accepted."
        idempotency: "Same diseaseObservationDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListDiseaseObservations"
          - "genxGetDiseaseObservation"
          - "genxRegisterFarm"
        decisions: ["RFC-123"]
        proposalStatus: "draft-non-normative"
      summary: Register one disease observation
      description: Register one disease observation record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiseaseObservationNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/DiseaseObservation'
                required:
                - metadata
                - result
                title: DiseaseObservationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - DiseaseObservation
components:
  responses:
    DiseaseObservationListResponse:
      content:
        application/json:
          schema:
            title: DiseaseObservationListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiseaseObservation'
            required:
            - metadata
            - result
      description: OK