info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    OntologyTermRecordNewRequest:
      type: object
      description: |-
        Request to register one ontology term or synonym entry. Unknown
        ontologyTermDbId creates; same id with an identical body replays the
        existing record; same id with a different body is rejected with 409.
      required:
      - ontologyTermDbId
      properties:
        ontologyTermDbId:
          description: Namespaced ontology-term identity `{authority}:ontology-term:{localId}`
          type: string
          example: institute-a:ontology-term:ot-2026-001
        term:
          description: Ontology term
          type: string
          example: wheat
        synonyms:
          description: Synonyms for the term
          type: array
          items:
            type: string
          example: ["Triticum aestivum"]
        ontology:
          description: Source ontology name
          type: string
          example: AGROVOC
        status:
          description: Lifecycle state of the entry
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: ontologyTermDbId of the entry this one replaces
          type: string
          example: institute-a:ontology-term:ot-2026-000
        provenance:
          description: Evidence and method provenance for the entry
          $ref: '#/components/schemas/ProvenanceEnvelope'
