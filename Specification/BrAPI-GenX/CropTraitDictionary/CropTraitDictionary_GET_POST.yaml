info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /crop-trait-dictionaries:
    get:
      operationId: genxListCropTraitDictionaries
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crop-trait-dictionaries.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "List crop trait dictionary entries, optionally filtered by status."
        canBeUsedFor:
          - "Discover crop trait dictionary entries."
          - "Support crop trait and terminology governance."
        mustNotBeUsedFor:
          - "Creating or changing a stage entry (use the POST endpoint)."
          - "Assuming a stage entry is a BrAPI Observation."
          - "Treating the list as a complete ontology."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCropTraitDictionary"
          - "genxGetCropTraitDictionary"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-088"]
        proposalStatus: "draft-non-normative"
      summary: List crop trait dictionaries
      description: Get a paged list of crop trait dictionary entries across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/CropTraitDictionaryListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CropTraitDictionary
    post:
      operationId: genxRegisterCropTraitDictionary
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crop-trait-dictionaries.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C4", "C9"]
        purpose: "Register one crop trait dictionary entry with provenance."
        canBeUsedFor:
          - "Publish a crop trait dictionary entry."
          - "Retry an identical entry safely using the same cropTraitDictionaryDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing entry; corrections require a new record that supersedes."
          - "Assuming an entry is a BrAPI Observation."
          - "Asserting that the entry is validated or endorsed."
        sideEffects: "Creates a crop trait dictionary identity or appends a new immutable version when accepted."
        idempotency: "Same cropTraitDictionaryDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListCropTraitDictionaries"
          - "genxGetCropTraitDictionary"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-088"]
        proposalStatus: "draft-non-normative"
      summary: Register one crop trait dictionary
      description: |-
        Unknown cropTraitDictionaryDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CropTraitDictionaryNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CropTraitDictionary'
                required:
                - metadata
                - result
                title: CropTraitDictionaryResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CropTraitDictionary
components:
  responses:
    CropTraitDictionaryListResponse:
      content:
        application/json:
          schema:
            title: CropTraitDictionaryListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CropTraitDictionary'
            required:
            - metadata
            - result
      description: OK
