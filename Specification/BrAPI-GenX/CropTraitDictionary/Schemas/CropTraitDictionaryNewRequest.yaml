info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    CropTraitDictionaryNewRequest:
      type: object
      description: |-
        Request to register one crop trait dictionary entry. Unknown
        cropTraitDictionaryDbId creates; same id with an identical body replays
        the existing record; same id with a different body is rejected with 409.
      required:
      - cropTraitDictionaryDbId
      properties:
        cropTraitDictionaryDbId:
          description: Namespaced crop-trait-dictionary identity `{authority}:crop-trait-dictionary:{localId}`
          type: string
          example: institute-a:crop-trait-dictionary:ctd-2026-001
        cropDbId:
          description: Crop or germplasm reference
          type: string
          example: crop-001
        trait:
          description: Trait name or identifier
          type: string
          example: grain yield
        definition:
          description: Definition of the trait
          type: string
          example: Grain yield per unit area
        status:
          description: Lifecycle state of the entry
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: cropTraitDictionaryDbId of the entry this one replaces
          type: string
          example: institute-a:crop-trait-dictionary:ctd-2026-000
        provenance:
          description: Evidence and method provenance for the entry
          $ref: '#/components/schemas/ProvenanceEnvelope'
