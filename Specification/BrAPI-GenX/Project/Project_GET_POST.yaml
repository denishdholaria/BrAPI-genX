info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /projects:
    get:
      operationId: genxListProjects
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.projects.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List project and funding reference records, optionally filtered by status."
        canBeUsedFor:
          - "Discover projects and funding references."
          - "Support research organization and reference data."
        mustNotBeUsedFor:
          - "Creating or changing a project (use the POST endpoint)."
          - "Assuming a project is a BrAPI Study."
          - "Treating the list as a complete project catalogue."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterProject"
          - "genxGetProject"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-089"]
        proposalStatus: "draft-non-normative"
      summary: List projects
      description: Get a paged list of project and funding reference records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ProjectListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Project
    post:
      operationId: genxRegisterProject
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.projects.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one project and funding reference record with provenance."
        canBeUsedFor:
          - "Publish a project or funding reference."
          - "Retry an identical record safely using the same projectDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a project is a BrAPI Study."
          - "Asserting that the project is validated or endorsed."
        sideEffects: "Creates a project identity or appends a new immutable version when accepted."
        idempotency: "Same projectDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListProjects"
          - "genxGetProject"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-089"]
        proposalStatus: "draft-non-normative"
      summary: Register one project
      description: |-
        Unknown projectDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/Project'
                required:
                - metadata
                - result
                title: ProjectResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Project
components:
  responses:
    ProjectListResponse:
      content:
        application/json:
          schema:
            title: ProjectListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
            required:
            - metadata
            - result
      description: OK
