info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    BreedingPipelineNewRequest:
      type: object
      description: Register a stable BreedingPipeline identity together with one immutable revision. Replay identity is breedingPipelineVersionDbId, not breedingPipelineDbId.
      required: [breedingPipelineDbId, breedingPipelineVersion]
      properties:
        breedingPipelineDbId:
          type: string
          description: Stable namespaced identity of the continuing pipeline workstream.
          example: institute-a:breeding-pipeline:bp-2026-001
        breedingPipelineVersion:
          description: Immutable revision payload. Scheme definitions are embedded in each scheme binding.
          $ref: '#/components/schemas/BreedingPipelineRevision'
