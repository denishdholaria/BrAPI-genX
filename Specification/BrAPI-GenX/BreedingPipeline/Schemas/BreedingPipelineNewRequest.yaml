info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    BreedingPipelineNewRequest:
      type: object
      description: Register a stable BreedingPipeline identity together with one immutable revision. Replay identity is breedingPipelineVersionDbId, not breedingPipelineDbId.
      required: [breedingPipelineDbId, breedingPipelineVersion]
      properties:
        breedingPipelineDbId:
          type: string
          description: Stable namespaced identity of the continuing pipeline workstream.
          example: institute-a:breeding-pipeline:bp-2026-001
        breedingPipelineVersion:
          $ref: '#/components/schemas/BreedingPipelineRevision'
    BreedingPipelineRevision:
      type: object
      required: [breedingPipelineVersionDbId, programReference, publicationState]
      properties:
        breedingPipelineVersionDbId:
          type: string
          description: Immutable revision identity. Same ID and identical canonical payload replays; same ID with a different payload is rejected with 409.
          example: institute-a:breeding-pipeline-version:bp-2026-001-v2
        pipelineName:
          type: string
        purpose:
          type: string
        programReference:
          $ref: '#/components/schemas/BrapiResourceReference'
        targetContexts:
          type: array
          items:
            $ref: '#/components/schemas/BreedingTargetContext'
        schemeBindings:
          type: array
          items:
            $ref: '#/components/schemas/BreedingSchemeBinding'
        publicationState:
          type: string
          enum: [draft, published, withdrawn]
        revisionRelationship:
          $ref: '#/components/schemas/RevisionRelationship'
        provenance:
          $ref: '#/components/schemas/ProvenanceEnvelope'
    BrapiResourceReference:
      type: object
      required: [apiGeneration, resourceType, server, dbId]
      properties:
        apiGeneration:
          type: string
          enum: ["2.1"]
        resourceType:
          type: string
        server:
          type: string
          format: uri
        dbId:
          type: string
    BreedingTargetContext:
      type: object
      properties:
        productConcept:
          type: object
          properties:
            reference:
              type: string
            snapshot:
              type: object
              additionalProperties: true
        marketSegment:
          type: object
          properties:
            reference:
              type: string
            description:
              type: string
        targetPopulationOfEnvironments:
          type: object
          properties:
            reference:
              type: string
            description:
              type: string
        traitRequirements:
          type: array
          items:
            type: object
            required: [traitReference, desiredDirection]
            properties:
              traitReference:
                $ref: '#/components/schemas/BrapiResourceReference'
              desiredDirection:
                type: string
                enum: [increase, decrease, maintain, target-range]
              threshold:
                type: number
              minimum:
                type: number
              maximum:
                type: number
              unit:
                type: string
              exactDecimal:
                type: string
        provenance:
          $ref: '#/components/schemas/ProvenanceEnvelope'
    BreedingSchemeBinding:
      type: object
      required: [breedingSchemeDbId, breedingSchemeVersionDbId]
      properties:
        breedingSchemeDbId:
          type: string
        breedingSchemeVersionDbId:
          type: string
        role:
          type: string
    RevisionRelationship:
      type: object
      properties:
        relationshipType:
          type: string
          enum: [supersedes, corrects]
        priorBreedingPipelineVersionDbId:
          type: string
