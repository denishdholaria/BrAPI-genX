info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    BreedingPipeline:
      type: object
      description: |-
        One immutable breeding pipeline record. A published (breedingPipelineDbId) record
        never mutates in place; corrections are recorded as additional
        records linked by supersedes.
      required:
      - breedingPipelineDbId
      - status
      properties:
        breedingPipelineDbId:
          description: Namespaced breeding-pipeline identity `{authority}:breeding-pipeline:{localId}`
          type: string
          example: institute-a:breeding-pipeline:bp-2026-001
        pipelineName:
          description: Name of the breeding pipeline
          type: string
          example: maize-recurrent-selection-2026
        pipelineType:
          description: Type of breeding pipeline
          type: string
          example: recurrent-selection
        breedingProgram:
          description: Reference to breeding program
          type: string
          example: institute-a:breeding-program:bp-2026-001
        pipelineStage:
          description: Current pipeline stage
          type: string
          example: advancement
        targetTrait:
          description: Target trait for selection
          type: string
          example: drought-tolerance
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: breedingPipelineDbId of the record this one replaces
          type: string
          example: institute-a:breeding-pipeline:bp-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
