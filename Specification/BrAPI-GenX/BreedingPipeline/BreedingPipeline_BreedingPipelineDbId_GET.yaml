info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /breeding-pipelines/{breedingPipelineDbId}:
    get:
      operationId: genxGetBreedingPipeline
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.breeding-pipelines.get"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve the stable logical pipeline view or one exact immutable revision."
        canBeUsedFor:
          - "Inspect the stable workstream identity and its current published revision summary."
          - "Retrieve the exact immutable revision identified by breedingPipelineVersionDbId."
        mustNotBeUsedFor:
          - "Assuming a record is a BrAPI data resource."
          - "Treating the current revision as a substitute for an explicitly requested historical revision."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterBreedingPipeline"
          - "genxListBreedingPipelines"
        decisions: ["RFC-154"]
        proposalStatus: "draft-non-normative"
      summary: Get one breeding pipeline
      description: Returns the logical pipeline with current published revision by default, or the exact requested breedingPipelineVersionDbId revision, or 404.
      parameters:
      - name: breedingPipelineDbId
        description: Namespaced breeding-pipeline identity `{authority}:breeding-pipeline:{localId}`
        in: path
        required: true
        schema:
          type: string
      - name: breedingPipelineVersionDbId
        description: Optional exact immutable revision identifier. When omitted, the current published revision is returned.
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/BreedingPipelineRevision'
                required:
                - metadata
                - result
                title: BreedingPipelineResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - BreedingPipeline