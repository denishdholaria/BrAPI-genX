info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /breeding-pipelines/{breedingPipelineDbId}:
    get:
      operationId: genxGetBreedingPipeline
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.breeding-pipelines.get"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one registered breeding pipeline."
        canBeUsedFor:
          - "Inspect a registered breeding pipeline record and its provenance."
        mustNotBeUsedFor:
          - "Assuming a record is a BrAPI data resource."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterBreedingPipeline"
          - "genxListBreedingPipelines"
        decisions: ["RFC-154"]
        proposalStatus: "draft-non-normative"
      summary: Get one breeding pipeline
      description: Returns the registered record, or 404.
      parameters:
      - name: breedingPipelineDbId
        description: Namespaced breeding-pipeline identity `{authority}:breeding-pipeline:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/BreedingPipeline'
                required:
                - metadata
                - result
                title: BreedingPipelineResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - BreedingPipeline