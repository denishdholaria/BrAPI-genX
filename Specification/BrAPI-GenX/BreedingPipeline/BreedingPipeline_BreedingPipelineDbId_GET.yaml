info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /breeding-pipelines/{breedingPipelineDbId}:
    get:
      operationId: genxGetBreedingPipeline
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.breeding-pipelines.get"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve the current published revision or one exact immutable revision of a stable pipeline workstream."
        canBeUsedFor:
          - "Retrieve the current published revision for a known stable workstream identity."
          - "Retrieve a specifically identified historical, draft, or withdrawn revision."
        mustNotBeUsedFor:
          - "Retrieve the logical workstream projection or revision-summary collection; use the list endpoint for those views."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the current revision as a substitute for an explicitly requested historical revision."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterBreedingPipeline"
          - "genxListBreedingPipelines"
        decisions: ["RFC-154", "D-BP-03", "D-BP-13"]
        proposalStatus: "draft-non-normative"
      summary: Get one breeding pipeline
      description: Returns the current published BreedingPipelineRevision by default, or the exact requested immutable revision. The response result is a revision payload in both cases; the stable breedingPipelineDbId remains within it. A default request returns 404 when no current published revision exists. The list endpoint returns the logical workstream projection and revision summaries.
      parameters:
      - name: breedingPipelineDbId
        description: Namespaced breeding-pipeline identity `{authority}:breeding-pipeline:{localId}`
        in: path
        required: true
        schema:
          type: string
      - name: breedingPipelineVersionDbId
        description: Optional exact immutable revision identifier, including draft or withdrawn history when authorized. When omitted, the current published revision is returned; if none exists, the server returns 404.
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/BreedingPipelineResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - BreedingPipeline