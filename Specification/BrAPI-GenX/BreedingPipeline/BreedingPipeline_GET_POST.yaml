info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /breeding-pipelines:
    get:
      operationId: genxListBreedingPipelines
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.breeding-pipelines.list"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List breeding pipeline definitions, optionally filtered by program or status."
        canBeUsedFor:
          - "Discover breeding pipelines."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterBreedingPipeline"
          - "genxGetBreedingPipeline"
          - "genxRegisterFarm"
        decisions: ["RFC-154"]
        proposalStatus: "draft-non-normative"
      summary: List breeding pipeline
      description: Get a paged list of breeding pipeline records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/BreedingPipelineListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - BreedingPipeline
    post:
      operationId: genxRegisterBreedingPipeline
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.breeding-pipelines.record"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one breeding pipeline record with provenance."
        canBeUsedFor:
          - "Publish a breeding pipeline."
          - "Retry an identical record safely using the same breedingPipelineDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a breeding pipeline identity or appends a new immutable version when accepted."
        idempotency: "Same breedingPipelineDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListBreedingPipelines"
          - "genxGetBreedingPipeline"
          - "genxRegisterFarm"
        decisions: ["RFC-154"]
        proposalStatus: "draft-non-normative"
      summary: Register one breeding pipeline
      description: Register one breeding pipeline record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreedingPipelineNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/BreedingPipeline'
                required:
                - metadata
                - result
                title: BreedingPipelineResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - BreedingPipeline
components:
  responses:
    BreedingPipelineListResponse:
      content:
        application/json:
          schema:
            title: BreedingPipelineListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BreedingPipeline'
            required:
            - metadata
            - result
      description: OK