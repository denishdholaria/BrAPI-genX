info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /breeding-pipelines:
    get:
      operationId: genxListBreedingPipelines
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.breeding-pipelines.list"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List stable BreedingPipeline workstream identities and their available revision summaries."
        canBeUsedFor:
          - "Discover stable breeding-pipeline workstream identities."
          - "Compare workstream purpose, current revision, and provenance across returned records."
          - "Request revision summaries for a complete workstream history."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the default current-revision view as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterBreedingPipeline"
          - "genxGetBreedingPipeline"
        decisions: ["RFC-154", "D-BP-01", "D-BP-02", "D-BP-03", "D-BP-13"]
        proposalStatus: "draft-non-normative"
      summary: List breeding pipelines
      description: Get a paged list of stable pipeline workstream identities. The default view returns the current published revision summary for each logical pipeline. An explicit includeRevisions option returns revision summaries; it does not replace exact historical revision retrieval.
      parameters:
      - name: includeRevisions
        description: When true, include all known revision summaries for each logical pipeline. When false or omitted, return the current published revision summary only.
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/BreedingPipelineListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - BreedingPipeline
    post:
      operationId: genxRegisterBreedingPipeline
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.breeding-pipelines.record"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Create a stable BreedingPipeline workstream and append its first immutable revision, or append a new immutable revision to an existing workstream."
        canBeUsedFor:
          - "Register a stable workstream identity with a new immutable breedingPipelineVersionDbId."
          - "Retry an identical revision safely using the same breedingPipelineVersionDbId."
        mustNotBeUsedFor:
          - "Mutating a published revision; substantive corrections require a new version identity."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a stable workstream identity when unknown and creates one immutable revision."
        idempotency: "Replay is keyed by breedingPipelineVersionDbId. The same version ID and identical canonical payload replays; the same version ID with a different payload is rejected with 409. A new revision under an existing pipeline uses a new version ID."
        semanticNeighbors:
          - "genxListBreedingPipelines"
          - "genxGetBreedingPipeline"
        decisions: ["RFC-154"]
        proposalStatus: "draft-non-normative"
      summary: Register a breeding pipeline revision
      description: Creates or references one stable workstream identity and registers one immutable pipeline revision. A new breedingPipelineVersionDbId is required for every additional revision.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreedingPipelineNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/BreedingPipelineRevision'
                required:
                - metadata
                - result
                title: BreedingPipelineResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - BreedingPipeline
components:
  schemas:
    BreedingPipelineResponse:
      type: object
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/metadata'
        result:
          $ref: '#/components/schemas/BreedingPipelineRevision'
  responses:
    BreedingPipelineListResponse:
      content:
        application/json:
          schema:
            title: BreedingPipelineListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BreedingPipeline'
            required:
            - metadata
            - result
      description: OK