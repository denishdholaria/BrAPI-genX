info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /breeding-pipelines:
    get:
      operationId: genxListBreedingPipelines
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.breeding-pipelines.list"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List breeding pipeline definitions, optionally filtered by program or status."
        canBeUsedFor:
          - "Discover breeding pipelines and their stage gates."
          - "Support breeding program planning and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a pipeline (use the POST endpoint)."
          - "Assuming a pipeline is a BrAPI Program or Study."
          - "Treating the list as a complete breeding program record."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterBreedingPipeline"
          - "genxGetBreedingPipeline"
        decisions: ["RFC-014"]
        proposalStatus: "draft-non-normative"
      summary: List breeding pipelines
      description: Get a paged list of breeding pipelines across authorities. Filters combine with AND.
      parameters:
      - name: programDbId
        description: Filter by BrAPI Program (breeding program)
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - deprecated
          - superseded
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/BreedingPipelineListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - BreedingPipeline
    post:
      operationId: genxRegisterBreedingPipeline
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.breeding-pipelines.register"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register a breeding pipeline with stages, entry/exit criteria, and provenance."
        canBeUsedFor:
          - "Publish pipeline stage-gate definitions."
          - "Create a new version under an existing pipeline identity."
        mustNotBeUsedFor:
          - "Updating or deleting an existing pipeline; corrections require a new record that supersedes."
          - "Assuming the pipeline is a BrAPI Program or Study."
          - "Treating the pipeline as an approved breeding plan."
        sideEffects: "Creates a pipeline identity or appends a new immutable version when accepted."
        idempotency: "Same pipeline identity and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListBreedingPipelines"
          - "genxGetBreedingPipeline"
        decisions: ["RFC-014"]
        proposalStatus: "draft-non-normative"
      summary: Register one breeding pipeline
      description: |-
        Unknown breedingPipelineDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreedingPipelineNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/BreedingPipeline'
                required:
                - metadata
                - result
                title: BreedingPipelineResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - BreedingPipeline
components:
  responses:
    BreedingPipelineListResponse:
      content:
        application/json:
          schema:
            title: BreedingPipelineListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BreedingPipeline'
            required:
            - metadata
            - result
      description: OK