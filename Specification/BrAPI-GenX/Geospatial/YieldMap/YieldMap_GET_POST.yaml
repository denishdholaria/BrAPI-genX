info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /yield-maps:
    get:
      operationId: genxListYieldMaps
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.yield-maps.list"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List yield maps, optionally filtered by study, crop cycle, or status."
        canBeUsedFor:
          - "Discover yield maps produced for a study or crop cycle."
          - "Support yield analysis and field-level reporting."
        mustNotBeUsedFor:
          - "Creating or changing a yield map (use the POST endpoint)."
          - "Assuming a yield map is a BrAPI Observation."
          - "Treating the list as a complete yield history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterYieldMap"
          - "genxGetYieldMap"
        decisions: ["RFC-070"]
        proposalStatus: "draft-non-normative"
      summary: List yield maps
      description: Get a paged list of yield maps across authorities. Filters combine with AND.
      parameters:
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: cropCycleDbId
        description: Filter by GenX CropCycle
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - inactive
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/YieldMapListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - YieldMap
    post:
      operationId: genxRegisterYieldMap
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.yield-maps.register"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register a yield map with storage reference, resolution, and provenance."
        canBeUsedFor:
          - "Publish a yield map produced from harvest data."
          - "Create a new version under an existing yield map identity."
        mustNotBeUsedFor:
          - "Updating or deleting an existing yield map; corrections require a new record that supersedes."
          - "Assuming the yield map is a BrAPI Observation."
          - "Treating the yield map as measured yield without the referenced harvest records."
        sideEffects: "Creates a yield map identity or appends a new immutable version when accepted."
        idempotency: "Same yield map identity and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListYieldMaps"
          - "genxGetYieldMap"
        decisions: ["RFC-070"]
        proposalStatus: "draft-non-normative"
      summary: Register one yield map
      description: |-
        Unknown yieldMapDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YieldMapNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/YieldMap'
                required:
                - metadata
                - result
                title: YieldMapResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - YieldMap
components:
  responses:
    YieldMapListResponse:
      content:
        application/json:
          schema:
            title: YieldMapListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/YieldMap'
            required:
            - metadata
            - result
      description: OK