info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /location-geometries:
    get:
      operationId: genxListLocationGeometries
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.location-geometries.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List location geometry records, optionally filtered by status."
        canBeUsedFor:
          - "Discover location-geometries and time conventions."
          - "Support geospatial reference data."
        mustNotBeUsedFor:
          - "Creating or changing a list (use the POST endpoint)."
          - "Assuming a list is a BrAPI Study."
          - "Treating the list as a complete catalogue."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterLocationGeometry"
          - "genxGetLocationGeometry"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-092"]
        proposalStatus: "draft-non-normative"
      summary: List location-geometries
      description: Get a paged list of location-geometry and time convention records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/LocationGeometryListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - LocationGeometry
    post:
      operationId: genxRegisterLocationGeometry
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.location-geometries.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one location geometry record with provenance."
        canBeUsedFor:
          - "Publish a location-geometry or time convention."
          - "Retry an identical record safely using the same locationGeometryDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a list is a BrAPI Study."
          - "Asserting that the list is validated or endorsed."
        sideEffects: "Creates a location geometry identity or appends a new immutable version when accepted."
        idempotency: "Same locationGeometryDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListLocationGeometries"
          - "genxGetLocationGeometry"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-092"]
        proposalStatus: "draft-non-normative"
      summary: Register one location-geometry
      description: |-
        Unknown locationGeometryDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationGeometryNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/LocationGeometry'
                required:
                - metadata
                - result
                title: LocationGeometryResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - LocationGeometry
components:
  responses:
    LocationGeometryListResponse:
      content:
        application/json:
          schema:
            title: LocationGeometryListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LocationGeometry'
            required:
            - metadata
            - result
      description: OK
