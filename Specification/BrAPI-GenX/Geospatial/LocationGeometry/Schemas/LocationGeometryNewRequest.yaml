info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    LocationGeometryNewRequest:
      type: object
      description: |-
        Request to register one location geometry record. Unknown
        locationGeometryDbId creates; same id with an identical body replays
        the existing record; same id with a different body is rejected with 409.
      required:
      - locationGeometryDbId
      properties:
        locationGeometryDbId:
          description: Namespaced location-geometry identity `{authority}:location-geometry:{localId}`
          type: string
          example: institute-a:location-geometry:lg-2026-001
        locationDbId:
          description: BrAPI Location reference
          type: string
          example: loc-001
        geometryUri:
          description: URI referencing the geometry
          type: string
          example: https://storage.example.org/geom/lg-2026-001.geojson
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: locationGeometryDbId of the record this one replaces
          type: string
          example: institute-a:location-geometry:lg-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
