info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /crs-transforms:
    get:
      operationId: genxListCrsTransforms
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crs-transforms.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List crs transform records, optionally filtered by status."
        canBeUsedFor:
          - "Discover crs transforms."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCrsTransform"
          - "genxGetCrsTransform"
          - "genxRegisterFarm"
        decisions: ["RFC-140"]
        proposalStatus: "draft-non-normative"
      summary: List crs transforms
      description: Get a paged list of crs transform records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/CrsTransformListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CrsTransform
    post:
      operationId: genxRegisterCrsTransform
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crs-transforms.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one crs transform record with provenance."
        canBeUsedFor:
          - "Publish a crs transform."
          - "Retry an identical record safely using the same crsTransformDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a crs transform identity or appends a new immutable version when accepted."
        idempotency: "Same crsTransformDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListCrsTransforms"
          - "genxGetCrsTransform"
          - "genxRegisterFarm"
        decisions: ["RFC-140"]
        proposalStatus: "draft-non-normative"
      summary: Register one crs transform
      description: Register one crs transform record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrsTransformNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CrsTransform'
                required:
                - metadata
                - result
                title: CrsTransformResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CrsTransform
components:
  responses:
    CrsTransformListResponse:
      content:
        application/json:
          schema:
            title: CrsTransformListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CrsTransform'
            required:
            - metadata
            - result
      description: OK