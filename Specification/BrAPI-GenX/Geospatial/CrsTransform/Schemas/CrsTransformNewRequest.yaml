info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    CrsTransformNewRequest:
      type: object
      description: |-
        Request to register one CRS transform record. Unknown crsTransformDbId
        creates; same id with an identical body replays the existing record;
        same id with a different body is rejected with 409.
      required:
      - crsTransformDbId
      properties:
        crsTransformDbId:
          description: Namespaced CRS-transform identity `{authority}:crs-transform:{localId}`
          type: string
          example: institute-a:crs-transform:ct-2026-001
        sourceCrs:
          description: Source CRS
          type: string
          example: EPSG:4326
        targetCrs:
          description: Target CRS
          type: string
          example: EPSG:3857
        transformMethod:
          description: Transform method
          type: string
          example: reprojection
        parameters:
          description: Transform parameters
          type: string
          example: {}
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: crsTransformDbId of the record this one replaces
          type: string
          example: institute-a:crs-transform:ct-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
