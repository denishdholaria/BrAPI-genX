info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /spatial-queries:
    get:
      operationId: genxListSpatialQueries
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.spatial-queries.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List spatial query records, optionally filtered by status."
        canBeUsedFor:
          - "Discover spatial querys."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterSpatialQuery"
          - "genxGetSpatialQuery"
          - "genxRegisterFarm"
        decisions: ["RFC-143"]
        proposalStatus: "draft-non-normative"
      summary: List spatial queries
      description: Get a paged list of spatial query records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/SpatialQueryListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SpatialQuery
    post:
      operationId: genxRegisterSpatialQuery
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.spatial-queries.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one spatial query record with provenance."
        canBeUsedFor:
          - "Publish a spatial query."
          - "Retry an identical record safely using the same spatialQueryDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a spatial query identity or appends a new immutable version when accepted."
        idempotency: "Same spatialQueryDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListSpatialQueries"
          - "genxGetSpatialQuery"
          - "genxRegisterFarm"
        decisions: ["RFC-143"]
        proposalStatus: "draft-non-normative"
      summary: Register one spatial query
      description: Register one spatial query record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpatialQueryNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/SpatialQuery'
                required:
                - metadata
                - result
                title: SpatialQueryResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SpatialQuery
components:
  responses:
    SpatialQueryListResponse:
      content:
        application/json:
          schema:
            title: SpatialQueryListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SpatialQuery'
            required:
            - metadata
            - result
      description: OK