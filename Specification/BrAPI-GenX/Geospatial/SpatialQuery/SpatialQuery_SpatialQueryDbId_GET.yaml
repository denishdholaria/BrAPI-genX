info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /spatial-queries/{spatialQueryDbId}:
    get:
      operationId: genxGetSpatialQuery
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.spatial-queries.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one spatial query record."
        canBeUsedFor:
          - "Inspect catalogue entries and provenance."
        mustNotBeUsedFor:
          - "Assuming a record is a BrAPI data resource."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterSpatialQuery"
          - "genxListSpatialQueries"
          - "genxRegisterResearchAsset"
        decisions: ["RFC-143"]
        proposalStatus: "draft-non-normative"
      summary: Get one spatial query
      description: Returns the registered record, or 404.
      parameters:
      - name: spatialQueryDbId
        description: Namespaced spatial-queries identity `{authority}:spatial-queries:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/SpatialQuery'
                required:
                - metadata
                - result
                title: SpatialQueryResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - SpatialQuery