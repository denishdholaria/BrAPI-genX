info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    PhenotypeCapture:
      type: object
      description: |-
        One immutable phenotype capture record. A published
        (phenotypeCaptureDbId) record never mutates in place; corrections are
        recorded as additional captures linked by supersedes.
      required:
      - phenotypeCaptureDbId
      - studyDbId
      - observationUnitDbId
      - capturedAt
      - entries
      properties:
        phenotypeCaptureDbId:
          description: Namespaced phenotype-capture identity `{authority}:phenotype-capture:{localId}`
          type: string
          example: institute-a:phenotype-capture:pc-2026-001
        studyDbId:
          description: BrAPI Study / trial context
          type: string
          example: institute-a:study:yield-trial-2026
        observationUnitDbId:
          description: BrAPI Observation Unit captured
          type: string
          example: institute-a:observationunit:ou-42
        capturedAt:
          description: Timestamp of the capture (ISO-8601)
          type: string
          format: date-time
          example: '2026-10-24T08:00:00Z'
        captureMethod:
          description: How the capture was performed
          type: string
          enum:
          - manual
          - image
          - sensor
          - bulk
          example: manual
        entries:
          description: Captured observation entries with quality and missingness
          type: array
          items:
            type: object
            required:
            - variableDbId
            properties:
              variableDbId:
                description: BrAPI Observation Variable or GenX VariableTerm identifier
                type: string
                example: institute-a:variable:grain-yield
              value:
                description: Observed value (null when missing)
                type: number
                nullable: true
                example: 4.2
              unit:
                description: Unit of measure
                type: string
                example: t_per_hectare
              qualityFlag:
                description: Quality status of the entry
                type: string
                enum:
                - valid
                - suspect
                - invalid
                - missing
                example: valid
              missingReason:
                description: Reason when value is missing
                type: string
                example: not-observed
              correctedFrom:
                description: Previous value this entry corrects
                type: number
                example: 4.0
        imageDbIds:
          description: BrAPI Image identifiers linked to this capture
          type: array
          items:
            type: string
          example: [institute-a:image:img-1]
        notes:
          description: Human-readable notes
          type: string
          example: First capture after flowering.
        supersedes:
          description: phenotypeCaptureDbId of the capture this one replaces
          type: string
          example: institute-a:phenotype-capture:pc-2026-000
        status:
          description: Lifecycle state of the capture record
          type: string
          enum:
          - active
          - superseded
          example: active
        provenance:
          description: Evidence and method provenance for the capture
          $ref: '#/components/schemas/ProvenanceEnvelope'