info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /variantmatrices/{matrixDbId}:
    get:
      operationId: genxGetVariantMatrixReference
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.variant-matrices.get"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C5", "C6", "C9"]
        purpose: "Retrieve one registered variant-matrix reference and its integrity and retrieval metadata."
        canBeUsedFor:
          - "Resolve the metadata needed to retrieve and verify external matrix bytes."
        mustNotBeUsedFor:
          - "Expecting the matrix file or selected variants to be streamed in the response."
          - "Treating the matrix reference as a VariantSet or CallSet."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "SEM-04"
        decisions: ["RFC-005", "D-11", "D-12", "D-19"]
        proposalStatus: "draft-non-normative"
      summary: Get one matrix reference
      description: Returns the registered record, or 404. Bytes are retrieved out of band via fileURL or accessService.
      parameters:
      - name: matrixDbId
        description: Namespaced matrix identity `{authority}:matrix:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/VariantMatrix'
                required:
                - metadata
                - result
                title: VariantMatrixResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - Variant Matrices
