info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths:
  /variantmatrices/{matrixDbId}:
    get:
      operationId: genxGetVariantMatrixReference
      summary: Get one matrix reference
      description: Returns the registered record, or 404. Bytes are retrieved out of band via fileURL or accessService.
      parameters:
      - name: matrixDbId
        description: Namespaced matrix identity `{authority}:matrix:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/VariantMatrix'
                required:
                - metadata
                - result
                title: VariantMatrixResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - Variant Matrices
