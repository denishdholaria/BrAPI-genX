info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /fertilizer-applications/{fertilizerApplicationDbId}:
    get:
      operationId: genxGetFertilizerApplication
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.fertilizer-applications.get"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one recorded fertilizer application."
        canBeUsedFor:
          - "Inspect fertilizer product, quantity, and provenance."
        mustNotBeUsedFor:
          - "Assuming the application is a BrAPI Location."
          - "Treating a superseded application as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordFertilizerApplication"
          - "genxListFertilizerApplications"
        decisions: ["RFC-026"]
        proposalStatus: "draft-non-normative"
      summary: Get one fertilizer application
      description: Returns the recorded application, or 404.
      parameters:
      - name: fertilizerApplicationDbId
        description: Namespaced fertilizer-application identity `{authority}:fertilizer-application:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/FertilizerApplication'
                required:
                - metadata
                - result
                title: FertilizerApplicationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - FertilizerApplication