info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /quarantine-records:
    get:
      operationId: genxListQuarantineRecords
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.quarantine-records.list"
        classification:
          primaryDomain: "D1"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List quarantine records, optionally filtered by seed lot or status."
        canBeUsedFor:
          - "Discover quarantine events for conserved material."
          - "Support conservation planning and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI SeedLot transaction."
          - "Treating the list as a complete conservation record."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordQuarantine"
          - "genxGetQuarantineRecord"
        decisions: ["RFC-030"]
        proposalStatus: "draft-non-normative"
      summary: List quarantine records
      description: Get a paged list of quarantine records across authorities. Filters combine with AND.
      parameters:
      - name: seedLotDbId
        description: Filter by BrAPI SeedLot
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - released
          - superseded
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/QuarantineRecordListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Quarantine
    post:
      operationId: genxRecordQuarantine
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.quarantine-records.record"
        classification:
          primaryDomain: "D1"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one quarantine event with reason and provenance."
        canBeUsedFor:
          - "Record quarantine of conserved material."
          - "Retry an identical record safely using the same quarantineRecordDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming the record is a BrAPI SeedLot transaction."
          - "Treating the record as a complete conservation record."
        sideEffects: "Creates a quarantine record when accepted."
        idempotency: "Same quarantineRecordDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListQuarantineRecords"
          - "genxGetQuarantineRecord"
        decisions: ["RFC-030"]
        proposalStatus: "draft-non-normative"
      summary: Record one quarantine
      description: |-
        Unknown quarantineRecordDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuarantineRecordNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/QuarantineRecord'
                required:
                - metadata
                - result
                title: QuarantineRecordResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Quarantine
components:
  responses:
    QuarantineRecordListResponse:
      content:
        application/json:
          schema:
            title: QuarantineRecordListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuarantineRecord'
            required:
            - metadata
            - result
      description: OK