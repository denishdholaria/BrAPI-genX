info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /soil-chemistry:
    get:
      operationId: genxListSoilChemistry
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.soil-chemistry.list"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List soil texture, chemistry, and moisture records, optionally filtered by site or status."
        canBeUsedFor:
          - "Discover soil texture, chemistry, and moisture observations for a site."
          - "Support soil health and agronomic analysis."
        mustNotBeUsedFor:
          - "Creating or changing a soil chemistry record (use the POST endpoint)."
          - "Assuming a record is a BrAPI Observation."
          - "Treating the list as a complete soil inventory."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterSoilChemistry"
          - "genxGetSoilChemistry"
          - "genxRegisterSoilProfile"
        decisions: ["RFC-077"]
        proposalStatus: "draft-non-normative"
      summary: List soil chemistry records
      description: Get a paged list of soil texture, chemistry, and moisture records across authorities. Filters combine with AND.
      parameters:
      - name: siteDbId
        description: Filter by site or location reference
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/SoilChemistryListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SoilChemistry
    post:
      operationId: genxRegisterSoilChemistry
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.soil-chemistry.record"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one soil texture, chemistry, and moisture record with site linkage and provenance."
        canBeUsedFor:
          - "Publish soil texture, chemistry, and moisture observations for a site."
          - "Retry an identical record safely using the same soilChemistryDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI Observation."
          - "Asserting that the soil is validated or certified."
        sideEffects: "Creates a soil chemistry identity or appends a new immutable version when accepted."
        idempotency: "Same soilChemistryDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListSoilChemistry"
          - "genxGetSoilChemistry"
          - "genxRegisterSoilProfile"
        decisions: ["RFC-077"]
        proposalStatus: "draft-non-normative"
      summary: Register one soil chemistry record
      description: |-
        Unknown soilChemistryDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoilChemistryNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/SoilChemistry'
                required:
                - metadata
                - result
                title: SoilChemistryResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SoilChemistry
components:
  responses:
    SoilChemistryListResponse:
      content:
        application/json:
          schema:
            title: SoilChemistryListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SoilChemistry'
            required:
            - metadata
            - result
      description: OK
