info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /analysis-methods:
    get:
      operationId: genxListAnalysisMethods
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.analysis-methods.list"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List registered analysis method versions and their lifecycle states."
        canBeUsedFor:
          - "Discover registered analysis methods and versions."
          - "Select a method version subject to lifecycle status and advertised support."
        mustNotBeUsedFor:
          - "Executing an analysis (use GenX Jobs)."
          - "Assuming registration means scientific validation, approval, or endorsement."
          - "Assuming metrics or results from different methods are directly comparable."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterAnalysisMethod"
          - "genxGetAnalysisMethod"
          - "genxSubmitAsyncJob"
        decisions: ["RFC-009"]
        proposalStatus: "draft-non-normative"
      summary: List registered analysis methods
      description: Get a paged list of analysis method versions across authorities. Filters combine with AND.
      parameters:
      - name: analysisMethodDbId
        description: Namespaced analysis-method identity `{authority}:analysis-method:{localId}`
        in: query
        required: false
        schema:
          type: string
      - name: methodType
        description: Filter by analysis class
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - deprecated
          - revoked
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/AnalysisMethodListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - AnalysisMethods
    post:
      operationId: genxRegisterAnalysisMethod
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.analysis-methods.register"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register an analysis method version with identity, version, type, input/output contracts, and lifecycle state."
        canBeUsedFor:
          - "Publish method metadata and integrity references."
          - "Create a new version under an existing method identity."
          - "Record deprecation or revocation status as governed elsewhere."
        mustNotBeUsedFor:
          - "Executing an analysis."
          - "Assuming registration means scientific validation, approval, or endorsement."
          - "Assuming methods with similar types are interchangeable."
        sideEffects: "Creates a method identity or appends a new immutable version when accepted."
        idempotency: "Same method identity/version and identical body replays; conflicting content for the same version is rejected."
        semanticNeighbors:
          - "genxListAnalysisMethods"
          - "genxGetAnalysisMethod"
          - "genxSubmitAsyncJob"
        decisions: ["RFC-009"]
        proposalStatus: "draft-non-normative"
      summary: Register one analysis method version
      description: |-
        Unknown analysisMethodDbId creates; known id with a new version appends;
        same (analysisMethodDbId, methodVersion) with an identical body replays
        the existing record; same pair with a different body is rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisMethodNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/AnalysisMethod'
                required:
                - metadata
                - result
                title: AnalysisMethodResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - AnalysisMethods
components:
  responses:
    AnalysisMethodListResponse:
      content:
        application/json:
          schema:
            title: AnalysisMethodListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalysisMethod'
            required:
            - metadata
            - result
      description: OK