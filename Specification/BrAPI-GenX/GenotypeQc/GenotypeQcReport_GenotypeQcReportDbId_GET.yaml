info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /genotype-qc-reports/{genotypeQcReportDbId}:
    get:
      operationId: genxGetGenotypeQcReport
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.genotype-qc-reports.get"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one genotype QC report."
        canBeUsedFor:
          - "Inspect QC metrics, thresholds, and provenance."
        mustNotBeUsedFor:
          - "Assuming the report is a BrAPI data resource."
          - "Treating a superseded report as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordGenotypeQcReport"
          - "genxListGenotypeQcReports"
          - "genxRegisterGenomicDataset"
        decisions: ["RFC-064"]
        proposalStatus: "draft-non-normative"
      summary: Get one genotype QC report
      description: Returns the recorded report, or 404.
      parameters:
      - name: genotypeQcReportDbId
        description: Namespaced genotype-qc identity `{authority}:genotype-qc:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/GenotypeQcReport'
                required:
                - metadata
                - result
                title: GenotypeQcReportResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - GenotypeQcReport