info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    CrosswalkNewRequest:
      type: object
      description: |-
        Request to register one crosswalk record. Unknown crosswalkDbId
        creates; same id with an identical body replays the existing record;
        same id with a different body is rejected with 409.
      required:
      - crosswalkDbId
      properties:
        crosswalkDbId:
          description: Namespaced crosswalk identity `{authority}:crosswalk:{localId}`
          type: string
          example: institute-a:crosswalk:cw-2026-001
        source:
          description: Source system
          type: string
          example: MCPD
        target:
          description: Target system
          type: string
          example: GenX
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: crosswalkDbId of the record this one replaces
          type: string
          example: institute-a:crosswalk:cw-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
