info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /crosswalks/{crosswalkDbId}:
    get:
      operationId: genxGetCrosswalk
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crosswalks.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one crosswalk record."
        canBeUsedFor:
          - "Inspect crosswalk identity, funding, and provenance."
        mustNotBeUsedFor:
          - "Assuming a crosswalk is a BrAPI Study."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCrosswalk"
          - "genxListCrosswalks"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-105"]
        proposalStatus: "draft-non-normative"
      summary: Get one crosswalk
      description: Returns the registered record, or 404.
      parameters:
      - name: crosswalkDbId
        description: Namespaced crosswalk identity `{authority}:crosswalk:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/Crosswalk'
                required:
                - metadata
                - result
                title: CrosswalkResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - Crosswalk
