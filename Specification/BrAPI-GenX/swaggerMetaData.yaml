components:
  securitySchemes:
    GenXAuthorizationToken:
      bearerFormat: JWT (GenX auth profile, see RFC-001) or opaque token
      description: Bearer token proving authorization. GenX servers advertising the `oidc` auth profile accept OIDC JWTs; see RFC-001 for the profile. V2.1 semantics are unchanged.
      scheme: bearer
      type: http
info:
  description: |-
    BrAPI-GenX is a proposal for the next generation of the Breeding API. Status: draft, not accepted, not normative. V2.1 remains the stable release. See Specification/BrAPI-GenX/RFCs/RFC-001-GenX-Skeleton.md.
  title: BrAPI-GenX (proposal)
  version: '0.1-draft'
openapi: 3.0.0
paths: {}
security:
- GenXAuthorizationToken: []
servers:
- url: http://localhost:8080/genx/v1
  description: Local/reference GenX server only. Not an official BrAPI deployment.
