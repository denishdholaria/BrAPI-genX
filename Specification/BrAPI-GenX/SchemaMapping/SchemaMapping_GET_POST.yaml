info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /schema-mappings:
    get:
      operationId: genxListSchemaMappings
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.schema-mappings.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List schema mapping records, optionally filtered by status."
        canBeUsedFor:
          - "Discover schema mappings."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterSchemaMapping"
          - "genxGetSchemaMapping"
          - "genxRegisterFarm"
        decisions: ["RFC-152"]
        proposalStatus: "draft-non-normative"
      summary: List schema mapping
      description: Get a paged list of schema mapping records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/SchemaMappingListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SchemaMapping
    post:
      operationId: genxRegisterSchemaMapping
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.schema-mappings.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one schema mapping record with provenance."
        canBeUsedFor:
          - "Publish a schema mapping."
          - "Retry an identical record safely using the same schemaMappingDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a schema mapping identity or appends a new immutable version when accepted."
        idempotency: "Same schemaMappingDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListSchemaMappings"
          - "genxGetSchemaMapping"
          - "genxRegisterFarm"
        decisions: ["RFC-152"]
        proposalStatus: "draft-non-normative"
      summary: Register one schema mapping
      description: Register one schema mapping record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaMappingNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/SchemaMapping'
                required:
                - metadata
                - result
                title: SchemaMappingResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SchemaMapping
components:
  responses:
    SchemaMappingListResponse:
      content:
        application/json:
          schema:
            title: SchemaMappingListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SchemaMapping'
            required:
            - metadata
            - result
      description: OK