info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /ipm-strategies:
    get:
      operationId: genxListIpmStrategies
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.ipm-strategies.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List ipm strategy records, optionally filtered by status."
        canBeUsedFor:
          - "Discover ipm strategys."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterIpmStrategy"
          - "genxGetIpmStrategy"
          - "genxRegisterFarm"
        decisions: ["RFC-125"]
        proposalStatus: "draft-non-normative"
      summary: List ipm strategies
      description: Get a paged list of ipm strategy records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/IpmStrategyListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - IpmStrategy
    post:
      operationId: genxRegisterIpmStrategy
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.ipm-strategies.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one ipm strategy record with provenance."
        canBeUsedFor:
          - "Publish a ipm strategy."
          - "Retry an identical record safely using the same ipmStrategyDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a ipm strategy identity or appends a new immutable version when accepted."
        idempotency: "Same ipmStrategyDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListIpmStrategies"
          - "genxGetIpmStrategy"
          - "genxRegisterFarm"
        decisions: ["RFC-125"]
        proposalStatus: "draft-non-normative"
      summary: Register one ipm strategy
      description: Register one ipm strategy record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpmStrategyNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/IpmStrategy'
                required:
                - metadata
                - result
                title: IpmStrategyResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - IpmStrategy
components:
  responses:
    IpmStrategyListResponse:
      content:
        application/json:
          schema:
            title: IpmStrategyListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IpmStrategy'
            required:
            - metadata
            - result
      description: OK