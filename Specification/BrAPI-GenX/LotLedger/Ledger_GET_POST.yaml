info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths:
  /seedlots/{seedLotDbId}/ledger:
    get:
      operationId: genxListSeedLotLedgerEntries
      x-brapi-den:
        catalogId: "brapi-den.genx.v3.seed-lot-ledger.list"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Read a seed lot's append-only movement ledger in position order, with an optional movement-type filter."
        canBeUsedFor:
          - "Inspect the entry stream for one lot."
          - "Reconstruct or audit that lot's history when entries and quantity semantics are valid."
        mustNotBeUsedFor:
          - "Assuming a globally comparable order across lots, servers, or independent streams."
          - "Treating the ledger as a complete atomic multi-lot transfer transaction."
          - "Combining with V2.1 SeedLotTransaction records as independent movements or assuming automatic equivalence."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "SEM-01"
        decisions: ["RFC-003", "D-07", "D-08", "D-20"]
        proposalStatus: "draft-non-normative"
      summary: Read a lot's ledger in position order
      description: "Entries are returned in per-lot position order. Positions are source-local cursors; no global ordering is claimed. Unknown lots follow documented server behavior (reference server returns an empty list)."
      parameters:
      - name: seedLotDbId
        description: Owning seed lot
        in: path
        required: true
        schema:
          type: string
      - name: entryType
        description: Filter by kind of movement
        in: query
        required: false
        schema:
          type: string
          enum:
          - adjust
          - move
          - handoff
          - production
          - planting
          - trade
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/LotLedgerEntryListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - Seed Lots
    post:
      operationId: genxAppendSeedLotLedgerEntry
      x-brapi-den:
        catalogId: "brapi-den.genx.v3.seed-lot-ledger.append"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Append one immutable movement entry to one seed lot's ledger with replay and conflict protection."
        canBeUsedFor:
          - "Record a single-lot adjustment, movement, handoff, production, planting, or trade entry."
          - "Retry an identical entry safely using the same idempotency key."
        mustNotBeUsedFor:
          - "Updating or deleting an existing ledger entry; corrections require an additional record."
          - "Assuming multi-lot transfer atomicity."
          - "Automatically mirroring a movement to V2.1 SeedLotTransaction or double-counting both streams."
        sideEffects: "Appends one ledger entry when accepted."
        idempotency: "Same key and identical body replays existing entry; same key and different body is rejected as a conflict."
        semanticNeighbors:
          - "SEM-01"
        decisions: ["RFC-003", "D-07", "D-08", "D-20", "A-05", "A-06"]
        proposalStatus: "draft-non-normative"
      summary: Append one ledger entry
      description: |-
        Unknown idempotencyKey appends; known key with an identical body
        replays the existing entry with zero new effects; known key with a
        different body is rejected with 409.
      parameters:
      - name: seedLotDbId
        description: Owning seed lot
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        description: |-
          Optional replay key (UUID recommended). May alternatively be supplied
          inside the request body as `idempotencyKey`. The header wins when both
          are present.
        in: header
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotLedgerEntryNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/LotLedgerEntry'
                required:
                - metadata
                - result
                title: LotLedgerEntryResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - Seed Lots
components:
  responses:
    LotLedgerEntryListResponse:
      content:
        application/json:
          schema:
            title: LotLedgerEntryListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LotLedgerEntry'
            required:
            - metadata
            - result
      description: OK
