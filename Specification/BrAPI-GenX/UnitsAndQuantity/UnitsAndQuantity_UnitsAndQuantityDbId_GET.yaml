info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /units-and-quantities/{unitsAndQuantityDbId}:
    get:
      operationId: genxGetUnitsAndQuantity
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.units-and-quantities.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "Retrieve one units and quantity semantics entry."
        canBeUsedFor:
          - "Inspect unit, quantity, definition, and provenance."
        mustNotBeUsedFor:
          - "Assuming an entry is a BrAPI Observation."
          - "Treating a superseded entry as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterUnitsAndQuantity"
          - "genxListUnitsAndQuantities"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-082"]
        proposalStatus: "draft-non-normative"
      summary: Get one units and quantity entry
      description: Returns the registered entry, or 404.
      parameters:
      - name: unitsAndQuantityDbId
        description: Namespaced units-and-quantity identity `{authority}:units-and-quantity:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/UnitsAndQuantity'
                required:
                - metadata
                - result
                title: UnitsAndQuantityResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - UnitsAndQuantity
