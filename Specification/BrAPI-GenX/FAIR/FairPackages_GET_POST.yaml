info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths:
  /fair-packages:
    get:
      operationId: genxListFairPackageMetadata
      summary: List registered FAIR packages (metadata only)
      description: Get a paged list of package metadata across authorities. Filters combine with AND. Payload bytes are never served here.
      parameters:
      - name: accessRights
        description: Filter by access contract
        in: query
        required: false
        schema:
          type: string
          enum:
          - open
          - embargoed
          - restricted
      - name: license
        description: Filter by SPDX license expression
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/FAIRPackageListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - FAIR Packages
    post:
      operationId: genxRegisterFairPackage
      summary: Register one FAIR package
      description: |-
        Unknown packageDbId creates; known id with an identical body replays
        the existing record; known id with a different body is rejected with
        409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FAIRPackageNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/FAIRPackage'
                required:
                - metadata
                - result
                title: FAIRPackageResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - FAIR Packages
components:
  responses:
    FAIRPackageListResponse:
      content:
        application/json:
          schema:
            title: FAIRPackageListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FAIRPackage'
            required:
            - metadata
            - result
      description: OK
