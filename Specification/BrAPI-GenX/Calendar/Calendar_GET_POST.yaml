info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /calendars:
    get:
      operationId: genxListCalendars
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.calendars.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List calendar and time convention records, optionally filtered by status."
        canBeUsedFor:
          - "Discover calendars and time conventions."
          - "Support reference data and time conventions."
        mustNotBeUsedFor:
          - "Creating or changing a list (use the POST endpoint)."
          - "Assuming a list is a BrAPI Study."
          - "Treating the list as a complete catalogue."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCalendar"
          - "genxGetCalendar"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-091"]
        proposalStatus: "draft-non-normative"
      summary: List calendars
      description: Get a paged list of calendar and time convention records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/CalendarListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Calendar
    post:
      operationId: genxRegisterCalendar
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.calendars.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one calendar or time convention record with provenance."
        canBeUsedFor:
          - "Publish a calendar or time convention."
          - "Retry an identical record safely using the same calendarDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a list is a BrAPI Study."
          - "Asserting that the list is validated or endorsed."
        sideEffects: "Creates a calendar identity or appends a new immutable version when accepted."
        idempotency: "Same calendarDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListCalendars"
          - "genxGetCalendar"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-091"]
        proposalStatus: "draft-non-normative"
      summary: Register one calendar
      description: |-
        Unknown calendarDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/Calendar'
                required:
                - metadata
                - result
                title: CalendarResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Calendar
components:
  responses:
    CalendarListResponse:
      content:
        application/json:
          schema:
            title: CalendarListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Calendar'
            required:
            - metadata
            - result
      description: OK
