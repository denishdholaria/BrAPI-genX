info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /sowing-windows:
    get:
      operationId: genxListSowingWindows
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.sowing-windows.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List sowing window records, optionally filtered by status."
        canBeUsedFor:
          - "Discover sowing windows."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterSowingWindow"
          - "genxGetSowingWindow"
          - "genxRegisterFarm"
        decisions: ["RFC-130"]
        proposalStatus: "draft-non-normative"
      summary: List sowing windows
      description: Get a paged list of sowing window records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/SowingWindowListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SowingWindow
    post:
      operationId: genxRegisterSowingWindow
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.sowing-windows.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one sowing window record with provenance."
        canBeUsedFor:
          - "Publish a sowing window."
          - "Retry an identical record safely using the same sowingWindowDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a sowing window identity or appends a new immutable version when accepted."
        idempotency: "Same sowingWindowDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListSowingWindows"
          - "genxGetSowingWindow"
          - "genxRegisterFarm"
        decisions: ["RFC-130"]
        proposalStatus: "draft-non-normative"
      summary: Register one sowing window
      description: Register one sowing window record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SowingWindowNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/SowingWindow'
                required:
                - metadata
                - result
                title: SowingWindowResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SowingWindow
components:
  responses:
    SowingWindowListResponse:
      content:
        application/json:
          schema:
            title: SowingWindowListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SowingWindow'
            required:
            - metadata
            - result
      description: OK