info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    IrrigationAdviceNewRequest:
      type: object
      description: |-
        Request to register one irrigation advice record. Unknown irrigationAdviceDbId
        creates; same id with an identical body replays the existing record;
        same id with a different body is rejected with 409.
      required:
      - irrigationAdviceDbId
      properties:
        irrigationAdviceDbId:
          description: Namespaced irrigation-advice identity `{authority}:irrigation-advice:{localId}`
          type: string
          example: institute-a:irrigation-advice:ia-2026-001
        adviceType:
          description: Type of irrigation advice
          type: string
          example: deficit irrigation
        recommendedAmount:
          description: Recommended water amount
          type: string
          example: "25mm"
        recommendedFrequency:
          description: Recommended irrigation frequency
          type: string
          example: weekly
        regionOrZone:
          description: Region or zone the advice applies to
          type: string
          example: zone-3
        cropType:
          description: Crop type the advice applies to
          type: string
          example: maize
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: irrigationAdviceDbId of the record this one replaces
          type: string
          example: institute-a:irrigation-advice:ia-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
