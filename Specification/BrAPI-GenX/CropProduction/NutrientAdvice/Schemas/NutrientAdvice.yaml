info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    NutrientAdvice:
      type: object
      description: |-
        One immutable nutrient advice record. A published (nutrientAdviceDbId) record
        never mutates in place; corrections are recorded as additional
        records linked by supersedes.
      required:
      - nutrientAdviceDbId
      - status
      properties:
        nutrientAdviceDbId:
          description: Namespaced nutrient-advice identity `{authority}:nutrient-advice:{localId}`
          type: string
          example: institute-a:nutrient-advice:na-2026-001
        adviceType:
          description: Type of nutrient advice
          type: string
          example: nitrogen
        recommendedNutrient:
          description: Recommended nutrient
          type: string
          example: nitrogen
        recommendedRate:
          description: Recommended application rate
          type: string
          example: "150kg/ha"
        regionOrZone:
          description: Region or zone the advice applies to
          type: string
          example: zone-3
        cropType:
          description: Crop type the advice applies to
          type: string
          example: maize
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: nutrientAdviceDbId of the record this one replaces
          type: string
          example: institute-a:nutrient-advice:na-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
