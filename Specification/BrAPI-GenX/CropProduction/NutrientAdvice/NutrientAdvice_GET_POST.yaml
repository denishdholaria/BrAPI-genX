info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /nutrient-advices:
    get:
      operationId: genxListNutrientAdvices
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.nutrient-advices.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List nutrient advice records, optionally filtered by status."
        canBeUsedFor:
          - "Discover nutrient advices."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterNutrientAdvice"
          - "genxGetNutrientAdvice"
          - "genxRegisterFarm"
        decisions: ["RFC-132"]
        proposalStatus: "draft-non-normative"
      summary: List nutrient advice
      description: Get a paged list of nutrient advice records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/NutrientAdviceListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - NutrientAdvice
    post:
      operationId: genxRegisterNutrientAdvice
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.nutrient-advices.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one nutrient advice record with provenance."
        canBeUsedFor:
          - "Publish a nutrient advice."
          - "Retry an identical record safely using the same nutrientAdviceDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a nutrient advice identity or appends a new immutable version when accepted."
        idempotency: "Same nutrientAdviceDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListNutrientAdvices"
          - "genxGetNutrientAdvice"
          - "genxRegisterFarm"
        decisions: ["RFC-132"]
        proposalStatus: "draft-non-normative"
      summary: Register one nutrient advice
      description: Register one nutrient advice record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NutrientAdviceNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/NutrientAdvice'
                required:
                - metadata
                - result
                title: NutrientAdviceResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - NutrientAdvice
components:
  responses:
    NutrientAdviceListResponse:
      content:
        application/json:
          schema:
            title: NutrientAdviceListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NutrientAdvice'
            required:
            - metadata
            - result
      description: OK