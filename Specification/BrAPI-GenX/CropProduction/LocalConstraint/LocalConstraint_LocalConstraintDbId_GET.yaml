info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /local-constraints/{localConstraintDbId}:
    get:
      operationId: genxGetLocalConstraint
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.local-constraints.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one local constraint record."
        canBeUsedFor:
          - "Inspect catalogue entries and provenance."
        mustNotBeUsedFor:
          - "Assuming a record is a BrAPI data resource."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterLocalConstraint"
          - "genxListLocalConstraints"
          - "genxRegisterResearchAsset"
        decisions: ["RFC-139"]
        proposalStatus: "draft-non-normative"
      summary: Get one local constraint
      description: Returns the registered record, or 404.
      parameters:
      - name: localConstraintDbId
        description: Namespaced local-constraints identity `{authority}:local-constraints:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/LocalConstraint'
                required:
                - metadata
                - result
                title: LocalConstraintResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - LocalConstraint