info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /farms/{farmDbId}:
    get:
      operationId: genxGetFarm
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.farms.get"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one farm."
        canBeUsedFor:
          - "Inspect site reference, area, and provenance."
        mustNotBeUsedFor:
          - "Assuming the farm is a BrAPI Location."
          - "Treating a superseded farm as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterFarm"
          - "genxListFarms"
        decisions: ["RFC-069"]
        proposalStatus: "draft-non-normative"
      summary: Get one farm
      description: Returns the registered farm, or 404.
      parameters:
      - name: farmDbId
        description: Namespaced farm identity `{authority}:farm:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/Farm'
                required:
                - metadata
                - result
                title: FarmResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - Farm