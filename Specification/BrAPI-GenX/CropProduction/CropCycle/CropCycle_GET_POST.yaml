info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /crop-cycles:
    get:
      operationId: genxListCropCycles
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crop-cycles.list"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List crop cycles, optionally filtered by location, study, or status."
        canBeUsedFor:
          - "Discover crop cycles for a location or study."
          - "Support agronomy and crop model inputs."
        mustNotBeUsedFor:
          - "Creating or changing a cycle (use the POST endpoint)."
          - "Assuming a cycle is a BrAPI Study."
          - "Treating the list as a complete crop record."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCropCycle"
          - "genxGetCropCycle"
        decisions: ["RFC-029"]
        proposalStatus: "draft-non-normative"
      summary: List crop cycles
      description: Get a paged list of crop cycles across authorities. Filters combine with AND.
      parameters:
      - name: locationDbId
        description: Filter by BrAPI Location
        in: query
        required: false
        schema:
          type: string
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - completed
          - superseded
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/CropCycleListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CropCycle
    post:
      operationId: genxRegisterCropCycle
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crop-cycles.register"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register a crop cycle with planting/harvest dates and provenance."
        canBeUsedFor:
          - "Publish crop cycle metadata."
          - "Create a new version under an existing cycle identity."
        mustNotBeUsedFor:
          - "Updating or deleting an existing cycle; corrections require a new record that supersedes."
          - "Assuming the cycle is a BrAPI Study."
          - "Treating the cycle as a complete crop record."
        sideEffects: "Creates a cycle identity or appends a new immutable version when accepted."
        idempotency: "Same cycle identity and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListCropCycles"
          - "genxGetCropCycle"
        decisions: ["RFC-029"]
        proposalStatus: "draft-non-normative"
      summary: Register one crop cycle
      description: |-
        Unknown cropCycleDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CropCycleNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CropCycle'
                required:
                - metadata
                - result
                title: CropCycleResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CropCycle
components:
  responses:
    CropCycleListResponse:
      content:
        application/json:
          schema:
            title: CropCycleListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CropCycle'
            required:
            - metadata
            - result
      description: OK