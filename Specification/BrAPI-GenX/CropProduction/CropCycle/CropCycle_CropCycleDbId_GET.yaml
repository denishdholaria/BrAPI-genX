info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /crop-cycles/{cropCycleDbId}:
    get:
      operationId: genxGetCropCycle
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crop-cycles.get"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one crop cycle."
        canBeUsedFor:
          - "Inspect planting/harvest dates and provenance."
        mustNotBeUsedFor:
          - "Assuming the cycle is a BrAPI Study."
          - "Treating a superseded cycle as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCropCycle"
          - "genxListCropCycles"
        decisions: ["RFC-029"]
        proposalStatus: "draft-non-normative"
      summary: Get one crop cycle
      description: Returns the registered cycle, or 404.
      parameters:
      - name: cropCycleDbId
        description: Namespaced crop-cycle identity `{authority}:crop-cycle:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CropCycle'
                required:
                - metadata
                - result
                title: CropCycleResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - CropCycle