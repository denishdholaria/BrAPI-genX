info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /harvest-records/{harvestRecordDbId}:
    get:
      operationId: genxGetHarvestRecord
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.harvest-records.get"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one recorded harvest event."
        canBeUsedFor:
          - "Inspect harvest quantity, quality, and provenance."
        mustNotBeUsedFor:
          - "Assuming the record is a BrAPI SeedLot transaction."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordHarvest"
          - "genxListHarvestRecords"
        decisions: ["RFC-011"]
        proposalStatus: "draft-non-normative"
      summary: Get one harvest record
      description: Returns the recorded harvest, or 404.
      parameters:
      - name: harvestRecordDbId
        description: Namespaced harvest-record identity `{authority}:harvest-record:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/HarvestRecord'
                required:
                - metadata
                - result
                title: HarvestRecordResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - HarvestRecords