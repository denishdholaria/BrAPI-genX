info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    CropSuitability:
      type: object
      description: |-
        One immutable crop suitability record. A published (cropSuitabilityDbId) record
        never mutates in place; corrections are recorded as additional
        records linked by supersedes.
      required:
      - cropSuitabilityDbId
      - status
      properties:
        cropSuitabilityDbId:
          description: Namespaced crop-suitability identity `{authority}:crop-suitability:{localId}`
          type: string
          example: institute-a:crop-suitability:cs-2026-001
        suitabilityType:
          description: Type of suitability assessment
          type: string
          example: rainfed
        suitableCrop:
          description: Suitable crop
          type: string
          example: sorghum
        suitabilityScore:
          description: Suitability score
          type: string
          example: "0.85"
        regionOrZone:
          description: Region or zone the suitability applies to
          type: string
          example: zone-3
        season:
          description: Season the suitability applies to
          type: string
          example: 2026 main season
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: cropSuitabilityDbId of the record this one replaces
          type: string
          example: institute-a:crop-suitability:cs-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
