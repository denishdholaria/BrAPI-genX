info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /common-crop-names:
    get:
      operationId: genxListCommonCropNames
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.common-crop-names.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "List common crop name entries, optionally filtered by status."
        canBeUsedFor:
          - "Discover common crop names."
          - "Support crop reference data."
        mustNotBeUsedFor:
          - "Creating or changing an entry (use the POST endpoint)."
          - "Assuming an entry is a BrAPI Germplasm."
          - "Treating the list as a complete catalogue."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCommonCropName"
          - "genxGetCommonCropName"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-094"]
        proposalStatus: "draft-non-normative"
      summary: List common crop names
      description: Get a paged list of common crop name entries across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/CommonCropNameListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CommonCropName
    post:
      operationId: genxRegisterCommonCropName
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.common-crop-names.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C4", "C9"]
        purpose: "Register one common crop name entry with provenance."
        canBeUsedFor:
          - "Publish a common crop name."
          - "Retry an identical entry safely using the same commonCropNameDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing entry; corrections require a new record that supersedes."
          - "Assuming an entry is a BrAPI Germplasm."
          - "Asserting that the entry is validated or endorsed."
        sideEffects: "Creates a common crop name identity or appends a new immutable version when accepted."
        idempotency: "Same commonCropNameDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListCommonCropNames"
          - "genxGetCommonCropName"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-094"]
        proposalStatus: "draft-non-normative"
      summary: Register one common crop name
      description: |-
        Unknown commonCropNameDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonCropNameNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CommonCropName'
                required:
                - metadata
                - result
                title: CommonCropNameResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CommonCropName
components:
  responses:
    CommonCropNameListResponse:
      content:
        application/json:
          schema:
            title: CommonCropNameListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommonCropName'
            required:
            - metadata
            - result
      description: OK
