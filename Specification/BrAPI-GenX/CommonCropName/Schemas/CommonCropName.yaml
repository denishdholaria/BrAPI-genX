info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    CommonCropName:
      type: object
      description: |-
        One immutable common crop name entry. A published
        (commonCropNameDbId) record never mutates in place; corrections are
        recorded as additional entries linked by supersedes.
      required:
      - commonCropNameDbId
      - status
      properties:
        commonCropNameDbId:
          description: Namespaced common-crop-name identity `{authority}:common-crop-name:{localId}`
          type: string
          example: institute-a:common-crop-name:ccn-2026-001
        scientificName:
          description: Scientific name
          type: string
          example: Triticum aestivum
        commonName:
          description: Common crop name
          type: string
          example: wheat
        status:
          description: Lifecycle state of the entry
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: commonCropNameDbId of the entry this one replaces
          type: string
          example: institute-a:common-crop-name:ccn-2026-000
        provenance:
          description: Evidence and method provenance for the entry
          $ref: '#/components/schemas/ProvenanceEnvelope'
