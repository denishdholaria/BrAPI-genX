info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /common-crop-names/{commonCropNameDbId}:
    get:
      operationId: genxGetCommonCropName
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.common-crop-names.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "Retrieve one common crop name entry."
        canBeUsedFor:
          - "Inspect crop name, synonyms, and provenance."
        mustNotBeUsedFor:
          - "Assuming an entry is a BrAPI Germplasm."
          - "Treating a superseded entry as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCommonCropName"
          - "genxListCommonCropNames"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-094"]
        proposalStatus: "draft-non-normative"
      summary: Get one common crop name
      description: Returns the registered entry, or 404.
      parameters:
      - name: commonCropNameDbId
        description: Namespaced common-crop-name identity `{authority}:common-crop-name:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CommonCropName'
                required:
                - metadata
                - result
                title: CommonCropNameResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - CommonCropName
