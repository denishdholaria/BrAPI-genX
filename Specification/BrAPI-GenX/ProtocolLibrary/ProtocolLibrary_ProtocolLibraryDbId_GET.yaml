info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /protocol-libraries/{protocolLibraryDbId}:
    get:
      operationId: genxGetProtocolLibrary
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.protocol-libraries.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one protocol library record."
        canBeUsedFor:
          - "Inspect catalogue entries and provenance."
        mustNotBeUsedFor:
          - "Assuming a record is a BrAPI data resource."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterProtocolLibrary"
          - "genxListProtocolLibraries"
          - "genxRegisterResearchAsset"
        decisions: ["RFC-119"]
        proposalStatus: "draft-non-normative"
      summary: Get one protocol library
      description: Returns the registered record, or 404.
      parameters:
      - name: protocolLibraryDbId
        description: Namespaced protocol-libraries identity `{authority}:protocol-libraries:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ProtocolLibrary'
                required:
                - metadata
                - result
                title: ProtocolLibraryResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - ProtocolLibrary