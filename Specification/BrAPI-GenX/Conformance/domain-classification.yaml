# BrAPI-GenX Domain Classification Registry
# Status: proposed, non-normative. BrAPI V2.1 contracts remain unchanged.
# Every entry has exactly one primary class or is explicitly cross-cutting.
# Facets are secondary descriptive tags, not assertions of schema equivalence.

version: "0.1.0-proposal"
classification_document: "CLASSIFICATION.md"

domain_classes:
  D1:
    name: "Germplasm and Biological Resources"
  D2:
    name: "Breeding Programs and Experimental Design"
  D3:
    name: "Genotyping and Molecular Genomics"
  D4:
    name: "Phenotyping and Plant Observations"
  D5:
    name: "Environment, Agroecology and Field Context"
  D6:
    name: "Crop Production and Material Operations"
  D7:
    name: "Scientific Analysis, Models and Derived Evidence"

cross_cutting_capabilities:
  C1: "Identity, versioning and capability negotiation"
  C2: "Provenance, evidence and uncertainty"
  C3: "Execution lifecycle and idempotency"
  C4: "Terminology and semantic governance"
  C5: "Data exchange, publication and access"
  C6: "Integrity and external artifact references"
  C7: "Streaming, telemetry and temporal aggregation"
  C8: "Conformance and contract governance"
  C9: "Security, authority and tenancy"

modules:
  - path: "Provenance/"
    object: "ProvenanceEnvelope"
    primary_class: null
    cross_cutting: ["C2", "C1", "C6"]
    rationale: "Reusable embedded evidence contract; not a domain entity or standalone endpoint."
  - path: "Jobs/"
    object: "Job"
    primary_class: null
    cross_cutting: ["C3", "C1", "C2", "C9"]
    rationale: "Execution lifecycle; jobType determines the domain of the underlying work."
  - path: "ServerInfoV3/"
    object: "ServerInfoV3"
    primary_class: null
    cross_cutting: ["C1", "C8", "C9"]
    rationale: "Capability negotiation and server-surface discovery."
  - path: "VariableTerms/"
    object: "VariableTerm"
    primary_class: null
    cross_cutting: ["C4", "C1", "C2"]
    rationale: "Shared terminology governance; not the observation or analysis itself."
  - path: "LotLedger/"
    object: "LotLedgerEntry"
    primary_class: "D6"
    cross_cutting: ["C1", "C2", "C3", "C6", "C9"]
    rationale: "Append-only traceability of material movement. Not assumed wire-equivalent to V2.1 SeedLotTransaction; see D-20."
  - path: "Models/"
    object: "ModelArtifact"
    primary_class: "D7"
    cross_cutting: ["C1", "C2", "C3", "C5", "C6", "C9"]
    rationale: "Identity and lifecycle of analytical model artifacts; executing inference is a Job."
  - path: "Genomics/"
    object: "VariantMatrix"
    primary_class: "D3"
    cross_cutting: ["C1", "C2", "C5", "C6", "C9"]
    rationale: "External genomic matrix reference and integrity metadata; not VariantSet alias or byte transport."
  - path: "FAIR/"
    object: "FAIRPackage"
    primary_class: null
    cross_cutting: ["C5", "C1", "C2", "C6", "C9"]
    rationale: "Exchange, publication, license and access envelope around domain payloads."
  - path: "Telemetry/"
    object: "TelemetryPoint"
    primary_class: null
    context_classes: ["D4", "D5"]
    cross_cutting: ["C7", "C1", "C2", "C3", "C6", "C9"]
    rationale: "The existing schema is context-neutral. Classify individual readings by observed phenomenon: environmental readings as D5; plant phenotype readings as D4."
  - path: "SelectionDecisions/"
    object: "SelectionDecision"
    primary_class: "D2"
    cross_cutting: ["C1", "C2", "C3", "C9"]
