version: "0.1.0-proposal"
classification_document: "CLASSIFICATION.md"
domain_classes:
  D1: "Germplasm and Biological Resources"
  D2: "Breeding Programs and Experimental Design"
  D3: "Genotyping and Molecular Genomics"
  D4: "Phenotyping and Plant Observations"
  D5: "Environment, Agroecology and Field Context"
  D6: "Crop Production and Material Operations"
  D7: "Scientific Analysis, Models and Derived Evidence"
cross_cutting_capabilities:
  C1: "Identity, versioning and capability negotiation"
  C2: "Provenance, evidence and uncertainty"
  C3: "Execution lifecycle and idempotency"
  C4: "Terminology and semantic governance"
  C5: "Data exchange, publication and access"
  C6: "Integrity and external artifact references"
  C7: "Streaming, telemetry and temporal aggregation"
  C8: "Conformance and contract governance"
  C9: "Security, authority and tenancy"
modules:
  - path: "Provenance/"
    primary_class: null
    cross_cutting: [C2, C1, C6]
    rationale: "Embedded evidence contract, not a standalone endpoint."
  - path: "Jobs/"
    primary_class: null
    cross_cutting: [C3, C1, C2, C9]
    rationale: "Execution lifecycle; job type determines the domain of underlying work."
  - path: "ServerInfoV3/"
    primary_class: null
    cross_cutting: [C1, C8, C9]
    rationale: "Capability negotiation and server-surface discovery."
  - path: "VariableTerms/"
    primary_class: null
    cross_cutting: [C4, C1, C2]
    rationale: "Shared scientific terminology governance."
  - path: "LotLedger/"
    primary_class: D6
    cross_cutting: [C1, C2, C3, C6, C9]
    rationale: "Material movement traceability; not assumed equivalent to V2.1 SeedLotTransaction (D-20)."
  - path: "Models/"
    primary_class: D7
    cross_cutting: [C1, C2, C3, C5, C6, C9]
    rationale: "Analytical model artifact identity and lifecycle; inference executes as a Job."
  - path: "Genomics/"
    primary_class: D3
    cross_cutting: [C1, C2, C5, C6, C9]
    rationale: "External genomic matrix reference and integrity metadata, not byte transport."
  - path: "FAIR/"
    primary_class: null
    cross_cutting: [C5, C1, C2, C6, C9]
    rationale: "Publication, licensing and access envelope around domain payloads."
  - path: "Telemetry/"
    primary_class: null
    context_classes: [D4, D5]
    cross_cutting: [C7, C1, C2, C3, C6, C9]
    rationale: "Classify individual readings by phenomenon: environmental readings D5; plant phenotype readings D4."
  - path: "Conformance/"
    primary_class: null
    cross_cutting: [C8, C1, C3]
    rationale: "Specification conformance and interoperability evidence."