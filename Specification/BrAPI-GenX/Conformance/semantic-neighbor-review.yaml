  - Specification/BrAPI-GenX/Genotyping/GenomicDatasets/Schemas/GenomicDataset.yaml
  decisionReferences:
  - RFC-013
  - RFC-118
  scientificConcerns:
  - 'Registry-only reference: present in ENDPOINT-REGISTRY.json semanticNeighborIds but absent from source OpenAPI semanticNeighbors.'
  - No documented one-to-one semantic mapping or equivalence is established by the operation identifier alone.
  - 'Crosses GenX modules: ArtifactCatalogue -> GenomicDatasets.'
  rationale: 'ArtifactCatalogue models file location, byte digest and artifact type; GenomicDataset models a biological dataset, pipeline and assembly metadata. A catalogue entry might describe a file belonging to a dataset, but neither schema specifies a typed identity/reference mapping or cardinality.'
  openQuestion: 'Is a documented artifact-to-dataset membership/reference contract needed, with stable identifiers, content digest purpose, one-to-many cardinality and access rules, or are the current operation neighbors misleading?'
  evidence: []
