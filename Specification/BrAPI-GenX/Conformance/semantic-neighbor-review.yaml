scope: Operation-level registry-only semantic-neighbor references reported by Scripts/auditEndpointRegistrySourceConsistency.py.
  This ledger governs review status only; it does not alter endpoint contracts or declare scientific equivalence.
generated_from:
  registry: Specification/ENDPOINT-REGISTRY.json
  audit_script: Scripts/auditEndpointRegistrySourceConsistency.py
  baseline_registry_only_count: 153
allowed_statuses:
- inherited-unreviewed
- evidence-backed-proposed
- requires-decision
- rejected
- superseded
status_meanings:
  inherited-unreviewed: Inherited registry-only reference awaiting semantic review. Not approved and not rejected.
  evidence-backed-proposed: A safe mapping or relationship is proposed with traceable evidence. Still requires maintainer/architect
    review before acceptance.
  requires-decision: Requires an explicit architectural or scientific decision before progress.
  rejected: Independently authorized rejection of the relationship. Requires rationale.
  superseded: Superseded by another governed relationship or decision. Requires rationale and successor reference.
allowed_provenance:
- inherited-registry-only
- source-openapi-declared
- registry-and-source
- documented-mapping
- manual-review
allowed_boundaries:
- within-module
- cross-module
- cross-domain
allowed_transitions:
  inherited-unreviewed:
  - evidence-backed-proposed
  - requires-decision
  - rejected
  - superseded
  evidence-backed-proposed:
  - requires-decision
  - rejected
  - superseded
  requires-decision:
  - evidence-backed-proposed
  - rejected
  - superseded
  rejected:
  - superseded
  superseded: []
required_evidence_for_statuses:
  evidence-backed-proposed:
  - rationale
  - evidence
  - reviewedBy
  - reviewedAt
  requires-decision:
  - rationale
  - openQuestion
  rejected:
  - rationale
  superseded:
  - rationale
  - supersededBy
