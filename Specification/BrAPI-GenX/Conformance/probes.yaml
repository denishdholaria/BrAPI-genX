version: 1
notes: Authority for GenX conformance. Static probes execute against this repo;
  live probes execute against a server given via --server and SKIP otherwise.
probes:
- id: S-01
  tier: static
  object: all
  title: Every GenX $ref resolves to a defined component
  check: refs_resolve
  procedure:
  - Collect $ref '#/components/<section>/<name>' from all BrAPI-GenX endpoint YAMLs.
  - Collect definitions from BrAPI-GenX Schemas plus Specification/Components and Specification/OpenAPI-Components Parameters, Responses, Schemas.
  - Collect read-only definitions from committed V2.1 module files (Specification/BrAPI-*/**/*.yaml); GenX must reference them, never redefine them.
  expectation: Zero unresolvable references and zero GenX names shadowing a V2.1 or shared component name.
  falsifier: Any $ref with no matching definition, or any GenX definition colliding with an existing name.
- id: S-02
  tier: static
  object: all
  title: Fixtures carry the required fields of their schema
  check: required_fields
  procedure:
  - Validate each shaped fixture against the required lists in probes.yaml required_map.
  expectation: All required fields present with the documented types.
  falsifier: A fixture missing a required field still passing.
- id: S-03
  tier: static
  object: jobs
  title: Fixture lifecycle states stay inside the Job status enum
  check: job_enums
  procedure:
  - Check every status value in job fixtures against SUBMITTED, RUNNING, COMPLETED, FAILED, CANCELLED, EXPIRED.
  - Check every capability methods entry against GET, POST, PUT, DELETE.
  expectation: No out-of-enum value in fixtures or schemas.
  falsifier: An out-of-enum status accepted by the check.
- id: S-04
  tier: static
  object: provenance
  title: Digests in fixtures are lowercase SHA-256 hex
  check: digest_format
  procedure:
  - Match inputsDigest, responseDigest, queryDigest against ^[0-9a-f]{64}$.
  expectation: Every digest present in fixtures matches.
  falsifier: A truncated, uppercase, or non-hex digest passing.
- id: S-05
  tier: static
  object: all
  title: Date-times in fixtures parse as RFC 3339
  check: datetime_format
  procedure:
  - Parse recordedAt, createdAt, updatedAt, expiresAt as RFC 3339 date-times.
  expectation: Every date-time present parses.
  falsifier: A non-conforming timestamp passing.
- id: S-06
  tier: static
  object: jobs
  title: Replay and conflict fixtures stand in the specified relation
  check: idempotency_relations
  procedure:
  - Canonicalize job_submit and job_submit_replay bodies; they must be byte-identical.
  - job_submit_conflict must share the idempotencyKey and differ in body.
  expectation: Replay pair identical; conflict pair shares key only.
  falsifier: Either relation inverted without failing.
- id: S-07
  tier: static
  object: serverInfoV3
  title: Advertised GenX capabilities are grounded in this directory
  check: capability_grounding
  procedure:
  - For each capability in serverinfov3.json whose name is a GenX object name (jobs, provenanceEnvelope, variableTerms), require a matching BrAPI-GenX directory and schema.
  - Non-GenX capability names are tolerated (existing call families).
  expectation: No advertised GenX name without a backing schema.
  falsifier: An unbacked GenX name passing.
- id: S-08
  tier: static
  object: serverInfoV3
  title: V2.1 fallback fixture keeps the V2.1 Service shape
  check: v21_fallback_shape
  procedure:
  - Check serverinfo_v21_only.json calls entries carry service, versions, methods.
  expectation: A GenX client can negotiate from calls alone.
  falsifier: Fallback fixture unreadable under V2.1 rules.
- id: S-09
  tier: static
  object: variableTerms
  title: Term fixtures carry the required VariableTerm fields
  check: required_fields
  procedure:
  - Validate term fixtures against the required lists in probes.yaml required_map.
  expectation: All required fields present with the documented types.
  falsifier: A fixture missing a required field still passing.
- id: S-10
  tier: static
  object: variableTerms
  title: Term identifiers in fixtures are namespaced {authority}:{type}:{localId}
  check: term_id_format
  procedure:
  - Match variableDbId, traitDbId, methodDbId, scaleDbId, supersededBy values in term fixtures against ^[^:/]+:[^:/]+:[^:/]+$.
  expectation: Every identifier present is namespaced.
  falsifier: A bare or two-segment identifier passing.
- id: S-11
  tier: static
  object: lotLedger
  title: Ledger fixtures carry the required LotLedgerEntry fields
  check: required_fields
  procedure:
  - Validate ledger fixtures against the required lists in probes.yaml required_map.
  expectation: All required fields present with the documented types.
  falsifier: A fixture missing a required field still passing.
- id: S-12
  tier: static
  object: lotLedger
  title: Ledger quantities are fixed-scale decimal strings, never floats
  check: decimal_format
  procedure:
  - Match quantity values in ledger fixtures against ^-?\d+(\.\d+)?$ and reject JSON numbers.
  expectation: Every quantity present is a decimal string.
  falsifier: A float quantity or a non-numeric string passing.
- id: S-13
  tier: static
  object: modelRegistry
  title: Model fixtures carry the required ModelArtifact fields
  check: required_fields
  procedure:
  - Validate model fixtures against the required lists in probes.yaml required_map.
  expectation: All required fields present with the documented types.
  falsifier: A fixture missing a required field still passing.
- id: S-14
  tier: static
  object: modelRegistry
  title: Model identities are namespaced and digests are SHA-256 hex
  check: model_shape
  procedure:
  - Match modelDbId values against ^[^:/]+:[^:/]+:[^:/]+$.
  - Match artifactDigest and trainingDataDigest against ^[0-9a-f]{64}$.
  - Check status values against the ModelArtifact schema enum.
  expectation: Every model identifier, digest, and status in fixtures is well-formed.
  falsifier: A bare id, a non-hex digest, or an out-of-enum status passing.
- id: S-15
  tier: static
  object: variantMatrices
  title: Matrix fixtures carry the required VariantMatrix fields
  check: required_fields
  procedure:
  - Validate matrix fixtures against the required lists in probes.yaml required_map.
  expectation: All required fields present with the documented types.
  falsifier: A fixture missing a required field still passing.
- id: S-16
  tier: static
  object: variantMatrices
  title: Matrix locations are retrievable URLs and digests are SHA-256 hex
  check: matrix_shape
  procedure:
  - Match matrixDbId values against ^[^:/]+:[^:/]+:[^:/]+$.
  - Require fileURL to start with https:// or drs://.
  - Match fileDigest and indexDigest against ^[0-9a-f]{64}$.
  - Check format values against the VariantMatrix schema enum.
  expectation: Every location, digest, and format in fixtures is well-formed.
  falsifier: A relative URL, a non-hex digest, or an out-of-enum format passing.
- id: S-17
  tier: static
  object: fairPackages
  title: Package fixtures carry the required FAIRPackage fields
  check: required_fields
  procedure:
  - Validate package fixtures against the required lists in probes.yaml required_map.
  expectation: All required fields present with the documented types.
  falsifier: A fixture missing a required field still passing.
- id: S-18
  tier: static
  object: fairPackages
  title: Package licenses, identifiers, and embargoes are well-formed
  check: package_shape
  procedure:
  - Match packageDbId values against ^[^:/]+:[^:/]+:[^:/]+$.
  - Require license to be a non-empty string.
  - Match DOI identifier values against ^10\.\d{4,}/.+.
  - Check accessRights values against the FAIRPackage schema enum.
  - Parse embargoUntil values as RFC 3339.
  expectation: Every license, identifier, right, and embargo date in fixtures is well-formed.
  falsifier: An empty license, a malformed DOI, an out-of-enum right, or a bad date passing.
- id: S-19
  tier: static
  object: telemetry
  title: Telemetry fixtures carry the required TelemetryPoint fields
  check: telemetry_required
  procedure:
  - Validate every point in the telemetry batch fixtures against deviceDbId, sensorDbId, timestamp, value.
  expectation: All required fields present on every point.
  falsifier: A point missing a required field still passing.
- id: S-20
  tier: static
  object: telemetry
  title: Telemetry values are JSON numbers with valid timestamps and quality
  check: telemetry_shape
  procedure:
  - Require value to be a JSON number (booleans rejected).
  - Parse timestamp values as RFC 3339.
  - Check quality values against the TelemetryPoint schema enum.
  expectation: Every point in fixtures is well-formed.
  falsifier: A string value, a bad timestamp, or an out-of-enum quality passing.
- id: S-21
  tier: static
  object: all
  title: Every GenX operation has a stable identity and every V2.1 route reuse is registered
  check: endpoint_identity
  procedure:
  - Collect all operation objects from GenX and V2.1 endpoint YAML files.
  - Require every GenX operation to have a unique operationId matching genxVerbNoun; require non-empty summary and description.
  - Detect repeated GenX method/path templates after normalizing parameter names.
  - Compare relative method/path overlaps between V2.1 and GenX with Conformance/endpoint-overlaps.yaml; no new or stale overlap may pass unregistered.
  expectation: All GenX operation identities are explicit and unique, and all cross-generation relative-path reuse has a recorded semantic distinction.
  falsifier: An unnamed/duplicate operationId, duplicate GenX route template, or unregistered/stale V2.1 route overlap passes.
- id: L-01
  tier: live
  object: jobs
  title: Replay with same key and body returns the existing job, zero new effects
  procedure:
  - POST JobNewRequest with a fresh idempotencyKey; record jobDbId.
  - POST the identical body and key again; GET the complete jobs collection.
  expectation: Second response is 200 or 202 with the same jobDbId and exactly one stored job with that original key and identifier.
  falsifier: A second jobDbId is issued or a duplicate/modified stored job exists despite matching responses.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_submit, capture_job: true}
  - {method: POST, path: /jobs, replay_capture: true, assert: {same_jobDbId: true}}
  - {method: GET, path: /jobs, assert: {status: 200, job_replay_single_stored: true}}
- id: L-02
  tier: live
  object: jobs
  title: Same key with a different body is a conflict, not a new job
  procedure:
  - POST a body under a fresh key; GET the complete job collection; POST a different body under the same key; reread the collection.
  expectation: Second POST is rejected (conflict status; exact code requires-decision per RFC-001 §8), with no new job or change to stored job identities.
  falsifier: A second job is created, a job is removed, or the original job's immutable identity fields are changed.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_submit, capture_job: true}
  - {method: GET, path: /jobs, assert: {status: 200, capture_job_collection: true}}
  - {method: POST, path: /jobs, body_fixture: live_submit_conflict, assert: {rejected: true}}
  - {method: GET, path: /jobs, assert: {status: 200, job_conflict_collection_unchanged: true}}
- id: L-03
  tier: live
  object: jobs
  title: Cancelling a terminal job is rejected
  procedure:
  - Submit a job, wait for a terminal state, attempt DELETE, and re-GET the original job.
  expectation: DELETE is rejected; the same job remains in its original terminal state.
  falsifier: A terminal job changes identity or status after rejected DELETE, or the readback is unavailable.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_submit, capture_job: true, wait_terminal: true}
  - {method: DELETE, path: "/jobs/{jobDbId}", assert: {rejected: true}}
  - {method: GET, path: "/jobs/{jobDbId}", assert: {status: 200, terminal_state_unchanged: true}}
- id: L-04
  tier: live
  object: jobs
  title: Unknown jobType is rejected at submit
  procedure:
  - POST a JobNewRequest with jobType this-door-does-not-exist; GET the complete jobs collection.
  expectation: Rejected with 400 and no job exists for the rejected idempotency key or job type.
  falsifier: A job is accepted or stored for the unadvertised type despite the rejection response.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_submit_unknown_type, assert: {status: 400}}
  - {method: GET, path: /jobs, assert: {status: 200, unknown_job_type_not_stored: true}}
- id: L-05
  tier: live
  object: jobs
  title: Expired jobs report EXPIRED and refuse result retrieval
  procedure:
  - GET a known-expired jobDbId (server-provided fixture id or one aged past expiresAt).
  expectation: Status EXPIRED; the requested expired job remains identifiable but its result field is absent or null.
  falsifier: An expired job reports EXPIRED but still exposes a result payload, or serves a different job.
  calls:
  - {method: GET, path: "/jobs/{expiredJobDbId}", assert: {body: {'result.status': EXPIRED}, expired_result_withheld: true}}
- id: L-06
  tier: live
  object: serverInfoV3
  title: GenX client negotiates against a V2.1-only server via calls
  procedure:
  - GET /serverinfo on the target; accept either ServerInfoV3 or V2.1 shape.
  expectation: V2.1 shape with calls[] is accepted as a valid negotiation outcome; no GenX call is attempted unadvertised.
  falsifier: Client requires GenX fields to proceed.
  calls:
  - {method: GET, path: /serverinfo, assert: {negotiable: true}}
- id: L-07
  tier: live
  object: provenance
  title: A provenanced payload round-trips with its digests intact
  procedure:
  - Submit the reference echo-style analysis job carrying provenanced_observation.json; on COMPLETED, compare the returned job identity and the entire originally submitted observation.
  expectation: The original observation identity, variable, value, and all nested provenance (including inputsDigest and evidenceLinks) survive the round-trip unchanged.
  falsifier: A copied provenance object on a different or altered observation, wrong completed job identity, or any dropped or mutated original field.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_provenanced_submit, capture_job: true, wait_terminal: true}
  - {method: GET, path: "/jobs/{jobDbId}", assert: {provenance_intact: true}}
- id: L-08
  tier: live
  object: variableTerms
  title: Versioned variable-term publication replays an identical version without duplication
  procedure:
  - POST a VariableTermNewRequest to /genx/v1/variable-terms under a fresh namespaced id; POST the identical body again.
  expectation: Second response is 200 with the same (variableDbId, version); the collection holds exactly one unchanged published version.
  falsifier: A second version is created for the identical replay.
  calls:
  - {method: POST, path: /variable-terms, body_fixture: live_term_submit, capture_term: true}
  - {method: POST, path: /variable-terms, body_fixture: live_term_submit, assert: {same_term: true}}
  - {method: GET, path: "/variable-terms?variableDbId={variableDbId}", assert: {status: 200, term_replay_single_version: true}}
- id: L-09
  tier: live
  object: variableTerms
  title: Conflicting rewrite of a published variable-term version is rejected
  procedure:
  - POST to /genx/v1/variable-terms; POST the same (variableDbId, version) with a different body; GET the original published version.
  expectation: Second call is rejected with 409 and the published version is unchanged on re-GET.
  falsifier: The published version is mutated or a conflicting version is stored.
  calls:
  - {method: POST, path: /variable-terms, body_fixture: live_term_submit, capture_term: true}
  - {method: POST, path: /variable-terms, body_fixture: live_term_conflict, assert: {status: 409}}
  - {method: GET, path: "/variable-terms/{variableDbId}?version={termVersion}", assert: {status: 200, unchanged_term_record: true}}
- id: L-10
  tier: live
  object: lotLedger
  title: Ledger append replays identical entries without duplication
  procedure:
  - POST a LotLedgerEntryNewRequest under a fresh lot and idempotencyKey; POST the identical body again; re-GET the ledger.
  expectation: Second response is 200 with the same entryDbId; the ledger retains exactly one unchanged original entry with that key.
  falsifier: A second entry is appended for the identical replay.
  calls:
  - {method: POST, path: "/seedlots/{lotDbId}/ledger", body_fixture: live_ledger_submit, capture_ledger: true}
  - {method: POST, path: "/seedlots/{lotDbId}/ledger", body_fixture: live_ledger_submit, assert: {same_ledger: true}}
  - {method: GET, path: "/seedlots/{lotDbId}/ledger", assert: {ledger_count: 1, ledger_original_intact: true}}
- id: L-11
  tier: live
  object: lotLedger
  title: Conflicting ledger write is rejected and the ledger is unchanged
  procedure:
  - POST a ledger entry; POST the same idempotencyKey with a different quantity; re-GET the ledger.
  expectation: Second call is rejected with 409; the original ledger entry, including quantity and provenance, remains unchanged and no additional entry is stored.
  falsifier: The original entry is mutated or a conflicting entry is stored.
  calls:
  - {method: POST, path: "/seedlots/{lotDbId}/ledger", body_fixture: live_ledger_submit, capture_ledger: true}
  - {method: POST, path: "/seedlots/{lotDbId}/ledger", body_fixture: live_ledger_conflict, assert: {status: 409}}
  - {method: GET, path: "/seedlots/{lotDbId}/ledger", assert: {ledger_count: 1, ledger_original_intact: true}}
- id: L-12
  tier: live
  object: modelRegistry
  title: Model registration replays identical versions without duplication
  procedure:
  - POST a ModelArtifactNewRequest under a fresh namespaced id; POST the identical body again; GET all stored versions for that model identifier.
  expectation: Second response is 200 with the same (modelDbId, modelVersion) and exactly one original unchanged stored version.
  falsifier: A second version is created, original artifact metadata is changed, or collection evidence is incomplete.
  calls:
  - {method: POST, path: /models, body_fixture: live_model_submit, capture_model: true}
  - {method: POST, path: /models, body_fixture: live_model_submit, assert: {same_model: true}}
  - {method: GET, path: "/models?modelDbId={modelDbId}", assert: {status: 200, model_replay_single_version: true}}
- id: L-13
  tier: live
  object: modelRegistry
  title: Conflicting artifact under a published version is rejected
  procedure:
  - POST a model version; POST the same (modelDbId, modelVersion) with a different artifactDigest; read back the original version.
  expectation: Second call is rejected with 409 and every originally submitted field of the published version remains unchanged on re-GET.
  falsifier: The artifact, training data, metrics, framework, or provenance is mutated despite a conflict response.
  calls:
  - {method: POST, path: /models, body_fixture: live_model_submit, capture_model: true}
  - {method: POST, path: /models, body_fixture: live_model_conflict, assert: {status: 409}}
  - {method: GET, path: "/models/{modelDbId}?version={modelVersion}", assert: {unchanged_model_digest: true}}
- id: L-14
  tier: live
  object: modelRegistry
  title: Inference on a registered model binds inputs by digest
  procedure:
  - Register a model; submit an inference job naming it; on COMPLETED verify the exact stored job and complete inference record against the original model and inputs.
  expectation: The completed job matches the submitted job identifier and idempotency key, and its sole result names the registered (modelDbId, modelVersion) with inputsDigest equal to SHA-256 over canonical original inputs.
  falsifier: Wrong job identity, nonterminal job, changed model version, extra result, or an unverifiable inputsDigest.
  calls:
  - {method: POST, path: /models, body_fixture: live_model_submit, capture_model: true}
  - {method: POST, path: /jobs, body_fixture: live_inference_submit, capture_job: true, wait_terminal: true}
  - {method: GET, path: "/jobs/{jobDbId}", assert: {inference_intact: true}}
- id: L-15
  tier: live
  object: modelRegistry
  title: Inference on unknown or revoked models is rejected at submit
  procedure:
  - Submit inference naming an unregistered model; register a revoked model and submit inference naming it; GET the complete jobs collection after both rejections.
  expectation: Both submits are rejected with 400 and no stored job exists for either rejected request key or model identity.
  falsifier: A job is accepted or a matching job is stored for an unknown or revoked model despite rejection.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_inference_unknown, assert: {status: 400}}
  - {method: POST, path: /models, body_fixture: live_model_revoked, capture_model_revoked: true}
  - {method: POST, path: /jobs, body_fixture: live_inference_revoked, assert: {status: 400}}
  - {method: GET, path: /jobs, assert: {status: 200, rejected_inference_not_stored: true}}
- id: L-16
  tier: live
  object: variantMatrices
  title: Matrix registration replays identical records without duplication
  procedure:
  - POST a VariantMatrixNewRequest under a fresh namespaced id; POST the identical body again; GET the complete matrix collection.
  expectation: Second response is 200 with the same matrixDbId and exactly one unchanged stored reference exists for that id.
  falsifier: A second record is stored, original matrix metadata or provenance changes, or the collection is incomplete.
  calls:
  - {method: POST, path: /variantmatrices, body_fixture: live_matrix_submit, capture_matrix: true}
  - {method: POST, path: /variantmatrices, body_fixture: live_matrix_submit, assert: {same_matrix: true}}
  - {method: GET, path: /variantmatrices, assert: {status: 200, matrix_replay_single_record: true}}
- id: L-17
  tier: live
  object: variantMatrices
  title: Mutated bytes under a published id are rejected
  procedure:
  - POST a matrix reference; POST the same matrixDbId with a different fileDigest.
  expectation: Second call is rejected with 409 and all originally submitted matrix fields remain unchanged on re-GET.
  falsifier: The published file, index, access-service or provenance metadata is mutated or a conflicting record is stored.
  calls:
  - {method: POST, path: /variantmatrices, body_fixture: live_matrix_submit, capture_matrix: true}
  - {method: POST, path: /variantmatrices, body_fixture: live_matrix_conflict, assert: {status: 409}}
  - {method: GET, path: "/variantmatrices/{matrixDbId}", assert: {unchanged_matrix_digest: true}}
- id: L-18
  tier: live
  object: fairPackages
  title: Package registration replays identical records without duplication
  procedure:
  - POST a FAIRPackageNewRequest under a fresh namespaced id; POST the identical body again; GET the complete package collection.
  expectation: Second response is 200 with the same packageDbId and exactly one unchanged stored package for that identifier.
  falsifier: A second record is stored, original license, links or provenance changes, or collection evidence is incomplete.
  calls:
  - {method: POST, path: /fair-packages, body_fixture: live_package_submit, capture_package: true}
  - {method: POST, path: /fair-packages, body_fixture: live_package_submit, assert: {same_package: true}}
  - {method: GET, path: /fair-packages, assert: {status: 200, package_replay_single_record: true}}
- id: L-19
  tier: live
  object: fairPackages
  title: Mutated license under a published id is rejected
  procedure:
  - POST a package; POST the same packageDbId with a different license; read back the original package.
  expectation: Second call is rejected with 409 and all originally submitted package fields remain unchanged on re-GET.
  falsifier: The license, access rights, evidence digests, provenance or other published metadata is mutated.
  calls:
  - {method: POST, path: /fair-packages, body_fixture: live_package_submit, capture_package: true}
  - {method: POST, path: /fair-packages, body_fixture: live_package_conflict, assert: {status: 409}}
  - {method: GET, path: "/fair-packages/{packageDbId}", assert: {unchanged_package_license: true}}
- id: L-20
  tier: live
  object: fairPackages
  title: Embargoed packages are denied before expiry
  procedure:
  - POST an embargoed package with a far-future embargoUntil; GET it back; verify the denied response contains no protected package data.
  expectation: GET is denied with 403 while embargoed and no submitted package metadata or payload references are echoed in the response.
  falsifier: The request succeeds, a JSON denial contains protected fields, or a plain-text error echoes submitted package content.
  calls:
  - {method: POST, path: /fair-packages, body_fixture: live_package_embargoed, capture_package: true}
  - {method: GET, path: "/fair-packages/{packageDbId}", assert: {status: 403, embargo_denial_no_payload: true}}
- id: L-21
  tier: live
  object: telemetry
  title: Telemetry batch append replays identical points without duplication
  procedure:
  - POST a batch of three points; POST the identical batch again; reread the original device and sensor.
  expectation: First response reports appended 3 replayed 0 and no conflicts; second reports appended 0 replayed 3 and no conflicts; the same three original readings remain stored exactly once.
  falsifier: A replayed point is stored twice, an unrelated rejection is reported, or any original reading changes.
  calls:
  - {method: POST, path: /telemetry, body_fixture: live_telemetry_batch, capture_telemetry: true, assert: {telemetry_counts: {appended: 3, replayed: 0}, telemetry_no_conflicts: true}}
  - {method: POST, path: /telemetry, body_fixture: live_telemetry_batch, assert: {telemetry_counts: {appended: 0, replayed: 3}, telemetry_no_conflicts: true}}
  - {method: GET, path: "/telemetry?deviceDbId={telemetry_device}&sensorDbId=air-temp-01&aggregation=none", assert: {telemetry_original_intact: true}}
- id: L-22
  tier: live
  object: telemetry
  title: Disagreeing value for a stored sample instant is rejected element-wise
  procedure:
  - POST a three-point batch and verify clean ingestion; POST a point with the same natural key but a different value; verify the response names that exact rejected key.
  expectation: The first batch appends exactly three readings with no replay or conflicts; the conflicting element is then identified by its device/sensor/timestamp key with nothing appended, and all original stored fields remain unchanged on re-GET.
  falsifier: A fabricated or unrelated conflict key, an unaccepted or contradictory initial batch, an overwritten original record or wholesale batch failure.
  calls:
  - {method: POST, path: /telemetry, body_fixture: live_telemetry_batch, capture_telemetry: true, assert: {telemetry_counts: {appended: 3, replayed: 0}, telemetry_no_conflicts: true}}
  - {method: POST, path: /telemetry, body_fixture: live_telemetry_conflict, assert: {telemetry_counts: {appended: 0, replayed: 0}, telemetry_conflicts: 1}}
  - {method: GET, path: "/telemetry?deviceDbId={telemetry_device}&sensorDbId=air-temp-01&aggregation=none", assert: {telemetry_original_intact: true}}
- id: L-23
  tier: live
  object: telemetry
  title: Server aggregates recompute identically from stored points
  procedure:
  - POST three known points; GET the source readings over their exact range; GET the mean over that range and recompute from the original samples.
  expectation: The three original stored readings are intact and exactly one mean bucket has sampleCount 3, consistent timestamp and value equal to the arithmetic mean within 1e-9.
  falsifier: Source samples are missing/changed, an aggregation response is inconsistent or a bucket disagrees with the original points.
  calls:
  - {method: POST, path: /telemetry, body_fixture: live_telemetry_batch, capture_telemetry: true}
  - {method: GET, path: "/telemetry?deviceDbId={telemetry_device}&sensorDbId=air-temp-01&from=2026-09-07T08:00:00Z&to=2026-09-07T08:03:00Z&aggregation=none", assert: {status: 200, telemetry_original_intact: true}}
  - {method: GET, path: "/telemetry?deviceDbId={telemetry_device}&sensorDbId=air-temp-01&from=2026-09-07T08:00:00Z&to=2026-09-07T08:03:00Z&aggregation=mean", assert: {status: 200, telemetry_mean: 21.7, telemetry_samples: 3}}
- id: L-24
  tier: live
  object: jobs
  title: Concurrent identical submits yield exactly one job
  procedure:
  - POST the identical body and idempotency key from 8 threads at once; GET the complete jobs collection to inspect the stored effect.
  expectation: All responses are 2xx with one distinct jobDbId; exactly one stored job has that original idempotency key and identifier.
  falsifier: Two distinct response jobDbIds, missing stored identity, duplicate key, or incomplete collection evidence.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_submit, concurrent_posts: 8, assert: {single_effect: true}}
  - {method: GET, path: /jobs, assert: {status: 200, concurrent_single_stored_job: true}}
- id: L-25
  tier: live
  object: all
  title: List endpoints return paged envelopes
  procedure:
  - GET job and model collections after creating one of each; validate first-page arithmetic and bind the listed records to the original submission.
  expectation: Each returns a consistent first-page envelope and exactly one matching created identity; the job retains its original type/idempotency key, and the model retains all submitted fields including nested provenance.
  falsifier: Missing or duplicate created identities, a mismatched job type or request key, changed model fields, inconsistent pagination or missing created records.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_submit, capture_job: true}
  - {method: POST, path: /models, body_fixture: live_model_submit, capture_model: true}
  - {method: GET, path: /jobs, assert: {status: 200, collection_contains_created: jobs}}
  - {method: GET, path: /models, assert: {status: 200, collection_contains_created: models}}
- id: L-26
  tier: live
  object: telemetry
  title: Windowed buckets partition the range
  procedure:
  - POST three one-minute-apart points; GET their complete unaggregated stored records; then GET the three mean buckets with windowSeconds 60.
  expectation: Every original source field persists unchanged and the three minute buckets each contain the corresponding one-sample mean.
  falsifier: Missing or altered source records, fabricated aggregate-only data, incorrect minute boundaries, values or counts.
  calls:
  - {method: POST, path: /telemetry, body_fixture: live_telemetry_batch, capture_telemetry: true}
  - {method: GET, path: "/telemetry?deviceDbId={telemetry_device}&sensorDbId=air-temp-01&aggregation=none", assert: {status: 200, telemetry_original_intact: true}}
  - {method: GET, path: "/telemetry?deviceDbId={telemetry_device}&sensorDbId=air-temp-01&aggregation=mean&windowSeconds=60", assert: {data_length: 3, telemetry_window_partitions: true}}
- id: L-27
  tier: live
  object: modelRegistry
  title: Deprecated models serve with a warning
  procedure:
  - Register a deprecated model; submit inference naming it; verify completed output is bound to the originally registered version and canonical input digest.
  expectation: Submit is accepted with 202 and a WARNING status message; that exact inference job completes with the original model identity, version and input digest.
  falsifier: Silent acceptance, rejection, another job completing, changed model version, or unrelated inference output.
  calls:
  - {method: POST, path: /models, body_fixture: live_model_deprecated, capture_model_deprecated: true}
  - {method: POST, path: /jobs, body_fixture: live_inference_deprecated, assert: {status: 202, status_message: WARNING, deprecated_inference_completed: true}}
- id: L-28
  tier: live
  object: telemetry
  title: Collection pagination slices the range
  procedure:
  - POST three points; GET pages 0 and 1 with pageSize 2; reconstruct all three original records and verify both pagination envelopes.
  expectation: Pages contain the original 2+1 ordered records, every submitted field is retained, and both pages report consistent totalCount 3 and totalPages 2.
  falsifier: A missing, duplicated, substituted or altered tail record; wrong page boundaries, source fields or pagination metadata.
  calls:
  - {method: POST, path: /telemetry, body_fixture: live_telemetry_batch, capture_telemetry: true}
  - {method: GET, path: "/telemetry?deviceDbId={telemetry_device}&page=0&pageSize=2", assert: {data_length: 2, total_count: 3, telemetry_page_slice: true}}
  - {method: GET, path: "/telemetry?deviceDbId={telemetry_device}&page=1&pageSize=2", assert: {data_length: 1, total_count: 3, telemetry_page_slice: true}}
