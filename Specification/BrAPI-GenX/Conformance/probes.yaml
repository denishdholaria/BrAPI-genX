version: 1
notes: Authority for GenX conformance. Static probes execute against this repo;
  live probes execute against a server given via --server and SKIP otherwise.
probes:
- id: S-01
  tier: static
  object: all
  title: Every GenX $ref resolves to a defined component
  check: refs_resolve
  procedure:
  - Collect $ref '#/components/<section>/<name>' from all BrAPI-GenX endpoint YAMLs.
  - Collect definitions from BrAPI-GenX Schemas plus Specification/Components and Specification/OpenAPI-Components Parameters, Responses, Schemas.
  - Collect read-only definitions from committed V2.1 module files (Specification/BrAPI-*/**/*.yaml); GenX must reference them, never redefine them.
  expectation: Zero unresolvable references and zero GenX names shadowing a V2.1 or shared component name.
  falsifier: Any $ref with no matching definition, or any GenX definition colliding with an existing name.
- id: S-02
  tier: static
  object: all
  title: Fixtures carry the required fields of their schema
  check: required_fields
  procedure:
  - Validate each shaped fixture against the required lists in probes.yaml required_map.
  expectation: All required fields present with the documented types.
  falsifier: A fixture missing a required field still passing.
- id: S-03
  tier: static
  object: jobs
  title: Fixture lifecycle states stay inside the Job status enum
  check: job_enums
  procedure:
  - Check every status value in job fixtures against SUBMITTED, RUNNING, COMPLETED, FAILED, CANCELLED, EXPIRED.
  - Check every capability methods entry against GET, POST, PUT, DELETE.
  expectation: No out-of-enum value in fixtures or schemas.
  falsifier: An out-of-enum status accepted by the check.
- id: S-04
  tier: static
  object: provenance
  title: Digests in fixtures are lowercase SHA-256 hex
  check: digest_format
  procedure:
  - Match inputsDigest, responseDigest, queryDigest against ^[0-9a-f]{64}$.
  expectation: Every digest present in fixtures matches.
  falsifier: A truncated, uppercase, or non-hex digest passing.
- id: S-05
  tier: static
  object: all
  title: Date-times in fixtures parse as RFC 3339
  check: datetime_format
  procedure:
  - Parse recordedAt, createdAt, updatedAt, expiresAt as RFC 3339 date-times.
  expectation: Every date-time present parses.
  falsifier: A non-conforming timestamp passing.
- id: S-06
  tier: static
  object: jobs
  title: Replay and conflict fixtures stand in the specified relation
  check: idempotency_relations
  procedure:
  - Canonicalize job_submit and job_submit_replay bodies; they must be byte-identical.
  - job_submit_conflict must share the idempotencyKey and differ in body.
  expectation: Replay pair identical; conflict pair shares key only.
  falsifier: Either relation inverted without failing.
- id: S-07
  tier: static
  object: serverInfoV3
  title: Advertised GenX capabilities are grounded in this directory
  check: capability_grounding
  procedure:
  - For each capability in serverinfov3.json whose name is a GenX object name (jobs, provenanceEnvelope, variableTerms), require a matching BrAPI-GenX directory and schema.
  - Non-GenX capability names are tolerated (existing call families).
  expectation: No advertised GenX name without a backing schema.
  falsifier: An unbacked GenX name passing.
- id: S-08
  tier: static
  object: serverInfoV3
  title: V2.1 fallback fixture keeps the V2.1 Service shape
  check: v21_fallback_shape
  procedure:
  - Check serverinfo_v21_only.json calls entries carry service, versions, methods.
  expectation: A GenX client can negotiate from calls alone.
  falsifier: Fallback fixture unreadable under V2.1 rules.
- id: S-09
  tier: static
  object: variableTerms
  title: Term fixtures carry the required VariableTerm fields
  check: required_fields
  procedure:
  - Validate term fixtures against the required lists in probes.yaml required_map.
  expectation: All required fields present with the documented types.
  falsifier: A fixture missing a required field still passing.
- id: S-10
  tier: static
  object: variableTerms
  title: Term identifiers in fixtures are namespaced {authority}:{type}:{localId}
  check: term_id_format
  procedure:
  - Match variableDbId, traitDbId, methodDbId, scaleDbId, supersededBy values in term fixtures against ^[^:/]+:[^:/]+:[^:/]+$.
  expectation: Every identifier present is namespaced.
  falsifier: A bare or two-segment identifier passing.
- id: S-11
  tier: static
  object: lotLedger
  title: Ledger fixtures carry the required LotLedgerEntry fields
  check: required_fields
  procedure:
  - Validate ledger fixtures against the required lists in probes.yaml required_map.
  expectation: All required fields present with the documented types.
  falsifier: A fixture missing a required field still passing.
- id: S-12
  tier: static
  object: lotLedger
  title: Ledger quantities are fixed-scale decimal strings, never floats
  check: decimal_format
  procedure:
  - Match quantity values in ledger fixtures against ^-?\d+(\.\d+)?$ and reject JSON numbers.
  expectation: Every quantity present is a decimal string.
  falsifier: A float quantity or a non-numeric string passing.
- id: S-13
  tier: static
  object: modelRegistry
  title: Model fixtures carry the required ModelArtifact fields
  check: required_fields
  procedure:
  - Validate model fixtures against the required lists in probes.yaml required_map.
  expectation: All required fields present with the documented types.
  falsifier: A fixture missing a required field still passing.
- id: S-14
  tier: static
  object: modelRegistry
  title: Model identities are namespaced and digests are SHA-256 hex
  check: model_shape
  procedure:
  - Match modelDbId values against ^[^:/]+:[^:/]+:[^:/]+$.
  - Match artifactDigest and trainingDataDigest against ^[0-9a-f]{64}$.
  - Check status values against the ModelArtifact schema enum.
  expectation: Every model identifier, digest, and status in fixtures is well-formed.
  falsifier: A bare id, a non-hex digest, or an out-of-enum status passing.
- id: S-15
  tier: static
  object: variantMatrices
  title: Matrix fixtures carry the required VariantMatrix fields
  check: required_fields
  procedure:
  - Validate matrix fixtures against the required lists in probes.yaml required_map.
  expectation: All required fields present with the documented types.
  falsifier: A fixture missing a required field still passing.
- id: S-16
  tier: static
  object: variantMatrices
  title: Matrix locations are retrievable URLs and digests are SHA-256 hex
  check: matrix_shape
  procedure:
  - Match matrixDbId values against ^[^:/]+:[^:/]+:[^:/]+$.
  - Require fileURL to start with https:// or drs://.
  - Match fileDigest and indexDigest against ^[0-9a-f]{64}$.
  - Check format values against the VariantMatrix schema enum.
  expectation: Every location, digest, and format in fixtures is well-formed.
  falsifier: A relative URL, a non-hex digest, or an out-of-enum format passing.
- id: S-17
  tier: static
  object: fairPackages
  title: Package fixtures carry the required FAIRPackage fields
  check: required_fields
  procedure:
  - Validate package fixtures against the required lists in probes.yaml required_map.
  expectation: All required fields present with the documented types.
  falsifier: A fixture missing a required field still passing.
- id: S-18
  tier: static
  object: fairPackages
  title: Package licenses, identifiers, and embargoes are well-formed
  check: package_shape
  procedure:
  - Match packageDbId values against ^[^:/]+:[^:/]+:[^:/]+$.
  - Require license to be a non-empty string.
  - Match DOI identifier values against ^10\.\d{4,}/.+.
  - Check accessRights values against the FAIRPackage schema enum.
  - Parse embargoUntil values as RFC 3339.
  expectation: Every license, identifier, right, and embargo date in fixtures is well-formed.
  falsifier: An empty license, a malformed DOI, an out-of-enum right, or a bad date passing.
- id: S-19
  tier: static
  object: telemetry
  title: Telemetry fixtures carry the required TelemetryPoint fields
  check: telemetry_required
  procedure:
  - Validate every point in the telemetry batch fixtures against deviceDbId, sensorDbId, timestamp, value.
  expectation: All required fields present on every point.
  falsifier: A point missing a required field still passing.
- id: S-20
  tier: static
  object: telemetry
  title: Telemetry values are JSON numbers with valid timestamps and quality
  check: telemetry_shape
  procedure:
  - Require value to be a JSON number (booleans rejected).
  - Parse timestamp values as RFC 3339.
  - Check quality values against the TelemetryPoint schema enum.
  expectation: Every point in fixtures is well-formed.
  falsifier: A string value, a bad timestamp, or an out-of-enum quality passing.
- id: S-21
  tier: static
  object: all
  title: Every GenX operation has a stable identity and every V2.1 route reuse is registered
  check: endpoint_identity
  procedure:
  - Collect all operation objects from GenX and V2.1 endpoint YAML files.
  - Require every GenX operation to have a unique operationId matching genxVerbNoun; require non-empty summary and description.
  - Detect repeated GenX method/path templates after normalizing parameter names.
  - Compare relative method/path overlaps between V2.1 and GenX with Conformance/endpoint-overlaps.yaml; no new or stale overlap may pass unregistered.
  expectation: All GenX operation identities are explicit and unique, and all cross-generation relative-path reuse has a recorded semantic distinction.
  falsifier: An unnamed/duplicate operationId, duplicate GenX route template, or unregistered/stale V2.1 route overlap passes.
- id: L-01
  tier: live
  object: jobs
  title: Replay with same key and body returns the existing job, zero new effects
  procedure:
  - POST JobNewRequest with a fresh idempotencyKey; record jobDbId.
  - POST the identical body and key again.
  expectation: Second response is 200 or 202 with the same jobDbId and no new job.
  falsifier: A second jobDbId is issued for the identical replay.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_submit, capture_job: true}
  - {method: POST, path: /jobs, replay_capture: true, assert: {same_jobDbId: true}}
- id: L-02
  tier: live
  object: jobs
  title: Same key with a different body is a conflict, not a new job
  procedure:
  - POST a body under a fresh key; POST a different body under the same key.
  expectation: Second call is rejected (conflict status; exact code requires-decision per RFC-001 §8) and creates nothing.
  falsifier: A second job is created or the first is mutated.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_submit, capture_job: true}
  - {method: POST, path: /jobs, body_fixture: live_submit_conflict, assert: {rejected: true}}
- id: L-03
  tier: live
  object: jobs
  title: Cancelling a terminal job is rejected
  procedure:
  - Submit a job, wait for a terminal state, DELETE it.
  expectation: DELETE is rejected; the terminal state is unchanged on re-GET.
  falsifier: A terminal job changes state after DELETE.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_submit, capture_job: true, wait_terminal: true}
  - {method: DELETE, path: "/jobs/{jobDbId}", assert: {rejected: true}}
- id: L-04
  tier: live
  object: jobs
  title: Unknown jobType is rejected at submit
  procedure:
  - POST a JobNewRequest with jobType this-door-does-not-exist.
  expectation: Rejected with 400 and no job created.
  falsifier: A job is accepted for an unadvertised type.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_submit_unknown_type, assert: {status: 400}}
- id: L-05
  tier: live
  object: jobs
  title: Expired jobs report EXPIRED and refuse result retrieval
  procedure:
  - GET a known-expired jobDbId (server-provided fixture id or one aged past expiresAt).
  expectation: Status EXPIRED; result not served.
  falsifier: An expired result is served as COMPLETED.
  calls:
  - {method: GET, path: "/jobs/{expiredJobDbId}", assert: {body: {'result.status': EXPIRED}}}
- id: L-06
  tier: live
  object: serverInfoV3
  title: GenX client negotiates against a V2.1-only server via calls
  procedure:
  - GET /serverinfo on the target; accept either ServerInfoV3 or V2.1 shape.
  expectation: V2.1 shape with calls[] is accepted as a valid negotiation outcome; no GenX call is attempted unadvertised.
  falsifier: Client requires GenX fields to proceed.
  calls:
  - {method: GET, path: /serverinfo, assert: {negotiable: true}}
- id: L-07
  tier: live
  object: provenance
  title: A provenanced payload round-trips with its digests intact
  procedure:
  - Submit a job carrying provenanced_observation.json parameters; on COMPLETED, compare echoed provenance digests.
  expectation: inputsDigest and evidenceLinks survive the round-trip byte-identical.
  falsifier: Any digest mutated or dropped in transit.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_provenanced_submit, capture_job: true, wait_terminal: true}
  - {method: GET, path: "/jobs/{jobDbId}", assert: {provenance_intact: true}}
- id: L-08
  tier: live
  object: variableTerms
  title: Versioned variable-term publication replays an identical version without duplication
  procedure:
  - POST a VariableTermNewRequest to /genx/v1/variable-terms under a fresh namespaced id; POST the identical body again.
  expectation: Second response is 200 with the same (variableDbId, version) and no new version.
  falsifier: A second version is created for the identical replay.
  calls:
  - {method: POST, path: /variable-terms, body_fixture: live_term_submit, capture_term: true}
  - {method: POST, path: /variable-terms, body_fixture: live_term_submit, assert: {same_term: true}}
- id: L-09
  tier: live
  object: variableTerms
  title: Conflicting rewrite of a published variable-term version is rejected
  procedure:
  - POST to /genx/v1/variable-terms; POST the same (variableDbId, version) with a different body.
  expectation: Second call is rejected with 409 and the published version is unchanged on re-GET.
  falsifier: The published version is mutated or a conflicting version is stored.
  calls:
  - {method: POST, path: /variable-terms, body_fixture: live_term_submit, capture_term: true}
  - {method: POST, path: /variable-terms, body_fixture: live_term_conflict, assert: {status: 409}}
- id: L-10
  tier: live
  object: lotLedger
  title: Ledger append replays identical entries without duplication
  procedure:
  - POST a LotLedgerEntryNewRequest under a fresh lot and idempotencyKey; POST the identical body again; re-GET the ledger.
  expectation: Second response is 200 with the same entryDbId; the ledger holds exactly one entry with that key.
  falsifier: A second entry is appended for the identical replay.
  calls:
  - {method: POST, path: "/seedlots/{lotDbId}/ledger", body_fixture: live_ledger_submit, capture_ledger: true}
  - {method: POST, path: "/seedlots/{lotDbId}/ledger", body_fixture: live_ledger_submit, assert: {same_ledger: true}}
  - {method: GET, path: "/seedlots/{lotDbId}/ledger", assert: {ledger_count: 1}}
- id: L-11
  tier: live
  object: lotLedger
  title: Conflicting ledger write is rejected and the ledger is unchanged
  procedure:
  - POST a ledger entry; POST the same idempotencyKey with a different quantity; re-GET the ledger.
  expectation: Second call is rejected with 409; the ledger still holds the original entry only.
  falsifier: The original entry is mutated or a conflicting entry is stored.
  calls:
  - {method: POST, path: "/seedlots/{lotDbId}/ledger", body_fixture: live_ledger_submit, capture_ledger: true}
  - {method: POST, path: "/seedlots/{lotDbId}/ledger", body_fixture: live_ledger_conflict, assert: {status: 409}}
  - {method: GET, path: "/seedlots/{lotDbId}/ledger", assert: {ledger_count: 1}}
- id: L-12
  tier: live
  object: modelRegistry
  title: Model registration replays identical versions without duplication
  procedure:
  - POST a ModelArtifactNewRequest under a fresh namespaced id; POST the identical body again.
  expectation: Second response is 200 with the same (modelDbId, modelVersion) and no new version.
  falsifier: A second version is created for the identical replay.
  calls:
  - {method: POST, path: /models, body_fixture: live_model_submit, capture_model: true}
  - {method: POST, path: /models, body_fixture: live_model_submit, assert: {same_model: true}}
- id: L-13
  tier: live
  object: modelRegistry
  title: Conflicting artifact under a published version is rejected
  procedure:
  - POST a model version; POST the same (modelDbId, modelVersion) with a different artifactDigest.
  expectation: Second call is rejected with 409 and the published version is unchanged on re-GET.
  falsifier: The published artifact digest is mutated or a conflicting version is stored.
  calls:
  - {method: POST, path: /models, body_fixture: live_model_submit, capture_model: true}
  - {method: POST, path: /models, body_fixture: live_model_conflict, assert: {status: 409}}
  - {method: GET, path: "/models/{modelDbId}?version={modelVersion}", assert: {unchanged_model_digest: true}}
- id: L-14
  tier: live
  object: modelRegistry
  title: Inference on a registered model binds inputs by digest
  procedure:
  - Register a model; submit an inference job naming it; on COMPLETED compare the echoed record.
  expectation: The record names the registered (modelDbId, modelVersion) and inputsDigest equals SHA-256 over the canonical inputs.
  falsifier: Missing model identity or an unverifiable inputsDigest.
  calls:
  - {method: POST, path: /models, body_fixture: live_model_submit, capture_model: true}
  - {method: POST, path: /jobs, body_fixture: live_inference_submit, capture_job: true, wait_terminal: true}
  - {method: GET, path: "/jobs/{jobDbId}", assert: {inference_intact: true}}
- id: L-15
  tier: live
  object: modelRegistry
  title: Inference on unknown or revoked models is rejected at submit
  procedure:
  - Submit inference naming an unregistered model; register a revoked model and submit inference naming it.
  expectation: Both submits are rejected with 400 and no job runs.
  falsifier: A job is accepted for an unknown or revoked model.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_inference_unknown, assert: {status: 400}}
  - {method: POST, path: /models, body_fixture: live_model_revoked, capture_model_revoked: true}
  - {method: POST, path: /jobs, body_fixture: live_inference_revoked, assert: {status: 400}}
- id: L-16
  tier: live
  object: variantMatrices
  title: Matrix registration replays identical records without duplication
  procedure:
  - POST a VariantMatrixNewRequest under a fresh namespaced id; POST the identical body again.
  expectation: Second response is 200 with the same matrixDbId and no new record.
  falsifier: A second record is created for the identical replay.
  calls:
  - {method: POST, path: /variantmatrices, body_fixture: live_matrix_submit, capture_matrix: true}
  - {method: POST, path: /variantmatrices, body_fixture: live_matrix_submit, assert: {same_matrix: true}}
- id: L-17
  tier: live
  object: variantMatrices
  title: Mutated bytes under a published id are rejected
  procedure:
  - POST a matrix reference; POST the same matrixDbId with a different fileDigest.
  expectation: Second call is rejected with 409 and the published record is unchanged on re-GET.
  falsifier: The published digest is mutated or a conflicting record is stored.
  calls:
  - {method: POST, path: /variantmatrices, body_fixture: live_matrix_submit, capture_matrix: true}
  - {method: POST, path: /variantmatrices, body_fixture: live_matrix_conflict, assert: {status: 409}}
  - {method: GET, path: "/variantmatrices/{matrixDbId}", assert: {unchanged_matrix_digest: true}}
- id: L-18
  tier: live
  object: fairPackages
  title: Package registration replays identical records without duplication
  procedure:
  - POST a FAIRPackageNewRequest under a fresh namespaced id; POST the identical body again.
  expectation: Second response is 200 with the same packageDbId and no new record.
  falsifier: A second record is created for the identical replay.
  calls:
  - {method: POST, path: /fair-packages, body_fixture: live_package_submit, capture_package: true}
  - {method: POST, path: /fair-packages, body_fixture: live_package_submit, assert: {same_package: true}}
- id: L-19
  tier: live
  object: fairPackages
  title: Mutated license under a published id is rejected
  procedure:
  - POST a package; POST the same packageDbId with a different license.
  expectation: Second call is rejected with 409 and the published record is unchanged on re-GET.
  falsifier: The published license is mutated or a conflicting record is stored.
  calls:
  - {method: POST, path: /fair-packages, body_fixture: live_package_submit, capture_package: true}
  - {method: POST, path: /fair-packages, body_fixture: live_package_conflict, assert: {status: 409}}
  - {method: GET, path: "/fair-packages/{packageDbId}", assert: {unchanged_package_license: true}}
- id: L-20
  tier: live
  object: fairPackages
  title: Embargoed packages are denied before expiry
  procedure:
  - POST an embargoed package with a far-future embargoUntil; GET it back.
  expectation: GET is denied with 403 while embargoed.
  falsifier: An embargoed record is served with 200.
  calls:
  - {method: POST, path: /fair-packages, body_fixture: live_package_embargoed, capture_package: true}
  - {method: GET, path: "/fair-packages/{packageDbId}", assert: {status: 403}}
- id: L-21
  tier: live
  object: telemetry
  title: Telemetry batch append replays identical points without duplication
  procedure:
  - POST a batch of three points; POST the identical batch again.
  expectation: First response reports appended 3 replayed 0; second reports appended 0 replayed 3.
  falsifier: A replayed point is stored twice.
  calls:
  - {method: POST, path: /telemetry, body_fixture: live_telemetry_batch, capture_telemetry: true, assert: {telemetry_counts: {appended: 3, replayed: 0}}}
  - {method: POST, path: /telemetry, body_fixture: live_telemetry_batch, assert: {telemetry_counts: {appended: 0, replayed: 3}}}
- id: L-22
  tier: live
  object: telemetry
  title: Disagreeing value for a stored sample instant is rejected element-wise
  procedure:
  - POST a batch; POST a point with the same natural key but a different value.
  expectation: The conflicting element is named in conflicts with nothing appended; the stored value is unchanged on re-GET.
  falsifier: The stored value is overwritten or the batch fails wholesale.
  calls:
  - {method: POST, path: /telemetry, body_fixture: live_telemetry_batch, capture_telemetry: true}
  - {method: POST, path: /telemetry, body_fixture: live_telemetry_conflict, assert: {telemetry_counts: {appended: 0, replayed: 0}, telemetry_conflicts: 1}}
  - {method: GET, path: "/telemetry?deviceDbId={telemetry_device}&sensorDbId=air-temp-01&aggregation=none", assert: {telemetry_original_intact: true}}
- id: L-23
  tier: live
  object: telemetry
  title: Server aggregates recompute identically from stored points
  procedure:
  - POST three known points; GET the mean over their range.
  expectation: One bucket with sampleCount 3 and value equal to the arithmetic mean within 1e-9.
  falsifier: An aggregate disagreeing with the stored points.
  calls:
  - {method: POST, path: /telemetry, body_fixture: live_telemetry_batch, capture_telemetry: true}
  - {method: GET, path: "/telemetry?deviceDbId={telemetry_device}&sensorDbId=air-temp-01&from=2026-09-07T08:00:00Z&to=2026-09-07T08:03:00Z&aggregation=mean", assert: {telemetry_mean: 21.7, telemetry_samples: 3}}
- id: L-24
  tier: live
  object: jobs
  title: Concurrent identical submits yield exactly one job
  procedure:
  - POST the identical body and idempotency key from 8 threads at once.
  expectation: All responses are 2xx with one distinct jobDbId; no second job exists.
  falsifier: Two distinct jobDbIds for one key.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_submit, concurrent_posts: 8, assert: {single_effect: true}}
- id: L-25
  tier: live
  object: all
  title: List endpoints return paged envelopes
  procedure:
  - GET collection endpoints after creating one job and one model.
  expectation: Each returns 200 with result.data arrays and pagination totals.
  falsifier: A collection read failing or missing pagination.
  calls:
  - {method: POST, path: /jobs, body_fixture: live_submit, capture_job: true}
  - {method: POST, path: /models, body_fixture: live_model_submit, capture_model: true}
  - {method: GET, path: /jobs, assert: {status: 200, collection_contains_created: jobs}}
  - {method: GET, path: /models, assert: {status: 200, collection_contains_created: models}}
- id: L-26
  tier: live
  object: telemetry
  title: Windowed buckets partition the range
  procedure:
  - POST three one-minute-apart points; GET mean buckets with windowSeconds 60.
  expectation: Three buckets, one sample each.
  falsifier: Points landing in the wrong buckets or bucket counts disagreeing.
  calls:
  - {method: POST, path: /telemetry, body_fixture: live_telemetry_batch, capture_telemetry: true}
  - {method: GET, path: "/telemetry?deviceDbId={telemetry_device}&sensorDbId=air-temp-01&aggregation=mean&windowSeconds=60", assert: {data_length: 3}}
- id: L-27
  tier: live
  object: modelRegistry
  title: Deprecated models serve with a warning
  procedure:
  - Register a deprecated model; submit inference naming it.
  expectation: Submit is accepted with 202 and a WARNING status message; the job completes.
  falsifier: Silent acceptance without warning, or rejection.
  calls:
  - {method: POST, path: /models, body_fixture: live_model_deprecated, capture_model_deprecated: true}
  - {method: POST, path: /jobs, body_fixture: live_inference_deprecated, assert: {status: 202, status_message: WARNING, deprecated_inference_completed: true}}
- id: L-28
  tier: live
  object: telemetry
  title: Collection pagination slices the range
  procedure:
  - POST three points; GET page 0 of size 2.
  expectation: Two rows returned with totalCount 3.
  falsifier: Wrong slice or wrong totals.
  calls:
  - {method: POST, path: /telemetry, body_fixture: live_telemetry_batch, capture_telemetry: true}
