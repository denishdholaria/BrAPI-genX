info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /genomic-datasets:
    get:
      operationId: genxListGenomicDatasets
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.genomic-datasets.list"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C5", "C6", "C9"]
        purpose: "List prepared genomic datasets, optionally filtered by type, reference assembly, or release status."
        canBeUsedFor:
          - "Discover genomic datasets and their provenance."
          - "Select a dataset subject to access policy and release status."
        mustNotBeUsedFor:
          - "Creating or changing a dataset (use the POST endpoint)."
          - "Assuming a dataset is a BrAPI VariantSet or VariantMatrix."
          - "Treating the list as a complete genomic repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterGenomicDataset"
          - "genxGetGenomicDataset"
          - "genxRegisterVariantMatrixReference"
        decisions: ["RFC-013"]
        proposalStatus: "draft-non-normative"
      summary: List genomic datasets
      description: Get a paged list of genomic datasets across authorities. Filters combine with AND.
      parameters:
      - name: genomicDatasetDbId
        description: Namespaced genomic-dataset identity `{authority}:genomic-dataset:{localId}`
        in: query
        required: false
        schema:
          type: string
      - name: datasetType
        description: Filter by dataset class
        in: query
        required: false
        schema:
          type: string
          enum:
          - variant-calls
          - allele-matrix
          - haplotypes
          - sequence-reads
          - marker-set
      - name: referenceAssembly
        description: Filter by reference assembly version
        in: query
        required: false
        schema:
          type: string
      - name: releaseStatus
        description: Filter by release status
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - released
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/GenomicDatasetListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - GenomicDatasets
    post:
      operationId: genxRegisterGenomicDataset
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.genomic-datasets.register"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C5", "C6", "C9"]
        purpose: "Register a prepared genomic dataset with reference assembly, pipeline provenance, and access policy."
        canBeUsedFor:
          - "Publish dataset metadata and integrity references."
          - "Create a new version under an existing dataset identity."
          - "Record release or withdrawal status as governed elsewhere."
        mustNotBeUsedFor:
          - "Uploading dataset bytes through this endpoint."
          - "Assuming registration means scientific validation or approval."
          - "Treating the dataset as a BrAPI VariantSet or VariantMatrix."
        sideEffects: "Creates a dataset identity or appends a new immutable version when accepted."
        idempotency: "Same dataset identity/version and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListGenomicDatasets"
          - "genxGetGenomicDataset"
          - "genxRegisterVariantMatrixReference"
        decisions: ["RFC-013"]
        proposalStatus: "draft-non-normative"
      summary: Register one genomic dataset
      description: |-
        Unknown genomicDatasetDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenomicDatasetNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/GenomicDataset'
                required:
                - metadata
                - result
                title: GenomicDatasetResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - GenomicDatasets
components:
  responses:
    GenomicDatasetListResponse:
      content:
        application/json:
          schema:
            title: GenomicDatasetListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GenomicDataset'
            required:
            - metadata
            - result
      description: OK