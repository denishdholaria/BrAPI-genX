info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /vcf-imports:
    get:
      operationId: genxListVcfImports
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.vcf-imports.list"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C5", "C6", "C9"]
        purpose: "List VCF import records, optionally filtered by dataset or status."
        canBeUsedFor:
          - "Discover VCF imports for a genomic dataset."
          - "Support genotyping provenance and auditing."
        mustNotBeUsedFor:
          - "Creating or changing an import (use the POST endpoint)."
          - "Assuming an import is a BrAPI VariantSet."
          - "Treating the list as a complete genomic repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordVcfImport"
          - "genxGetVcfImport"
          - "genxRegisterGenomicDataset"
        decisions: ["RFC-043"]
        proposalStatus: "draft-non-normative"
      summary: List VCF imports
      description: Get a paged list of VCF imports across authorities. Filters combine with AND.
      parameters:
      - name: genomicDatasetDbId
        description: Filter by GenX GenomicDataset
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - failed
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/VcfImportListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - VcfImport
    post:
      operationId: genxRecordVcfImport
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.vcf-imports.record"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C5", "C6", "C9"]
        purpose: "Record one VCF import with source format and provenance."
        canBeUsedFor:
          - "Record ingestion of a VCF or other variant file."
          - "Retry an identical import safely using the same vcfImportDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing import; corrections require a new record that supersedes."
          - "Assuming the import is a BrAPI VariantSet."
          - "Treating the import as a complete genomic repository."
        sideEffects: "Creates a VCF import when accepted."
        idempotency: "Same vcfImportDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListVcfImports"
          - "genxGetVcfImport"
          - "genxRegisterGenomicDataset"
        decisions: ["RFC-043"]
        proposalStatus: "draft-non-normative"
      summary: Record one VCF import
      description: |-
        Unknown vcfImportDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VcfImportNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/VcfImport'
                required:
                - metadata
                - result
                title: VcfImportResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - VcfImport
components:
  responses:
    VcfImportListResponse:
      content:
        application/json:
          schema:
            title: VcfImportListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VcfImport'
            required:
            - metadata
            - result
      description: OK