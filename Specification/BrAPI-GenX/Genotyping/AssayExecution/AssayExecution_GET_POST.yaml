info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /assay-executions:
    get:
      operationId: genxListAssayExecutions
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.assay-executions.list"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List assay execution records, optionally filtered by status."
        canBeUsedFor:
          - "Discover assay executions."
          - "Support genotyping assay workflow."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI Observation."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterAssayExecution"
          - "genxGetAssayExecution"
          - "genxRegisterFarm"
        decisions: ["RFC-113"]
        proposalStatus: "draft-non-normative"
      summary: List assay executions
      description: Get a paged list of assay execution records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/AssayExecutionListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - AssayExecution
    post:
      operationId: genxRegisterAssayExecution
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.assay-executions.record"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one assay execution record with provenance."
        canBeUsedFor:
          - "Publish an assay execution."
          - "Retry an identical record safely using the same assayExecutionDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI Observation."
          - "Asserting that the work order is completed or validated."
        sideEffects: "Creates an assay execution identity or appends a new immutable version when accepted."
        idempotency: "Same assayExecutionDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListAssayExecutions"
          - "genxGetAssayExecution"
          - "genxRegisterFarm"
        decisions: ["RFC-113"]
        proposalStatus: "draft-non-normative"
      summary: Register one assay execution
      description: |-
        Unknown assayExecutionDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssayExecutionNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/AssayExecution'
                required:
                - metadata
                - result
                title: AssayExecutionResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - AssayExecution
components:
  responses:
    AssayExecutionListResponse:
      content:
        application/json:
          schema:
            title: AssayExecutionListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssayExecution'
            required:
            - metadata
            - result
      description: OK
