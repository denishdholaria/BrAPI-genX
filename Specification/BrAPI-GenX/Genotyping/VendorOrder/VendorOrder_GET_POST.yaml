info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /vendor-orders:
    get:
      operationId: genxListVendorOrders
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.vendor-orders.list"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List vendor genotyping orders, optionally filtered by vendor or status."
        canBeUsedFor:
          - "Discover genotyping orders submitted to a vendor."
          - "Support vendor result ingestion and traceability."
        mustNotBeUsedFor:
          - "Creating or changing an order (use the POST endpoint)."
          - "Assuming an order result is a BrAPI VariantCall set."
          - "Treating the list as a complete genotyping history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterVendorOrder"
          - "genxGetVendorOrder"
          - "genxRegisterGenomicDataset"
        decisions: ["RFC-073"]
        proposalStatus: "draft-non-normative"
      summary: List vendor genotyping orders
      description: Get a paged list of vendor genotyping orders across authorities. Filters combine with AND.
      parameters:
      - name: vendor
        description: Filter by genotyping vendor
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/VendorOrderListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - VendorOrder
    post:
      operationId: genxRegisterVendorOrder
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.vendor-orders.record"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one vendor genotyping order with vendor, platform, and provenance."
        canBeUsedFor:
          - "Publish a vendor genotyping order and its sample count."
          - "Retry an identical order safely using the same vendorOrderDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing order; corrections require a new record that supersedes."
          - "Assuming the order result is a BrAPI VariantCall set."
          - "Asserting that the order is fulfilled or validated."
        sideEffects: "Creates a vendor order identity or appends a new immutable version when accepted."
        idempotency: "Same vendorOrderDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListVendorOrders"
          - "genxGetVendorOrder"
          - "genxRegisterGenomicDataset"
        decisions: ["RFC-073"]
        proposalStatus: "draft-non-normative"
      summary: Register one vendor genotyping order
      description: |-
        Unknown vendorOrderDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorOrderRecordNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/VendorOrderRecord'
                required:
                - metadata
                - result
                title: VendorOrderResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - VendorOrder
components:
  responses:
    VendorOrderListResponse:
      content:
        application/json:
          schema:
            title: VendorOrderListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VendorOrderRecord'
            required:
            - metadata
            - result
      description: OK
