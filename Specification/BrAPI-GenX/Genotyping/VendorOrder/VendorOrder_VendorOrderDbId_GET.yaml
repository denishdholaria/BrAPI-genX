info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /vendor-orders/{vendorOrderDbId}:
    get:
      operationId: genxGetVendorOrder
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.vendor-orders.get"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one vendor genotyping order."
        canBeUsedFor:
          - "Inspect vendor, platform, sample count, status, and provenance."
        mustNotBeUsedFor:
          - "Assuming the order result is a BrAPI VariantCall set."
          - "Treating a superseded order as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterVendorOrder"
          - "genxListVendorOrders"
          - "genxRegisterGenomicDataset"
        decisions: ["RFC-073"]
        proposalStatus: "draft-non-normative"
      summary: Get one vendor genotyping order
      description: Returns the registered order, or 404.
      parameters:
      - name: vendorOrderDbId
        description: Namespaced vendor-order identity `{authority}:vendor-order:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/VendorOrderRecord'
                required:
                - metadata
                - result
                title: VendorOrderResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - VendorOrder
