info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /marker-probes:
    get:
      operationId: genxListMarkerProbes
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.marker-probes.list"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List marker probe records, optionally filtered by marker, platform, or status."
        canBeUsedFor:
          - "Discover probes defined for a marker or genotyping platform."
          - "Support assay design and probe traceability."
        mustNotBeUsedFor:
          - "Creating or changing a probe (use the POST endpoint)."
          - "Assuming a probe is a BrAPI Marker."
          - "Treating the list as a complete assay catalogue."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterMarkerProbe"
          - "genxGetMarkerProbe"
          - "genxRecordAssayDesign"
        decisions: ["RFC-071"]
        proposalStatus: "draft-non-normative"
      summary: List marker probes
      description: Get a paged list of marker probes across authorities. Filters combine with AND.
      parameters:
      - name: markerDbId
        description: Filter by BrAPI Marker
        in: query
        required: false
        schema:
          type: string
      - name: platform
        description: Filter by genotyping platform or vendor
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/MarkerProbeListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - MarkerProbe
    post:
      operationId: genxRegisterMarkerProbe
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.marker-probes.record"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one marker probe with marker linkage, platform, and provenance."
        canBeUsedFor:
          - "Publish a vendor probe definition and its marker linkage."
          - "Retry an identical probe safely using the same markerProbeDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing probe; corrections require a new record that supersedes."
          - "Assuming the probe is a BrAPI Marker or replaces the Marker registry."
          - "Asserting that the probe is validated or commercially available."
        sideEffects: "Creates a marker probe identity or appends a new immutable version when accepted."
        idempotency: "Same markerProbeDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListMarkerProbes"
          - "genxGetMarkerProbe"
          - "genxRecordAssayDesign"
        decisions: ["RFC-071"]
        proposalStatus: "draft-non-normative"
      summary: Register one marker probe
      description: |-
        Unknown markerProbeDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkerProbeNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/MarkerProbe'
                required:
                - metadata
                - result
                title: MarkerProbeResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - MarkerProbe
components:
  responses:
    MarkerProbeListResponse:
      content:
        application/json:
          schema:
            title: MarkerProbeListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarkerProbe'
            required:
            - metadata
            - result
      description: OK