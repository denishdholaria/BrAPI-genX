info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    MarkerProbeNewRequest:
      type: object
      description: |-
        Request to register one marker probe. Unknown markerProbeDbId
        creates; same id with an identical body replays the existing record;
        same id with a different body is rejected with 409.
      required:
      - markerProbeDbId
      properties:
        markerProbeDbId:
          description: Namespaced marker-probe identity `{authority}:marker-probe:{localId}`
          type: string
          example: institute-a:marker-probe:mp-2026-001
        markerDbId:
          description: BrAPI Marker the probe targets
          type: string
          example: m1
        platform:
          description: Genotyping platform or vendor the probe is defined for
          type: string
          example: vendor-x-array-v3
        probeSequence:
          description: Probe sequence, when disclosed
          type: string
          example: ACGTACGTACGT
        status:
          description: Lifecycle state of the probe record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: markerProbeDbId of the record this one replaces
          type: string
          example: institute-a:marker-probe:mp-2026-000
        provenance:
          description: Evidence and method provenance for the probe
          $ref: '#/components/schemas/ProvenanceEnvelope'
