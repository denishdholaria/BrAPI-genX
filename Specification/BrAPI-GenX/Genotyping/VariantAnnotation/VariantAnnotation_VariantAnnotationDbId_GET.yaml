info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /variant-annotations/{variantAnnotationDbId}:
    get:
      operationId: genxGetVariantAnnotation
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.variant-annotations.get"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one variant annotation."
        canBeUsedFor:
          - "Inspect functional annotations and provenance."
        mustNotBeUsedFor:
          - "Assuming the result is a BrAPI data resource."
          - "Treating a superseded result as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordVariantAnnotation"
          - "genxListVariantAnnotations"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-062"]
        proposalStatus: "draft-non-normative"
      summary: Get one variant annotation
      description: Returns the recorded annotation, or 404.
      parameters:
      - name: variantAnnotationDbId
        description: Namespaced variant-annotation identity `{authority}:variant-annotation:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/VariantAnnotation'
                required:
                - metadata
                - result
                title: VariantAnnotationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - VariantAnnotation