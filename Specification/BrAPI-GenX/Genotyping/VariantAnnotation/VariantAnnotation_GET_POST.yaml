info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /variant-annotations:
    get:
      operationId: genxListVariantAnnotations
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.variant-annotations.list"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List variant annotation records, optionally filtered by method, study, or status."
        canBeUsedFor:
          - "Discover variant annotations for a study or method."
          - "Support scientific reproducibility and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a result (use the POST endpoint)."
          - "Assuming a result is a BrAPI data resource."
          - "Treating the list as a complete analysis repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordVariantAnnotation"
          - "genxGetVariantAnnotation"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-062"]
        proposalStatus: "draft-non-normative"
      summary: List variant annotations
      description: Get a paged list of variant annotations across authorities. Filters combine with AND.
      parameters:
      - name: analysisMethodDbId
        description: Filter by GenX AnalysisMethod
        in: query
        required: false
        schema:
          type: string
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/VariantAnnotationListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - VariantAnnotation
    post:
      operationId: genxRecordVariantAnnotation
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.variant-annotations.record"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one variant annotation with annotations and provenance."
        canBeUsedFor:
          - "Publish variant annotation metadata and payload references."
          - "Retry an identical result safely using the same variantAnnotationDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing result; corrections require a new record that supersedes."
          - "Assuming the result is a BrAPI data resource."
          - "Treating the result as scientific validation or approval."
        sideEffects: "Creates a variant annotation when accepted."
        idempotency: "Same variantAnnotationDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListVariantAnnotations"
          - "genxGetVariantAnnotation"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-062"]
        proposalStatus: "draft-non-normative"
      summary: Record one variant annotation
      description: |-
        Unknown variantAnnotationDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantAnnotationNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/VariantAnnotation'
                required:
                - metadata
                - result
                title: VariantAnnotationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - VariantAnnotation
components:
  responses:
    VariantAnnotationListResponse:
      content:
        application/json:
          schema:
            title: VariantAnnotationListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VariantAnnotation'
            required:
            - metadata
            - result
      description: OK