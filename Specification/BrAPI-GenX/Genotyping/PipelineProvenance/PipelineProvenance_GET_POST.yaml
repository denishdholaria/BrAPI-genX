info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /pipeline-provenances:
    get:
      operationId: genxListPipelineProvenances
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.pipeline-provenances.list"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List pipeline provenance records, optionally filtered by status."
        canBeUsedFor:
          - "Discover pipeline provenances."
          - "Support genotyping pipeline provenance."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterPipelineProvenance"
          - "genxGetPipelineProvenance"
          - "genxRegisterFarm"
        decisions: ["RFC-116"]
        proposalStatus: "draft-non-normative"
      summary: List pipeline provenances
      description: Get a paged list of pipeline provenance records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/PipelineProvenanceListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - PipelineProvenance
    post:
      operationId: genxRegisterPipelineProvenance
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.pipeline-provenances.record"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one pipeline provenance record with provenance."
        canBeUsedFor:
          - "Publish a pipeline provenance."
          - "Retry an identical record safely using the same pipelineProvenanceDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the pipeline is validated or endorsed."
        sideEffects: "Creates a pipeline provenance identity or appends a new immutable version when accepted."
        idempotency: "Same pipelineProvenanceDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListPipelineProvenances"
          - "genxGetPipelineProvenance"
          - "genxRegisterFarm"
        decisions: ["RFC-116"]
        proposalStatus: "draft-non-normative"
      summary: Register one pipeline provenance
      description: Register one pipeline provenance record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineProvenanceNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/PipelineProvenance'
                required:
                - metadata
                - result
                title: PipelineProvenanceResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - PipelineProvenance
components:
  responses:
    PipelineProvenanceListResponse:
      content:
        application/json:
          schema:
            title: PipelineProvenanceListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PipelineProvenance'
            required:
            - metadata
            - result
      description: OK