info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /vcf-exports:
    get:
      operationId: genxListVcfExports
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.vcf-exports.list"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List VCF export records, optionally filtered by status."
        canBeUsedFor:
          - "Discover VCF exports."
          - "Support VCF import/export."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI Observation."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterVcfExport"
          - "genxGetVcfExport"
          - "genxRegisterFarm"
        decisions: ["RFC-114"]
        proposalStatus: "draft-non-normative"
      summary: List VCF exports
      description: Get a paged list of VCF export records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/VcfExportListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - VcfExport
    post:
      operationId: genxRegisterVcfExport
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.vcf-exports.record"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one VCF export record with provenance."
        canBeUsedFor:
          - "Publish a VCF export."
          - "Retry an identical record safely using the same vcfExportDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI Observation."
          - "Asserting that the work order is completed or validated."
        sideEffects: "Creates a VCF export identity or appends a new immutable version when accepted."
        idempotency: "Same vcfExportDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListVcfExports"
          - "genxGetVcfExport"
          - "genxRegisterFarm"
        decisions: ["RFC-114"]
        proposalStatus: "draft-non-normative"
      summary: Register one VCF export
      description: |-
        Unknown vcfExportDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VcfExportNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/VcfExport'
                required:
                - metadata
                - result
                title: VcfExportResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - VcfExport
components:
  responses:
    VcfExportListResponse:
      content:
        application/json:
          schema:
            title: VcfExportListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VcfExport'
            required:
            - metadata
            - result
      description: OK
