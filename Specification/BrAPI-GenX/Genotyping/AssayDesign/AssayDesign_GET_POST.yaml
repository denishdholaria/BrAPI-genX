info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /assay-designs:
    get:
      operationId: genxListAssayDesigns
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.assay-designs.list"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List assay design records, optionally filtered by study or status."
        canBeUsedFor:
          - "Discover assay designs for a study or method."
          - "Support scientific reproducibility and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a result (use the POST endpoint)."
          - "Assuming a result is a BrAPI data resource."
          - "Treating the list as a complete analysis repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordAssayDesign"
          - "genxGetAssayDesign"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-061"]
        proposalStatus: "draft-non-normative"
      summary: List assay designs
      description: Get a paged list of assay designs across authorities. Filters combine with AND.
      parameters:
      - name: analysisMethodDbId
        description: Filter by GenX AnalysisMethod
        in: query
        required: false
        schema:
          type: string
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/AssayDesignListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - AssayDesign
    post:
      operationId: genxRecordAssayDesign
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.assay-designs.record"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one assay design with platform and provenance."
        canBeUsedFor:
          - "Publish assay design metadata and payload references."
          - "Retry an identical result safely using the same assayDesignDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing result; corrections require a new record that supersedes."
          - "Assuming the result is a BrAPI data resource."
          - "Treating the result as scientific validation or approval."
        sideEffects: "Creates an assay design when accepted."
        idempotency: "Same assayDesignDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListAssayDesigns"
          - "genxGetAssayDesign"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-061"]
        proposalStatus: "draft-non-normative"
      summary: Record one assay design
      description: |-
        Unknown assayDesignDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssayDesignNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/AssayDesign'
                required:
                - metadata
                - result
                title: AssayDesignResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - AssayDesign
components:
  responses:
    AssayDesignListResponse:
      content:
        application/json:
          schema:
            title: AssayDesignListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssayDesign'
            required:
            - metadata
            - result
      description: OK