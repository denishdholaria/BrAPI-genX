info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /assay-designs/{assayDesignDbId}:
    get:
      operationId: genxGetAssayDesign
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.assay-designs.get"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one assay design."
        canBeUsedFor:
          - "Inspect platform, marker count, and provenance."
        mustNotBeUsedFor:
          - "Assuming the result is a BrAPI data resource."
          - "Treating a superseded result as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordAssayDesign"
          - "genxListAssayDesigns"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-061"]
        proposalStatus: "draft-non-normative"
      summary: Get one assay design
      description: Returns the recorded result, or 404.
      parameters:
      - name: assayDesignDbId
        description: Namespaced assay-design identity `{authority}:assay-design:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/AssayDesign'
                required:
                - metadata
                - result
                title: AssayDesignResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - AssayDesign