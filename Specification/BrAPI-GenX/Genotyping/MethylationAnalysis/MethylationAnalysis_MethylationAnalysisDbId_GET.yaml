info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /methylation-analyses/{methylationAnalysisDbId}:
    get:
      operationId: genxGetMethylationAnalysis
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.methylation-analyses.get"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one methylation analysis result."
        canBeUsedFor:
          - "Inspect components, explained variance, and provenance."
        mustNotBeUsedFor:
          - "Assuming the result is a BrAPI data resource."
          - "Treating a superseded result as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordMethylationAnalysis"
          - "genxListMethylationAnalyses"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-057"]
        proposalStatus: "draft-non-normative"
      summary: Get one methylation analysis result
      description: Returns the recorded result, or 404.
      parameters:
      - name: methylationAnalysisDbId
        description: Namespaced methylation-analysis identity `{authority}:methylation-analysis:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/MethylationAnalysis'
                required:
                - metadata
                - result
                title: MethylationAnalysisResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - MethylationAnalysis