info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /gwas-results:
    get:
      operationId: genxListGwasResults
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.gwas-results.list"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List GWAS result records, optionally filtered by method, study, or status."
        canBeUsedFor:
          - "Discover GWAS results for a study or method."
          - "Support scientific reproducibility and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a result (use the POST endpoint)."
          - "Assuming a result is a BrAPI data resource."
          - "Treating the list as a complete analysis repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordGwasResult"
          - "genxGetGwasResult"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-047"]
        proposalStatus: "draft-non-normative"
      summary: List GWAS results
      description: Get a paged list of GWAS results across authorities. Filters combine with AND.
      parameters:
      - name: analysisMethodDbId
        description: Filter by GenX AnalysisMethod
        in: query
        required: false
        schema:
          type: string
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/GwasResultListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - GwasResult
    post:
      operationId: genxRecordGwasResult
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.gwas-results.record"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one GWAS result with significant markers and provenance."
        canBeUsedFor:
          - "Publish GWAS result metadata and payload references."
          - "Retry an identical result safely using the same gwasResultDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing result; corrections require a new record that supersedes."
          - "Assuming the result is a BrAPI data resource."
          - "Treating the result as scientific validation or approval."
        sideEffects: "Creates a GWAS result when accepted."
        idempotency: "Same gwasResultDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListGwasResults"
          - "genxGetGwasResult"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-047"]
        proposalStatus: "draft-non-normative"
      summary: Record one GWAS result
      description: |-
        Unknown gwasResultDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GwasResultNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/GwasResult'
                required:
                - metadata
                - result
                title: GwasResultResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - GwasResult
components:
  responses:
    GwasResultListResponse:
      content:
        application/json:
          schema:
            title: GwasResultListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GwasResult'
            required:
            - metadata
            - result
      description: OK