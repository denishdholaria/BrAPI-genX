info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /reference-assemblies:
    get:
      operationId: genxListReferenceAssemblies
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.reference-assemblies.list"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List reference assembly records, optionally filtered by status."
        canBeUsedFor:
          - "Discover reference assemblies."
          - "Support genotyping reference selection."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterReferenceAssembly"
          - "genxGetReferenceAssembly"
          - "genxRegisterFarm"
        decisions: ["RFC-115"]
        proposalStatus: "draft-non-normative"
      summary: List reference assemblies
      description: Get a paged list of reference assembly records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ReferenceAssemblyListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ReferenceAssembly
    post:
      operationId: genxRegisterReferenceAssembly
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.reference-assemblies.record"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one reference assembly record with provenance."
        canBeUsedFor:
          - "Publish a reference assembly."
          - "Retry an identical record safely using the same referenceAssemblyDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the assembly is validated or endorsed."
        sideEffects: "Creates a reference assembly identity or appends a new immutable version when accepted."
        idempotency: "Same referenceAssemblyDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListReferenceAssemblies"
          - "genxGetReferenceAssembly"
          - "genxRegisterFarm"
        decisions: ["RFC-115"]
        proposalStatus: "draft-non-normative"
      summary: Register one reference assembly
      description: Register one reference assembly record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceAssemblyNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ReferenceAssembly'
                required:
                - metadata
                - result
                title: ReferenceAssemblyResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ReferenceAssembly
components:
  responses:
    ReferenceAssemblyListResponse:
      content:
        application/json:
          schema:
            title: ReferenceAssemblyListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReferenceAssembly'
            required:
            - metadata
            - result
      description: OK