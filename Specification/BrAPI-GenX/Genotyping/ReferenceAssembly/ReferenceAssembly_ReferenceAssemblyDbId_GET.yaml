info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /reference-assemblies/{referenceAssemblyDbId}:
    get:
      operationId: genxGetReferenceAssembly
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.reference-assemblies.get"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one reference assembly record."
        canBeUsedFor:
          - "Inspect assembly, accession, and provenance."
        mustNotBeUsedFor:
          - "Assuming a record is a BrAPI data resource."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterReferenceAssembly"
          - "genxListReferenceAssemblies"
          - "genxRegisterFarm"
        decisions: ["RFC-115"]
        proposalStatus: "draft-non-normative"
      summary: Get one reference assembly
      description: Returns the registered record, or 404.
      parameters:
      - name: referenceAssemblyDbId
        description: Namespaced reference-assemblies identity `{authority}:reference-assemblies:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ReferenceAssembly'
                required:
                - metadata
                - result
                title: ReferenceAssemblyResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - ReferenceAssembly