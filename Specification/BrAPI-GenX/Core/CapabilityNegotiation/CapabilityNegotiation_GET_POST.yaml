info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /capability-negotiations:
    get:
      operationId: genxListCapabilityNegotiations
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.capability-negotiations.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List capability negotiation records, optionally filtered by status."
        canBeUsedFor:
          - "Discover capability negotiations."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCapabilityNegotiation"
          - "genxGetCapabilityNegotiation"
          - "genxRegisterFarm"
        decisions: ["RFC-153"]
        proposalStatus: "draft-non-normative"
      summary: List capability negotiation
      description: Get a paged list of capability negotiation records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/CapabilityNegotiationListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CapabilityNegotiation
    post:
      operationId: genxRegisterCapabilityNegotiation
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.capability-negotiations.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one capability negotiation record with provenance."
        canBeUsedFor:
          - "Publish a capability negotiation."
          - "Retry an identical record safely using the same capabilityNegotiationDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a capability negotiation identity or appends a new immutable version when accepted."
        idempotency: "Same capabilityNegotiationDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListCapabilityNegotiations"
          - "genxGetCapabilityNegotiation"
          - "genxRegisterFarm"
        decisions: ["RFC-153"]
        proposalStatus: "draft-non-normative"
      summary: Register one capability negotiation
      description: Register one capability negotiation record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityNegotiationNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CapabilityNegotiation'
                required:
                - metadata
                - result
                title: CapabilityNegotiationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CapabilityNegotiation
components:
  responses:
    CapabilityNegotiationListResponse:
      content:
        application/json:
          schema:
            title: CapabilityNegotiationListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CapabilityNegotiation'
            required:
            - metadata
            - result
      description: OK