info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    InstitutionCodeNewRequest:
      type: object
      description: |-
        Request to register one institution and collection code entry. Unknown
        institutionCodeDbId creates; same id with an identical body replays
        the existing record; same id with a different body is rejected with 409.
      required:
      - institutionCodeDbId
      properties:
        institutionCodeDbId:
          description: Namespaced institution-code identity `{authority}:institution-code:{localId}`
          type: string
          example: institute-a:institution-code:ic-2026-001
        code:
          description: Institution or collection code
          type: string
          example: WHEAT-GB
        name:
          description: Institution or collection name
          type: string
          example: Wheat Genebank
        status:
          description: Lifecycle state of the entry
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: institutionCodeDbId of the entry this one replaces
          type: string
          example: institute-a:institution-code:ic-2026-000
        provenance:
          description: Evidence and method provenance for the entry
          $ref: '#/components/schemas/ProvenanceEnvelope'
