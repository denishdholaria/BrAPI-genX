info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /telemetry-normalizations:
    get:
      operationId: genxListTelemetryNormalizations
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.telemetry-normalizations.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List telemetry normalization records, optionally filtered by status."
        canBeUsedFor:
          - "Discover telemetry normalizations."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterTelemetryNormalization"
          - "genxGetTelemetryNormalization"
          - "genxRegisterFarm"
        decisions: ["RFC-148"]
        proposalStatus: "draft-non-normative"
      summary: List telemetry normalization
      description: Get a paged list of telemetry normalization records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/TelemetryNormalizationListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - TelemetryNormalization
    post:
      operationId: genxRegisterTelemetryNormalization
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.telemetry-normalizations.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one telemetry normalization record with provenance."
        canBeUsedFor:
          - "Publish a telemetry normalization."
          - "Retry an identical record safely using the same telemetryNormalizationDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a telemetry normalization identity or appends a new immutable version when accepted."
        idempotency: "Same telemetryNormalizationDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListTelemetryNormalizations"
          - "genxGetTelemetryNormalization"
          - "genxRegisterFarm"
        decisions: ["RFC-148"]
        proposalStatus: "draft-non-normative"
      summary: Register one telemetry normalization
      description: Register one telemetry normalization record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryNormalizationNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/TelemetryNormalization'
                required:
                - metadata
                - result
                title: TelemetryNormalizationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - TelemetryNormalization
components:
  responses:
    TelemetryNormalizationListResponse:
      content:
        application/json:
          schema:
            title: TelemetryNormalizationListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TelemetryNormalization'
            required:
            - metadata
            - result
      description: OK