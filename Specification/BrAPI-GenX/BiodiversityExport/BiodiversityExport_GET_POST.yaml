info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /biodiversity-exports:
    get:
      operationId: genxListBiodiversityExports
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.biodiversity-exports.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List biodiversity export records, optionally filtered by status."
        canBeUsedFor:
          - "Discover biodiversity exports."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterBiodiversityExport"
          - "genxGetBiodiversityExport"
          - "genxRegisterFarm"
        decisions: ["RFC-121"]
        proposalStatus: "draft-non-normative"
      summary: List biodiversity exports
      description: Get a paged list of biodiversity export records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/BiodiversityExportListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - BiodiversityExport
    post:
      operationId: genxRegisterBiodiversityExport
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.biodiversity-exports.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one biodiversity export record with provenance."
        canBeUsedFor:
          - "Publish a biodiversity export."
          - "Retry an identical record safely using the same biodiversityExportDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a biodiversity export identity or appends a new immutable version when accepted."
        idempotency: "Same biodiversityExportDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListBiodiversityExports"
          - "genxGetBiodiversityExport"
          - "genxRegisterFarm"
        decisions: ["RFC-121"]
        proposalStatus: "draft-non-normative"
      summary: Register one biodiversity export
      description: Register one biodiversity export record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiodiversityExportNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/BiodiversityExport'
                required:
                - metadata
                - result
                title: BiodiversityExportResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - BiodiversityExport
components:
  responses:
    BiodiversityExportListResponse:
      content:
        application/json:
          schema:
            title: BiodiversityExportListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BiodiversityExport'
            required:
            - metadata
            - result
      description: OK