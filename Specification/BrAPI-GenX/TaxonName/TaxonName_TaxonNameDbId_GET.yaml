info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /taxon-names/{taxonNameDbId}:
    get:
      operationId: genxGetTaxonName
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.taxon-names.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "Retrieve one taxon name or synonym entry."
        canBeUsedFor:
          - "Inspect taxon name, synonyms, and provenance."
        mustNotBeUsedFor:
          - "Assuming an entry is a BrAPI Germplasm."
          - "Treating a superseded entry as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterTaxonName"
          - "genxListTaxonNames"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-080"]
        proposalStatus: "draft-non-normative"
      summary: Get one taxon name
      description: Returns the registered entry, or 404.
      parameters:
      - name: taxonNameDbId
        description: Namespaced taxon-name identity `{authority}:taxon-name:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/TaxonName'
                required:
                - metadata
                - result
                title: TaxonNameResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - TaxonName
