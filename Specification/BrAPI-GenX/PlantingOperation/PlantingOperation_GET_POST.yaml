info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /planting-operations:
    get:
      operationId: genxListPlantingOperations
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.planting-operations.list"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List planting operation records, optionally filtered by study, crop cycle, or status."
        canBeUsedFor:
          - "Discover planting operations for a study or crop cycle."
          - "Support agronomic traceability for a season."
        mustNotBeUsedFor:
          - "Creating or changing an operation (use the POST endpoint)."
          - "Assuming an operation is a BrAPI data resource."
          - "Treating the list as a complete field operation history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordPlantingOperation"
          - "genxGetPlantingOperation"
          - "genxRegisterCropCycle"
        decisions: ["RFC-066"]
        proposalStatus: "draft-non-normative"
      summary: List planting operations
      description: Get a paged list of planting operations across authorities. Filters combine with AND.
      parameters:
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: cropCycleDbId
        description: Filter by GenX CropCycle
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/PlantingOperationListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - PlantingOperation
    post:
      operationId: genxRecordPlantingOperation
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.planting-operations.record"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one planting operation with date, method, rate, and provenance."
        canBeUsedFor:
          - "Publish a planting event for agronomic traceability."
          - "Retry an identical operation safely using the same plantingOperationDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing operation; corrections require a new record that supersedes."
          - "Assuming the operation is a BrAPI data resource."
          - "Treating an operation as evidence that seed was viable or that planting succeeded."
        sideEffects: "Creates a planting record when accepted."
        idempotency: "Same plantingOperationDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListPlantingOperations"
          - "genxGetPlantingOperation"
          - "genxRegisterCropCycle"
        decisions: ["RFC-066"]
        proposalStatus: "draft-non-normative"
      summary: Record one planting operation
      description: |-
        Unknown plantingOperationDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantingOperationNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/PlantingOperation'
                required:
                - metadata
                - result
                title: PlantingOperationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - PlantingOperation
components:
  responses:
    PlantingOperationListResponse:
      content:
        application/json:
          schema:
            title: PlantingOperationListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlantingOperation'
            required:
            - metadata
            - result
      description: OK