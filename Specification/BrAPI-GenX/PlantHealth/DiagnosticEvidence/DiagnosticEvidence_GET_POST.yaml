info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /diagnostic-evidences:
    get:
      operationId: genxListDiagnosticEvidences
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.diagnostic-evidences.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List diagnostic evidence records, optionally filtered by status."
        canBeUsedFor:
          - "Discover diagnostic evidences."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterDiagnosticEvidence"
          - "genxGetDiagnosticEvidence"
          - "genxRegisterFarm"
        decisions: ["RFC-124"]
        proposalStatus: "draft-non-normative"
      summary: List diagnostic evidence
      description: Get a paged list of diagnostic evidence records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/DiagnosticEvidenceListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - DiagnosticEvidence
    post:
      operationId: genxRegisterDiagnosticEvidence
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.diagnostic-evidences.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one diagnostic evidence record with provenance."
        canBeUsedFor:
          - "Publish a diagnostic evidence."
          - "Retry an identical record safely using the same diagnosticEvidenceDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a diagnostic evidence identity or appends a new immutable version when accepted."
        idempotency: "Same diagnosticEvidenceDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListDiagnosticEvidences"
          - "genxGetDiagnosticEvidence"
          - "genxRegisterFarm"
        decisions: ["RFC-124"]
        proposalStatus: "draft-non-normative"
      summary: Register one diagnostic evidence
      description: Register one diagnostic evidence record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticEvidenceNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/DiagnosticEvidence'
                required:
                - metadata
                - result
                title: DiagnosticEvidenceResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - DiagnosticEvidence
components:
  responses:
    DiagnosticEvidenceListResponse:
      content:
        application/json:
          schema:
            title: DiagnosticEvidenceListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiagnosticEvidence'
            required:
            - metadata
            - result
      description: OK