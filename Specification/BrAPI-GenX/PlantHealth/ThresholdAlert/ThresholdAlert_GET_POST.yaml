info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /threshold-alerts:
    get:
      operationId: genxListThresholdAlerts
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.threshold-alerts.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List threshold alert records, optionally filtered by status."
        canBeUsedFor:
          - "Discover threshold alerts."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterThresholdAlert"
          - "genxGetThresholdAlert"
          - "genxRegisterFarm"
        decisions: ["RFC-126"]
        proposalStatus: "draft-non-normative"
      summary: List threshold alerts
      description: Get a paged list of threshold alert records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ThresholdAlertListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ThresholdAlert
    post:
      operationId: genxRegisterThresholdAlert
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.threshold-alerts.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one threshold alert record with provenance."
        canBeUsedFor:
          - "Publish a threshold alert."
          - "Retry an identical record safely using the same thresholdAlertDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a threshold alert identity or appends a new immutable version when accepted."
        idempotency: "Same thresholdAlertDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListThresholdAlerts"
          - "genxGetThresholdAlert"
          - "genxRegisterFarm"
        decisions: ["RFC-126"]
        proposalStatus: "draft-non-normative"
      summary: Register one threshold alert
      description: Register one threshold alert record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThresholdAlertNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ThresholdAlert'
                required:
                - metadata
                - result
                title: ThresholdAlertResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ThresholdAlert
components:
  responses:
    ThresholdAlertListResponse:
      content:
        application/json:
          schema:
            title: ThresholdAlertListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ThresholdAlert'
            required:
            - metadata
            - result
      description: OK