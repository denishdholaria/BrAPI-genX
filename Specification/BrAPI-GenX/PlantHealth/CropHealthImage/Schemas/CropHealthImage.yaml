info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    CropHealthImage:
      type: object
      description: |-
        One immutable crop health image record. A published (cropHealthImageDbId) record
        never mutates in place; corrections are recorded as additional
        records linked by supersedes.
      required:
      - cropHealthImageDbId
      - status
      properties:
        cropHealthImageDbId:
          description: Namespaced crop-health-image identity `{authority}:crop-health-image:{localId}`
          type: string
          example: institute-a:crop-health-image:chi-2026-001
        imageType:
          description: Type of crop health image
          type: string
          example: multispectral
        captureDate:
          description: Date the image was captured
          type: string
          example: "2026-05-01"
        sensorOrPlatform:
          description: Sensor or platform used for capture
          type: string
          example: UAV
        vegetationIndex:
          description: Vegetation index derived from the image
          type: string
          example: NDVI
        healthStatus:
          description: Crop health status
          type: string
          example: stressed
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: cropHealthImageDbId of the record this one replaces
          type: string
          example: institute-a:crop-health-image:chi-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
