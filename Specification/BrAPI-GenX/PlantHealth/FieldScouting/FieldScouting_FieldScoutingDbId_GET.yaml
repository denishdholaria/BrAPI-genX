info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /field-scouting/{fieldScoutingDbId}:
    get:
      operationId: genxGetFieldScouting
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.field-scouting.get"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one field scouting or work order record."
        canBeUsedFor:
          - "Inspect field linkage, scouting details, status, and provenance."
        mustNotBeUsedFor:
          - "Assuming a scouting record is a BrAPI Observation."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterFieldScouting"
          - "genxListFieldScouting"
          - "genxRegisterFarm"
        decisions: ["RFC-074"]
        proposalStatus: "draft-non-normative"
      summary: Get one field scouting record
      description: Returns the registered record, or 404.
      parameters:
      - name: fieldScoutingDbId
        description: Namespaced field-scouting identity `{authority}:field-scouting:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/FieldScouting'
                required:
                - metadata
                - result
                title: FieldScoutingResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - FieldScouting
