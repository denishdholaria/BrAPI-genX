info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /telemetry-normalizations/{telemetryNormalizationDbId}:
    get:
      operationId: genxGetTelemetryNormalization
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.telemetry-normalizations.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one telemetry normalization record."
        canBeUsedFor:
          - "Inspect catalogue entries and provenance."
        mustNotBeUsedFor:
          - "Assuming a record is a BrAPI data resource."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterTelemetryNormalization"
          - "genxListTelemetryNormalizations"
          - "genxRegisterResearchAsset"
        decisions: ["RFC-148"]
        proposalStatus: "draft-non-normative"
      summary: Get one telemetry normalization
      description: Returns the registered record, or 404.
      parameters:
      - name: telemetryNormalizationDbId
        description: Namespaced telemetry-normalization identity `{authority}:telemetry-normalization:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/TelemetryNormalization'
                required:
                - metadata
                - result
                title: TelemetryNormalizationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - TelemetryNormalization