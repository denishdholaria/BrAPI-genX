info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /haplotype-analyses:
    get:
      operationId: genxListHaplotypeAnalyses
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.haplotype-analyses.list"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List haplotype analysis result records, optionally filtered by method, study, or status."
        canBeUsedFor:
          - "Discover haplotype analysis results for a study or method."
          - "Support scientific reproducibility and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a result (use the POST endpoint)."
          - "Assuming a result is a BrAPI data resource."
          - "Treating the list as a complete analysis repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordHaplotypeAnalysis"
          - "genxGetHaplotypeAnalysis"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-059"]
        proposalStatus: "draft-non-normative"
      summary: List haplotype analysis results
      description: Get a paged list of haplotype analysis results across authorities. Filters combine with AND.
      parameters:
      - name: analysisMethodDbId
        description: Filter by GenX AnalysisMethod
        in: query
        required: false
        schema:
          type: string
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/HaplotypeAnalysisListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - HaplotypeAnalysis
    post:
      operationId: genxRecordHaplotypeAnalysis
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.haplotype-analyses.record"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one haplotype analysis result with haplotypes and provenance."
        canBeUsedFor:
          - "Publish haplotype analysis result metadata and payload references."
          - "Retry an identical result safely using the same haplotypeAnalysisDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing result; corrections require a new record that supersedes."
          - "Assuming the result is a BrAPI data resource."
          - "Treating the result as scientific validation or approval."
        sideEffects: "Creates a haplotype analysis result when accepted."
        idempotency: "Same haplotypeAnalysisDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListHaplotypeAnalyses"
          - "genxGetHaplotypeAnalysis"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-059"]
        proposalStatus: "draft-non-normative"
      summary: Record one haplotype analysis result
      description: |-
        Unknown haplotypeAnalysisDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HaplotypeAnalysisNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/HaplotypeAnalysis'
                required:
                - metadata
                - result
                title: HaplotypeAnalysisResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - HaplotypeAnalysis
components:
  responses:
    HaplotypeAnalysisListResponse:
      content:
        application/json:
          schema:
            title: HaplotypeAnalysisListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HaplotypeAnalysis'
            required:
            - metadata
            - result
      description: OK