info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /phenology-observations/{phenologyObservationDbId}:
    get:
      operationId: genxGetPhenologyObservation
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.phenology-observations.get"
        classification:
          primaryDomain: "D4"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one phenology observation."
        canBeUsedFor:
          - "Inspect developmental stage, BBCH code, and provenance."
        mustNotBeUsedFor:
          - "Assuming the observation is a BrAPI Observation."
          - "Treating a superseded observation as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordPhenologyObservation"
          - "genxListPhenologyObservations"
        decisions: ["RFC-027"]
        proposalStatus: "draft-non-normative"
      summary: Get one phenology observation
      description: Returns the recorded observation, or 404.
      parameters:
      - name: phenologyObservationDbId
        description: Namespaced phenology-observation identity `{authority}:phenology-observation:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/PhenologyObservation'
                required:
                - metadata
                - result
                title: PhenologyObservationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - PhenologyObservation