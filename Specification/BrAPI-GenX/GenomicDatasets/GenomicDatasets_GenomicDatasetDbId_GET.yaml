info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /genomic-datasets/{genomicDatasetDbId}:
    get:
      operationId: genxGetGenomicDataset
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.genomic-datasets.get"
        classification:
          primaryDomain: "D3"
          crossCuttingCapabilities: ["C1", "C2", "C5", "C6", "C9"]
        purpose: "Retrieve one registered genomic dataset."
        canBeUsedFor:
          - "Inspect dataset identity, reference assembly, pipeline provenance, and access policy."
        mustNotBeUsedFor:
          - "Assuming the dataset is a BrAPI VariantSet or VariantMatrix."
          - "Treating a withdrawn dataset as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterGenomicDataset"
          - "genxListGenomicDatasets"
          - "genxRegisterVariantMatrixReference"
        decisions: ["RFC-013"]
        proposalStatus: "draft-non-normative"
      summary: Get one genomic dataset
      description: Returns the registered dataset, or 404.
      parameters:
      - name: genomicDatasetDbId
        description: Namespaced genomic-dataset identity `{authority}:genomic-dataset:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/GenomicDataset'
                required:
                - metadata
                - result
                title: GenomicDatasetResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - GenomicDatasets