info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /kinship-matrices:
    get:
      operationId: genxListKinshipMatrices
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.kinship-matrices.list"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C5", "C6", "C9"]
        purpose: "List kinship matrix records, optionally filtered by method, study, or status."
        canBeUsedFor:
          - "Discover kinship matrices for a study or method."
          - "Support genomic analysis and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a matrix (use the POST endpoint)."
          - "Assuming a matrix is a BrAPI data resource."
          - "Treating the list as a complete analysis repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterKinshipMatrix"
          - "genxGetKinshipMatrix"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-052"]
        proposalStatus: "draft-non-normative"
      summary: List kinship matrices
      description: Get a paged list of kinship matrices across authorities. Filters combine with AND.
      parameters:
      - name: analysisMethodDbId
        description: Filter by GenX AnalysisMethod
        in: query
        required: false
        schema:
          type: string
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/KinshipMatrixListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Kinship
    post:
      operationId: genxRegisterKinshipMatrix
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.kinship-matrices.register"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C5", "C6", "C9"]
        purpose: "Register a kinship matrix with method, storage reference, and provenance."
        canBeUsedFor:
          - "Publish kinship matrix metadata."
          - "Create a new version under an existing matrix identity."
        mustNotBeUsedFor:
          - "Updating or deleting an existing matrix; corrections require a new record that supersedes."
          - "Assuming the matrix is a BrAPI data resource."
          - "Treating the matrix as scientific validation or approval."
        sideEffects: "Creates a kinship matrix identity or appends a new immutable version when accepted."
        idempotency: "Same identity and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListKinshipMatrices"
          - "genxGetKinshipMatrix"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-052"]
        proposalStatus: "draft-non-normative"
      summary: Register one kinship matrix
      description: |-
        Unknown kinshipMatrixDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KinshipMatrixNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/KinshipMatrix'
                required:
                - metadata
                - result
                title: KinshipMatrixResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Kinship
components:
  responses:
    KinshipMatrixListResponse:
      content:
        application/json:
          schema:
            title: KinshipMatrixListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KinshipMatrix'
            required:
            - metadata
            - result
      description: OK