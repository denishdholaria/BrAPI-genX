info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    SelectionDecision:
      type: object
      description: |-
        One immutable breeding selection verdict with rationale and evidence.
        It is not a scheme task definition or selection rule. A scheme-local
        stage can appear only inside schemeContext, which requires the exact
        BreedingSchemeVersion identity.
      required: [selectionDecisionDbId, programReference, decision, decisionDate]
      properties:
        selectionDecisionDbId:
          description: Namespaced selection-decision identity `{authority}:selection-decision:{localId}`
          type: string
          example: institute-a:selection-decision:sd-2026-001
        programReference:
          description: Authority-qualified BrAPI Program reference.
          $ref: '#/components/schemas/BrapiResourceReference'
        pipelineContext:
          description: Optional exact pipeline revision context when this decision was governed by a registered pipeline.
          $ref: '#/components/schemas/BreedingPipelineExecutionContext'
        schemeContext:
          description: Optional exact scheme-version context. Any supplied stage identifier must resolve in this exact version.
          $ref: '#/components/schemas/BreedingSchemeExecutionContext'
        studyReference:
          description: Optional authority-qualified BrAPI Study reference.
          $ref: '#/components/schemas/BrapiResourceReference'
        candidateGermplasmReference:
          description: Optional authority-qualified BrAPI Germplasm candidate reference.
          $ref: '#/components/schemas/BrapiResourceReference'
        populationReference:
          description: Optional authority-qualified population or family material reference.
          $ref: '#/components/schemas/BrapiResourceReference'
        selectionCriterion:
          description: Criterion or index used to reach the verdict; this is not the verdict itself.
          type: string
          example: grain-yield-index-2026
        decision:
          description: Actual verdict reached for the candidate.
          type: string
          enum: [selected, rejected, deferred, advanced]
          example: selected
        decisionDate:
          description: Date the verdict was recorded (ISO-8601).
          type: string
          format: date
          example: '2026-10-24'
        decisionMaker:
          description: Actor recording the verdict (person identifier or system identity).
          type: string
          example: breeder-42
        rationale:
          description: Human-readable justification.
          type: string
          example: Selected for high yield and acceptable disease score.
        linkedObservationReferences:
          description: Authority-qualified BrAPI Observation references that informed the verdict.
          type: array
          items:
            $ref: '#/components/schemas/BrapiResourceReference'
        linkedJobDbId:
          description: GenX Job that produced supporting analysis, when applicable.
          type: string
          example: institute-a:job:analysis-7
        supersedes:
          description: selectionDecisionDbId of the decision this one corrects or supersedes.
          type: string
          example: institute-a:selection-decision:sd-2026-000
        status:
          description: Lifecycle state of this immutable verdict record.
          type: string
          enum: [active, superseded]
          example: active
        provenance:
          description: Evidence and method provenance for the verdict.
          $ref: '#/components/schemas/ProvenanceEnvelope'
