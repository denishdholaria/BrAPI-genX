info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    SelectionDecisionNewRequest:
      type: object
      description: |-
        Request to record one selection decision. Unknown
        selectionDecisionDbId creates; same id with an identical body replays
        the existing record; same id with a different body is rejected with 409.
      required:
      - selectionDecisionDbId
      - programDbId
      - decision
      - decisionDate
      properties:
        selectionDecisionDbId:
          description: Namespaced selection-decision identity `{authority}:selection-decision:{localId}`
          type: string
          example: institute-a:selection-decision:sd-2026-001
        programDbId:
          description: BrAPI Program (breeding program) this decision belongs to
          type: string
          example: institute-a:program:wheat-breeding
        studyDbId:
          description: BrAPI Study / trial context, when applicable
          type: string
          example: institute-a:study:yield-trial-2026
        candidateGermplasmDbId:
          description: BrAPI Germplasm candidate under evaluation
          type: string
          example: institute-a:germplasm:line-42
        populationDbId:
          description: Optional BrAPI population / family reference
          type: string
          example: institute-a:population:f2-2026
        selectionCriterion:
          description: Criterion or index used to reach the verdict
          type: string
          example: grain-yield-index-2026
        decision:
          description: Verdict reached for the candidate
          type: string
          enum:
          - selected
          - rejected
          - deferred
          - advanced
          example: selected
        decisionDate:
          description: Date the verdict was recorded (ISO-8601)
          type: string
          format: date
          example: '2026-10-24'
        decisionMaker:
          description: Actor recording the verdict (person id or system identity)
          type: string
          example: breeder-42
        rationale:
          description: Human-readable justification
          type: string
          example: Selected for high yield and acceptable disease score.
        linkedObservationDbIds:
          description: BrAPI Observation identifiers that informed the verdict
          type: array
          items:
            type: string
          example: [institute-a:observation:obs-1, institute-a:observation:obs-2]
        linkedJobDbId:
          description: GenX Job that produced supporting analysis, when applicable
          type: string
          example: institute-a:job:analysis-7
        supersedes:
          description: selectionDecisionDbId of the decision this one replaces
          type: string
          example: institute-a:selection-decision:sd-2026-000
        status:
          description: Lifecycle state of the decision record
          type: string
          enum:
          - active
          - superseded
          default: active
          example: active
        provenance:
          description: Evidence and method provenance for the verdict
          $ref: '#/components/schemas/ProvenanceEnvelope'