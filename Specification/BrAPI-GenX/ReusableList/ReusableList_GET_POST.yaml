info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /reusable-lists:
    get:
      operationId: genxListReusableLists
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.reusable-lists.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List reusable list and cohort records, optionally filtered by status."
        canBeUsedFor:
          - "Discover reusable lists and cohorts."
          - "Support reference data and research organization."
        mustNotBeUsedFor:
          - "Creating or changing a list (use the POST endpoint)."
          - "Assuming a list is a BrAPI Study."
          - "Treating the list as a complete catalogue."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterReusableList"
          - "genxGetReusableList"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-090"]
        proposalStatus: "draft-non-normative"
      summary: List reusable lists
      description: Get a paged list of reusable list and cohort records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ReusableListListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ReusableList
    post:
      operationId: genxRegisterReusableList
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.reusable-lists.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one reusable list or cohort record with provenance."
        canBeUsedFor:
          - "Publish a reusable list or cohort."
          - "Retry an identical record safely using the same reusableListDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a list is a BrAPI Study."
          - "Asserting that the list is validated or endorsed."
        sideEffects: "Creates a reusable list identity or appends a new immutable version when accepted."
        idempotency: "Same reusableListDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListReusableLists"
          - "genxGetReusableList"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-090"]
        proposalStatus: "draft-non-normative"
      summary: Register one reusable list
      description: |-
        Unknown reusableListDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReusableListNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ReusableList'
                required:
                - metadata
                - result
                title: ReusableListResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ReusableList
components:
  responses:
    ReusableListListResponse:
      content:
        application/json:
          schema:
            title: ReusableListListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReusableList'
            required:
            - metadata
            - result
      description: OK
