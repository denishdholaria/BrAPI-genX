info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /research-locations/{researchLocationDbId}:
    get:
      operationId: genxGetResearchLocation
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.research-locations.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one research location record."
        canBeUsedFor:
          - "Inspect research-location identity, funding, and provenance."
        mustNotBeUsedFor:
          - "Assuming a research-location is a BrAPI Study."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterResearchLocation"
          - "genxListResearchLocations"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-100"]
        proposalStatus: "draft-non-normative"
      summary: Get one research-location
      description: Returns the registered record, or 404.
      parameters:
      - name: researchLocationDbId
        description: Namespaced research-location identity `{authority}:research-location:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ResearchLocation'
                required:
                - metadata
                - result
                title: ResearchLocationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - ResearchLocation
