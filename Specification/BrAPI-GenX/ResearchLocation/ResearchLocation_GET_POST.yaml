info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /research-locations:
    get:
      operationId: genxListResearchLocations
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.research-locations.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List research location records, optionally filtered by status."
        canBeUsedFor:
          - "Discover research-locations and funding references."
          - "Support research organization."
        mustNotBeUsedFor:
          - "Creating or changing a research-location (use the POST endpoint)."
          - "Assuming a research-location is a BrAPI Study."
          - "Treating the list as a complete research-location catalogue."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterResearchLocation"
          - "genxGetResearchLocation"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-100"]
        proposalStatus: "draft-non-normative"
      summary: List research-locations
      description: Get a paged list of research-location and funding reference records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ResearchLocationListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ResearchLocation
    post:
      operationId: genxRegisterResearchLocation
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.research-locations.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one research location record with provenance."
        canBeUsedFor:
          - "Publish a research-location or funding reference."
          - "Retry an identical record safely using the same researchLocationDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a research-location is a BrAPI Study."
          - "Asserting that the research-location is validated or endorsed."
        sideEffects: "Creates a research location identity or appends a new immutable version when accepted."
        idempotency: "Same researchLocationDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListResearchLocations"
          - "genxGetResearchLocation"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-100"]
        proposalStatus: "draft-non-normative"
      summary: Register one research-location
      description: |-
        Unknown researchLocationDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchLocationNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ResearchLocation'
                required:
                - metadata
                - result
                title: ResearchLocationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ResearchLocation
components:
  responses:
    ResearchLocationListResponse:
      content:
        application/json:
          schema:
            title: ResearchLocationListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResearchLocation'
            required:
            - metadata
            - result
      description: OK
