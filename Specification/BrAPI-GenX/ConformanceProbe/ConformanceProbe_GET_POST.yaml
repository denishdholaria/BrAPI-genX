info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /conformance-probes:
    get:
      operationId: genxListConformanceProbes
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.conformance-probes.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List conformance probe records, optionally filtered by status."
        canBeUsedFor:
          - "Discover conformance probes."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterConformanceProbe"
          - "genxGetConformanceProbe"
          - "genxRegisterFarm"
        decisions: ["RFC-155"]
        proposalStatus: "draft-non-normative"
      summary: List conformance probe
      description: Get a paged list of conformance probe records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ConformanceProbeListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ConformanceProbe
    post:
      operationId: genxRegisterConformanceProbe
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.conformance-probes.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one conformance probe record with provenance."
        canBeUsedFor:
          - "Publish a conformance probe."
          - "Retry an identical record safely using the same conformanceProbeDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a conformance probe identity or appends a new immutable version when accepted."
        idempotency: "Same conformanceProbeDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListConformanceProbes"
          - "genxGetConformanceProbe"
          - "genxRegisterFarm"
        decisions: ["RFC-155"]
        proposalStatus: "draft-non-normative"
      summary: Register one conformance probe
      description: Register one conformance probe record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConformanceProbeNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ConformanceProbe'
                required:
                - metadata
                - result
                title: ConformanceProbeResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ConformanceProbe
components:
  responses:
    ConformanceProbeListResponse:
      content:
        application/json:
          schema:
            title: ConformanceProbeListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConformanceProbe'
            required:
            - metadata
            - result
      description: OK