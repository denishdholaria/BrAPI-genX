info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /irrigation-operations/{irrigationEventDbId}:
    get:
      operationId: genxGetIrrigation
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.irrigation-operations.get"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one recorded irrigation event."
        canBeUsedFor:
          - "Inspect irrigation volume, duration, and provenance."
        mustNotBeUsedFor:
          - "Assuming the event is a BrAPI Location."
          - "Treating a superseded event as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordIrrigation"
          - "genxListIrrigations"
        decisions: ["RFC-024"]
        proposalStatus: "draft-non-normative"
      summary: Get one irrigation event
      description: Returns the recorded event, or 404.
      parameters:
      - name: irrigationEventDbId
        description: Namespaced irrigation-event identity `{authority}:irrigation-event:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/IrrigationEvent'
                required:
                - metadata
                - result
                title: IrrigationEventResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - IrrigationOperation