info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /analysis-results/{analysisResultDbId}:
    get:
      operationId: genxGetAnalysisResult
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.analysis-results.get"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one analysis result."
        canBeUsedFor:
          - "Inspect result payload, method, and provenance."
        mustNotBeUsedFor:
          - "Assuming the result is a BrAPI data resource."
          - "Treating a superseded result as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordAnalysisResult"
          - "genxListAnalysisResults"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-045"]
        proposalStatus: "draft-non-normative"
      summary: Get one analysis result
      description: Returns the recorded result, or 404.
      parameters:
      - name: analysisResultDbId
        description: Namespaced analysis-result identity `{authority}:analysis-result:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/AnalysisResult'
                required:
                - metadata
                - result
                title: AnalysisResultResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - AnalysisResult