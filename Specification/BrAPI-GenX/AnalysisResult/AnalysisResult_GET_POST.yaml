info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /analysis-results:
    get:
      operationId: genxListAnalysisResults
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.analysis-results.list"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List analysis result records, optionally filtered by method, study, or status."
        canBeUsedFor:
          - "Discover analysis results for a study or method."
          - "Support scientific reproducibility and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a result (use the POST endpoint)."
          - "Assuming a result is a BrAPI data resource."
          - "Treating the list as a complete analysis repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordAnalysisResult"
          - "genxGetAnalysisResult"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-045"]
        proposalStatus: "draft-non-normative"
      summary: List analysis results
      description: Get a paged list of analysis results across authorities. Filters combine with AND.
      parameters:
      - name: analysisMethodDbId
        description: Filter by GenX AnalysisMethod
        in: query
        required: false
        schema:
          type: string
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/AnalysisResultListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - AnalysisResult
    post:
      operationId: genxRecordAnalysisResult
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.analysis-results.record"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one analysis result with method, job, and provenance."
        canBeUsedFor:
          - "Publish analysis result metadata and payload references."
          - "Retry an identical result safely using the same analysisResultDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing result; corrections require a new record that supersedes."
          - "Assuming the result is a BrAPI data resource."
          - "Treating the result as scientific validation or approval."
        sideEffects: "Creates an analysis result when accepted."
        idempotency: "Same analysisResultDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListAnalysisResults"
          - "genxGetAnalysisResult"
          - "genxRegisterAnalysisMethod"
          - "genxSubmitAsyncJob"
        decisions: ["RFC-045"]
        proposalStatus: "draft-non-normative"
      summary: Record one analysis result
      description: |-
        Unknown analysisResultDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisResultNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/AnalysisResult'
                required:
                - metadata
                - result
                title: AnalysisResultResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - AnalysisResult
components:
  responses:
    AnalysisResultListResponse:
      content:
        application/json:
          schema:
            title: AnalysisResultListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalysisResult'
            required:
            - metadata
            - result
      description: OK