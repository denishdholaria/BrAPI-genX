info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /climate-normals/{climateNormalDbId}:
    get:
      operationId: genxGetClimateNormal
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.climate-normals.get"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one climate normal."
        canBeUsedFor:
          - "Inspect mean/min/max and provenance."
        mustNotBeUsedFor:
          - "Assuming the normal is a BrAPI Location."
          - "Treating a superseded normal as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterClimateNormal"
          - "genxListClimateNormals"
        decisions: ["RFC-033"]
        proposalStatus: "draft-non-normative"
      summary: Get one climate normal
      description: Returns the registered normal, or 404.
      parameters:
      - name: climateNormalDbId
        description: Namespaced climate-normal identity `{authority}:climate-normal:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ClimateNormal'
                required:
                - metadata
                - result
                title: ClimateNormalResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - ClimateNormals