info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /emissions:
    get:
      operationId: genxListEmissions
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.emissions.list"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List emissions records, optionally filtered by site or status."
        canBeUsedFor:
          - "Discover greenhouse gas emissions for a site or period."
          - "Support sustainability reporting and carbon accounting."
        mustNotBeUsedFor:
          - "Creating or changing an emissions record (use the POST endpoint)."
          - "Assuming an emissions record is a BrAPI Observation."
          - "Treating the list as a complete emissions inventory."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterEmissions"
          - "genxGetEmissions"
          - "genxRecordCarbonStock"
        decisions: ["RFC-076"]
        proposalStatus: "draft-non-normative"
      summary: List emissions records
      description: Get a paged list of emissions records across authorities. Filters combine with AND.
      parameters:
      - name: siteDbId
        description: Filter by site or location reference
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/EmissionsListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Emissions
    post:
      operationId: genxRegisterEmissions
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.emissions.record"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one emissions record with site linkage, period, and provenance."
        canBeUsedFor:
          - "Publish greenhouse gas emissions for a site or period."
          - "Retry an identical record safely using the same emissionsDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming an emissions record is a BrAPI Observation."
          - "Asserting that the emissions are validated or certified."
        sideEffects: "Creates an emissions identity or appends a new immutable version when accepted."
        idempotency: "Same emissionsDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListEmissions"
          - "genxGetEmissions"
          - "genxRecordCarbonStock"
        decisions: ["RFC-076"]
        proposalStatus: "draft-non-normative"
      summary: Register one emissions record
      description: |-
        Unknown emissionsDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmissionsNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/Emissions'
                required:
                - metadata
                - result
                title: EmissionsResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Emissions
components:
  responses:
    EmissionsListResponse:
      content:
        application/json:
          schema:
            title: EmissionsListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Emissions'
            required:
            - metadata
            - result
      description: OK
