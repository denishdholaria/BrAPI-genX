info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /emissions/{emissionsDbId}:
    get:
      operationId: genxGetEmissions
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.emissions.get"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one emissions record."
        canBeUsedFor:
          - "Inspect site linkage, period, emissions quantity, and provenance."
        mustNotBeUsedFor:
          - "Assuming an emissions record is a BrAPI Observation."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterEmissions"
          - "genxListEmissions"
          - "genxRecordCarbonStock"
        decisions: ["RFC-076"]
        proposalStatus: "draft-non-normative"
      summary: Get one emissions record
      description: Returns the registered record, or 404.
      parameters:
      - name: emissionsDbId
        description: Namespaced emissions identity `{authority}:emissions:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/Emissions'
                required:
                - metadata
                - result
                title: EmissionsResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - Emissions
