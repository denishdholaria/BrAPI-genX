info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /soil-profiles:
    get:
      operationId: genxListSoilProfiles
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.soil-profiles.list"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List soil profiles, optionally filtered by location or status."
        canBeUsedFor:
          - "Discover soil conditions for a location."
          - "Support agronomy and crop model inputs."
        mustNotBeUsedFor:
          - "Creating or changing a profile (use the POST endpoint)."
          - "Assuming a profile is a BrAPI Location."
          - "Treating the list as a complete soil survey."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterSoilProfile"
          - "genxGetSoilProfile"
        decisions: ["RFC-023"]
        proposalStatus: "draft-non-normative"
      summary: List soil profiles
      description: Get a paged list of soil profiles across authorities. Filters combine with AND.
      parameters:
      - name: locationDbId
        description: Filter by BrAPI Location
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/SoilProfileListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SoilProfile
    post:
      operationId: genxRegisterSoilProfile
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.soil-profiles.register"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register a soil profile with texture, chemistry, moisture, and provenance."
        canBeUsedFor:
          - "Publish soil profile metadata."
          - "Create a new version under an existing profile identity."
        mustNotBeUsedFor:
          - "Updating or deleting an existing profile; corrections require a new record that supersedes."
          - "Assuming the profile is a BrAPI Location."
          - "Treating the profile as a complete soil survey."
        sideEffects: "Creates a profile identity or appends a new immutable version when accepted."
        idempotency: "Same profile identity and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListSoilProfiles"
          - "genxGetSoilProfile"
        decisions: ["RFC-023"]
        proposalStatus: "draft-non-normative"
      summary: Register one soil profile
      description: |-
        Unknown soilProfileDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoilProfileNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/SoilProfile'
                required:
                - metadata
                - result
                title: SoilProfileResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - SoilProfile
components:
  responses:
    SoilProfileListResponse:
      content:
        application/json:
          schema:
            title: SoilProfileListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SoilProfile'
            required:
            - metadata
            - result
      description: OK