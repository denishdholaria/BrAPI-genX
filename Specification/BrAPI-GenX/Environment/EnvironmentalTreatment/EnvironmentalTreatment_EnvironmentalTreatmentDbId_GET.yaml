info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /environmental-treatments/{environmentalTreatmentDbId}:
    get:
      operationId: genxGetEnvironmentalTreatment
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.environmental-treatments.get"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one environmental treatment or stress exposure record."
        canBeUsedFor:
          - "Inspect site linkage, treatment type, exposure, and provenance."
        mustNotBeUsedFor:
          - "Assuming a record is a BrAPI Observation."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterEnvironmentalTreatment"
          - "genxListEnvironmentalTreatments"
          - "genxRecordExtremeWeather"
        decisions: ["RFC-078"]
        proposalStatus: "draft-non-normative"
      summary: Get one environmental treatment record
      description: Returns the registered record, or 404.
      parameters:
      - name: environmentalTreatmentDbId
        description: Namespaced environmental-treatment identity `{authority}:environmental-treatment:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/EnvironmentalTreatment'
                required:
                - metadata
                - result
                title: EnvironmentalTreatmentResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - EnvironmentalTreatment
