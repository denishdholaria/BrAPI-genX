info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /water-balances/{waterBalanceDbId}:
    get:
      operationId: genxGetWaterBalance
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.water-balances.get"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one water balance record."
        canBeUsedFor:
          - "Inspect period components and provenance."
        mustNotBeUsedFor:
          - "Assuming the record is a BrAPI data resource."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordWaterBalance"
          - "genxListWaterBalances"
          - "genxRegisterCropCycle"
        decisions: ["RFC-068"]
        proposalStatus: "draft-non-normative"
      summary: Get one water balance record
      description: Returns the recorded balance period, or 404.
      parameters:
      - name: waterBalanceDbId
        description: Namespaced water-balance identity `{authority}:water-balance:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/WaterBalance'
                required:
                - metadata
                - result
                title: WaterBalanceResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - WaterBalance