info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /water-balances:
    get:
      operationId: genxListWaterBalances
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.water-balances.list"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List water balance records, optionally filtered by study, location, or status."
        canBeUsedFor:
          - "Discover water balance periods for a study or location."
          - "Support irrigation planning and water accounting."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete water budget."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordWaterBalance"
          - "genxGetWaterBalance"
          - "genxRegisterCropCycle"
        decisions: ["RFC-068"]
        proposalStatus: "draft-non-normative"
      summary: List water balances
      description: Get a paged list of water balance records across authorities. Filters combine with AND.
      parameters:
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: locationDbId
        description: Filter by BrAPI Location
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/WaterBalanceListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - WaterBalance
    post:
      operationId: genxRecordWaterBalance
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.water-balances.record"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one water balance period with components and provenance."
        canBeUsedFor:
          - "Publish a water balance period for water accounting."
          - "Retry an identical record safely using the same waterBalanceDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming the record is a BrAPI data resource."
          - "Treating a record as measured irrigation advice or a water right."
        sideEffects: "Creates a water balance record when accepted."
        idempotency: "Same waterBalanceDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListWaterBalances"
          - "genxGetWaterBalance"
          - "genxRegisterCropCycle"
        decisions: ["RFC-068"]
        proposalStatus: "draft-non-normative"
      summary: Record one water balance period
      description: |-
        Unknown waterBalanceDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaterBalanceNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/WaterBalance'
                required:
                - metadata
                - result
                title: WaterBalanceResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - WaterBalance
components:
  responses:
    WaterBalanceListResponse:
      content:
        application/json:
          schema:
            title: WaterBalanceListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WaterBalance'
            required:
            - metadata
            - result
      description: OK