info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /carbon-stocks/{carbonStockDbId}:
    get:
      operationId: genxGetCarbonStock
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.carbon-stocks.get"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one carbon stock record."
        canBeUsedFor:
          - "Inspect pool, stock, depth, and provenance."
        mustNotBeUsedFor:
          - "Assuming the record is a BrAPI data resource."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordCarbonStock"
          - "genxListCarbonStocks"
          - "genxRegisterSoilProfile"
        decisions: ["RFC-067"]
        proposalStatus: "draft-non-normative"
      summary: Get one carbon stock record
      description: Returns the recorded measurement, or 404.
      parameters:
      - name: carbonStockDbId
        description: Namespaced carbon-stock identity `{authority}:carbon-stock:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CarbonStock'
                required:
                - metadata
                - result
                title: CarbonStockResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - CarbonStock