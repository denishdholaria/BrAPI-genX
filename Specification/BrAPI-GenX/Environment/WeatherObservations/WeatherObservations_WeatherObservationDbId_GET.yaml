info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /weather-observations/{weatherObservationDbId}:
    get:
      operationId: genxGetWeatherObservation
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.weather-observations.get"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C7", "C9"]
        purpose: "Retrieve one recorded weather/environmental observation."
        canBeUsedFor:
          - "Inspect measured environmental conditions and their provenance."
        mustNotBeUsedFor:
          - "Assuming the observation is a BrAPI scientific Observation."
          - "Treating a superseded observation as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordWeatherObservation"
          - "genxListWeatherObservations"
          - "genxQueryTelemetrySamplesOrAggregates"
        decisions: ["RFC-010"]
        proposalStatus: "draft-non-normative"
      summary: Get one weather observation
      description: Returns the recorded observation, or 404.
      parameters:
      - name: weatherObservationDbId
        description: Namespaced weather-observation identity `{authority}:weather-observation:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/WeatherObservation'
                required:
                - metadata
                - result
                title: WeatherObservationResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - WeatherObservations