info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    SoilChemistryNewRequest:
      type: object
      description: |-
        Request to register one soil texture, chemistry, and moisture record.
        Unknown soilChemistryDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      required:
      - soilChemistryDbId
      properties:
        soilChemistryDbId:
          description: Namespaced soil-chemistry identity `{authority}:soil-chemistry:{localId}`
          type: string
          example: institute-a:soil-chemistry:sc-2026-001
        siteDbId:
          description: Site or location reference
          type: string
          example: site-001
        texture:
          description: Soil texture class
          type: string
          example: loam
        chemistry:
          description: Soil chemistry measurements
          type: object
          example: {pH: 6.5, organicCarbon: 1.2}
        moistureDepthCm:
          description: Depth of moisture measurement in centimetres
          type: number
          example: 30
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: soilChemistryDbId of the record this one replaces
          type: string
          example: institute-a:soil-chemistry:sc-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
