info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    SoilChemistry:
      type: object
      description: |-
        One immutable soil texture, chemistry, and moisture record. A
        published (soilChemistryDbId) record never mutates in place;
        corrections are recorded as additional records linked by supersedes.
      required:
      - soilChemistryDbId
      - status
      properties:
        soilChemistryDbId:
          description: Namespaced soil-chemistry identity `{authority}:soil-chemistry:{localId}`
          type: string
          example: institute-a:soil-chemistry:sc-2026-001
        siteDbId:
          description: Site or location reference
          type: string
          example: site-001
        texture:
          description: Soil texture class
          type: string
          example: loam
        chemistry:
          description: Soil chemistry measurements
          type: object
          example: {pH: 6.5, organicCarbon: 1.2}
        moistureDepthCm:
          description: Depth of moisture measurement in centimetres
          type: number
          example: 30
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: soilChemistryDbId of the record this one replaces
          type: string
          example: institute-a:soil-chemistry:sc-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
