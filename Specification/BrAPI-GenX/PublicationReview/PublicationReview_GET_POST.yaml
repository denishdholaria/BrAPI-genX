info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /publication-reviews:
    get:
      operationId: genxListPublicationReviews
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.publication-reviews.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List publication review records, optionally filtered by status."
        canBeUsedFor:
          - "Discover publication reviews."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterPublicationReview"
          - "genxGetPublicationReview"
          - "genxRegisterFarm"
        decisions: ["RFC-120"]
        proposalStatus: "draft-non-normative"
      summary: List publication reviews
      description: Get a paged list of publication review records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/PublicationReviewListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - PublicationReview
    post:
      operationId: genxRegisterPublicationReview
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.publication-reviews.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one publication review record with provenance."
        canBeUsedFor:
          - "Publish a publication review."
          - "Retry an identical record safely using the same publicationReviewDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a publication review identity or appends a new immutable version when accepted."
        idempotency: "Same publicationReviewDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListPublicationReviews"
          - "genxGetPublicationReview"
          - "genxRegisterFarm"
        decisions: ["RFC-120"]
        proposalStatus: "draft-non-normative"
      summary: Register one publication review
      description: Register one publication review record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationReviewNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/PublicationReview'
                required:
                - metadata
                - result
                title: PublicationReviewResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - PublicationReview
components:
  responses:
    PublicationReviewListResponse:
      content:
        application/json:
          schema:
            title: PublicationReviewListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicationReview'
            required:
            - metadata
            - result
      description: OK