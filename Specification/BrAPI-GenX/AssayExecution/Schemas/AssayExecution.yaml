info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    AssayExecution:
      type: object
      description: |-
        One immutable assay execution record. A published
        (assayExecutionDbId) record never mutates in place; corrections are
        recorded as additional records linked by supersedes.
      required:
      - assayExecutionDbId
      - status
      properties:
        assayExecutionDbId:
          description: Namespaced assay-execution identity `{authority}:assay-execution:{localId}`
          type: string
          example: institute-a:assay-execution:ae-2026-001
        assayDbId:
          description: Assay design reference
          type: string
          example: assay-001
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: assayExecutionDbId of the record this one replaces
          type: string
          example: institute-a:assay-execution:ae-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
