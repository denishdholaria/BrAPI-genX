info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /doubled-haploid-programs:
    get:
      operationId: genxListDoubledHaploidPrograms
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.doubled-haploid-programs.list"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List doubled haploid programs, optionally filtered by program or status."
        canBeUsedFor:
          - "Discover doubled haploid programs and their counts."
          - "Support breeding program planning and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a program (use the POST endpoint)."
          - "Assuming a program is a BrAPI Program."
          - "Treating the list as a complete breeding program record."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterDoubledHaploidProgram"
          - "genxGetDoubledHaploidProgram"
        decisions: ["RFC-020"]
        proposalStatus: "draft-non-normative"
      summary: List doubled haploid programs
      description: Get a paged list of doubled haploid programs across authorities. Filters combine with AND.
      parameters:
      - name: programDbId
        description: Filter by BrAPI Program (breeding program)
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - completed
          - superseded
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/DoubledHaploidProgramListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - DoubledHaploid
    post:
      operationId: genxRegisterDoubledHaploidProgram
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.doubled-haploid-programs.register"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register a doubled haploid program with method, donor, counts, and provenance."
        canBeUsedFor:
          - "Publish doubled haploid program metadata."
          - "Create a new version under an existing program identity."
        mustNotBeUsedFor:
          - "Updating or deleting an existing program; corrections require a new record that supersedes."
          - "Assuming the program is a BrAPI Program."
          - "Treating the program as an approved breeding plan."
        sideEffects: "Creates a program identity or appends a new immutable version when accepted."
        idempotency: "Same program identity and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListDoubledHaploidPrograms"
          - "genxGetDoubledHaploidProgram"
        decisions: ["RFC-020"]
        proposalStatus: "draft-non-normative"
      summary: Register one doubled haploid program
      description: |-
        Unknown doubledHaploidProgramDbId creates; same id with an identical
        body replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoubledHaploidProgramNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/DoubledHaploidProgram'
                required:
                - metadata
                - result
                title: DoubledHaploidProgramResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - DoubledHaploid
components:
  responses:
    DoubledHaploidProgramListResponse:
      content:
        application/json:
          schema:
            title: DoubledHaploidProgramListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DoubledHaploidProgram'
            required:
            - metadata
            - result
      description: OK