info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /yield-forecasts:
    get:
      operationId: genxListYieldForecasts
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.yield-forecasts.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List yield forecast records, optionally filtered by status."
        canBeUsedFor:
          - "Discover yield forecasts."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterYieldForecast"
          - "genxGetYieldForecast"
          - "genxRegisterFarm"
        decisions: ["RFC-134"]
        proposalStatus: "draft-non-normative"
      summary: List yield forecasts
      description: Get a paged list of yield forecast records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/YieldForecastListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - YieldForecast
    post:
      operationId: genxRegisterYieldForecast
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.yield-forecasts.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one yield forecast record with provenance."
        canBeUsedFor:
          - "Publish a yield forecast."
          - "Retry an identical record safely using the same yieldForecastDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a yield forecast identity or appends a new immutable version when accepted."
        idempotency: "Same yieldForecastDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListYieldForecasts"
          - "genxGetYieldForecast"
          - "genxRegisterFarm"
        decisions: ["RFC-134"]
        proposalStatus: "draft-non-normative"
      summary: Register one yield forecast
      description: Register one yield forecast record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YieldForecastNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/YieldForecast'
                required:
                - metadata
                - result
                title: YieldForecastResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - YieldForecast
components:
  responses:
    YieldForecastListResponse:
      content:
        application/json:
          schema:
            title: YieldForecastListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/YieldForecast'
            required:
            - metadata
            - result
      description: OK