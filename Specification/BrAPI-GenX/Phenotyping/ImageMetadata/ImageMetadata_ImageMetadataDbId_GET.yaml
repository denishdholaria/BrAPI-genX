info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /image-metadata/{imageMetadataDbId}:
    get:
      operationId: genxGetImageMetadata
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.image-metadata.get"
        classification:
          primaryDomain: "D4"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one image metadata record."
        canBeUsedFor:
          - "Inspect capture details and provenance."
        mustNotBeUsedFor:
          - "Assuming metadata is a BrAPI Image."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterImageMetadata"
          - "genxListImageMetadata"
        decisions: ["RFC-032"]
        proposalStatus: "draft-non-normative"
      summary: Get one image metadata
      description: Returns the registered metadata, or 404.
      parameters:
      - name: imageMetadataDbId
        description: Namespaced image-metadata identity `{authority}:image-metadata:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ImageMetadata'
                required:
                - metadata
                - result
                title: ImageMetadataResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - ImageMetadata