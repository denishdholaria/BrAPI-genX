info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /image-metadata:
    get:
      operationId: genxListImageMetadata
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.image-metadata.list"
        classification:
          primaryDomain: "D4"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List image metadata records, optionally filtered by study, observation unit, or status."
        canBeUsedFor:
          - "Discover image metadata for a study or observation unit."
          - "Support phenotyping and image analysis workflows."
        mustNotBeUsedFor:
          - "Creating or changing metadata (use the POST endpoint)."
          - "Assuming metadata is a BrAPI Image."
          - "Treating the list as a complete image repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterImageMetadata"
          - "genxGetImageMetadata"
        decisions: ["RFC-032"]
        proposalStatus: "draft-non-normative"
      summary: List image metadata
      description: Get a paged list of image metadata records across authorities. Filters combine with AND.
      parameters:
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: observationUnitDbId
        description: Filter by BrAPI Observation Unit
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ImageMetadataListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ImageMetadata
    post:
      operationId: genxRegisterImageMetadata
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.image-metadata.register"
        classification:
          primaryDomain: "D4"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register image metadata with capture details and provenance."
        canBeUsedFor:
          - "Publish image capture metadata."
          - "Create a new version under an existing image metadata identity."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming metadata is a BrAPI Image."
          - "Treating metadata as a complete image repository."
        sideEffects: "Creates an image metadata identity or appends a new immutable version when accepted."
        idempotency: "Same identity and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListImageMetadata"
          - "genxGetImageMetadata"
        decisions: ["RFC-032"]
        proposalStatus: "draft-non-normative"
      summary: Register one image metadata
      description: |-
        Unknown imageMetadataDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageMetadataNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ImageMetadata'
                required:
                - metadata
                - result
                title: ImageMetadataResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ImageMetadata
components:
  responses:
    ImageMetadataListResponse:
      content:
        application/json:
          schema:
            title: ImageMetadataListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImageMetadata'
            required:
            - metadata
            - result
      description: OK