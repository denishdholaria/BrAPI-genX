info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /quality-flags/{qualityFlagDbId}:
    get:
      operationId: genxGetQualityFlag
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.quality-flags.get"
        classification:
          primaryDomain: "D4"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one quality flag record."
        canBeUsedFor:
          - "Inspect flag, status, and provenance."
        mustNotBeUsedFor:
          - "Assuming a record is a BrAPI Observation."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterQualityFlag"
          - "genxListQualityFlags"
          - "genxRegisterFarm"
        decisions: ["RFC-111"]
        proposalStatus: "draft-non-normative"
      summary: Get one quality flag
      description: Returns the registered record, or 404.
      parameters:
      - name: qualityFlagDbId
        description: Namespaced quality-flags identity `{authority}:quality-flags:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/QualityFlag'
                required:
                - metadata
                - result
                title: QualityFlagResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - QualityFlag
