info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /quality-flags:
    get:
      operationId: genxListQualityFlags
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.quality-flags.list"
        classification:
          primaryDomain: "D4"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List quality flag records, optionally filtered by status."
        canBeUsedFor:
          - "Discover quality flags."
          - "Support phenotyping quality flags."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI Observation."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterQualityFlag"
          - "genxGetQualityFlag"
          - "genxRegisterFarm"
        decisions: ["RFC-111"]
        proposalStatus: "draft-non-normative"
      summary: List quality flags
      description: Get a paged list of quality flag records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/QualityFlagListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - QualityFlag
    post:
      operationId: genxRegisterQualityFlag
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.quality-flags.record"
        classification:
          primaryDomain: "D4"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one quality flag record with provenance."
        canBeUsedFor:
          - "Publish a quality flag."
          - "Retry an identical record safely using the same qualityFlagDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI Observation."
          - "Asserting that the work order is completed or validated."
        sideEffects: "Creates a quality flag identity or appends a new immutable version when accepted."
        idempotency: "Same qualityFlagDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListQualityFlags"
          - "genxGetQualityFlag"
          - "genxRegisterFarm"
        decisions: ["RFC-111"]
        proposalStatus: "draft-non-normative"
      summary: Register one quality flag
      description: |-
        Unknown qualityFlagDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityFlagNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/QualityFlag'
                required:
                - metadata
                - result
                title: QualityFlagResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - QualityFlag
components:
  responses:
    QualityFlagListResponse:
      content:
        application/json:
          schema:
            title: QualityFlagListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QualityFlag'
            required:
            - metadata
            - result
      description: OK
