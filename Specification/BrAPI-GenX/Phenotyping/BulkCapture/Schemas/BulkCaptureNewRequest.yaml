info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    BulkCaptureNewRequest:
      type: object
      description: |-
        Request to record one bulk capture. Unknown bulkCaptureDbId
        creates; same id with an identical body replays the existing
        record; same id with a different body is rejected with 409.
      required:
      - bulkCaptureDbId
      - studyDbId
      - capturedAt
      - entries
      properties:
        bulkCaptureDbId:
          description: Namespaced bulk-capture identity `{authority}:bulk-capture:{localId}`
          type: string
          example: institute-a:bulk-capture:bc-2026-001
        studyDbId:
          description: BrAPI Study / trial context
          type: string
          example: institute-a:study:yield-trial-2026
        capturedAt:
          description: Timestamp of the capture (ISO-8601)
          type: string
          format: date-time
          example: '2026-10-24T08:00:00Z'
        entries:
          description: Captured observation entries with quality and missingness
          type: array
          items:
            type: object
            required:
            - variableDbId
            properties:
              observationUnitDbId:
                description: BrAPI Observation Unit
                type: string
                example: institute-a:observationunit:ou-42
              variableDbId:
                description: BrAPI Observation Variable or GenX VariableTerm identifier
                type: string
                example: institute-a:variable:grain-yield
              value:
                description: Observed value (null when missing)
                type: number
                nullable: true
                example: 4.2
              unit:
                description: Unit of measure
                type: string
                example: t_per_hectare
              qualityFlag:
                description: Quality status of the entry
                type: string
                enum:
                - valid
                - suspect
                - invalid
                - missing
                default: valid
                example: valid
        status:
          description: Lifecycle state of the capture record
          type: string
          enum:
          - active
          - superseded
          default: active
          example: active
        supersedes:
          description: bulkCaptureDbId of the capture this one replaces
          type: string
          example: institute-a:bulk-capture:bc-2026-000
        provenance:
          description: Evidence and method provenance for the capture
          $ref: '#/components/schemas/ProvenanceEnvelope'