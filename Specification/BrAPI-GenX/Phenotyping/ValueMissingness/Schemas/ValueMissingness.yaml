info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    ValueMissingness:
      type: object
      description: |-
        One immutable value and missingness record. A published
        (valueMissingnessDbId) record never mutates in place; corrections
        are recorded as additional records linked by supersedes.
      required:
      - valueMissingnessDbId
      - status
      properties:
        valueMissingnessDbId:
          description: Namespaced value-missingness identity `{authority}:value-missingness:{localId}`
          type: string
          example: institute-a:value-missingness:vm-2026-001
        value:
          description: Observed value
          type: string
          example: 12.5
        missing:
          description: Whether the value is missing
          type: boolean
          example: false
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: valueMissingnessDbId of the record this one replaces
          type: string
          example: institute-a:value-missingness:vm-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
