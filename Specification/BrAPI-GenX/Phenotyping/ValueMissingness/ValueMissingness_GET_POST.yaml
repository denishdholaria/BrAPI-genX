info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /value-missingness:
    get:
      operationId: genxListValueMissingness
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.value-missingness.list"
        classification:
          primaryDomain: "D4"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List value and missingness records, optionally filtered by status."
        canBeUsedFor:
          - "Discover value and missingness records."
          - "Support phenotyping value and missingness."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI Observation."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterValueMissingness"
          - "genxGetValueMissingness"
          - "genxRegisterFarm"
        decisions: ["RFC-112"]
        proposalStatus: "draft-non-normative"
      summary: List value and missingness
      description: Get a paged list of value and missingness records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ValueMissingnessListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ValueMissingness
    post:
      operationId: genxRegisterValueMissingness
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.value-missingness.record"
        classification:
          primaryDomain: "D4"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one value and missingness record with provenance."
        canBeUsedFor:
          - "Publish a value and missingness record."
          - "Retry an identical record safely using the same valueMissingnessDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI Observation."
          - "Asserting that the work order is completed or validated."
        sideEffects: "Creates a value and missingness identity or appends a new immutable version when accepted."
        idempotency: "Same valueMissingnessDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListValueMissingness"
          - "genxGetValueMissingness"
          - "genxRegisterFarm"
        decisions: ["RFC-112"]
        proposalStatus: "draft-non-normative"
      summary: Register one value and missingness
      description: |-
        Unknown valueMissingnessDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueMissingnessNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ValueMissingness'
                required:
                - metadata
                - result
                title: ValueMissingnessResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ValueMissingness
components:
  responses:
    ValueMissingnessListResponse:
      content:
        application/json:
          schema:
            title: ValueMissingnessListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValueMissingness'
            required:
            - metadata
            - result
      description: OK
