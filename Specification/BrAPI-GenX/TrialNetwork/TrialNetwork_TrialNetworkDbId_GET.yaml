info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /trial-networks/{trialNetworkDbId}:
    get:
      operationId: genxGetTrialNetwork
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.trial-networks.get"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one trial network or MET design record."
        canBeUsedFor:
          - "Inspect field linkage, trial-network identity, status, and provenance."
        mustNotBeUsedFor:
          - "Assuming a record is a BrAPI Observation."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterTrialNetwork"
          - "genxListTrialNetworks"
          - "genxRegisterFarm"
        decisions: ["RFC-109"]
        proposalStatus: "draft-non-normative"
      summary: Get one trial-network
      description: Returns the registered record, or 404.
      parameters:
      - name: trialNetworkDbId
        description: Namespaced trial-networks identity `{authority}:trial-networks:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/TrialNetwork'
                required:
                - metadata
                - result
                title: TrialNetworkResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - TrialNetwork
