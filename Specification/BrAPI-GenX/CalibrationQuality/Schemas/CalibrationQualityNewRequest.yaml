info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    CalibrationQualityNewRequest:
      type: object
      description: |-
        Request to register one calibration quality record. Unknown calibrationQualityDbId
        creates; same id with an identical body replays the existing record;
        same id with a different body is rejected with 409.
      required:
      - calibrationQualityDbId
      properties:
        calibrationQualityDbId:
          description: Namespaced calibration-quality identity `{authority}:calibration-quality:{localId}`
          type: string
          example: institute-a:calibration-quality:cq-2026-001
        sensorDeviceReference:
          description: Reference to sensor device
          type: string
          example: institute-a:sensor-device:sd-2026-001
        calibrationType:
          description: Type of calibration
          type: string
          example: radiometric
        calibrationDate:
          description: Calibration date
          type: string
          example: "2026-05-01"
        calibrationFactor:
          description: Calibration factor
          type: string
          example: "1.05"
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: calibrationQualityDbId of the record this one replaces
          type: string
          example: institute-a:calibration-quality:cq-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
