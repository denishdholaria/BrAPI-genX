info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /edge-gateway-healths:
    get:
      operationId: genxListEdgeGatewayHealths
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.edge-gateway-healths.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List edge gateway health records, optionally filtered by status."
        canBeUsedFor:
          - "Discover edge gateway healths."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterEdgeGatewayHealth"
          - "genxGetEdgeGatewayHealth"
          - "genxRegisterFarm"
        decisions: ["RFC-151"]
        proposalStatus: "draft-non-normative"
      summary: List edge gateway health
      description: Get a paged list of edge gateway health records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/EdgeGatewayHealthListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - EdgeGatewayHealth
    post:
      operationId: genxRegisterEdgeGatewayHealth
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.edge-gateway-healths.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one edge gateway health record with provenance."
        canBeUsedFor:
          - "Publish a edge gateway health."
          - "Retry an identical record safely using the same edgeGatewayHealthDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a edge gateway health identity or appends a new immutable version when accepted."
        idempotency: "Same edgeGatewayHealthDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListEdgeGatewayHealths"
          - "genxGetEdgeGatewayHealth"
          - "genxRegisterFarm"
        decisions: ["RFC-151"]
        proposalStatus: "draft-non-normative"
      summary: Register one edge gateway health
      description: Register one edge gateway health record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeGatewayHealthNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/EdgeGatewayHealth'
                required:
                - metadata
                - result
                title: EdgeGatewayHealthResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - EdgeGatewayHealth
components:
  responses:
    EdgeGatewayHealthListResponse:
      content:
        application/json:
          schema:
            title: EdgeGatewayHealthListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EdgeGatewayHealth'
            required:
            - metadata
            - result
      description: OK