info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /treatment-assignments:
    get:
      operationId: genxListTreatmentAssignments
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.treatment-assignments.list"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List treatment assignment records, optionally filtered by field or status."
        canBeUsedFor:
          - "Discover treatment assignments for a field."
          - "Support experimental design."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI Observation."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterTreatmentAssignment"
          - "genxGetTreatmentAssignment"
          - "genxRegisterFarm"
        decisions: ["RFC-106"]
        proposalStatus: "draft-non-normative"
      summary: List treatment assignments
      description: Get a paged list of treatment assignment records across authorities. Filters combine with AND.
      parameters:
      - name: fieldDbId
        description: Filter by field or site reference
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/TreatmentAssignmentListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - TreatmentAssignment
    post:
      operationId: genxRegisterTreatmentAssignment
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.treatment-assignments.record"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one treatment assignment record with field linkage and provenance."
        canBeUsedFor:
          - "Publish a treatment assignment for a field."
          - "Retry an identical record safely using the same treatmentAssignmentDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI Observation."
          - "Asserting that the work order is completed or validated."
        sideEffects: "Creates a treatment assignment identity or appends a new immutable version when accepted."
        idempotency: "Same treatmentAssignmentDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListTreatmentAssignments"
          - "genxGetTreatmentAssignment"
          - "genxRegisterFarm"
        decisions: ["RFC-106"]
        proposalStatus: "draft-non-normative"
      summary: Register one treatment assignment
      description: |-
        Unknown treatmentAssignmentDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreatmentAssignmentNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/TreatmentAssignment'
                required:
                - metadata
                - result
                title: TreatmentAssignmentResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - TreatmentAssignment
components:
  responses:
    TreatmentAssignmentListResponse:
      content:
        application/json:
          schema:
            title: TreatmentAssignmentListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TreatmentAssignment'
            required:
            - metadata
            - result
      description: OK
