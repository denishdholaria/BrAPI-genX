info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    DuplicateReviewNewRequest:
      type: object
      description: |-
        Request to register one duplicate review record. Unknown
        duplicateReviewDbId creates; same id with an identical body replays
        the existing record; same id with a different body is rejected with 409.
      required:
      - duplicateReviewDbId
      properties:
        duplicateReviewDbId:
          description: Namespaced duplicate-review identity `{authority}:duplicate-review:{localId}`
          type: string
          example: institute-a:duplicate-review:dr-2026-001
        candidateDbId:
          description: Candidate germplasm or accession reference
          type: string
          example: acc-001
        decision:
          description: Review decision
          type: string
          example: confirmed-duplicate
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: duplicateReviewDbId of the record this one replaces
          type: string
          example: institute-a:duplicate-review:dr-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
