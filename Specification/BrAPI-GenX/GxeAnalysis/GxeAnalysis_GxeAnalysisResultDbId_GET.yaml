info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /gxe-analyses/{gxeAnalysisResultDbId}:
    get:
      operationId: genxGetGxeAnalysis
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.gxe-analyses.get"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one GxE analysis result."
        canBeUsedFor:
          - "Inspect interaction effect and provenance."
        mustNotBeUsedFor:
          - "Assuming the result is a BrAPI data resource."
          - "Treating a superseded result as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordGxeAnalysis"
          - "genxListGxeAnalyses"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-051"]
        proposalStatus: "draft-non-normative"
      summary: Get one GxE analysis
      description: Returns the recorded result, or 404.
      parameters:
      - name: gxeAnalysisResultDbId
        description: Namespaced GxE-analysis-result identity `{authority}:gxe-analysis-result:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/GxeAnalysisResult'
                required:
                - metadata
                - result
                title: GxeAnalysisResultResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - GxeAnalysis