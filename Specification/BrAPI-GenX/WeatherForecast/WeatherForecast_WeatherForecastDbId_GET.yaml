info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /weather-forecasts/{weatherForecastDbId}:
    get:
      operationId: genxGetWeatherForecast
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.weather-forecasts.get"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C7", "C9"]
        purpose: "Retrieve one weather forecast."
        canBeUsedFor:
          - "Inspect predicted conditions and provenance."
        mustNotBeUsedFor:
          - "Assuming the forecast is a BrAPI Location."
          - "Treating a superseded forecast as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterWeatherForecast"
          - "genxListWeatherForecasts"
        decisions: ["RFC-031"]
        proposalStatus: "draft-non-normative"
      summary: Get one weather forecast
      description: Returns the registered forecast, or 404.
      parameters:
      - name: weatherForecastDbId
        description: Namespaced weather-forecast identity `{authority}:weather-forecast:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/WeatherForecast'
                required:
                - metadata
                - result
                title: WeatherForecastResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - WeatherForecast