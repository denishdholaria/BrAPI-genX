info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /capability-metadata/{capabilityMetadataDbId}:
    get:
      operationId: genxGetCapabilityMetadata
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.capability-metadata.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one capability metadata record."
        canBeUsedFor:
          - "Inspect capability metadata and provenance."
        mustNotBeUsedFor:
          - "Assuming metadata is a BrAPI Study."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCapabilityMetadata"
          - "genxListCapabilityMetadata"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-099"]
        proposalStatus: "draft-non-normative"
      summary: Get one capability metadata
      description: Returns the registered record, or 404.
      parameters:
      - name: capabilityMetadataDbId
        description: Namespaced capability-metadata identity `{authority}:capability-metadata:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CapabilityMetadata'
                required:
                - metadata
                - result
                title: CapabilityMetadataResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - CapabilityMetadata
