info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /capability-metadata:
    get:
      operationId: genxListCapabilityMetadata
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.capability-metadata.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List capability metadata records, optionally filtered by status."
        canBeUsedFor:
          - "Discover capability metadata."
          - "Support capability negotiation."
        mustNotBeUsedFor:
          - "Creating or changing a capability-metadata (use the POST endpoint)."
          - "Assuming metadata is a BrAPI Study."
          - "Treating the list as a complete catalogue."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCapabilityMetadata"
          - "genxGetCapabilityMetadata"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-099"]
        proposalStatus: "draft-non-normative"
      summary: List capability-metadata
      description: Get a paged list of capability metadata records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/CapabilityMetadataListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CapabilityMetadata
    post:
      operationId: genxRegisterCapabilityMetadata
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.capability-metadata.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one capability metadata record with provenance."
        canBeUsedFor:
          - "Publish capability metadata."
          - "Retry an identical record safely using the same capabilityMetadataDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming metadata is a BrAPI Study."
          - "Asserting that the record is validated or endorsed."
        sideEffects: "Creates a capability metadata identity or appends a new immutable version when accepted."
        idempotency: "Same capabilityMetadataDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListCapabilityMetadata"
          - "genxGetCapabilityMetadata"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-099"]
        proposalStatus: "draft-non-normative"
      summary: Register one capability-metadata
      description: |-
        Unknown capabilityMetadataDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityMetadataNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CapabilityMetadata'
                required:
                - metadata
                - result
                title: CapabilityMetadataResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CapabilityMetadata
components:
  responses:
    CapabilityMetadataListResponse:
      content:
        application/json:
          schema:
            title: CapabilityMetadataListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CapabilityMetadata'
            required:
            - metadata
            - result
      description: OK
