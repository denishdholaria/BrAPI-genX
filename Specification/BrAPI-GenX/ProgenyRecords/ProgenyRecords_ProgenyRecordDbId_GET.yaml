info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /progeny-records/{progenyRecordDbId}:
    get:
      operationId: genxGetProgenyRecord
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.progeny-records.get"
        classification:
          primaryDomain: "D2"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one recorded progeny/family link."
        canBeUsedFor:
          - "Inspect progeny, parents, generation, and provenance."
        mustNotBeUsedFor:
          - "Assuming the record is a BrAPI Pedigree or Cross."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordProgeny"
          - "genxListProgenyRecords"
        decisions: ["RFC-019"]
        proposalStatus: "draft-non-normative"
      summary: Get one progeny record
      description: Returns the recorded progeny, or 404.
      parameters:
      - name: progenyRecordDbId
        description: Namespaced progeny-record identity `{authority}:progeny-record:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ProgenyRecord'
                required:
                - metadata
                - result
                title: ProgenyRecordResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - ProgenyRecords