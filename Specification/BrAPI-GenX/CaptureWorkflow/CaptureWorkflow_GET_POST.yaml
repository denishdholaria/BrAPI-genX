info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /capture-workflows:
    get:
      operationId: genxListCaptureWorkflows
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.capture-workflows.list"
        classification:
          primaryDomain: "D4"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List capture workflow records, optionally filtered by status."
        canBeUsedFor:
          - "Discover capture workflows."
          - "Support phenotyping capture workflow."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI Observation."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCaptureWorkflow"
          - "genxGetCaptureWorkflow"
          - "genxRegisterFarm"
        decisions: ["RFC-110"]
        proposalStatus: "draft-non-normative"
      summary: List capture workflows
      description: Get a paged list of capture workflow records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/CaptureWorkflowListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CaptureWorkflow
    post:
      operationId: genxRegisterCaptureWorkflow
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.capture-workflows.record"
        classification:
          primaryDomain: "D4"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one capture workflow record with provenance."
        canBeUsedFor:
          - "Publish a capture workflow."
          - "Retry an identical record safely using the same captureWorkflowDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI Observation."
          - "Asserting that the work order is completed or validated."
        sideEffects: "Creates a capture workflow identity or appends a new immutable version when accepted."
        idempotency: "Same captureWorkflowDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListCaptureWorkflows"
          - "genxGetCaptureWorkflow"
          - "genxRegisterFarm"
        decisions: ["RFC-110"]
        proposalStatus: "draft-non-normative"
      summary: Register one capture workflow
      description: |-
        Unknown captureWorkflowDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureWorkflowNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/CaptureWorkflow'
                required:
                - metadata
                - result
                title: CaptureWorkflowResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - CaptureWorkflow
components:
  responses:
    CaptureWorkflowListResponse:
      content:
        application/json:
          schema:
            title: CaptureWorkflowListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaptureWorkflow'
            required:
            - metadata
            - result
      description: OK
