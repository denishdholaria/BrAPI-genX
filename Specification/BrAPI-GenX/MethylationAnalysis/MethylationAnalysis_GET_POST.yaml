info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /methylation-analyses:
    get:
      operationId: genxListMethylationAnalyses
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.methylation-analyses.list"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List methylation analysis result records, optionally filtered by method, study, or status."
        canBeUsedFor:
          - "Discover methylation analysis results for a study or method."
          - "Support scientific reproducibility and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a result (use the POST endpoint)."
          - "Assuming a result is a BrAPI data resource."
          - "Treating the list as a complete analysis repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordMethylationAnalysis"
          - "genxGetMethylationAnalysis"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-057"]
        proposalStatus: "draft-non-normative"
      summary: List methylation analysis results
      description: Get a paged list of methylation analysis results across authorities. Filters combine with AND.
      parameters:
      - name: analysisMethodDbId
        description: Filter by GenX AnalysisMethod
        in: query
        required: false
        schema:
          type: string
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/MethylationAnalysisListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - MethylationAnalysis
    post:
      operationId: genxRecordMethylationAnalysis
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.methylation-analyses.record"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one methylation analysis result with regions and provenance."
        canBeUsedFor:
          - "Publish methylation analysis result metadata and payload references."
          - "Retry an identical result safely using the same methylationAnalysisDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing result; corrections require a new record that supersedes."
          - "Assuming the result is a BrAPI data resource."
          - "Treating the result as scientific validation or approval."
        sideEffects: "Creates a methylation analysis result when accepted."
        idempotency: "Same methylationAnalysisDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListMethylationAnalyses"
          - "genxGetMethylationAnalysis"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-057"]
        proposalStatus: "draft-non-normative"
      summary: Record one methylation analysis result
      description: |-
        Unknown methylationAnalysisDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MethylationAnalysisNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/MethylationAnalysis'
                required:
                - metadata
                - result
                title: MethylationAnalysisResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - MethylationAnalysis
components:
  responses:
    MethylationAnalysisListResponse:
      content:
        application/json:
          schema:
            title: MethylationAnalysisListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MethylationAnalysis'
            required:
            - metadata
            - result
      description: OK