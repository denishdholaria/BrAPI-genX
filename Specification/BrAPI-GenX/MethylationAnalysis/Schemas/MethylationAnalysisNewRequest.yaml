info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    MethylationAnalysisNewRequest:
      type: object
      description: |-
        Request to record one methylation analysis result. Unknown methylationAnalysisDbId
        creates; same id with an identical body replays the existing
        record; same id with a different body is rejected with 409.
      required:
      - methylationAnalysisDbId
      - analysisMethodDbId
      properties:
        methylationAnalysisDbId:
          description: Namespaced methylation-analysis identity `{authority}:methylation-analysis:{localId}`
          type: string
          example: institute-a:methylation-analysis:ma-2026-001
        analysisMethodDbId:
          description: GenX AnalysisMethod used
          type: string
          example: institute-a:analysis-method:methylation
        jobDbId:
          description: GenX Job that produced this result
          type: string
          example: institute-a:job:analysis-7
        studyDbId:
          description: BrAPI Study / trial context, when applicable
          type: string
          example: institute-a:study:yield-trial-2026
        regions:
          description: Methylation regions or sites
          type: object
          example: {chr1: {start: 100, end: 200, level: 0.8}}
        status:
          description: Lifecycle state of the result record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: methylationAnalysisDbId of the result this one replaces
          type: string
          example: institute-a:methylation-analysis:ma-2026-000
        provenance:
          description: Evidence and method provenance for the result
          $ref: '#/components/schemas/ProvenanceEnvelope'