info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths:
  /variable-terms/{variableDbId}:
    get:
      operationId: genxGetVariableTermVersion
      summary: Get a versioned observation-variable term
      description: Returns the requested version, or the most recently created version when `version` is omitted. Version ordering semantics are requires-decision (see RFC-002 §5).
      parameters:
      - name: variableDbId
        description: Namespaced term identity `{authority}:{type}:{localId}`
        in: path
        required: true
        schema:
          type: string
      - name: version
        description: Term version to fetch
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/VariableTerm'
                required:
                - metadata
                - result
                title: VariableTermResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - VariableTerms
