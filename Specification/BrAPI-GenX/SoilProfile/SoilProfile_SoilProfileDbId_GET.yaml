info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /soil-profiles/{soilProfileDbId}:
    get:
      operationId: genxGetSoilProfile
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.soil-profiles.get"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one soil profile."
        canBeUsedFor:
          - "Inspect soil texture, chemistry, moisture, and provenance."
        mustNotBeUsedFor:
          - "Assuming the profile is a BrAPI Location."
          - "Treating a superseded profile as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterSoilProfile"
          - "genxListSoilProfiles"
        decisions: ["RFC-023"]
        proposalStatus: "draft-non-normative"
      summary: Get one soil profile
      description: Returns the registered profile, or 404.
      parameters:
      - name: soilProfileDbId
        description: Namespaced soil-profile identity `{authority}:soil-profile:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/SoilProfile'
                required:
                - metadata
                - result
                title: SoilProfileResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - SoilProfile