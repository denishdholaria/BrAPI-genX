info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths:
  /telemetry:
    get:
      operationId: genxQueryTelemetrySamplesOrAggregates
      x-brapi-den:
        catalogId: "brapi-den.genx.v3.telemetry.query"
        classification:
          primaryDomain: null
          contextualDomains: ["D4", "D5"]
          crossCuttingCapabilities: ["C1", "C2", "C3", "C7", "C9"]
        purpose: "Read device/sensor samples in timestamp order or calculate deterministic aggregates over a requested time range."
        canBeUsedFor:
          - "Retrieve raw telemetry for a device and optional sensor over a time interval."
          - "Calculate mean, minimum, maximum, or count aggregates in defined windows."
          - "Use an inclusive from timestamp and exclusive to timestamp."
        mustNotBeUsedFor:
          - "Automatically converting every telemetry sample into a BrAPI Observation."
          - "Assuming implicit links to a study, observation unit, or observation variable."
          - "Assuming unspecified gap-filling, resampling, or timezone-of-record behavior."
        sideEffects: "Read-only; aggregates are calculated from stored samples."
        idempotency: "Read-only for an unchanged stored dataset and query; deterministic aggregation rules apply to the same sample set and range."
        semanticNeighbors:
          - "SEM-03"
        decisions: ["RFC-007", "D-16", "D-17", "D-18"]
        proposalStatus: "draft-non-normative"
      summary: Read samples or aggregates over a time range
      description: |-
        Points are returned in timestamp order. With aggregation set,
        TelemetryBucket rows are returned instead, computed deterministically
        over windowSeconds buckets (default: one bucket over the whole
        range). Empty ranges yield empty data, never an error.
      parameters:
      - name: deviceDbId
        description: Device to read
        in: query
        required: true
        schema:
          type: string
      - name: sensorDbId
        description: Sensor to read
        in: query
        required: false
        schema:
          type: string
      - name: from
        description: Inclusive range start. Follows Date/Time Encoding.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        description: Exclusive range end. Follows Date/Time Encoding.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: aggregation
        description: Aggregate function, or none for raw points
        in: query
        required: false
        schema:
          type: string
          enum:
          - none
          - mean
          - min
          - max
          - count
          default: none
      - name: windowSeconds
        description: Bucket width for aggregates. Must be a positive integer.
        in: query
        required: false
        schema:
          type: integer
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          oneOf:
                          - $ref: '#/components/schemas/TelemetryPoint'
                          - $ref: '#/components/schemas/TelemetryBucket'
                    required:
                    - data
                required:
                - metadata
                - result
                title: TelemetryListResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Telemetry
    post:
      operationId: genxAppendTelemetryBatch
      x-brapi-den:
        catalogId: "brapi-den.genx.v3.telemetry.append-batch"
        classification:
          primaryDomain: null
          contextualDomains: ["D4", "D5"]
          crossCuttingCapabilities: ["C1", "C2", "C3", "C7", "C9"]
        purpose: "Append a batch of timestamped device/sensor samples while reporting newly appended, replayed, and conflicting elements."
        canBeUsedFor:
          - "Ingest sample batches from field or laboratory sensors."
          - "Retry identical samples without duplicating stored points."
          - "Reject conflicting values for an already-used device/sensor/timestamp key without discarding unrelated valid batch elements."
        mustNotBeUsedFor:
          - "Replacing existing samples silently."
          - "Assuming the batch is all-or-nothing; conflicts are handled element-wise."
          - "Treating telemetry as a complete observation record or assuming all samples are environmental."
        sideEffects: "Appends non-conflicting new points; reports duplicate replays and per-element conflicts."
        idempotency: "Natural key is deviceDbId + sensorDbId + timestamp. Same key and value replays; same key with a different value conflicts."
        semanticNeighbors:
          - "SEM-03"
        decisions: ["RFC-007", "D-16", "D-17", "D-18"]
        proposalStatus: "draft-non-normative"
      summary: Append a batch of samples
      description: |-
        Takes an array of TelemetryPoint (V2.1 batch style). Reports
        appended, replayed, and conflicts counts with the conflicting keys.
        Conflicting elements reject the element, never the batch.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TelemetryPoint'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/TelemetryBatchResult'
                required:
                - metadata
                - result
                title: TelemetryBatchResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Telemetry
components:
  schemas:
    TelemetryBatchResult:
      type: object
      description: Ingest counts for one batch. Conflicts name rejected natural keys; they never fail siblings.
      required:
      - appended
      - replayed
      - conflicts
      properties:
        appended:
          description: New points stored
          type: integer
          example: 2
        replayed:
          description: Points already stored with identical values
          type: integer
          example: 1
        conflicts:
          description: Natural keys rejected for disagreeing with stored values
          type: array
          items:
            type: string
          example: ['station-04/air-temp-01/2026-09-07T08:02:00Z']
