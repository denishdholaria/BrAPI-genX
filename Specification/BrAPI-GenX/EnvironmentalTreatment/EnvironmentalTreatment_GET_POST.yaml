info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /environmental-treatments:
    get:
      operationId: genxListEnvironmentalTreatments
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.environmental-treatments.list"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List environmental treatment and stress exposure records, optionally filtered by site or status."
        canBeUsedFor:
          - "Discover environmental treatments and stress exposures for a site."
          - "Support climate and stress analysis."
        mustNotBeUsedFor:
          - "Creating or changing a treatment record (use the POST endpoint)."
          - "Assuming a record is a BrAPI Observation."
          - "Treating the list as a complete treatment history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterEnvironmentalTreatment"
          - "genxGetEnvironmentalTreatment"
          - "genxRecordExtremeWeather"
        decisions: ["RFC-078"]
        proposalStatus: "draft-non-normative"
      summary: List environmental treatments
      description: Get a paged list of environmental treatment and stress exposure records across authorities. Filters combine with AND.
      parameters:
      - name: siteDbId
        description: Filter by site or location reference
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/EnvironmentalTreatmentListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - EnvironmentalTreatment
    post:
      operationId: genxRegisterEnvironmentalTreatment
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.environmental-treatments.record"
        classification:
          primaryDomain: "D5"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one environmental treatment or stress exposure record with site linkage and provenance."
        canBeUsedFor:
          - "Publish environmental treatments and stress exposures for a site."
          - "Retry an identical record safely using the same environmentalTreatmentDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI Observation."
          - "Asserting that the treatment is validated or effective."
        sideEffects: "Creates an environmental treatment identity or appends a new immutable version when accepted."
        idempotency: "Same environmentalTreatmentDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListEnvironmentalTreatments"
          - "genxGetEnvironmentalTreatment"
          - "genxRecordExtremeWeather"
        decisions: ["RFC-078"]
        proposalStatus: "draft-non-normative"
      summary: Register one environmental treatment record
      description: |-
        Unknown environmentalTreatmentDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentalTreatmentNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/EnvironmentalTreatment'
                required:
                - metadata
                - result
                title: EnvironmentalTreatmentResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - EnvironmentalTreatment
components:
  responses:
    EnvironmentalTreatmentListResponse:
      content:
        application/json:
          schema:
            title: EnvironmentalTreatmentListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnvironmentalTreatment'
            required:
            - metadata
            - result
      description: OK
