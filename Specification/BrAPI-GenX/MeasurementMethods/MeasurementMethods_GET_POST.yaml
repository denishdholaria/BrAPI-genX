info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /measurement-methods:
    get:
      operationId: genxListMeasurementMethods
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.measurement-methods.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "List measurement method definitions, optionally filtered by type or status."
        canBeUsedFor:
          - "Discover measurement methods and their procedures."
          - "Support terminology and method governance."
        mustNotBeUsedFor:
          - "Creating or changing a method (use the POST endpoint)."
          - "Assuming a method is a BrAPI Method or Scale."
          - "Treating the list as a complete method catalogue."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterMeasurementMethod"
          - "genxGetMeasurementMethod"
        decisions: ["RFC-017"]
        proposalStatus: "draft-non-normative"
      summary: List measurement methods
      description: Get a paged list of measurement methods across authorities. Filters combine with AND.
      parameters:
      - name: methodType
        description: Filter by method class
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - deprecated
          - superseded
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/MeasurementMethodListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - MeasurementMethods
    post:
      operationId: genxRegisterMeasurementMethod
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.measurement-methods.register"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C4", "C9"]
        purpose: "Register a measurement method with procedure, equipment, precision, and provenance."
        canBeUsedFor:
          - "Publish measurement method definitions."
          - "Create a new version under an existing method identity."
        mustNotBeUsedFor:
          - "Updating or deleting an existing method; corrections require a new record that supersedes."
          - "Assuming the method is a BrAPI Method."
          - "Treating the method as an approved protocol."
        sideEffects: "Creates a method identity or appends a new immutable version when accepted."
        idempotency: "Same method identity and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListMeasurementMethods"
          - "genxGetMeasurementMethod"
        decisions: ["RFC-017"]
        proposalStatus: "draft-non-normative"
      summary: Register one measurement method
      description: |-
        Unknown measurementMethodDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementMethodNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/MeasurementMethod'
                required:
                - metadata
                - result
                title: MeasurementMethodResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - MeasurementMethods
components:
  responses:
    MeasurementMethodListResponse:
      content:
        application/json:
          schema:
            title: MeasurementMethodListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MeasurementMethod'
            required:
            - metadata
            - result
      description: OK