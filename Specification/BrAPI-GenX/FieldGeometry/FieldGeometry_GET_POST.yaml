info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /field-geometries:
    get:
      operationId: genxListFieldGeometries
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.field-geometries.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List field geometry records, optionally filtered by status."
        canBeUsedFor:
          - "Discover field geometrys."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterFieldGeometry"
          - "genxGetFieldGeometry"
          - "genxRegisterFarm"
        decisions: ["RFC-142"]
        proposalStatus: "draft-non-normative"
      summary: List field geometries
      description: Get a paged list of field geometry records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/FieldGeometryListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - FieldGeometry
    post:
      operationId: genxRegisterFieldGeometry
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.field-geometries.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one field geometry record with provenance."
        canBeUsedFor:
          - "Publish a field geometry."
          - "Retry an identical record safely using the same fieldGeometryDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a field geometry identity or appends a new immutable version when accepted."
        idempotency: "Same fieldGeometryDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListFieldGeometries"
          - "genxGetFieldGeometry"
          - "genxRegisterFarm"
        decisions: ["RFC-142"]
        proposalStatus: "draft-non-normative"
      summary: Register one field geometry
      description: Register one field geometry record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldGeometryNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/FieldGeometry'
                required:
                - metadata
                - result
                title: FieldGeometryResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - FieldGeometry
components:
  responses:
    FieldGeometryListResponse:
      content:
        application/json:
          schema:
            title: FieldGeometryListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FieldGeometry'
            required:
            - metadata
            - result
      description: OK