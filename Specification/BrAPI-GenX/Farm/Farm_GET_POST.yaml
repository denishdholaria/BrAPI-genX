info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /farms:
    get:
      operationId: genxListFarms
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.farms.list"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List farms, optionally filtered by location or status."
        canBeUsedFor:
          - "Discover farms associated with a location."
          - "Support agronomic planning and site reference."
        mustNotBeUsedFor:
          - "Creating or changing a farm (use the POST endpoint)."
          - "Assuming a farm is a BrAPI Location."
          - "Treating the list as a complete land inventory."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterFarm"
          - "genxGetFarm"
        decisions: ["RFC-069"]
        proposalStatus: "draft-non-normative"
      summary: List farms
      description: Get a paged list of farms across authorities. Filters combine with AND.
      parameters:
      - name: locationDbId
        description: Filter by BrAPI Location
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - completed
          - superseded
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/FarmListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Farm
    post:
      operationId: genxRegisterFarm
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.farms.register"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register a farm with site reference, area, and provenance."
        canBeUsedFor:
          - "Publish farm identity and site reference metadata."
          - "Create a new version under an existing farm identity."
        mustNotBeUsedFor:
          - "Updating or deleting an existing farm; corrections require a new record that supersedes."
          - "Assuming the farm is a BrAPI Location."
          - "Treating the farm as a cadastral survey or legal land title."
        sideEffects: "Creates a farm identity or appends a new immutable version when accepted."
        idempotency: "Same farm identity and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListFarms"
          - "genxGetFarm"
        decisions: ["RFC-069"]
        proposalStatus: "draft-non-normative"
      summary: Register one farm
      description: |-
        Unknown farmDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/Farm'
                required:
                - metadata
                - result
                title: FarmResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Farm
components:
  responses:
    FarmListResponse:
      content:
        application/json:
          schema:
            title: FarmListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Farm'
            required:
            - metadata
            - result
      description: OK