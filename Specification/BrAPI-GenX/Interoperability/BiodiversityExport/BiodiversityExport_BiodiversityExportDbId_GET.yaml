info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /biodiversity-exports/{biodiversityExportDbId}:
    get:
      operationId: genxGetBiodiversityExport
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.biodiversity-exports.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one biodiversity export record."
        canBeUsedFor:
          - "Inspect catalogue entries and provenance."
        mustNotBeUsedFor:
          - "Assuming a record is a BrAPI data resource."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterBiodiversityExport"
          - "genxListBiodiversityExports"
          - "genxRegisterResearchAsset"
        decisions: ["RFC-121"]
        proposalStatus: "draft-non-normative"
      summary: Get one biodiversity export
      description: Returns the registered record, or 404.
      parameters:
      - name: biodiversityExportDbId
        description: Namespaced biodiversity-exports identity `{authority}:biodiversity-exports:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/BiodiversityExport'
                required:
                - metadata
                - result
                title: BiodiversityExportResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - BiodiversityExport