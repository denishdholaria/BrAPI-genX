info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /fair-packages/{packageDbId}:
    get:
      operationId: genxGetFairPackageMetadata
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.fair-packages.get-metadata"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C5", "C6", "C9"]
        purpose: "Retrieve the metadata envelope for one FAIR package subject to the currently specified embargo gate."
        canBeUsedFor:
          - "Read package metadata when the access contract permits the request."
        mustNotBeUsedFor:
          - "Retrieving payload bytes."
          - "Assuming embargoed metadata remains visible: the current reference behavior denies the whole record with 403, while the preferred metadata-visible policy remains unresolved."
          - "Treating this endpoint as an access-request approval workflow."
        sideEffects: "Read-only; may deny the record while its payload is embargoed under the current proposal behavior."
        idempotency: "Read-only."
        semanticNeighbors:
          - "SEM-05"
        decisions: ["RFC-006", "D-15"]
        proposalStatus: "draft-non-normative"
      summary: Get one FAIR package (denied while embargoed)
      description: Returns the package metadata, or 404. While payloads are embargoed (embargoUntil in the future) the record is denied with 403 to prove the gate exists; the gentler metadata-visible alternative is requires-decision (see RFC-006 §5).
      parameters:
      - name: packageDbId
        description: Namespaced package identity `{authority}:package:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/FAIRPackage'
                required:
                - metadata
                - result
                title: FAIRPackageResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - FAIR Packages
