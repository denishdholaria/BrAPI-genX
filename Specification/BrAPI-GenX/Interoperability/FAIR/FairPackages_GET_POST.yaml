info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /fair-packages:
    get:
      operationId: genxListFairPackageMetadata
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.fair-packages.list-metadata"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C5", "C6", "C9"]
        purpose: "List FAIR package metadata with optional access-rights and license filters; the endpoint does not serve payload bytes."
        canBeUsedFor:
          - "Discover package citation, licensing, access-rights, embargo, and payload-reference metadata."
          - "Find packages by supported metadata filters."
        mustNotBeUsedFor:
          - "Downloading payload bytes or assuming the package service stores them."
          - "Minting Digital Object Identifiers (DOIs) or approving restricted-access requests."
          - "Assuming all embargo policies or metadata-visibility rules have been finalized."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "SEM-05"
        decisions: ["RFC-006", "D-13", "D-14", "D-15"]
        proposalStatus: "draft-non-normative"
      summary: List registered FAIR packages (metadata only)
      description: Get a paged list of package metadata across authorities. Filters combine with AND. Payload bytes are never served here.
      parameters:
      - name: accessRights
        description: Filter by access contract
        in: query
        required: false
        schema:
          type: string
          enum:
          - open
          - embargoed
          - restricted
      - name: license
        description: Filter by SPDX license expression
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/FAIRPackageListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - FAIR Packages
    post:
      operationId: genxRegisterFairPackage
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.fair-packages.register"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C5", "C6", "C9"]
        purpose: "Register an identified, licensed, access-controlled package envelope that binds one or more payload references into a citable metadata record."
        canBeUsedFor:
          - "Record a package title, identifiers, license, access rights, embargo, creators, and payload references."
          - "Publish a stable metadata envelope around data owned by another service."
        mustNotBeUsedFor:
          - "Uploading or storing the payload bytes."
          - "Minting persistent identifiers or running license negotiation."
          - "Implementing restricted-access approval workflows."
        sideEffects: "Creates package metadata if accepted."
        idempotency: "Identical registration replays; conflicting content under the same package identity is rejected."
        semanticNeighbors:
          - "SEM-05"
        decisions: ["RFC-006", "D-13", "D-14", "D-15"]
        proposalStatus: "draft-non-normative"
      summary: Register one FAIR package
      description: |-
        Unknown packageDbId creates; known id with an identical body replays
        the existing record; known id with a different body is rejected with
        409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FAIRPackageNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/FAIRPackage'
                required:
                - metadata
                - result
                title: FAIRPackageResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - FAIR Packages
components:
  responses:
    FAIRPackageListResponse:
      content:
        application/json:
          schema:
            title: FAIRPackageListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FAIRPackage'
            required:
            - metadata
            - result
      description: OK
