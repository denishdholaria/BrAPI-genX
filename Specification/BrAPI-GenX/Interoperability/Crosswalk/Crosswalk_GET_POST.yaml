info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /crosswalks:
    get:
      operationId: genxListCrosswalks
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crosswalks.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List crosswalk records, optionally filtered by status."
        canBeUsedFor:
          - "Discover crosswalks and funding references."
          - "Support crosswalks and reference data."
        mustNotBeUsedFor:
          - "Creating or changing a crosswalk (use the POST endpoint)."
          - "Assuming a crosswalk is a BrAPI Study."
          - "Treating the list as a complete crosswalk catalogue."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCrosswalk"
          - "genxGetCrosswalk"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-105"]
        proposalStatus: "draft-non-normative"
      summary: List crosswalks
      description: Get a paged list of crosswalk and funding reference records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/CrosswalkListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Crosswalk
    post:
      operationId: genxRegisterCrosswalk
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.crosswalks.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one crosswalk record with provenance."
        canBeUsedFor:
          - "Publish a crosswalk or funding reference."
          - "Retry an identical record safely using the same crosswalkDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a crosswalk is a BrAPI Study."
          - "Asserting that the crosswalk is validated or endorsed."
        sideEffects: "Creates a crosswalk identity or appends a new immutable version when accepted."
        idempotency: "Same crosswalkDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListCrosswalks"
          - "genxGetCrosswalk"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-105"]
        proposalStatus: "draft-non-normative"
      summary: Register one crosswalk
      description: |-
        Unknown crosswalkDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrosswalkNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/Crosswalk'
                required:
                - metadata
                - result
                title: CrosswalkResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Crosswalk
components:
  responses:
    CrosswalkListResponse:
      content:
        application/json:
          schema:
            title: CrosswalkListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Crosswalk'
            required:
            - metadata
            - result
      description: OK
