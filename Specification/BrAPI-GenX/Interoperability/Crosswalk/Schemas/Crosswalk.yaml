info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    Crosswalk:
      type: object
      description: |-
        One immutable crosswalk record. A published (crosswalkDbId) record
        never mutates in place; corrections are recorded as additional
        records linked by supersedes.
      required:
      - crosswalkDbId
      - status
      properties:
        crosswalkDbId:
          description: Namespaced crosswalk identity `{authority}:crosswalk:{localId}`
          type: string
          example: institute-a:crosswalk:cw-2026-001
        source:
          description: Source system
          type: string
          example: MCPD
        target:
          description: Target system
          type: string
          example: GenX
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: crosswalkDbId of the record this one replaces
          type: string
          example: institute-a:crosswalk:cw-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
