info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    CalendarNewRequest:
      type: object
      description: |-
        Request to register one calendar or time convention record. Unknown
        calendarDbId creates; same id with an identical body replays the
        existing record; same id with a different body is rejected with 409.
      required:
      - calendarDbId
      properties:
        calendarDbId:
          description: Namespaced calendar identity `{authority}:calendar:{localId}`
          type: string
          example: institute-a:calendar:cal-2026-001
        name:
          description: Calendar or convention name
          type: string
          example: Northern hemisphere growing season
        convention:
          description: Time convention details
          type: string
          example: ISO-8601
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: calendarDbId of the record this one replaces
          type: string
          example: institute-a:calendar:cal-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
