info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /calendars/{calendarDbId}:
    get:
      operationId: genxGetCalendar
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.calendars.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one calendar or time convention record."
        canBeUsedFor:
          - "Inspect calendar identity, convention, and provenance."
        mustNotBeUsedFor:
          - "Assuming a list is a BrAPI Study."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterCalendar"
          - "genxListCalendars"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-091"]
        proposalStatus: "draft-non-normative"
      summary: Get one calendar
      description: Returns the registered record, or 404.
      parameters:
      - name: calendarDbId
        description: Namespaced calendar identity `{authority}:calendar:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/Calendar'
                required:
                - metadata
                - result
                title: CalendarResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - Calendar
