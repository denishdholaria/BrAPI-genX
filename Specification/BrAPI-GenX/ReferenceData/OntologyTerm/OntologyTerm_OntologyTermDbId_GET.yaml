info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /ontology-terms/{ontologyTermDbId}:
    get:
      operationId: genxGetOntologyTerm
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.ontology-terms.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "Retrieve one ontology term or synonym entry."
        canBeUsedFor:
          - "Inspect term, synonyms, and provenance."
        mustNotBeUsedFor:
          - "Assuming an entry is a BrAPI Observation."
          - "Treating a superseded entry as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterOntologyTerm"
          - "genxListOntologyTerms"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-085"]
        proposalStatus: "draft-non-normative"
      summary: Get one ontology term
      description: Returns the registered entry, or 404.
      parameters:
      - name: ontologyTermDbId
        description: Namespaced ontology-term identity `{authority}:ontology-term:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/OntologyTermRecord'
                required:
                - metadata
                - result
                title: OntologyTermResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - OntologyTerm
