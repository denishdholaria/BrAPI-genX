info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /developmental-stages/{developmentalStageDbId}:
    get:
      operationId: genxGetDevelopmentalStage
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.developmental-stages.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "Retrieve one developmental stage vocabulary entry."
        canBeUsedFor:
          - "Inspect crop linkage, stage code, definition, and provenance."
        mustNotBeUsedFor:
          - "Assuming an entry is a BrAPI Observation."
          - "Treating a superseded entry as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterDevelopmentalStage"
          - "genxListDevelopmentalStages"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-079"]
        proposalStatus: "draft-non-normative"
      summary: Get one developmental stage
      description: Returns the registered entry, or 404.
      parameters:
      - name: developmentalStageDbId
        description: Namespaced developmental-stage identity `{authority}:developmental-stage:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/DevelopmentalStage'
                required:
                - metadata
                - result
                title: DevelopmentalStageResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - DevelopmentalStage
