info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    DevelopmentalStage:
      type: object
      description: |-
        One immutable developmental stage vocabulary entry. A published
        (developmentalStageDbId) record never mutates in place; corrections
        are recorded as additional entries linked by supersedes.
      required:
      - developmentalStageDbId
      - status
      properties:
        developmentalStageDbId:
          description: Namespaced developmental-stage identity `{authority}:developmental-stage:{localId}`
          type: string
          example: institute-a:developmental-stage:ds-2026-001
        cropDbId:
          description: Crop or germplasm reference
          type: string
          example: crop-001
        stageCode:
          description: Developmental stage code
          type: string
          example: BBCH-31
        stageName:
          description: Human-readable stage name
          type: string
          example: Stem elongation
        definition:
          description: Definition of the stage
          type: string
          example: First node visible
        status:
          description: Lifecycle state of the entry
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: developmentalStageDbId of the entry this one replaces
          type: string
          example: institute-a:developmental-stage:ds-2026-000
        provenance:
          description: Evidence and method provenance for the entry
          $ref: '#/components/schemas/ProvenanceEnvelope'
