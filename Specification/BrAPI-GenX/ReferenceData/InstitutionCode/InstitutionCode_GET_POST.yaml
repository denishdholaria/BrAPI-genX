info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /institution-codes:
    get:
      operationId: genxListInstitutionCodes
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.institution-codes.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "List institution and collection code entries, optionally filtered by status."
        canBeUsedFor:
          - "Discover institution and collection codes."
          - "Support reference data."
        mustNotBeUsedFor:
          - "Creating or changing an entry (use the POST endpoint)."
          - "Assuming an entry is a BrAPI Germplasm."
          - "Treating the list as a complete catalogue."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterInstitutionCode"
          - "genxGetInstitutionCode"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-096"]
        proposalStatus: "draft-non-normative"
      summary: List institution codes
      description: Get a paged list of institution and collection code entries across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/InstitutionCodeListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - InstitutionCode
    post:
      operationId: genxRegisterInstitutionCode
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.institution-codes.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C4", "C9"]
        purpose: "Register one institution and collection code entry with provenance."
        canBeUsedFor:
          - "Publish an institution code."
          - "Retry an identical entry safely using the same institutionCodeDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing entry; corrections require a new record that supersedes."
          - "Assuming an entry is a BrAPI Germplasm."
          - "Asserting that the entry is validated or endorsed."
        sideEffects: "Creates an institution code identity or appends a new immutable version when accepted."
        idempotency: "Same institutionCodeDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListInstitutionCodes"
          - "genxGetInstitutionCode"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-096"]
        proposalStatus: "draft-non-normative"
      summary: Register one institution code
      description: |-
        Unknown institutionCodeDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionCodeNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/InstitutionCode'
                required:
                - metadata
                - result
                title: InstitutionCodeResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - InstitutionCode
components:
  responses:
    InstitutionCodeListResponse:
      content:
        application/json:
          schema:
            title: InstitutionCodeListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstitutionCode'
            required:
            - metadata
            - result
      description: OK
