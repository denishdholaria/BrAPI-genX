info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /institution-codes/{institutionCodeDbId}:
    get:
      operationId: genxGetInstitutionCode
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.institution-codes.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "Retrieve one institution and collection code entry."
        canBeUsedFor:
          - "Inspect code, name, and provenance."
        mustNotBeUsedFor:
          - "Assuming an entry is a BrAPI Germplasm."
          - "Treating a superseded entry as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterInstitutionCode"
          - "genxListInstitutionCodes"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-096"]
        proposalStatus: "draft-non-normative"
      summary: Get one institution code
      description: Returns the registered entry, or 404.
      parameters:
      - name: institutionCodeDbId
        description: Namespaced institution-code identity `{authority}:institution-code:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/InstitutionCode'
                required:
                - metadata
                - result
                title: InstitutionCodeResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - InstitutionCode
