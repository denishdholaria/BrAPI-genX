info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /external-vocabularies:
    get:
      operationId: genxListExternalVocabularies
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.external-vocabularies.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "List external vocabulary sync entries, optionally filtered by status."
        canBeUsedFor:
          - "Discover external vocabulary sync entries."
          - "Support external vocabulary synchronization."
        mustNotBeUsedFor:
          - "Creating or changing a stage entry (use the POST endpoint)."
          - "Assuming a stage entry is a BrAPI Observation."
          - "Treating the list as a complete ontology."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterExternalVocabulary"
          - "genxGetExternalVocabulary"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-083"]
        proposalStatus: "draft-non-normative"
      summary: List external vocabularies
      description: Get a paged list of external vocabulary sync entries across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ExternalVocabularyListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ExternalVocabulary
    post:
      operationId: genxRegisterExternalVocabulary
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.external-vocabularies.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C4", "C9"]
        purpose: "Register one external vocabulary sync entry with provenance."
        canBeUsedFor:
          - "Publish an external vocabulary sync entry."
          - "Retry an identical entry safely using the same externalVocabularyDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing entry; corrections require a new record that supersedes."
          - "Assuming an entry is a BrAPI Observation."
          - "Asserting that the entry is validated or endorsed."
        sideEffects: "Creates an external vocabulary identity or appends a new immutable version when accepted."
        idempotency: "Same externalVocabularyDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListExternalVocabularies"
          - "genxGetExternalVocabulary"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-083"]
        proposalStatus: "draft-non-normative"
      summary: Register one external vocabulary
      description: |-
        Unknown externalVocabularyDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalVocabularyNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ExternalVocabulary'
                required:
                - metadata
                - result
                title: ExternalVocabularyResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ExternalVocabulary
components:
  responses:
    ExternalVocabularyListResponse:
      content:
        application/json:
          schema:
            title: ExternalVocabularyListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalVocabulary'
            required:
            - metadata
            - result
      description: OK
