info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /measurement-methods/{measurementMethodDbId}:
    get:
      operationId: genxGetMeasurementMethod
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.measurement-methods.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "Retrieve one registered measurement method."
        canBeUsedFor:
          - "Inspect method procedure, equipment, precision, and provenance."
        mustNotBeUsedFor:
          - "Assuming the method is a BrAPI Method."
          - "Treating a superseded method as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterMeasurementMethod"
          - "genxListMeasurementMethods"
        decisions: ["RFC-017"]
        proposalStatus: "draft-non-normative"
      summary: Get one measurement method
      description: Returns the registered method, or 404.
      parameters:
      - name: measurementMethodDbId
        description: Namespaced measurement-method identity `{authority}:measurement-method:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/MeasurementMethod'
                required:
                - metadata
                - result
                title: MeasurementMethodResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - MeasurementMethods