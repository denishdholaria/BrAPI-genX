info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /variable-terms/{variableDbId}:
    get:
      operationId: genxGetVariableTermVersion
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.variable-terms.get-version"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4"]
        purpose: "Retrieve a specific VariableTerm version, or the most recently created version when the version query parameter is omitted."
        canBeUsedFor:
          - "Resolve the exact term version referenced by a reproducible analysis when version is supplied."
          - "Read the latest-created version when no version is supplied."
        mustNotBeUsedFor:
          - "Assuming omitted-version lookup returns the highest semantic-version number; ordering semantics remain unresolved."
          - "Treating VariableTerm as the V2.1 OntologyTerm schema."
          - "Inferring cross-authority equivalence from a matching name."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxPublishVariableTermVersion"
          - "V2.1 OntologyTerm schema"
        decisions: ["RFC-002", "D-05", "D-06", "A-03"]
        proposalStatus: "draft-non-normative"
      summary: Get a versioned observation-variable term
      description: Returns the requested version, or the most recently created version when `version` is omitted. Version ordering semantics are requires-decision (see RFC-002 §5).
      parameters:
      - name: variableDbId
        description: Namespaced term identity `{authority}:{type}:{localId}`
        in: path
        required: true
        schema:
          type: string
      - name: version
        description: Term version to fetch
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/VariableTerm'
                required:
                - metadata
                - result
                title: VariableTermResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - VariableTerms
