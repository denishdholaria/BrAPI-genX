info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /ontology-mappings/{ontologyMappingDbId}:
    get:
      operationId: genxGetOntologyMapping
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.ontology-mappings.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "Retrieve one ontology mapping or crosswalk entry."
        canBeUsedFor:
          - "Inspect source, target, mapping, and provenance."
        mustNotBeUsedFor:
          - "Assuming an entry is a BrAPI Observation."
          - "Treating a superseded entry as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterOntologyMapping"
          - "genxListOntologyMappings"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-086"]
        proposalStatus: "draft-non-normative"
      summary: Get one ontology mapping
      description: Returns the registered entry, or 404.
      parameters:
      - name: ontologyMappingDbId
        description: Namespaced ontology-mapping identity `{authority}:ontology-mapping:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/OntologyMapping'
                required:
                - metadata
                - result
                title: OntologyMappingResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - OntologyMapping
