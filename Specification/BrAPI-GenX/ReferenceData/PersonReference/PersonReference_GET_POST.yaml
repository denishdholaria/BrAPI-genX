info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /person-references:
    get:
      operationId: genxListPersonReferences
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.person-references.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List person reference entries, optionally filtered by status."
        canBeUsedFor:
          - "Discover person references."
          - "Support reference data."
        mustNotBeUsedFor:
          - "Creating or changing an entry (use the POST endpoint)."
          - "Assuming an entry is a BrAPI Person."
          - "Treating the list as a complete catalogue."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterPersonReference"
          - "genxGetPersonReference"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-097"]
        proposalStatus: "draft-non-normative"
      summary: List person references
      description: Get a paged list of person reference entries across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/PersonReferenceListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - PersonReference
    post:
      operationId: genxRegisterPersonReference
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.person-references.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one person reference entry with provenance."
        canBeUsedFor:
          - "Publish a person reference."
          - "Retry an identical entry safely using the same personReferenceDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing entry; corrections require a new record that supersedes."
          - "Assuming an entry is a BrAPI Person."
          - "Asserting that the entry is validated or endorsed."
        sideEffects: "Creates a person reference identity or appends a new immutable version when accepted."
        idempotency: "Same personReferenceDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListPersonReferences"
          - "genxGetPersonReference"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-097"]
        proposalStatus: "draft-non-normative"
      summary: Register one person reference
      description: |-
        Unknown personReferenceDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonReferenceNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/PersonReference'
                required:
                - metadata
                - result
                title: PersonReferenceResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - PersonReference
components:
  responses:
    PersonReferenceListResponse:
      content:
        application/json:
          schema:
            title: PersonReferenceListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonReference'
            required:
            - metadata
            - result
      description: OK
