info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    CropSpeciesNewRequest:
      type: object
      description: |-
        Request to register one crop and species registry entry. Unknown
        cropSpeciesDbId creates; same id with an identical body replays the
        existing record; same id with a different body is rejected with 409.
      required:
      - cropSpeciesDbId
      properties:
        cropSpeciesDbId:
          description: Namespaced crop-species identity `{authority}:crop-species:{localId}`
          type: string
          example: institute-a:crop-species:cs-2026-001
        scientificName:
          description: Scientific name
          type: string
          example: Triticum aestivum
        cropName:
          description: Crop name
          type: string
          example: wheat
        status:
          description: Lifecycle state of the entry
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: cropSpeciesDbId of the entry this one replaces
          type: string
          example: institute-a:crop-species:cs-2026-000
        provenance:
          description: Evidence and method provenance for the entry
          $ref: '#/components/schemas/ProvenanceEnvelope'
