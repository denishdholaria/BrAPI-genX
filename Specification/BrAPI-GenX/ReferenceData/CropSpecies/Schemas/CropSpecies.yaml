info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    CropSpecies:
      type: object
      description: |-
        One immutable crop and species registry entry. A published
        (cropSpeciesDbId) record never mutates in place; corrections are
        recorded as additional entries linked by supersedes.
      required:
      - cropSpeciesDbId
      - status
      properties:
        cropSpeciesDbId:
          description: Namespaced crop-species identity `{authority}:crop-species:{localId}`
          type: string
          example: institute-a:crop-species:cs-2026-001
        scientificName:
          description: Scientific name
          type: string
          example: Triticum aestivum
        cropName:
          description: Crop name
          type: string
          example: wheat
        status:
          description: Lifecycle state of the entry
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: cropSpeciesDbId of the entry this one replaces
          type: string
          example: institute-a:crop-species:cs-2026-000
        provenance:
          description: Evidence and method provenance for the entry
          $ref: '#/components/schemas/ProvenanceEnvelope'
