info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /reference-data-versions:
    get:
      operationId: genxListReferenceDataVersions
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.reference-data-versions.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List reference data version records, optionally filtered by status."
        canBeUsedFor:
          - "Discover reference-data-versions and time conventions."
          - "Support reference data versioning."
        mustNotBeUsedFor:
          - "Creating or changing a list (use the POST endpoint)."
          - "Assuming a list is a BrAPI Study."
          - "Treating the list as a complete catalogue."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterReferenceDataVersion"
          - "genxGetReferenceDataVersion"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-093"]
        proposalStatus: "draft-non-normative"
      summary: List reference-data-versions
      description: Get a paged list of reference-data-version and time convention records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ReferenceDataVersionListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ReferenceDataVersion
    post:
      operationId: genxRegisterReferenceDataVersion
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.reference-data-versions.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one reference data version record with provenance."
        canBeUsedFor:
          - "Publish a reference-data-version or time convention."
          - "Retry an identical record safely using the same referenceDataVersionDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a list is a BrAPI Study."
          - "Asserting that the list is validated or endorsed."
        sideEffects: "Creates a reference data version identity or appends a new immutable version when accepted."
        idempotency: "Same referenceDataVersionDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListReferenceDataVersions"
          - "genxGetReferenceDataVersion"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-093"]
        proposalStatus: "draft-non-normative"
      summary: Register one reference-data-version
      description: |-
        Unknown referenceDataVersionDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceDataVersionNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ReferenceDataVersion'
                required:
                - metadata
                - result
                title: ReferenceDataVersionResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ReferenceDataVersion
components:
  responses:
    ReferenceDataVersionListResponse:
      content:
        application/json:
          schema:
            title: ReferenceDataVersionListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReferenceDataVersion'
            required:
            - metadata
            - result
      description: OK
