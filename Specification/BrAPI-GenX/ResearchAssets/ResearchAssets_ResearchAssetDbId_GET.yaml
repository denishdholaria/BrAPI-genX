info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /research-assets/{researchAssetDbId}:
    get:
      operationId: genxGetResearchAsset
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.research-assets.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C5", "C6", "C9"]
        purpose: "Retrieve one registered research asset."
        canBeUsedFor:
          - "Inspect asset metadata, license, access policy, and provenance."
        mustNotBeUsedFor:
          - "Assuming the asset is a BrAPI data resource."
          - "Treating a withdrawn asset as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterResearchAsset"
          - "genxListResearchAssets"
          - "genxRegisterFairPackage"
        decisions: ["RFC-016"]
        proposalStatus: "draft-non-normative"
      summary: Get one research asset
      description: Returns the registered asset, or 404.
      parameters:
      - name: researchAssetDbId
        description: Namespaced research-asset identity `{authority}:research-asset:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ResearchAsset'
                required:
                - metadata
                - result
                title: ResearchAssetResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - ResearchAssets