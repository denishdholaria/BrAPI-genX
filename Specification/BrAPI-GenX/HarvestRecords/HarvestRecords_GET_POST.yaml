info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /harvest-records:
    get:
      operationId: genxListHarvestRecords
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.harvest-records.list"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List harvest-event records, optionally filtered by study, location, germplasm, or date range."
        canBeUsedFor:
          - "Discover harvest outcomes for a study or location."
          - "Support yield tracking and seed-lot linkage."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a harvest record is a BrAPI SeedLot transaction."
          - "Treating the list as a complete yield forecast."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordHarvest"
          - "genxGetHarvestRecord"
        decisions: ["RFC-011"]
        proposalStatus: "draft-non-normative"
      summary: List harvest records
      description: Get a paged list of harvest records across authorities. Filters combine with AND.
      parameters:
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: locationDbId
        description: Filter by BrAPI Location
        in: query
        required: false
        schema:
          type: string
      - name: germplasmDbId
        description: Filter by BrAPI Germplasm
        in: query
        required: false
        schema:
          type: string
      - name: harvestedFrom
        description: Start of harvest time range (ISO-8601)
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: harvestedTo
        description: End of harvest time range (ISO-8601)
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/HarvestRecordListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - HarvestRecords
    post:
      operationId: genxRecordHarvest
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.harvest-records.record"
        classification:
          primaryDomain: "D6"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one harvest event with quantity, quality, and provenance."
        canBeUsedFor:
          - "Record a harvest event for a study, location, and germplasm."
          - "Retry an identical record safely using the same harvestRecordDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming the record is a BrAPI SeedLot transaction."
          - "Treating the record as a yield forecast or prediction."
        sideEffects: "Creates a harvest record when accepted."
        idempotency: "Same harvestRecordDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListHarvestRecords"
          - "genxGetHarvestRecord"
        decisions: ["RFC-011"]
        proposalStatus: "draft-non-normative"
      summary: Record one harvest
      description: |-
        Unknown harvestRecordDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarvestRecordNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/HarvestRecord'
                required:
                - metadata
                - result
                title: HarvestRecordResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - HarvestRecords
components:
  responses:
    HarvestRecordListResponse:
      content:
        application/json:
          schema:
            title: HarvestRecordListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HarvestRecord'
            required:
            - metadata
            - result
      description: OK