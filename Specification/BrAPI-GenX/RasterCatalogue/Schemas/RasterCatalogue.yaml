info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    RasterCatalogue:
      type: object
      description: |-
        One immutable raster catalogue record. A published (rasterCatalogueDbId) record
        never mutates in place; corrections are recorded as additional
        records linked by supersedes.
      required:
      - rasterCatalogueDbId
      - status
      properties:
        rasterCatalogueDbId:
          description: Namespaced raster-catalogue identity `{authority}:raster-catalogue:{localId}`
          type: string
          example: institute-a:raster-catalogue:rc-2026-001
        datasetName:
          description: Name of the raster dataset
          type: string
          example: ndvi-2026
        datasetType:
          description: Type of raster dataset
          type: string
          example: NDVI
        resolution:
          description: Spatial resolution
          type: string
          example: "30m"
        crs:
          description: Coordinate reference system
          type: string
          example: EPSG:4326
        extent:
          description: Spatial extent
          type: string
          example: POLYGON((...))
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: rasterCatalogueDbId of the record this one replaces
          type: string
          example: institute-a:raster-catalogue:rc-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
