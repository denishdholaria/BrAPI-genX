info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /genomic-selections:
    get:
      operationId: genxListGenomicSelections
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.genomic-selections.list"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List genomic selection result records, optionally filtered by method, study, or status."
        canBeUsedFor:
          - "Discover genomic selection results for a study or method."
          - "Support scientific reproducibility and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a result (use the POST endpoint)."
          - "Assuming a result is a BrAPI data resource."
          - "Treating the list as a complete analysis repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordGenomicSelection"
          - "genxGetGenomicSelection"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-055"]
        proposalStatus: "draft-non-normative"
      summary: List genomic selection results
      description: Get a paged list of genomic selection results across authorities. Filters combine with AND.
      parameters:
      - name: analysisMethodDbId
        description: Filter by GenX AnalysisMethod
        in: query
        required: false
        schema:
          type: string
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/GenomicSelectionListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - GenomicSelection
    post:
      operationId: genxRecordGenomicSelection
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.genomic-selections.record"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one genomic selection result with selections and provenance."
        canBeUsedFor:
          - "Publish genomic selection result metadata and payload references."
          - "Retry an identical result safely using the same genomicSelectionDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing result; corrections require a new record that supersedes."
          - "Assuming the result is a BrAPI data resource."
          - "Treating the result as scientific validation or approval."
        sideEffects: "Creates a genomic selection result when accepted."
        idempotency: "Same genomicSelectionDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListGenomicSelections"
          - "genxGetGenomicSelection"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-055"]
        proposalStatus: "draft-non-normative"
      summary: Record one genomic selection result
      description: |-
        Unknown genomicSelectionDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenomicSelectionNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/GenomicSelection'
                required:
                - metadata
                - result
                title: GenomicSelectionResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - GenomicSelection
components:
  responses:
    GenomicSelectionListResponse:
      content:
        application/json:
          schema:
            title: GenomicSelectionListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GenomicSelection'
            required:
            - metadata
            - result
      description: OK