info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths:
  /models/{modelDbId}:
    get:
      operationId: genxGetModelVersion
      x-brapi-den:
        catalogId: "brapi-den.genx.v3.models.get-version"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve the registered metadata for one model identity/version."
        canBeUsedFor:
          - "Inspect artifact digest, training provenance, version, and lifecycle status before selecting an inference model."
        mustNotBeUsedFor:
          - "Executing inference or training."
          - "Assuming model bytes are served by this endpoint."
          - "Assuming metadata status alone proves scientific fitness for a particular task."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterModelVersion"
          - "genxSubmitAsyncJob"
        decisions: ["RFC-004", "D-09", "D-10"]
        proposalStatus: "draft-non-normative"
      summary: Get one model (latest created when version is omitted)
      description: Returns the requested version, or the most recently created version when `version` is omitted.
      parameters:
      - name: modelDbId
        description: Namespaced model identity `{authority}:model:{localId}`
        in: path
        required: true
        schema:
          type: string
      - name: version
        description: Model version to fetch
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ModelArtifact'
                required:
                - metadata
                - result
                title: ModelArtifactResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - Models
