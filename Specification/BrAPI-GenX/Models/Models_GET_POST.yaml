info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths:
  /models:
    get:
      operationId: genxListModelVersions
      x-brapi-den:
        catalogId: "brapi-den.genx.v3.models.list"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List registered model artifact versions and their lifecycle states, including active, deprecated, and revoked."
        canBeUsedFor:
          - "Discover registered model identities and versions."
          - "Select a model version subject to lifecycle status and advertised inference support."
        mustNotBeUsedFor:
          - "Running inference or training a model."
          - "Assuming registration means scientific validation, approval, or endorsement."
          - "Assuming metrics from different models are directly comparable without defined metric semantics."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterModelVersion"
          - "genxGetModelVersion"
          - "genxSubmitAsyncJob"
        decisions: ["RFC-004", "D-09"]
        proposalStatus: "draft-non-normative"
      summary: List registered model versions
      description: Get a paged list of model versions across authorities. Filters combine with AND.
      parameters:
      - name: modelDbId
        description: Namespaced model identity `{authority}:model:{localId}`
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - deprecated
          - revoked
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ModelArtifactListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Models
    post:
      operationId: genxRegisterModelVersion
      x-brapi-den:
        catalogId: "brapi-den.genx.v3.models.register-version"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register a model artifact version with a namespaced identity, immutable artifact digest, training provenance, metrics, framework, and lifecycle state."
        canBeUsedFor:
          - "Publish model metadata and integrity references."
          - "Create a new version under an existing model identity."
          - "Record deprecation or revocation status as governed elsewhere."
        mustNotBeUsedFor:
          - "Training a model or executing inference."
          - "Assuming the endpoint uploads model bytes; artifact transport is a separate unresolved contract."
          - "Treating the revoked flag as an approval or governance workflow."
        sideEffects: "Creates a model identity or appends a new immutable version when accepted."
        idempotency: "Same model identity/version and identical body replays; conflicting content for the same version is rejected."
        semanticNeighbors:
          - "genxListModelVersions"
          - "genxGetModelVersion"
          - "genxSubmitAsyncJob"
        decisions: ["RFC-004", "D-09", "D-10"]
        proposalStatus: "draft-non-normative"
      x-brapi-den:
        catalogId: "brapi-den.genx.v3.models.register-version"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register a model artifact version with a namespaced identity, immutable artifact digest, training provenance, metrics, framework, and lifecycle state."
        canBeUsedFor:
          - "Publish model metadata and integrity references."
          - "Create a new version under an existing model identity."
          - "Record deprecation or revocation status as governed elsewhere."
        mustNotBeUsedFor:
          - "Training a model or executing inference."
          - "Assuming the endpoint uploads model bytes; artifact transport is a separate unresolved contract."
          - "Treating the revoked flag as an approval or governance workflow."
        sideEffects: "Creates a model identity or appends a new immutable version when accepted."
        idempotency: "Same model identity/version and identical body replays; conflicting content for the same version is rejected."
        semanticNeighbors:
          - "genxListModelVersions"
          - "genxGetModelVersion"
          - "genxSubmitAsyncJob"
        decisions: ["RFC-004", "D-09", "D-10"]
        proposalStatus: "draft-non-normative"
      summary: Register one model version
      description: |-
        Unknown modelDbId creates; known id with a new version appends;
        same (modelDbId, modelVersion) with an identical body replays the
        existing record; same pair with a different body is rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelArtifactNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ModelArtifact'
                required:
                - metadata
                - result
                title: ModelArtifactResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Models
components:
  responses:
    ModelArtifactListResponse:
      content:
        application/json:
          schema:
            title: ModelArtifactListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelArtifact'
            required:
            - metadata
            - result
      description: OK
