info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /pedigree-analyses/{pedigreeAnalysisDbId}:
    get:
      operationId: genxGetPedigreeAnalysis
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.pedigree-analyses.get"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one pedigree analysis result."
        canBeUsedFor:
          - "Inspect pedigree metrics and provenance."
        mustNotBeUsedFor:
          - "Assuming the result is a BrAPI data resource."
          - "Treating a superseded result as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordPedigreeAnalysis"
          - "genxListPedigreeAnalyses"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-060"]
        proposalStatus: "draft-non-normative"
      summary: Get one pedigree analysis result
      description: Returns the recorded result, or 404.
      parameters:
      - name: pedigreeAnalysisDbId
        description: Namespaced pedigree-analysis identity `{authority}:pedigree-analysis:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/PedigreeAnalysis'
                required:
                - metadata
                - result
                title: PedigreeAnalysisResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - PedigreeAnalysis