info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    VendorOrderRecord:
      type: object
      description: |-
        One immutable vendor genotyping order record. A published
        (vendorOrderDbId) record never mutates in place; corrections are
        recorded as additional orders linked by supersedes.
      required:
      - vendorOrderDbId
      - status
      properties:
        vendorOrderDbId:
          description: Namespaced vendor-order identity `{authority}:vendor-order:{localId}`
          type: string
          example: institute-a:vendor-order:vo-2026-001
        vendor:
          description: Genotyping vendor or service provider
          type: string
          example: vendor-x
        platform:
          description: Genotyping platform requested
          type: string
          example: vendor-x-array-v3
        sampleCount:
          description: Number of samples in the order
          type: integer
          example: 96
        resultIngestedAt:
          description: Timestamp when results were ingested, when applicable
          type: string
          example: 2026-10-01T12:00:00Z
        status:
          description: Lifecycle state of the order record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: vendorOrderDbId of the record this one replaces
          type: string
          example: institute-a:vendor-order:vo-2026-000
        provenance:
          description: Evidence and method provenance for the order
          $ref: '#/components/schemas/ProvenanceEnvelope'
