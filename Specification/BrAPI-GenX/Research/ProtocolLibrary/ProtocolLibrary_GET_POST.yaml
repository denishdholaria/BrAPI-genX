info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /protocol-libraries:
    get:
      operationId: genxListProtocolLibraries
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.protocol-libraries.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List protocol library records, optionally filtered by status."
        canBeUsedFor:
          - "Discover protocol libraries."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterProtocolLibrary"
          - "genxGetProtocolLibrary"
          - "genxRegisterFarm"
        decisions: ["RFC-119"]
        proposalStatus: "draft-non-normative"
      summary: List protocol libraries
      description: Get a paged list of protocol library records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ProtocolLibraryListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ProtocolLibrary
    post:
      operationId: genxRegisterProtocolLibrary
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.protocol-libraries.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one protocol library record with provenance."
        canBeUsedFor:
          - "Publish an protocol library."
          - "Retry an identical record safely using the same protocolLibraryDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates an protocol library identity or appends a new immutable version when accepted."
        idempotency: "Same protocolLibraryDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListProtocolLibraries"
          - "genxGetProtocolLibrary"
          - "genxRegisterFarm"
        decisions: ["RFC-119"]
        proposalStatus: "draft-non-normative"
      summary: Register one protocol library
      description: Register one protocol library record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtocolLibraryNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ProtocolLibrary'
                required:
                - metadata
                - result
                title: ProtocolLibraryResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - ProtocolLibrary
components:
  responses:
    ProtocolLibraryListResponse:
      content:
        application/json:
          schema:
            title: ProtocolLibraryListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProtocolLibrary'
            required:
            - metadata
            - result
      description: OK