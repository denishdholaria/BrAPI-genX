info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /mixed-model-results/{mixedModelResultDbId}:
    get:
      operationId: genxGetMixedModelResult
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.mixed-model-results.get"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one mixed model result."
        canBeUsedFor:
          - "Inspect variance components, BLUPs, and provenance."
        mustNotBeUsedFor:
          - "Assuming the result is a BrAPI data resource."
          - "Treating a superseded result as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordMixedModelResult"
          - "genxListMixedModelResults"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-048"]
        proposalStatus: "draft-non-normative"
      summary: Get one mixed model result
      description: Returns the recorded result, or 404.
      parameters:
      - name: mixedModelResultDbId
        description: Namespaced mixed-model-result identity `{authority}:mixed-model-result:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/MixedModelResult'
                required:
                - metadata
                - result
                title: MixedModelResultResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - MixedModel