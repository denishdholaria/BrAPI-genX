info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /pca-results:
    get:
      operationId: genxListPcaResults
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.pca-results.list"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List PCA result records, optionally filtered by method, study, or status."
        canBeUsedFor:
          - "Discover PCA results for a study or method."
          - "Support scientific reproducibility and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a result (use the POST endpoint)."
          - "Assuming a result is a BrAPI data resource."
          - "Treating the list as a complete analysis repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordPcaResult"
          - "genxGetPcaResult"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-053"]
        proposalStatus: "draft-non-normative"
      summary: List PCA results
      description: Get a paged list of PCA results across authorities. Filters combine with AND.
      parameters:
      - name: analysisMethodDbId
        description: Filter by GenX AnalysisMethod
        in: query
        required: false
        schema:
          type: string
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/PcaResultListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - PcaResult
    post:
      operationId: genxRecordPcaResult
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.pca-results.record"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one PCA result with components and provenance."
        canBeUsedFor:
          - "Publish PCA result metadata and payload references."
          - "Retry an identical result safely using the same pcaResultDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing result; corrections require a new record that supersedes."
          - "Assuming the result is a BrAPI data resource."
          - "Treating the result as scientific validation or approval."
        sideEffects: "Creates a PCA result when accepted."
        idempotency: "Same pcaResultDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListPcaResults"
          - "genxGetPcaResult"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-053"]
        proposalStatus: "draft-non-normative"
      summary: Record one PCA result
      description: |-
        Unknown pcaResultDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PcaResultNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/PcaResult'
                required:
                - metadata
                - result
                title: PcaResultResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - PcaResult
components:
  responses:
    PcaResultListResponse:
      content:
        application/json:
          schema:
            title: PcaResultListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PcaResult'
            required:
            - metadata
            - result
      description: OK