info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    ModelArtifactNewRequest:
      type: object
      description: |-
        Request to register one model version. Unknown modelDbId creates;
        known id with a new version appends; same (modelDbId, modelVersion)
        with an identical body replays the existing record; same pair with a
        different body is rejected with 409.
      required:
      - modelDbId
      - modelName
      - modelVersion
      - artifactDigest
      properties:
        modelDbId:
          description: Namespaced model identity `{authority}:model:{localId}`
          type: string
          example: institute-a:model:yield-gblup-wheat
        modelName:
          description: Human readable model name
          type: string
          example: Wheat yield GBLUP 2026
        modelVersion:
          description: Model version. Opaque string.
          type: string
          example: '7'
        artifactDigest:
          description: SHA-256 (lowercase hex) over the model artifact bytes
          type: string
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        artifactURL:
          description: Where the artifact bytes can be retrieved, when published
          type: string
          format: uri
          example: https://institute.org/models/yield-gblup-wheat/v/7.onnx
        trainingDataDigest:
          description: SHA-256 (lowercase hex) over the canonical training inputs
          type: string
          example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        metrics:
          description: Model-defined evaluation scores. Comparability across models is out of scope.
          type: object
          example: {rmse: 0.31, unit: t_per_hectare}
        framework:
          description: Runtime the artifact targets
          type: string
          example: onnx-1.17
        status:
          description: Lifecycle state at registration time
          type: string
          enum:
          - active
          - deprecated
          - revoked
          default: active
          example: active
        supersededBy:
          description: modelDbId of the replacement model, same authority
          type: string
          example: institute-a:model:yield-gblup-wheat-v8
        provenance:
          description: Who trained this model, on what data, with which code version
          $ref: '#/components/schemas/ProvenanceEnvelope'
