info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    ResearchProgramNewRequest:
      type: object
      description: |-
        Request to register one research program record. Unknown
        researchProgramDbId creates; same id with an identical body replays
        the existing record; same id with a different body is rejected with 409.
      required:
      - researchProgramDbId
      properties:
        researchProgramDbId:
          description: Namespaced research-program identity `{authority}:research-program:{localId}`
          type: string
          example: institute-a:research-program:rp-2026-001
        title:
          description: Program title
          type: string
          example: Genomics for yield improvement
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          default: active
          example: active
        supersedes:
          description: researchProgramDbId of the record this one replaces
          type: string
          example: institute-a:research-program:rp-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
