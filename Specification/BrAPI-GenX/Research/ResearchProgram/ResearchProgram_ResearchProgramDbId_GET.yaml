info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /research-programs/{researchProgramDbId}:
    get:
      operationId: genxGetResearchProgram
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.research-programs.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one research program record."
        canBeUsedFor:
          - "Inspect research-program identity, funding, and provenance."
        mustNotBeUsedFor:
          - "Assuming a research-program is a BrAPI Study."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterResearchProgram"
          - "genxListResearchPrograms"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-098"]
        proposalStatus: "draft-non-normative"
      summary: Get one research-program
      description: Returns the registered record, or 404.
      parameters:
      - name: researchProgramDbId
        description: Namespaced research-program identity `{authority}:research-program:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ResearchProgram'
                required:
                - metadata
                - result
                title: ResearchProgramResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - ResearchProgram
