info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    ResearchAssetNewRequest:
      type: object
      description: |-
        Request to register one research asset. Unknown researchAssetDbId
        creates; same id with an identical body replays the existing record;
        same id with a different body is rejected with 409.
      required:
      - researchAssetDbId
      properties:
        researchAssetDbId:
          description: Namespaced research-asset identity `{authority}:research-asset:{localId}`
          type: string
          example: institute-a:research-asset:ra-2026-001
        assetType:
          description: Kind of research output
          type: string
          enum:
          - dataset
          - model
          - protocol
          - report
          - evidence-pack
          - other
          example: dataset
        title:
          description: Human-readable title of the asset
          type: string
          example: Wheat yield trial 2026 dataset
        description:
          description: Short description of the asset
          type: string
          example: Plot-level yield and covariates for the 2026 multi-site trial.
        license:
          description: License identifier applied to the asset
          type: string
          example: CC-BY-4.0
        accessPolicy:
          description: Access policy for the asset
          type: string
          enum:
          - open
          - restricted
          - embargoed
          - closed
          example: open
        embargoUntil:
          description: End of the embargo window (ISO 8601), when accessPolicy is embargoed
          type: string
          format: date-time
          example: '2027-01-01T00:00:00Z'
        persistentIdentifier:
          description: Persistent identifier already assigned to the asset (DOI, Handle, ARK)
          type: string
          example: doi:10.5281/zenodo.1234567
        fairPackageDbId:
          description: GenX FAIR package that carries the payload, when applicable
          type: string
          example: institute-a:fair-package:fp-2026-001
        status:
          description: Lifecycle state of the asset record
          type: string
          enum:
          - draft
          - published
          - superseded
          - withdrawn
          default: draft
          example: published
        supersedes:
          description: researchAssetDbId of the asset record this one replaces
          type: string
          example: institute-a:research-asset:ra-2026-000
        provenance:
          description: Evidence and method provenance for the asset
          $ref: '#/components/schemas/ProvenanceEnvelope'
