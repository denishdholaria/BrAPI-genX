info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /evidence-packs:
    get:
      operationId: genxListEvidencePacks
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.evidence-packs.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List evidence pack records, optionally filtered by status."
        canBeUsedFor:
          - "Discover evidence packs."
          - "Support dataset/model artefact discovery."
        mustNotBeUsedFor:
          - "Creating or changing a record (use the POST endpoint)."
          - "Assuming a record is a BrAPI data resource."
          - "Treating the list as a complete history."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterEvidencePack"
          - "genxGetEvidencePack"
          - "genxRegisterFarm"
        decisions: ["RFC-122"]
        proposalStatus: "draft-non-normative"
      summary: List evidence packs
      description: Get a paged list of evidence pack records across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/EvidencePackListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - EvidencePack
    post:
      operationId: genxRegisterEvidencePack
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.evidence-packs.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Register one evidence pack record with provenance."
        canBeUsedFor:
          - "Publish a evidence pack."
          - "Retry an identical record safely using the same evidencePackDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing record; corrections require a new record that supersedes."
          - "Assuming a record is a BrAPI data resource."
          - "Asserting that the catalogue is validated or endorsed."
        sideEffects: "Creates a evidence pack identity or appends a new immutable version when accepted."
        idempotency: "Same evidencePackDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListEvidencePacks"
          - "genxGetEvidencePack"
          - "genxRegisterFarm"
        decisions: ["RFC-122"]
        proposalStatus: "draft-non-normative"
      summary: Register one evidence pack
      description: Register one evidence pack record with provenance.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidencePackNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/EvidencePack'
                required:
                - metadata
                - result
                title: EvidencePackResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - EvidencePack
components:
  responses:
    EvidencePackListResponse:
      content:
        application/json:
          schema:
            title: EvidencePackListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvidencePack'
            required:
            - metadata
            - result
      description: OK