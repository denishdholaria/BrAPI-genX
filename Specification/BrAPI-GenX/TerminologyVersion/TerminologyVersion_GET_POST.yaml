info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /terminology-versions:
    get:
      operationId: genxListTerminologyVersions
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.terminology-versions.list"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C4", "C9"]
        purpose: "List terminology version entries, optionally filtered by status."
        canBeUsedFor:
          - "Discover terminology version entries."
          - "Support terminology versioning and provenance."
        mustNotBeUsedFor:
          - "Creating or changing a stage entry (use the POST endpoint)."
          - "Assuming a stage entry is a BrAPI Observation."
          - "Treating the list as a complete ontology."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterTerminologyVersion"
          - "genxGetTerminologyVersion"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-084"]
        proposalStatus: "draft-non-normative"
      summary: List terminology versions
      description: Get a paged list of terminology version entries across authorities. Filters combine with AND.
      parameters:
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/TerminologyVersionListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - TerminologyVersion
    post:
      operationId: genxRegisterTerminologyVersion
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.terminology-versions.record"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C3", "C4", "C9"]
        purpose: "Register one terminology version entry with provenance."
        canBeUsedFor:
          - "Publish a terminology version entry."
          - "Retry an identical entry safely using the same terminologyVersionDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing entry; corrections require a new record that supersedes."
          - "Assuming an entry is a BrAPI Observation."
          - "Asserting that the entry is validated or endorsed."
        sideEffects: "Creates a terminology version identity or appends a new immutable version when accepted."
        idempotency: "Same terminologyVersionDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListTerminologyVersions"
          - "genxGetTerminologyVersion"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-084"]
        proposalStatus: "draft-non-normative"
      summary: Register one terminology version
      description: |-
        Unknown terminologyVersionDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminologyVersionNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/TerminologyVersion'
                required:
                - metadata
                - result
                title: TerminologyVersionResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - TerminologyVersion
components:
  responses:
    TerminologyVersionListResponse:
      content:
        application/json:
          schema:
            title: TerminologyVersionListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TerminologyVersion'
            required:
            - metadata
            - result
      description: OK
