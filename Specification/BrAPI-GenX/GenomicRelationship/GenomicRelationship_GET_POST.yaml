info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /genomic-relationships:
    get:
      operationId: genxListGenomicRelationships
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.genomic-relationships.list"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C5", "C6", "C9"]
        purpose: "List genomic relationship matrix records, optionally filtered by method, study, or status."
        canBeUsedFor:
          - "Discover genomic relationships for a study or method."
          - "Support genomic analysis and auditing."
        mustNotBeUsedFor:
          - "Creating or changing a matrix (use the POST endpoint)."
          - "Assuming a matrix is a BrAPI data resource."
          - "Treating the list as a complete analysis repository."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterGenomicRelationship"
          - "genxGetGenomicRelationship"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-056"]
        proposalStatus: "draft-non-normative"
      summary: List genomic relationships
      description: Get a paged list of genomic relationships across authorities. Filters combine with AND.
      parameters:
      - name: analysisMethodDbId
        description: Filter by GenX AnalysisMethod
        in: query
        required: false
        schema:
          type: string
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
          - withdrawn
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/GenomicRelationshipListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - GenomicRelationship
    post:
      operationId: genxRegisterGenomicRelationship
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.genomic-relationships.register"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C5", "C6", "C9"]
        purpose: "Register a genomic relationship matrix with method, storage reference, and provenance."
        canBeUsedFor:
          - "Publish genomic relationship metadata."
          - "Create a new version under an existing matrix identity."
        mustNotBeUsedFor:
          - "Updating or deleting an existing matrix; corrections require a new record that supersedes."
          - "Assuming the matrix is a BrAPI data resource."
          - "Treating the matrix as scientific validation or approval."
        sideEffects: "Creates a genomic relationship matrix identity or appends a new immutable version when accepted."
        idempotency: "Same identity and identical body replays; conflicting content for the same identity is rejected."
        semanticNeighbors:
          - "genxListGenomicRelationships"
          - "genxGetGenomicRelationship"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-056"]
        proposalStatus: "draft-non-normative"
      summary: Register one genomic relationship
      description: |-
        Unknown genomicRelationshipDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenomicRelationshipNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/GenomicRelationship'
                required:
                - metadata
                - result
                title: GenomicRelationshipResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - GenomicRelationship
components:
  responses:
    GenomicRelationshipListResponse:
      content:
        application/json:
          schema:
            title: GenomicRelationshipListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GenomicRelationship'
            required:
            - metadata
            - result
      description: OK