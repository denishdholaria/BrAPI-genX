info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    ConservationMembership:
      type: object
      description: |-
        One immutable conservation membership record. A published
        (conservationMembershipDbId) record never mutates in place;
        corrections are recorded as additional records linked by supersedes.
      required:
      - conservationMembershipDbId
      - status
      properties:
        conservationMembershipDbId:
          description: Namespaced conservation-membership identity `{authority}:conservation-membership:{localId}`
          type: string
          example: institute-a:conservation-membership:cm-2026-001
        memberDbId:
          description: Germplasm or accession reference
          type: string
          example: acc-001
        program:
          description: Conservation program name
          type: string
          example: global wheat conservation
        status:
          description: Lifecycle state of the record
          type: string
          enum:
          - active
          - superseded
          - withdrawn
          example: active
        supersedes:
          description: conservationMembershipDbId of the record this one replaces
          type: string
          example: institute-a:conservation-membership:cm-2026-000
        provenance:
          description: Evidence and method provenance for the record
          $ref: '#/components/schemas/ProvenanceEnvelope'
