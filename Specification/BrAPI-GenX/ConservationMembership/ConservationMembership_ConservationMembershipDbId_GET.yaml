info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /conservation-memberships/{conservationMembershipDbId}:
    get:
      operationId: genxGetConservationMembership
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.conservation-memberships.get"
        classification:
          primaryDomain: null
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one conservation membership record."
        canBeUsedFor:
          - "Inspect conservation-membership identity, funding, and provenance."
        mustNotBeUsedFor:
          - "Assuming a conservation-membership is a BrAPI Study."
          - "Treating a superseded record as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRegisterConservationMembership"
          - "genxListConservationMemberships"
          - "genxPublishVariableTermVersion"
        decisions: ["RFC-102"]
        proposalStatus: "draft-non-normative"
      summary: Get one conservation-membership
      description: Returns the registered record, or 404.
      parameters:
      - name: conservationMembershipDbId
        description: Namespaced conservation-membership identity `{authority}:conservation-membership:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ConservationMembership'
                required:
                - metadata
                - result
                title: ConservationMembershipResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - ConservationMembership
