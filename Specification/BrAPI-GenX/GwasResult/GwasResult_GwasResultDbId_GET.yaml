info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /gwas-results/{gwasResultDbId}:
    get:
      operationId: genxGetGwasResult
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.gwas-results.get"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one GWAS result."
        canBeUsedFor:
          - "Inspect significant markers, top p-value, and provenance."
        mustNotBeUsedFor:
          - "Assuming the result is a BrAPI data resource."
          - "Treating a superseded result as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordGwasResult"
          - "genxListGwasResults"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-047"]
        proposalStatus: "draft-non-normative"
      summary: Get one GWAS result
      description: Returns the recorded result, or 404.
      parameters:
      - name: gwasResultDbId
        description: Namespaced GWAS-result identity `{authority}:gwas-result:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/GwasResult'
                required:
                - metadata
                - result
                title: GwasResultResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - GwasResult