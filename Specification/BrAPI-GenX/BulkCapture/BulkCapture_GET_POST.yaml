info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /bulk-captures:
    get:
      operationId: genxListBulkCaptures
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.bulk-captures.list"
        classification:
          primaryDomain: "D4"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "List bulk capture records, optionally filtered by study or status."
        canBeUsedFor:
          - "Discover bulk capture events for a study."
          - "Support phenotyping and auditing workflows."
        mustNotBeUsedFor:
          - "Creating or changing a capture (use the POST endpoint)."
          - "Assuming a capture is a BrAPI Observation."
          - "Treating the list as a complete phenotype dataset."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordBulkCapture"
          - "genxGetBulkCapture"
        decisions: ["RFC-040"]
        proposalStatus: "draft-non-normative"
      summary: List bulk captures
      description: Get a paged list of bulk captures across authorities. Filters combine with AND.
      parameters:
      - name: studyDbId
        description: Filter by BrAPI Study / trial context
        in: query
        required: false
        schema:
          type: string
      - name: status
        description: Filter by lifecycle state
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - superseded
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/BulkCaptureListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - BulkCapture
    post:
      operationId: genxRecordBulkCapture
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.bulk-captures.record"
        classification:
          primaryDomain: "D4"
          crossCuttingCapabilities: ["C1", "C2", "C3", "C6", "C9"]
        purpose: "Record one bulk capture event with entries and provenance."
        canBeUsedFor:
          - "Record batch capture of observations for a study."
          - "Retry an identical capture safely using the same bulkCaptureDbId."
        mustNotBeUsedFor:
          - "Updating or deleting an existing capture; corrections require a new record that supersedes."
          - "Assuming the capture is a BrAPI Observation."
          - "Treating the capture as a complete phenotype dataset."
        sideEffects: "Creates a bulk capture when accepted."
        idempotency: "Same bulkCaptureDbId and identical body replays the existing record; same id with a different body is rejected with 409."
        semanticNeighbors:
          - "genxListBulkCaptures"
          - "genxGetBulkCapture"
        decisions: ["RFC-040"]
        proposalStatus: "draft-non-normative"
      summary: Record one bulk capture
      description: |-
        Unknown bulkCaptureDbId creates; same id with an identical body
        replays the existing record; same id with a different body is
        rejected with 409.
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCaptureNewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/BulkCapture'
                required:
                - metadata
                - result
                title: BulkCaptureResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - BulkCapture
components:
  responses:
    BulkCaptureListResponse:
      content:
        application/json:
          schema:
            title: BulkCaptureListResponse
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BulkCapture'
            required:
            - metadata
            - result
      description: OK