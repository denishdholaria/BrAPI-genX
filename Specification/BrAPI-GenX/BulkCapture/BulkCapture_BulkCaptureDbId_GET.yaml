info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /bulk-captures/{bulkCaptureDbId}:
    get:
      operationId: genxGetBulkCapture
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.bulk-captures.get"
        classification:
          primaryDomain: "D4"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one bulk capture record."
        canBeUsedFor:
          - "Inspect capture entries and provenance."
        mustNotBeUsedFor:
          - "Assuming the capture is a BrAPI Observation."
          - "Treating a superseded capture as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordBulkCapture"
          - "genxListBulkCaptures"
        decisions: ["RFC-040"]
        proposalStatus: "draft-non-normative"
      summary: Get one bulk capture
      description: Returns the recorded capture, or 404.
      parameters:
      - name: bulkCaptureDbId
        description: Namespaced bulk-capture identity `{authority}:bulk-capture:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/BulkCapture'
                required:
                - metadata
                - result
                title: BulkCaptureResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - BulkCapture