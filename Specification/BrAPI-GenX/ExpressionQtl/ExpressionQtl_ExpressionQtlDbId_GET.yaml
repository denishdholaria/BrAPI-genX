info:
  title: BrAPI-GenX API
  version: ''
openapi: 3.0.0
paths:
  /expression-qtls/{expressionQtlDbId}:
    get:
      operationId: genxGetExpressionQtl
      x-brapi-genx:
        catalogId: "brapi-genx.genx.v1.expression-qtls.get"
        classification:
          primaryDomain: "D7"
          crossCuttingCapabilities: ["C1", "C2", "C6", "C9"]
        purpose: "Retrieve one expression QTL result."
        canBeUsedFor:
          - "Inspect components, explained variance, and provenance."
        mustNotBeUsedFor:
          - "Assuming the result is a BrAPI data resource."
          - "Treating a superseded result as current."
        sideEffects: "Read-only."
        idempotency: "Read-only."
        semanticNeighbors:
          - "genxRecordExpressionQtl"
          - "genxListExpressionQtls"
          - "genxRegisterAnalysisMethod"
        decisions: ["RFC-058"]
        proposalStatus: "draft-non-normative"
      summary: Get one expression QTL result
      description: Returns the recorded result, or 404.
      parameters:
      - name: expressionQtlDbId
        description: Namespaced expression-QTL identity `{authority}:expression-qtl:{localId}`
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  '@context':
                    $ref: '#/components/schemas/Context'
                  metadata:
                    $ref: '#/components/schemas/metadata'
                  result:
                    $ref: '#/components/schemas/ExpressionQtl'
                required:
                - metadata
                - result
                title: ExpressionQtlResponse
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
      tags:
      - ExpressionQtl