name: Build specifications, schemas and comparisions

on:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      skip_job: ${{ steps.skip.outputs.skip_job }}
      skip_commit: ${{ steps.check-tag.outputs.skip_commit }}
      commit_message: ${{ steps.check-tag.outputs.commit_message }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python for contract fixture validation
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install contract fixture validation dependencies
        run: python -m pip install 'PyYAML==6.0.2' 'rfc8785==0.1.4'
      - name: Guard scientific source-contract field evidence
        run: python Scripts/check_scientific_contract_boundaries.py
      - name: Test scientific source-contract drift detection
        run: python Scripts/test_scientific_contract_boundaries.py
      - name: Check reviewed semantic-neighbor source evidence
        run: python Scripts/check_semantic_neighbor_evidence.py
      - name: Regression-test semantic-neighbor source evidence
        run: python Scripts/test_semantic_neighbor_evidence.py
      - name: Check RFC governance and approved deferrals
        run: python Scripts/check_rfc_governance.py
      - name: Regression-test RFC governance gate
        run: python Scripts/test_rfc_governance.py
      - name: Test BreedingPipeline authority-filter identity uniqueness
        run: python Scripts/test_breeding_pipeline_parameter_duplicates.py
      - name: Validate advisory breeding design fixtures
        run: python3 Scripts/validate_breeding_pipeline_candidate_fixtures.py
      - name: Validate approved-candidate breeding contract fixtures
        run: python3 Scripts/validate_breeding_pipeline_contract_fixtures.py
      - name: Check last commit message
        id: commit-message
        run: |
          echo "COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')" >> "$GITHUB_ENV"
      - id: skip
        name: Skip if automated push
        if: contains(env.COMMIT_MESSAGE, 'Apply automatic changes')
        run: |
          echo "Automated commit detected - skipping job"
          echo "skip_job=true" >> "$GITHUB_OUTPUT"
      - name: Check Branch with Regex
        id: check-tag
        run: |
          # Generated artifacts are committed only on explicit release branches.
          # Manual generation validates output but does not bypass the branch policy.
          regex="^refs/heads/brapi-V[0-9]+\\.[0-9]+$"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "skip_commit=true" >> "$GITHUB_OUTPUT"
            echo "commit_message=" >> "$GITHUB_OUTPUT"
            echo "Manual generation: artifacts are validated but not committed automatically"
          elif [[ "${{ github.ref }}" =~ $regex ]]; then
            echo "skip_commit=false" >> "$GITHUB_OUTPUT"
            echo "commit_message=Apply automatic changes" >> "$GITHUB_OUTPUT"
            echo "Release branch - WILL commit generated files"
          else
            echo "skip_commit=true" >> "$GITHUB_OUTPUT"
            echo "commit_message=" >> "$GITHUB_OUTPUT"
            echo "Non-release branch - will not commit generated files"
          fi
  generate:
    runs-on: ubuntu-24.04
    needs: check
    if: needs.check.outputs.skip_job != 'true'
    steps:
      - name: debug
        run: |
          echo ${{ needs.check.outputs.skip_job }}
          echo ${{ needs.check.outputs.skip_commit }}
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Explicit contents:write permission is used only by the guarded release-branch commit step below.
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
      - name: Build and run the Docker image
        working-directory: ./docker
        run: docker compose run build-docs
      - name: Convert compiled specification
        working-directory: ./docker
        run: docker compose run gen-swagger
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
      - name: Change wrapper permissions
        working-directory: ./generator
        run: chmod +x ./gradlew
      - name: Copy compiled specification
        working-directory: ./generator
        run: ./gradlew copyOpenApi
      - name: Validate
        working-directory: ./generator
        run: ./gradlew validate
      - name: Generate OpenAPI, GraphQL and OWL
        working-directory: ./generator
        run: ./gradlew generateAll
      - name: Compare OpenAPI
        working-directory: ./generator
        run: ./gradlew compareAll
      - name: Check generated artifact diff summary
        run: |
          git diff --stat -- Specification/Generated/
          # Generated artifacts are derived outputs. The upstream generator currently
          # emits some trailing whitespace, so do not fail generation on diff --check.
      - name: Report generated artifact changes
        if: always()
        run: git status --short -- Specification/Generated/
