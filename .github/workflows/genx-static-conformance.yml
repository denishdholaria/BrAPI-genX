name: GenX conformance (static and live)

on:
  pull_request:
    paths:
      # Source contracts, shared components, catalogues, and generated artefacts
      # all affect GenX verification; keep the complete Specification/ tree watched.
      - 'Specification/**'
      - 'Scripts/checkGenXConformance.py'
      - 'Scripts/checkGenXEndpointCatalog.py'
      - 'Scripts/checkEndpointRegistry.py'
      - 'Scripts/domain_classification.py'
      - 'Scripts/test_domain_classification.py'
      - 'Scripts/auditEndpointRegistrySourceConsistency.py'
      - 'Scripts/generateEndpointArtifacts.py'
      - 'Scripts/test_endpoint_identity.py'
      - 'Scripts/test_capability_negotiation.py'
      - 'Scripts/test_job_idempotency.py'
      - 'Scripts/test_digest_vectors.py'
      - 'Scripts/test_digest_vector_mutations.py'
      - 'Scripts/digest-conformance/**'
      - 'Scripts/jcs-canonicalization/**'
      - 'Scripts/test_cross_language_jcs.py'
      - 'Scripts/genx_test_server.py'
      - 'Scripts/validate_breeding_pipeline_candidate_fixtures.py'
      - 'Scripts/validate_breeding_pipeline_contract_fixtures.py'
      - 'Scripts/test_breeding_pipeline_contract_fixture_validator.py'
      - 'Scripts/check_breeding_pipeline_api_contract.py'
      - 'Scripts/test_breeding_pipeline_parameter_duplicates.py'
      - 'Scripts/specification_structure.py'
      - 'Scripts/test_specification_structure.py'
      - 'Scripts/test_conformance_workflow_scope.py'
      - 'Scripts/check_registry_drift_regression.py'
      - 'Scripts/test_registry_drift_regression.py'
      - 'Scripts/test_registry_source_consistency.py'
      - 'Scripts/check_scientific_contract_boundaries.py'
      - 'Scripts/test_scientific_contract_boundaries.py'
      - 'Scripts/check_semantic_neighbor_evidence.py'
      - 'Scripts/test_semantic_neighbor_evidence.py'
      - 'Scripts/check_rfc_governance.py'
      - 'Scripts/test_rfc_governance.py'
      - 'Scripts/semantic_neighbor_lineage.py'
      - 'Scripts/test_semantic_neighbor_lineage.py'
      - 'Scripts/report_semantic_neighbor_consumers.py'
      - 'Scripts/test_semantic_neighbor_consumers.py'
      - 'Scripts/validate_semantic_decision_candidate.py'
      - 'Scripts/test_semantic_decision_candidate.py'
      - 'Scripts/verify_breeding_pipeline_cas_trace.py'
      - 'Scripts/test_breeding_pipeline_cas_trace.py'
      - 'Scripts/report_semantic_neighbor_inventory.py'
      - 'Scripts/test_semantic_neighbor_inventory.py'
      - 'Scripts/check_semantic_neighbor_governance.py'
      - 'Scripts/test_semantic_neighbor_governance.py'
      - 'Scripts/semantic_neighbor_terminal_decisions.py'
      - 'Scripts/test_semantic_neighbor_terminal_decisions.py'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-CANDIDATE-FIXTURES.json'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-CONTRACT-FIXTURES.json'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-DECISIONS-APPROVED.md'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-OPEN-DECISIONS.md'
      - '.github/workflows/genx-static-conformance.yml'
  push:
    paths:
      # Source contracts, shared components, catalogues, and generated artefacts
      # all affect GenX verification; keep the complete Specification/ tree watched.
      - 'Specification/**'
      - 'Scripts/checkGenXConformance.py'
      - 'Scripts/checkGenXEndpointCatalog.py'
      - 'Scripts/checkEndpointRegistry.py'
      - 'Scripts/domain_classification.py'
      - 'Scripts/test_domain_classification.py'
      - 'Scripts/auditEndpointRegistrySourceConsistency.py'
      - 'Scripts/generateEndpointArtifacts.py'
      - 'Scripts/test_endpoint_identity.py'
      - 'Scripts/test_capability_negotiation.py'
      - 'Scripts/test_job_idempotency.py'
      - 'Scripts/test_digest_vectors.py'
      - 'Scripts/test_digest_vector_mutations.py'
      - 'Scripts/digest-conformance/**'
      - 'Scripts/jcs-canonicalization/**'
      - 'Scripts/test_cross_language_jcs.py'
      - 'Scripts/genx_test_server.py'
      - 'Scripts/validate_breeding_pipeline_candidate_fixtures.py'
      - 'Scripts/validate_breeding_pipeline_contract_fixtures.py'
      - 'Scripts/test_breeding_pipeline_contract_fixture_validator.py'
      - 'Scripts/check_breeding_pipeline_api_contract.py'
      - 'Scripts/test_breeding_pipeline_parameter_duplicates.py'
      - 'Scripts/specification_structure.py'
      - 'Scripts/test_specification_structure.py'
      - 'Scripts/test_conformance_workflow_scope.py'
      - 'Scripts/check_registry_drift_regression.py'
      - 'Scripts/test_registry_drift_regression.py'
      - 'Scripts/test_registry_source_consistency.py'
      - 'Scripts/check_scientific_contract_boundaries.py'
      - 'Scripts/test_scientific_contract_boundaries.py'
      - 'Scripts/check_semantic_neighbor_evidence.py'
      - 'Scripts/test_semantic_neighbor_evidence.py'
      - 'Scripts/check_rfc_governance.py'
      - 'Scripts/test_rfc_governance.py'
      - 'Scripts/semantic_neighbor_lineage.py'
      - 'Scripts/test_semantic_neighbor_lineage.py'
      - 'Scripts/report_semantic_neighbor_consumers.py'
      - 'Scripts/test_semantic_neighbor_consumers.py'
      - 'Scripts/validate_semantic_decision_candidate.py'
      - 'Scripts/test_semantic_decision_candidate.py'
      - 'Scripts/verify_breeding_pipeline_cas_trace.py'
      - 'Scripts/test_breeding_pipeline_cas_trace.py'
      - 'Scripts/report_semantic_neighbor_inventory.py'
      - 'Scripts/test_semantic_neighbor_inventory.py'
      - 'Scripts/check_semantic_neighbor_governance.py'
      - 'Scripts/test_semantic_neighbor_governance.py'
      - 'Scripts/semantic_neighbor_terminal_decisions.py'
      - 'Scripts/test_semantic_neighbor_terminal_decisions.py'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-CANDIDATE-FIXTURES.json'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-CONTRACT-FIXTURES.json'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-DECISIONS-APPROVED.md'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-OPEN-DECISIONS.md'
      - '.github/workflows/genx-static-conformance.yml'
  workflow_dispatch:
    inputs:
      comparison_sha:
        description: 'Comparison commit SHA (required for manual dispatch)'
        required: true
        type: string

concurrency:
  group: genx-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-conformance:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Pinned source/registry drift baseline requires history.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install conformance dependencies
        run: python -m pip install 'PyYAML==6.0.2' 'rfc8785==0.1.4'
      - name: Guard scientific source-contract field evidence
        run: python Scripts/check_scientific_contract_boundaries.py
      - name: Test scientific source-contract drift detection
        run: python Scripts/test_scientific_contract_boundaries.py
      - name: Check reviewed semantic-neighbor source evidence
        run: python Scripts/check_semantic_neighbor_evidence.py
      - name: Regression-test semantic-neighbor source evidence
        run: python Scripts/test_semantic_neighbor_evidence.py
      - name: Check RFC governance and approved deferrals
        run: python Scripts/check_rfc_governance.py
      - name: Regression-test RFC governance gate
        run: python Scripts/test_rfc_governance.py
      - name: Validate advisory breeding design fixtures
        run: python3 Scripts/validate_breeding_pipeline_candidate_fixtures.py
      - name: Validate approved-candidate breeding contract fixtures
        run: python3 Scripts/validate_breeding_pipeline_contract_fixtures.py
      - name: Run breeding contract fixture validator regressions
        run: python Scripts/test_breeding_pipeline_contract_fixture_validator.py
      - name: Check breeding pipeline OpenAPI and authority-filter contract
        run: python Scripts/check_breeding_pipeline_api_contract.py
      - name: Test BreedingPipeline authority-filter identity uniqueness
        run: python Scripts/test_breeding_pipeline_parameter_duplicates.py
      - name: Run endpoint-identity mutation tests
        run: python Scripts/test_endpoint_identity.py
      - name: Run capability-negotiation mutation tests
        run: python Scripts/test_capability_negotiation.py
      - name: Run job idempotency concurrency tests
        run: python Scripts/test_job_idempotency.py
      - name: Run Python digest golden vectors
        run: python Scripts/test_digest_vectors.py
      - name: Set up Bun for independent JavaScript implementation
        uses: oven-sh/setup-bun@v2
      - name: Install TypeScript digest test dependency
        run: |
          cd Scripts/digest-conformance
          bun install
      - name: Run digest corpus mutation tests in both runtimes
        run: python Scripts/test_digest_vector_mutations.py
      - name: Run TypeScript digest golden vectors
        run: |
          cd Scripts/digest-conformance
          bun run test
      - name: Install TypeScript JCS test dependency
        run: |
          cd Scripts/jcs-canonicalization
          bun install
      - name: Run TypeScript JCS vectors
        run: |
          cd Scripts/jcs-canonicalization
          bun run test
      - name: Run cross-language JCS interoperability
        run: python Scripts/test_cross_language_jcs.py
      - name: Run static GenX conformance probes
        run: python Scripts/checkGenXConformance.py
      - name: Validate semantic endpoint catalogue
        run: python Scripts/checkGenXEndpointCatalog.py
      - name: Run domain classification mutation tests
        run: python Scripts/test_domain_classification.py
      - name: Validate GenX specification folder and generated baseline links
        run: python Scripts/specification_structure.py
      - name: Run structural specification mutation tests
        run: python Scripts/test_specification_structure.py
      - name: Test CI workflow dependency coverage
        run: python Scripts/test_conformance_workflow_scope.py
      - name: Validate master endpoint registry and semantic links
        run: python Scripts/checkEndpointRegistry.py
      - name: Audit descriptive registry metadata against source OpenAPI (report only)
        run: python Scripts/auditEndpointRegistrySourceConsistency.py --plan-json
      - name: Enforce strict source and registry semantic-neighbor integrity
        run: python Scripts/auditEndpointRegistrySourceConsistency.py --strict
      - name: Test semantic-neighbor reference integrity mutations
        run: python Scripts/test_registry_source_consistency.py
      - name: Test registry/source drift regression behavior
        run: python Scripts/test_registry_drift_regression.py
      - name: Validate live semantic-neighbor review inventory
        run: python Scripts/report_semantic_neighbor_inventory.py --check
      - name: Test semantic-neighbor inventory reporting
        run: python Scripts/test_semantic_neighbor_inventory.py
      - name: Audit executable semantic-neighbor consumers
        run: python Scripts/report_semantic_neighbor_consumers.py
      - name: Test BreedingPipeline CAS observation-trace invariants
        run: python Scripts/test_breeding_pipeline_cas_trace.py
      - name: Test draft decision candidate validator (not authorization)
        run: python Scripts/test_semantic_decision_candidate.py
      - name: Test executable consumer regression gate
        run: python Scripts/test_semantic_neighbor_consumers.py
      - name: Test historically retained neighbor provenance
        run: python Scripts/test_semantic_neighbor_lineage.py
      - name: Validate semantic-neighbor governance ledger
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMPARE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COMPARE="${{ github.event.inputs.comparison_sha }}"
          else
            COMPARE="${{ github.event.before }}"
          fi
          if [ -z "$COMPARE" ]; then
            echo "comparison SHA is required" >&2
            exit 1
          fi
          if [ "$COMPARE" = "0000000000000000000000000000000000000000" ]; then
            COMPARE="$(git merge-base HEAD origin/main 2>/dev/null || true)"
          fi
          if [ -z "$COMPARE" ]; then
            python Scripts/check_semantic_neighbor_governance.py
          else
            python Scripts/check_semantic_neighbor_governance.py --comparison-ref "$COMPARE"
          fi
      - name: Test exact terminal-decision binding
        run: python Scripts/test_semantic_neighbor_terminal_decisions.py
      - name: Test semantic-neighbor governance mutations
        run: python Scripts/test_semantic_neighbor_governance.py
      - name: Enforce no new registry/source descriptive drift
        run: python Scripts/check_registry_drift_regression.py
      - name: Verify generated endpoint catalogue and crosswalk
        run: python Scripts/generateEndpointArtifacts.py --check
      - name: Collect static conformance failure diagnostics
        if: failure()
        run: |
          set +e
          run_check() {
            echo ""
            echo ">>> $*"
            "$@" 2>&1
            result=$?
            echo "EXIT_STATUS=$result"
          }
          {
            run_check python3 Scripts/validate_breeding_pipeline_candidate_fixtures.py
            run_check python3 Scripts/validate_breeding_pipeline_contract_fixtures.py
            run_check python Scripts/test_breeding_pipeline_contract_fixture_validator.py
            run_check python Scripts/check_breeding_pipeline_api_contract.py
            run_check python Scripts/test_endpoint_identity.py
            run_check python Scripts/test_capability_negotiation.py
            run_check python Scripts/test_job_idempotency.py
            run_check python Scripts/checkGenXConformance.py
            run_check python Scripts/specification_structure.py
            run_check python Scripts/test_specification_structure.py
            run_check python Scripts/test_conformance_workflow_scope.py
            run_check python Scripts/checkGenXEndpointCatalog.py
            run_check python Scripts/checkEndpointRegistry.py
            run_check python Scripts/auditEndpointRegistrySourceConsistency.py --plan-json
            run_check python Scripts/auditEndpointRegistrySourceConsistency.py --strict
            run_check python Scripts/test_registry_source_consistency.py
            run_check python Scripts/test_registry_drift_regression.py
            run_check python Scripts/check_semantic_neighbor_governance.py
            run_check python Scripts/test_semantic_neighbor_governance.py
            run_check python Scripts/test_semantic_neighbor_terminal_decisions.py
            run_check python Scripts/test_semantic_neighbor_lineage.py
            run_check python Scripts/report_semantic_neighbor_consumers.py
            run_check python Scripts/test_semantic_neighbor_consumers.py
            run_check python Scripts/test_semantic_decision_candidate.py
            run_check python Scripts/test_breeding_pipeline_cas_trace.py
            run_check python Scripts/report_semantic_neighbor_inventory.py --check
            run_check python Scripts/test_semantic_neighbor_inventory.py
            run_check python Scripts/check_registry_drift_regression.py
            run_check python Scripts/generateEndpointArtifacts.py --check
          } | tee "$RUNNER_TEMP/genx-static-diagnostics.log"
      - name: Upload static conformance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: genx-static-conformance-diagnostics
          path: ${{ runner.temp }}/genx-static-diagnostics.log
          if-no-files-found: warn

  live-reference-conformance:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install conformance dependencies for the reference server
        run: python -m pip install 'PyYAML==6.0.2' 'rfc8785==0.1.4'
      - name: Start in-memory GenX reference server
        run: |
          python Scripts/genx_test_server.py --port 18080 --delay 0.4 --profile genx > /tmp/genx-reference-server.log 2>&1 &
          echo $! > /tmp/genx-reference-server.pid
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(30):
              try:
                  with urlopen("http://127.0.0.1:18080/genx/v1/serverinfo", timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.5)
          else:
              print("GenX reference server failed to become ready. Server log follows:")
              try:
                  with open("/tmp/genx-reference-server.log", encoding="utf-8") as log:
                      print(log.read())
              except OSError as exc:
                  print(f"Unable to read server log: {exc}")
              raise SystemExit("GenX reference server failed to become ready")
          PY
      - name: Run live GenX conformance probes
        run: python Scripts/checkGenXConformance.py --server http://127.0.0.1:18080/genx/v1 --expired-job JOB_EXPIRED
      - name: Collect live conformance failure diagnostics
        if: failure()
        run: |
          set +e
          python Scripts/checkGenXConformance.py --server http://127.0.0.1:18080/genx/v1 --expired-job JOB_EXPIRED 2>&1 | tee "$RUNNER_TEMP/genx-live-diagnostics.log"
          echo "EXIT_STATUS=${PIPESTATUS[0]}"
      - name: Upload live conformance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: genx-live-conformance-diagnostics
          path: ${{ runner.temp }}/genx-live-diagnostics.log
          if-no-files-found: warn
      - name: Stop in-memory GenX reference server
        if: always()
        run: |
          if [ -f /tmp/genx-reference-server.pid ]; then
            kill "$(cat /tmp/genx-reference-server.pid)" || true
          fi
