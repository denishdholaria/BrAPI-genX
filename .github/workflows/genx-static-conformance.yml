name: GenX conformance (static and live)

on:
  pull_request:
    paths:
      # Source contracts, shared components, catalogues, and generated artefacts
      # all affect GenX verification; keep the complete Specification/ tree watched.
      - 'Specification/**'
      - 'Scripts/checkGenXConformance.py'
      - 'Scripts/checkGenXEndpointCatalog.py'
      - 'Scripts/checkEndpointRegistry.py'
      - 'Scripts/domain_classification.py'
      - 'Scripts/test_domain_classification.py'
      - 'Scripts/auditEndpointRegistrySourceConsistency.py'
      - 'Scripts/generateEndpointArtifacts.py'
      - 'Scripts/test_endpoint_identity.py'
      - 'Scripts/test_capability_negotiation.py'
      - 'Scripts/test_job_idempotency.py'
      - 'Scripts/test_digest_vectors.py'
      - 'Scripts/test_digest_vector_mutations.py'
      - 'Scripts/digest-conformance/**'
      - 'Scripts/jcs-canonicalization/**'
      - 'Scripts/test_cross_language_jcs.py'
      - 'Scripts/genx_test_server.py'
      - 'Scripts/validate_breeding_pipeline_candidate_fixtures.py'
      - 'Scripts/validate_breeding_pipeline_contract_fixtures.py'
      - 'Scripts/test_breeding_pipeline_contract_fixture_validator.py'
      - 'Scripts/check_breeding_pipeline_api_contract.py'
      - 'Scripts/test_specification_structure.py'
      - 'Scripts/test_conformance_workflow_scope.py'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-CANDIDATE-FIXTURES.json'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-CONTRACT-FIXTURES.json'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-DECISIONS-APPROVED.md'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-OPEN-DECISIONS.md'
      - '.github/workflows/genx-static-conformance.yml'
  push:
    paths:
      # Source contracts, shared components, catalogues, and generated artefacts
      # all affect GenX verification; keep the complete Specification/ tree watched.
      - 'Specification/**'
      - 'Scripts/checkGenXConformance.py'
      - 'Scripts/checkGenXEndpointCatalog.py'
      - 'Scripts/checkEndpointRegistry.py'
      - 'Scripts/domain_classification.py'
      - 'Scripts/test_domain_classification.py'
      - 'Scripts/auditEndpointRegistrySourceConsistency.py'
      - 'Scripts/generateEndpointArtifacts.py'
      - 'Scripts/test_endpoint_identity.py'
      - 'Scripts/test_capability_negotiation.py'
      - 'Scripts/test_job_idempotency.py'
      - 'Scripts/test_digest_vectors.py'
      - 'Scripts/test_digest_vector_mutations.py'
      - 'Scripts/digest-conformance/**'
      - 'Scripts/jcs-canonicalization/**'
      - 'Scripts/test_cross_language_jcs.py'
      - 'Scripts/genx_test_server.py'
      - 'Scripts/validate_breeding_pipeline_candidate_fixtures.py'
      - 'Scripts/validate_breeding_pipeline_contract_fixtures.py'
      - 'Scripts/test_breeding_pipeline_contract_fixture_validator.py'
      - 'Scripts/check_breeding_pipeline_api_contract.py'
      - 'Scripts/test_specification_structure.py'
      - 'Scripts/test_conformance_workflow_scope.py'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-CANDIDATE-FIXTURES.json'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-CONTRACT-FIXTURES.json'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-DECISIONS-APPROVED.md'
      - 'docs/assessment/BRAPI-GENX-BREEDING-PIPELINE-OPEN-DECISIONS.md'
      - '.github/workflows/genx-static-conformance.yml'
  workflow_dispatch:

concurrency:
  group: genx-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-conformance:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install conformance dependencies
        run: python -m pip install 'PyYAML==6.0.2' 'rfc8785==0.1.4'
      - name: Validate advisory breeding design fixtures
        run: python3 Scripts/validate_breeding_pipeline_candidate_fixtures.py
      - name: Validate approved-candidate breeding contract fixtures
        run: python3 Scripts/validate_breeding_pipeline_contract_fixtures.py
      - name: Run breeding contract fixture validator regressions
        run: python Scripts/test_breeding_pipeline_contract_fixture_validator.py
      - name: Check breeding pipeline OpenAPI and authority-filter contract
        run: python Scripts/check_breeding_pipeline_api_contract.py
      - name: Run endpoint-identity mutation tests
        run: python Scripts/test_endpoint_identity.py
      - name: Run capability-negotiation mutation tests
        run: python Scripts/test_capability_negotiation.py
      - name: Run job idempotency concurrency tests
        run: python Scripts/test_job_idempotency.py
      - name: Run Python digest golden vectors
        run: python Scripts/test_digest_vectors.py
      - name: Set up Bun for independent JavaScript implementation
        uses: oven-sh/setup-bun@v2
      - name: Install TypeScript digest test dependency
        run: |
          cd Scripts/digest-conformance
          bun install
      - name: Run digest corpus mutation tests in both runtimes
        run: python Scripts/test_digest_vector_mutations.py
      - name: Run TypeScript digest golden vectors
        run: |
          cd Scripts/digest-conformance
          bun run test
      - name: Install TypeScript JCS test dependency
        run: |
          cd Scripts/jcs-canonicalization
          bun install
      - name: Run TypeScript JCS vectors
        run: |
          cd Scripts/jcs-canonicalization
          bun run test
      - name: Run cross-language JCS interoperability
        run: python Scripts/test_cross_language_jcs.py
      - name: Run static GenX conformance probes
        run: python Scripts/checkGenXConformance.py
      - name: Validate semantic endpoint catalogue
        run: python Scripts/checkGenXEndpointCatalog.py
      - name: Run domain classification mutation tests
        run: python Scripts/test_domain_classification.py
      - name: Validate master endpoint registry and semantic links
        run: python Scripts/checkEndpointRegistry.py
      - name: Audit descriptive registry metadata against source OpenAPI (report only)
        run: python Scripts/auditEndpointRegistrySourceConsistency.py --plan-json
      - name: Verify generated endpoint catalogue and crosswalk
        run: python Scripts/generateEndpointArtifacts.py --check
      - name: Collect static conformance failure diagnostics
        if: failure()
        run: |
          set +e
          run_check() {
            echo ""
            echo ">>> $*"
            "$@" 2>&1
            result=$?
            echo "EXIT_STATUS=$result"
          }
          {
            run_check python3 Scripts/validate_breeding_pipeline_candidate_fixtures.py
            run_check python3 Scripts/validate_breeding_pipeline_contract_fixtures.py
            run_check python Scripts/test_breeding_pipeline_contract_fixture_validator.py
            run_check python Scripts/check_breeding_pipeline_api_contract.py
            run_check python Scripts/test_endpoint_identity.py
            run_check python Scripts/test_capability_negotiation.py
            run_check python Scripts/test_job_idempotency.py
            run_check python Scripts/checkGenXConformance.py
            run_check python Scripts/checkGenXEndpointCatalog.py
            run_check python Scripts/checkEndpointRegistry.py
            run_check python Scripts/auditEndpointRegistrySourceConsistency.py --plan-json
            run_check python Scripts/generateEndpointArtifacts.py --check
          } | tee "$RUNNER_TEMP/genx-static-diagnostics.log"
      - name: Upload static conformance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: genx-static-conformance-diagnostics
          path: ${{ runner.temp }}/genx-static-diagnostics.log
          if-no-files-found: warn

  live-reference-conformance:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install conformance dependencies for the reference server
        run: python -m pip install 'PyYAML==6.0.2' 'rfc8785==0.1.4'
      - name: Start in-memory GenX reference server
        run: |
          python Scripts/genx_test_server.py --port 18080 --delay 0.4 --profile genx > /tmp/genx-reference-server.log 2>&1 &
          echo $! > /tmp/genx-reference-server.pid
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(30):
              try:
                  with urlopen("http://127.0.0.1:18080/genx/v1/serverinfo", timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.5)
          else:
              print("GenX reference server failed to become ready. Server log follows:")
              try:
                  with open("/tmp/genx-reference-server.log", encoding="utf-8") as log:
                      print(log.read())
              except OSError as exc:
                  print(f"Unable to read server log: {exc}")
              raise SystemExit("GenX reference server failed to become ready")
          PY
      - name: Run live GenX conformance probes
        run: python Scripts/checkGenXConformance.py --server http://127.0.0.1:18080/genx/v1 --expired-job JOB_EXPIRED
      - name: Collect live conformance failure diagnostics
        if: failure()
        run: |
          set +e
          python Scripts/checkGenXConformance.py --server http://127.0.0.1:18080/genx/v1 --expired-job JOB_EXPIRED 2>&1 | tee "$RUNNER_TEMP/genx-live-diagnostics.log"
          echo "EXIT_STATUS=${PIPESTATUS[0]}"
      - name: Upload live conformance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: genx-live-conformance-diagnostics
          path: ${{ runner.temp }}/genx-live-diagnostics.log
          if-no-files-found: warn
      - name: Stop in-memory GenX reference server
        if: always()
        run: |
          if [ -f /tmp/genx-reference-server.pid ]; then
            kill "$(cat /tmp/genx-reference-server.pid)" || true
          fi
